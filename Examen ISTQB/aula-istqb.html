% de cobertura de sentencia, pero no al revés.", "b": "Alcanzar el 100 % de cobertura de sentencia implica el 100 % de cobertura de rama.", "c": "Son equivalentes: siempre requieren el mismo número de casos.", "d": "Alcanzar el 100 % de cobertura de rama garantiza que se detectan todos los defectos del código."}, "correcta": ["a"], "explicacion": "La cobertura de rama subsume a la de sentencia: cualquier conjunto de casos que alcance el 100 % de rama alcanza también el 100 % de sentencia, pero no al revés (un IF sin ELSE se puede cubrir al 100 % en sentencias sin probar la rama falsa). Además, ni siquiera el 100 % de rama garantiza encontrar todos los defectos; por ejemplo, no detecta defectos que dependan de datos concretos (como una división por cero con un valor concreto).", "razones": {"a": "Correcta.", "b": "Es al revés.", "c": "La de rama suele necesitar más casos.", "d": "Nada garantiza encontrar todos los defectos."}, "clave": "Rama ⇒ sentencia. Sentencia ⇏ rama."}, {"id": "4-15", "cap": 4, "lo": "FL-4.3.3", "k": "K2", "tema": "Valor de la prueba de caja blanca", "pregunta": "¿Cuál es un punto FUERTE de las técnicas de caja blanca?", "opciones": {"a": "Pueden detectar defectos aunque la especificación del software sea vaga, esté obsoleta o esté incompleta.", "b": "Detectan con facilidad los requisitos que no se han implementado (omisiones).", "c": "No necesitan acceder al código ni a la estructura del sistema.", "d": "Una cobertura de rama del 100 % asegura que el software cumple los requisitos."}, "correcta": ["a"], "explicacion": "Un punto fuerte de la caja blanca es que tiene en cuenta toda la implementación durante la prueba, lo que facilita detectar defectos incluso cuando la especificación es vaga, está obsoleta o incompleta. Un punto débil es que, si el software no implementa uno o más requisitos, la caja blanca puede no detectar los defectos resultantes por omisión. También se puede usar en la prueba estática (por ejemplo, en ejecuciones en seco del código).", "razones": {"a": "Correcta.", "b": "Es su debilidad: lo que no está en el código no se puede cubrir.", "c": "Al contrario: necesita la estructura interna.", "d": "La cobertura de código no demuestra que se cumplan los requisitos."}, "clave": "Caja blanca: no ve lo que FALTA en el código (omisiones)."}, {"id": "4-16", "cap": 4, "lo": "FL-4.4.1", "k": "K2", "tema": "Predicción de errores", "pregunta": "¿En qué se basa principalmente la técnica de predicción de errores?", "opciones": {"a": "En el conocimiento del probador sobre cómo ha funcionado la aplicación en el pasado, los tipos de errores que suelen cometer los desarrolladores y los fallos de aplicaciones similares.", "b": "En un análisis formal de las particiones del dominio de entrada.", "c": "En la medición de la cobertura de sentencia del código.", "d": "En las tablas de decisión derivadas de las reglas de negocio."}, "correcta": ["a"], "explicacion": "La predicción de errores anticipa la aparición de errores, defectos y fallos a partir del conocimiento del probador, incluido: cómo ha funcionado la aplicación en el pasado, los tipos de errores que suelen cometer los desarrolladores y los tipos de defectos que resultan de ellos, y los fallos ocurridos en otras aplicaciones similares. Un enfoque metódico es el ataque de faltas (fault attack): crear una lista de posibles errores, defectos y fallos y diseñar pruebas para descubrirlos o provocarlos.", "razones": {"a": "Correcta.", "b": "Es partición de equivalencia (caja negra).", "c": "Es caja blanca.", "d": "Es la técnica de tabla de decisión."}, "clave": "Predicción de errores = experiencia + listas de defectos típicos (ataque de faltas)."}, {"id": "4-17", "cap": 4, "lo": "FL-4.4.2", "k": "K2", "tema": "Prueba exploratoria", "pregunta": "¿En qué situación es MÁS apropiada la prueba exploratoria?", "opciones": {"a": "Cuando las especificaciones son escasas o inadecuadas y hay mucha presión de tiempo.", "b": "Cuando la normativa exige casos de prueba detallados y guionizados como evidencia.", "c": "Cuando el equipo de prueba no tiene experiencia en el dominio ni en la aplicación.", "d": "Cuando el objetivo es alcanzar el 100 % de cobertura de rama."}, "correcta": ["a"], "explicacion": "En la prueba exploratoria las pruebas se diseñan, ejecutan y evalúan simultáneamente mientras el probador aprende sobre el objeto de prueba. A veces se hace por sesiones (time-box, carta de prueba y una sesión de puesta en común posterior). Es útil cuando hay pocas especificaciones o son inadecuadas, o cuando hay mucha presión de tiempo, y también para complementar técnicas más formales. Es más eficaz si el probador es experimentado, tiene conocimiento del dominio y buenas habilidades (curiosidad, pensamiento crítico, creatividad).", "razones": {"a": "Correcta.", "b": "La normativa favorece pruebas guionizadas y documentadas.", "c": "Es menos eficaz con probadores sin experiencia.", "d": "La cobertura de rama se consigue con técnicas de caja blanca."}, "clave": "Exploratoria → poca especificación, poco tiempo y probadores con experiencia."}, {"id": "4-18", "cap": 4, "lo": "FL-4.4.3", "k": "K2", "tema": "Prueba basada en listas de comprobación", "pregunta": "¿Qué afirmación sobre la prueba basada en listas de comprobación es correcta?", "opciones": {"a": "Los elementos de la lista deben formularse como preguntas, y no deben incluirse los que se pueden comprobar automáticamente.", "b": "La lista debe ser lo más larga y genérica posible para cubrirlo todo.", "c": "Una vez creada, la lista no debe modificarse para mantener la consistencia.", "d": "Solo sirve para la prueba funcional."}, "correcta": ["a"], "explicacion": "En la prueba basada en listas de comprobación, el probador diseña, implementa y ejecuta pruebas para cubrir las condiciones de una lista. Cada elemento se formula como una pregunta y se debe poder comprobar por separado y de forma directa. No se deben incluir elementos que se comprueben automáticamente, que funcionen mejor como criterios de entrada o salida, o que sean demasiado generales. Las listas deben actualizarse con regularidad a partir del análisis de defectos, porque pierden eficacia con el tiempo. Sirven para la prueba funcional y la no funcional. Sin casos de prueba detallados aportan pautas y consistencia; las listas de alto nivel dan cierta variabilidad: más cobertura pero menos repetibilidad.", "razones": {"a": "Correcta.", "b": "No deben ser demasiado largas ni incluir elementos demasiado generales.", "c": "Al contrario: deben actualizarse con regularidad.", "d": "Sirven para la funcional y la no funcional."}, "clave": "Lista de comprobación: preguntas concretas, actualizadas y nada que ya compruebe una herramienta."}, {"id": "4-19", "cap": 4, "lo": "FL-4.5.1", "k": "K2", "tema": "Redacción colaborativa de historias de usuario", "pregunta": "Las '3 C' de una historia de usuario son:", "opciones": {"a": "Tarjeta, Conversación y Confirmación.", "b": "Código, Compilación y Cobertura.", "c": "Cliente, Contrato y Criterio.", "d": "Contexto, Cambio y Control."}, "correcta": ["a"], "explicacion": "Una historia de usuario tiene tres aspectos críticos, las '3 C': la Tarjeta (el medio que describe la historia, por ejemplo una ficha o una entrada en un tablero), la Conversación (explica cómo se usará el software; puede documentarse o ser verbal) y la Confirmación (los criterios de aceptación). El formato más común es 'Como [rol], quiero [objetivo] para [valor de negocio]', seguido de los criterios de aceptación.", "razones": {"a": "Correcta.", "b": "Términos técnicos sin relación con las historias de usuario.", "c": "Inventado.", "d": "Inventado."}, "clave": "Card, Conversation, Confirmation."}, {"id": "4-20", "cap": 4, "lo": "FL-4.5.1", "k": "K2", "tema": "INVEST", "pregunta": "Una historia de usuario dice: 'El sistema debe ser rápido y fácil de usar'. ¿Qué criterio INVEST incumple de forma MÁS evidente?", "opciones": {"a": "Independiente.", "b": "Negociable.", "c": "Pequeña.", "d": "Comprobable (Testable)."}, "correcta": ["d"], "explicacion": "INVEST: Independiente, Negociable, Valiosa, Estimable, pequeña (Small) y Comprobable (Testable). 'Rápido' y 'fácil de usar' no son medibles: no se puede escribir un criterio de aceptación objetivo para verificarlos, así que la historia no es comprobable. Si las partes interesadas no saben cómo probar una historia, puede indicar que no es lo bastante clara, que no refleja algo de valor o que necesitan ayuda para probarla.", "razones": {"a": "Nada sugiere que dependa de otras historias.", "b": "Es negociable; el problema es que no se puede verificar.", "c": "Puede ser grande, pero lo más evidente es que no se puede verificar.", "d": "Correcta."}, "clave": "Adjetivos vagos (rápido, fácil, intuitivo) → historia no comprobable."}, {"id": "4-21", "cap": 4, "lo": "FL-4.5.2", "k": "K2", "tema": "Criterios de aceptación", "pregunta": "¿Cuáles son los dos formatos más habituales para redactar criterios de aceptación?", "opciones": {"a": "Orientado a escenarios (Dado/Cuando/Entonces) y orientado a reglas (lista de verificación con viñetas o tabla de correspondencia entre entradas y salidas).", "b": "Diagrama de clases y diagrama de secuencia.", "c": "Casos de prueba de caja blanca y de caja negra.", "d": "Historia de usuario y épica."}, "correcta": ["a"], "explicacion": "Los criterios de aceptación son las condiciones que debe cumplir una implementación para que las partes interesadas la acepten. Sirven para definir el alcance de la historia, alcanzar consenso, describir escenarios positivos y negativos, servir de base para la prueba de aceptación y permitir una planificación y estimación precisas. Los formatos más comunes son el orientado a escenarios (Dado/Cuando/Entonces, propio de BDD) y el orientado a reglas (listas de verificación o tablas de entradas y salidas). Se admiten otros formatos siempre que los criterios estén bien definidos y no sean ambiguos.", "razones": {"a": "Correcta.", "b": "Son modelos de diseño UML.", "c": "Son categorías de técnicas, no formatos de criterios de aceptación.", "d": "Son unidades de requisito, no formatos de criterios."}, "clave": "Escenarios (Gherkin) o reglas (lista o tabla)."}, {"id": "4-22", "cap": 4, "lo": "FL-4.1.1", "k": "K2", "tema": "Categorías de técnicas", "pregunta": "Un probador diseña pruebas a partir de una lista de los defectos más frecuentes en aplicaciones de comercio electrónico en las que ha trabajado antes. ¿A qué categoría pertenece la técnica que usa?", "opciones": {"a": "Técnica de caja negra.", "b": "Técnica de caja blanca.", "c": "Técnica basada en la experiencia.", "d": "Técnica basada en la colaboración."}, "correcta": ["c"], "explicacion": "Las técnicas basadas en la experiencia aprovechan el conocimiento y la experiencia de los probadores para diseñar e implementar casos de prueba. Son la predicción de errores (con su variante metódica, el ataque de faltas a partir de una lista de defectos), la prueba exploratoria y la prueba basada en listas de comprobación. Su eficacia depende en gran medida de las habilidades del probador, y pueden detectar defectos que se escapan a las técnicas de caja negra y de caja blanca.", "razones": {"a": "La caja negra se basa en la especificación.", "b": "La caja blanca se basa en la estructura.", "c": "Correcta. Es un ataque de faltas, una forma de predicción de errores.", "d": "Los enfoques colaborativos (capítulo 4.5) se centran en las historias de usuario, los criterios de aceptación y ATDD."}, "clave": "Lista de defectos del pasado → predicción de errores o ataque de faltas → experiencia."}, {"id": "5-01", "cap": 5, "lo": "FL-5.1.4", "k": "K3", "tema": "Estimación de tres puntos", "pregunta": "Para estimar el esfuerzo de prueba de una funcionalidad, los expertos dan estos valores: optimista (a) = 6 días-persona, más probable (m) = 9 días-persona, pesimista (b) = 18 días-persona. Usando la estimación de tres puntos, ¿cuál es la estimación (E) y su desviación típica (SD)?", "opciones": {"a": "E = 10; SD = 2", "b": "E = 11; SD = 2", "c": "E = 10; SD = 12", "d": "E = 9; SD = 2"}, "correcta": ["a"], "explicacion": "En la estimación de tres puntos los expertos dan tres valores: el más optimista (a), el más probable (m) y el más pesimista (b). La estimación final es la media aritmética ponderada E = (a + 4m + b) / 6 = (6 + 36 + 18) / 6 = 60 / 6 = 10. La desviación típica es SD = (b − a) / 6 = (18 − 6) / 6 = 2. El resultado se expresa como E ± SD = 10 ± 2 días-persona.", "razones": {"a": "Correcta.", "b": "11 es la media simple (6 + 9 + 18) / 3; no aplica la ponderación 4m.", "c": "12 es b − a sin dividir entre 6.", "d": "9 es el valor más probable, no la estimación ponderada."}, "clave": "E = (a + 4m + b) / 6; SD = (b − a) / 6. Apréndetela de memoria."}, {"id": "5-02", "cap": 5, "lo": "FL-5.1.4", "k": "K3", "tema": "Estimación basada en ratios", "pregunta": "En el proyecto anterior de la organización, el esfuerzo de desarrollo fue de 800 días-persona y el de prueba de 200 días-persona. El nuevo proyecto, similar, tiene un esfuerzo de desarrollo estimado de 1.200 días-persona. Con la estimación basada en ratios, ¿cuál es el esfuerzo de prueba estimado?", "opciones": {"a": "240 días-persona", "b": "300 días-persona", "c": "400 días-persona", "d": "1.500 días-persona"}, "correcta": ["b"], "explicacion": "La estimación basada en ratios usa cifras recogidas en proyectos anteriores de la organización para derivar ratios 'estándar' para proyectos similares. Ratio prueba / desarrollo = 200 / 800 = 0,25 (o 4:1 desarrollo:prueba). Esfuerzo de prueba = 1.200 × 0,25 = 300 días-persona.", "razones": {"a": "Sería aplicar un 20 %, que no es el ratio histórico.", "b": "Correcta.", "c": "Sería un ratio de 3:1.", "d": "Es la suma de desarrollo + prueba del proyecto anterior más 500; no tiene sentido."}, "clave": "Ratio histórico × tamaño nuevo."}, {"id": "5-03", "cap": 5, "lo": "FL-5.1.5", "k": "K3", "tema": "Priorización basada en el riesgo", "pregunta": "Hay que ejecutar estos casos de prueba, priorizados según el riesgo:", "anexo": "Caso   Riesgo      Dependencia\nTC1    Muy alto    requiere que antes se haya ejecutado TC3\nTC2    Medio       —\nTC3    Bajo        —\nTC4    Alto        —", "pregunta2": "¿En qué orden deben ejecutarse?", "opciones": {"a": "TC1, TC4, TC2, TC3", "b": "TC3, TC1, TC4, TC2", "c": "TC4, TC1, TC2, TC3", "d": "TC3, TC2, TC4, TC1"}, "correcta": ["b"], "explicacion": "En la priorización basada en el riesgo, el orden lo marca el resultado del análisis de riesgos: primero lo de mayor riesgo. Pero el programa aclara que, si un caso de alta prioridad depende de otro de menor prioridad, el de menor prioridad debe ejecutarse antes. TC1 (muy alto) necesita TC3, así que va TC3 → TC1, luego TC4 (alto) y por último TC2 (medio).", "razones": {"a": "TC1 no puede ejecutarse antes de TC3.", "b": "Correcta.", "c": "Ignora la dependencia y pone TC4 antes que TC1, de riesgo mayor.", "d": "Ordena de menor a mayor riesgo."}, "clave": "Riesgo de mayor a menor, PERO las dependencias mandan."}, {"id": "5-04", "cap": 5, "lo": "FL-5.1.5", "k": "K3", "tema": "Priorización basada en la cobertura", "pregunta": "Se usa la priorización basada en la cobertura ADICIONAL. Los casos cubren estos requisitos:", "anexo": "TC-A: R1, R2, R3\nTC-B: R3, R4\nTC-C: R1, R2\nTC-D: R4, R5", "pregunta2": "¿Qué dos casos se ejecutan primero, en este orden?", "opciones": {"a": "TC-A y TC-B", "b": "TC-A y TC-D", "c": "TC-D y TC-A", "d": "TC-A y TC-C"}, "correcta": ["b"], "explicacion": "En la priorización por cobertura adicional se ejecuta primero el caso con más cobertura (TC-A, 3 requisitos). Después, en cada paso, el que añade más cobertura todavía no alcanzada. Tras TC-A faltan R4 y R5: TC-B añade 1 (R4), TC-C añade 0 y TC-D añade 2 (R4 y R5). Por tanto, el segundo es TC-D. Con TC-A y TC-D ya se cubre el 100 % de los requisitos.", "razones": {"a": "TC-B solo añade R4; TC-D añade dos requisitos.", "b": "Correcta.", "c": "TC-A tiene más cobertura inicial (3 frente a 2), así que va primero.", "d": "TC-C no añade nada nuevo tras TC-A."}, "clave": "Cobertura adicional: después del primero, mira solo lo que AÑADE cada caso."}, {"id": "5-05", "cap": 5, "lo": "FL-5.5.1", "k": "K3", "tema": "Informe de defecto", "pregunta": "Un probador registra este informe de defecto:", "anexo": "Título: Error en el pago\nDescripción: No funciona el pago con tarjeta.\nSeveridad: Alta", "pregunta2": "¿Qué información es MÁS importante añadir para que el informe sea útil?", "opciones": {"a": "El nombre del desarrollador que lo corregirá.", "b": "Los pasos para reproducirlo, el resultado esperado y el real, y el entorno y la versión del objeto de prueba.", "c": "Una estimación del coste de la corrección.", "d": "El código fuente corregido."}, "correcta": ["b"], "explicacion": "Un informe de defecto suele contener: identificador único; título con un resumen breve; fecha de observación, organización emisora y autor; identificación del objeto de prueba y del entorno; contexto del defecto (caso de prueba ejecutado, actividad, fase del ciclo de vida, técnica, datos...); descripción del fallo que permita reproducirlo y resolverlo, incluidos los pasos y las evidencias (registros, volcados de base de datos, capturas, grabaciones); resultados esperados y reales; severidad; prioridad de corrección; estado y referencias (por ejemplo, al caso de prueba). Sin pasos, resultados esperado y real ni entorno, el desarrollador no puede reproducirlo.", "razones": {"a": "La asignación la hace la gestión de defectos; no es lo que más falta.", "b": "Correcta.", "c": "No forma parte del contenido típico de un informe de defecto.", "d": "El probador no aporta la corrección."}, "clave": "Un informe de defecto útil es REPRODUCIBLE: pasos, esperado frente a real, entorno."}, {"id": "5-06", "cap": 5, "lo": "FL-5.5.1", "k": "K3", "tema": "Severidad y prioridad", "pregunta": "Justo antes de lanzar una campaña publicitaria, se detecta que el nombre de la empresa aparece mal escrito en el logotipo de la página de inicio. Ninguna funcionalidad se ve afectada. ¿Cómo debería clasificarse el defecto?", "opciones": {"a": "Severidad alta, prioridad alta.", "b": "Severidad baja, prioridad alta.", "c": "Severidad alta, prioridad baja.", "d": "Severidad baja, prioridad baja."}, "correcta": ["b"], "explicacion": "La severidad es el grado de impacto del defecto en el sistema o en las partes interesadas. La prioridad es la urgencia de corregirlo. Un error tipográfico en el logo no afecta a ninguna funcionalidad (severidad baja), pero por su visibilidad y la campaña inminente es urgente corregirlo (prioridad alta). Son dos campos independientes del informe de defecto.", "razones": {"a": "El impacto técnico es bajo: nada deja de funcionar.", "b": "Correcta.", "c": "Está al revés.", "d": "Por el contexto de negocio la urgencia es alta."}, "clave": "Severidad = impacto. Prioridad = urgencia de negocio. Pueden ir en direcciones opuestas."}, {"id": "5-07", "cap": 5, "lo": "FL-5.1.1", "k": "K2", "tema": "Plan de prueba", "pregunta": "¿Qué elemento forma parte típicamente del contenido de un plan de prueba?", "opciones": {"a": "El enfoque de prueba: niveles, tipos y técnicas de prueba, y criterios de entrada y salida.", "b": "El código fuente de los componentes que se van a probar.", "c": "Las correcciones aplicadas a los defectos encontrados.", "d": "El manual de usuario final del producto."}, "correcta": ["a"], "explicacion": "El plan de prueba describe los objetivos, los recursos y los procesos de un proyecto de prueba. Contenido típico: contexto (alcance, objetivos de prueba, restricciones, base de prueba), supuestos y restricciones, partes interesadas (roles, responsabilidades, relevancia, formación), comunicación, registro de riesgos, enfoque de prueba (niveles, tipos, técnicas, entregables, criterios de entrada y salida, independencia, métricas, requisitos de datos y de entorno, desviaciones respecto a la política y la estrategia de la organización), y presupuesto y calendario.", "razones": {"a": "Correcta.", "b": "El código es el objeto de prueba, no contenido del plan.", "c": "Las correcciones las hace desarrollo; no forman parte del plan.", "d": "No es un producto de prueba."}, "clave": "El plan responde a: qué, por qué, cómo, quién, cuándo y con qué riesgos."}, {"id": "5-08", "cap": 5, "lo": "FL-5.1.2", "k": "K2", "tema": "Contribución del probador a la planificación", "pregunta": "¿Cómo contribuye el probador a la planificación de la ITERACIÓN?", "opciones": {"a": "Participa en el análisis de riesgo detallado de las historias de usuario, determina su comprobabilidad, las descompone en tareas de prueba y estima el esfuerzo.", "b": "Define la visión del producto y el presupuesto de la versión.", "c": "Decide en solitario qué historias entran en la iteración.", "d": "Escribe el código de las historias de mayor riesgo."}, "correcta": ["a"], "explicacion": "En la planificación de la VERSIÓN, los probadores participan en la redacción de historias de usuario comprobables y de sus criterios de aceptación, en los análisis de riesgos del proyecto y de calidad, en la estimación del esfuerzo de prueba de las historias, en la definición del enfoque de prueba y en la planificación de la prueba de la versión. En la planificación de la ITERACIÓN, participan en el análisis de riesgo detallado de las historias, determinan su comprobabilidad, las descomponen en tareas (sobre todo tareas de prueba), estiman el esfuerzo de prueba de todas las tareas e identifican y refinan los aspectos funcionales y no funcionales del objeto de prueba.", "razones": {"a": "Correcta.", "b": "Es responsabilidad de negocio o del propietario del producto.", "c": "La decide el equipo con el propietario del producto.", "d": "No es su contribución a la planificación."}, "clave": "Versión = visión amplia. Iteración = historias concretas → tareas y estimación."}, {"id": "5-09", "cap": 5, "lo": "FL-5.1.3", "k": "K2", "tema": "Criterios de entrada y salida", "pregunta": "¿Cuál de los siguientes es un ejemplo de criterio de SALIDA?", "opciones": {"a": "Se ha alcanzado el 90 % de cobertura de requisitos y no quedan defectos críticos abiertos.", "b": "El entorno de prueba está disponible y configurado.", "c": "El objeto de prueba ha superado las pruebas de humo.", "d": "Los probadores han recibido formación sobre la herramienta."}, "correcta": ["a"], "explicacion": "Los criterios de entrada definen las condiciones previas para empezar una actividad: disponibilidad de recursos (personas, herramientas, entornos, datos de prueba, presupuesto, tiempo), disponibilidad de productos de prueba (base de prueba, requisitos comprobables, historias, casos de prueba) y un nivel de calidad inicial del objeto de prueba (por ejemplo, que haya pasado las pruebas de humo). Los criterios de salida definen qué hay que conseguir para dar por terminada una actividad: medidas de exhaustividad (cobertura alcanzada, número de defectos sin resolver, densidad de defectos, casos fallidos) y criterios binarios de compleción (pruebas planificadas ejecutadas, prueba estática realizada, defectos notificados, regresión automatizada). Quedarse sin tiempo o presupuesto también puede ser un criterio de salida válido si las partes interesadas aceptan el riesgo.", "razones": {"a": "Correcta.", "b": "Es criterio de entrada (recursos).", "c": "Es criterio de entrada (calidad inicial del objeto de prueba).", "d": "Es criterio de entrada (recursos)."}, "clave": "Entrada = ¿podemos empezar? Salida = ¿podemos terminar?"}, {"id": "5-10", "cap": 5, "lo": "FL-5.1.3", "k": "K1", "tema": "Definición de Hecho", "pregunta": "En el desarrollo de software ágil, ¿cómo se suelen denominar los criterios de salida?", "opciones": {"a": "Definición de Preparado (Definition of Ready).", "b": "Definición de Hecho (Definition of Done).", "c": "Criterios INVEST.", "d": "Carta de prueba."}, "correcta": ["b"], "explicacion": "En ágil, los criterios de salida suelen llamarse Definición de Hecho (DoD): definen las métricas objetivas del equipo para considerar un elemento terminado y listo para entregar. Los criterios de entrada que debe cumplir una historia de usuario para empezar el desarrollo o la prueba se llaman Definición de Preparado (DoR).", "razones": {"a": "La DoR son los criterios de ENTRADA.", "b": "Correcta.", "c": "INVEST son características de una buena historia de usuario.", "d": "Una carta de prueba guía una sesión de prueba exploratoria."}, "clave": "DoR = entrada. DoD = salida."}, {"id": "5-11", "cap": 5, "lo": "FL-5.1.7", "k": "K2", "tema": "Cuadrantes de prueba", "pregunta": "Según el modelo de cuadrantes de prueba, ¿en qué cuadrante se sitúan la prueba exploratoria, la prueba de usabilidad y la prueba de aceptación de usuario?", "opciones": {"a": "Q1: orientado a la tecnología, apoya al equipo.", "b": "Q2: orientado al negocio, apoya al equipo.", "c": "Q3: orientado al negocio, critica el producto.", "d": "Q4: orientado a la tecnología, critica el producto."}, "correcta": ["c"], "explicacion": "Los cuadrantes (de Brian Marick) agrupan los niveles y tipos de prueba en ágil. Q1 (tecnología, apoya al equipo): pruebas de componente y de integración de componentes, automatizadas e incluidas en CI. Q2 (negocio, apoya al equipo): pruebas funcionales, ejemplos, pruebas de historias de usuario, prototipos de experiencia de usuario, prueba de API y simulaciones; comprueban los criterios de aceptación y pueden ser manuales o automatizadas. Q3 (negocio, critica el producto): prueba exploratoria, de usabilidad y de aceptación de usuario; orientadas al usuario y a menudo manuales. Q4 (tecnología, critica el producto): pruebas de humo y pruebas no funcionales (excepto usabilidad), a menudo automatizadas.", "razones": {"a": "Q1: componente e integración de componentes.", "b": "Q2: pruebas funcionales y de historias.", "c": "Correcta.", "d": "Q4: pruebas de humo y no funcionales técnicas (rendimiento, seguridad...)."}, "clave": "Q3 = el usuario critica el producto (exploratoria, usabilidad, UAT)."}, {"id": "5-12", "cap": 5, "lo": "FL-5.1.6", "k": "K2", "tema": "Pirámide de prueba", "pregunta": "¿Qué afirmación sobre la pirámide de prueba es correcta?", "opciones": {"a": "Las pruebas de las capas inferiores son pequeñas, aisladas y rápidas, y hay más pruebas en la base que en la cima.", "b": "Las pruebas de extremo a extremo de la cima son las más rápidas y deben ser las más numerosas.", "c": "Todas las capas deben tener el mismo número de pruebas.", "d": "La pirámide solo se aplica a la prueba manual."}, "correcta": ["a"], "explicacion": "La pirámide de prueba es un modelo que muestra que distintas pruebas pueden tener distinta granularidad. Su altura representa el esfuerzo de automatización: las capas inferiores tienen pruebas pequeñas, aisladas y rápidas que comprueban poca funcionalidad, así que hacen falta muchas para una cobertura razonable. Las capas superiores tienen pruebas complejas, de alto nivel y de extremo a extremo, más lentas, que comprueban mucha funcionalidad, por lo que suelen bastar menos. El número y el nombre de las capas pueden variar.", "razones": {"a": "Correcta.", "b": "Las de extremo a extremo son las más lentas y menos numerosas.", "c": "El número de pruebas disminuye al subir.", "d": "Representa el esfuerzo de automatización."}, "clave": "Base: muchas, rápidas y aisladas. Cima: pocas, lentas y de extremo a extremo."}, {"id": "5-13", "cap": 5, "lo": "FL-5.2.2", "k": "K2", "tema": "Riesgos de proyecto y de producto", "pregunta": "¿Cuáles de los siguientes son riesgos de PROYECTO? (Selecciona DOS)", "opciones": {"a": "El proveedor externo entrega el entorno de prueba con tres semanas de retraso.", "b": "El tiempo de respuesta del sistema puede ser inadecuado con carga alta.", "c": "El equipo no tiene suficiente experiencia con la herramienta de automatización elegida.", "d": "El cálculo de intereses puede ser incorrecto en años bisiestos.", "e": "La aplicación puede tener vulnerabilidades de seguridad en el inicio de sesión."}, "correcta": ["a", "c"], "explicacion": "Los riesgos de proyecto afectan a la gestión y el control del proyecto: cuestiones organizativas (retrasos en las entregas, estimaciones inexactas, recortes de costes), de personas (habilidades insuficientes, conflictos, problemas de comunicación, falta de personal), técnicas (aumento del alcance, poco soporte de herramientas) y de proveedores (fallos en la entrega de terceros, quiebra de la empresa proveedora). Los riesgos de producto afectan a las características de calidad del producto: funcionalidad que falta o es incorrecta, cálculos incorrectos, errores en tiempo de ejecución, mala arquitectura, algoritmos ineficientes, tiempo de respuesta inadecuado, mala experiencia de usuario o vulnerabilidades de seguridad.", "razones": {"a": "Correcta. Riesgo de proveedor (proyecto).", "b": "Riesgo de producto (eficiencia de desempeño).", "c": "Correcta. Riesgo de personas (proyecto).", "d": "Riesgo de producto (cálculo incorrecto).", "e": "Riesgo de producto (seguridad)."}, "clave": "¿Afecta al PRODUCTO que se entrega o a CÓMO se gestiona el proyecto?"}, {"id": "5-14", "cap": 5, "lo": "FL-5.2.4", "k": "K2", "tema": "Control del riesgo de producto", "pregunta": "Se ha identificado un riesgo de producto de alto impacto: el cálculo de intereses podría ser incorrecto. ¿Qué acción es una MITIGACIÓN de ese riesgo mediante la prueba?", "opciones": {"a": "Aplicar técnicas de prueba adecuadas (por ejemplo, valores frontera) con un nivel de cobertura más alto sobre el módulo de cálculo, y asignar probadores con experiencia en el dominio.", "b": "Aceptar el riesgo sin hacer nada más.", "c": "Contratar un seguro que cubra posibles reclamaciones.", "d": "Eliminar el módulo del registro de riesgos para centrarse en otros."}, "correcta": ["a"], "explicacion": "El control del riesgo de producto incluye la mitigación y la monitorización. Las opciones de respuesta son: mitigación mediante la prueba, aceptación del riesgo, transferencia del riesgo y plan de contingencia. Acciones de mitigación mediante la prueba: elegir probadores con la experiencia y las habilidades adecuadas para cada tipo de riesgo; aplicar un nivel adecuado de independencia; hacer revisiones y análisis estático; aplicar técnicas de prueba y niveles de cobertura adecuados; aplicar los tipos de prueba que tratan las características de calidad afectadas, y hacer prueba dinámica, incluida la de regresión.", "razones": {"a": "Correcta.", "b": "Es aceptar el riesgo, no mitigarlo mediante la prueba.", "c": "Es transferir el riesgo, no mitigarlo mediante la prueba.", "d": "Ignorar el riesgo no es ninguna respuesta válida."}, "clave": "Respuestas al riesgo: mitigar (con prueba), aceptar, transferir o plan de contingencia."}, {"id": "5-15", "cap": 5, "lo": "FL-5.3.1", "k": "K2", "tema": "Métricas de prueba", "pregunta": "¿Cuál de las siguientes es una métrica de CALIDAD DEL PRODUCTO?", "opciones": {"a": "Tiempo medio hasta el fallo (MTTF).", "b": "Porcentaje de casos de prueba ejecutados.", "c": "Esfuerzo de prueba consumido hasta la fecha.", "d": "Grado de avance en la preparación del entorno de prueba."}, "correcta": ["a"], "explicacion": "El programa agrupa las métricas así: de avance del proyecto (finalización de tareas, uso de recursos, esfuerzo de prueba); de avance de la prueba (avance en la implementación de casos, en la preparación del entorno, número de casos ejecutados o no, superados o fallidos, tiempo de ejecución); de calidad del producto (disponibilidad, tiempo de respuesta, tiempo medio hasta el fallo); de defectos (número y prioridad de defectos encontrados y corregidos, densidad de defectos, porcentaje de detección de defectos); de riesgo (nivel de riesgo residual); de cobertura (de requisitos, de código), y de coste (coste de la prueba, coste organizativo de la calidad).", "razones": {"a": "Correcta.", "b": "Métrica de avance de la prueba.", "c": "Métrica de avance del proyecto.", "d": "Métrica de avance de la prueba."}, "clave": "Calidad del producto: disponibilidad, tiempo de respuesta, MTTF."}, {"id": "5-16", "cap": 5, "lo": "FL-5.3.2", "k": "K2", "tema": "Informes de prueba", "pregunta": "¿Qué contenido es propio del informe de COMPLECIÓN de la prueba y no del informe de avance?", "opciones": {"a": "Lecciones aprendidas y riesgos no mitigados al final de la prueba.", "b": "Las pruebas planificadas para el siguiente periodo.", "c": "Los impedimentos actuales y sus soluciones provisionales.", "d": "El avance respecto al plan durante el periodo actual."}, "correcta": ["a"], "explicacion": "El informe de avance se elabora periódicamente durante la prueba e incluye: periodo, avance respecto al plan (con desviaciones), impedimentos y soluciones provisionales, métricas, riesgos nuevos o cambiados y la prueba planificada para el siguiente periodo. El informe de compleción se elabora cuando termina un proyecto, un nivel o un tipo de prueba (idealmente cuando se cumplen los criterios de salida) e incluye: resumen, evaluación de la prueba y de la calidad del producto frente al plan, desviaciones, impedimentos, métricas, riesgos no mitigados, defectos no corregidos y lecciones aprendidas relevantes para la prueba.", "razones": {"a": "Correcta.", "b": "Es propio del informe de avance.", "c": "Es propio del informe de avance.", "d": "Es propio del informe de avance."}, "clave": "Avance = mirar hacia delante (siguiente periodo). Compleción = balance final y lecciones aprendidas."}, {"id": "5-17", "cap": 5, "lo": "FL-5.3.1", "k": "K2", "tema": "Control de la prueba", "pregunta": "¿Cuál es un ejemplo de CONTROL de la prueba?", "opciones": {"a": "Volver a priorizar las pruebas cuando un riesgo identificado se materializa.", "b": "Recopilar el número de casos superados y fallidos.", "c": "Archivar los productos de prueba al terminar el proyecto.", "d": "Diseñar casos de prueba a partir de las condiciones de prueba."}, "correcta": ["a"], "explicacion": "La monitorización de la prueba recopila información sobre la prueba para evaluar su avance y comprobar si se cumplen los criterios de salida. El control de la prueba usa esa información para dar orientación y aplicar las acciones correctivas necesarias (directivas de control). Ejemplos de control: volver a priorizar las pruebas cuando un riesgo identificado se convierte en un problema, reevaluar si un elemento cumple los criterios de entrada o salida tras un retrabajo, ajustar el calendario por un retraso en la entrega del entorno, o añadir recursos nuevos cuando y donde hagan falta.", "razones": {"a": "Correcta.", "b": "Es monitorización.", "c": "Es compleción.", "d": "Es diseño de la prueba."}, "clave": "Monitorizar = medir. Controlar = actuar sobre lo medido."}, {"id": "5-18", "cap": 5, "lo": "FL-5.4.1", "k": "K1", "tema": "Gestión de la configuración", "pregunta": "En la prueba, ¿qué proporciona la gestión de la configuración?", "opciones": {"a": "Una disciplina para identificar, controlar y hacer el seguimiento de productos de trabajo como planes, casos y resultados de prueba, como elementos de configuración con sus versiones y líneas base.", "b": "Un método para estimar el esfuerzo de prueba.", "c": "Una técnica de caja negra para derivar casos de prueba.", "d": "Una forma de evaluar el rendimiento de los probadores."}, "correcta": ["a"], "explicacion": "La gestión de la configuración (CM) proporciona una disciplina para identificar, controlar y hacer el seguimiento de productos de trabajo como planes de prueba, estrategias, condiciones, casos, scripts, resultados, registros e informes, tratados como elementos de configuración. Lleva el registro de los cambios, de las versiones y de las líneas base (configuraciones aprobadas que solo cambian mediante un proceso formal). Asegura que todos los elementos están identificados de forma única, controlados por versión y relacionados entre sí para mantener la trazabilidad. En CI/CD la CM suele async function initStore(){

  try{
    const db = window.claude ? await window.claude.use("db") : null;

      const remote={}; p.docs.forEach(d=>{const v=d.data(); if(v) remote[d.id]=v});
      // fusionar: lo local que no esté en remoto se sube
      for(const [id,v] of Object.entries(S.prog)){ if(!remote[id] || (remote[id].ultima||"")<(v.ultima||"")){ remote[id]=v; try{await db.doc("progreso/"+id).set(v)}catch(e){} } }
      S.prog=remote; S.sims=s.docs.map(d=>({...d.data(),_id:d.id}));
      S.db=db; S.store="db"; lsSet("istqb.prog",S.prog);
    }
  }catch(e){ /* sigue en local */ }

}
async function recordAnswer(q, ok, elegida){

  const v = {...prev, intentos:prev.intentos+1, aciertos:prev.aciertos+(ok?1:0), ultimaCorrecta:ok, ultima:new Date().toISOString(), ultimaElegida:elegida, historial:[...(prev.historial||[]),ok].slice(-10)};
  S.prog[q.id]=v; lsSet("istqb.prog",S.prog);
  if(S.db){ try{ await S.db.doc("progreso/"+q.id).set(v) }catch(e){} }
}

  S.sims.unshift(r); lsSet("istqb.sims",S.sims.slice(0,50));

}

/* ---------- Práctica ---------- */
function pickNext(){
  const pr=S.pr;
  let pool = pr.pool ? pr.pool.map(id=>byId[id]).filter(Boolean) : BANCO.filter(q=>!pr.cap || q.cap===pr.cap);
  if(pr.pool && pr.poolLeft){ pool = pr.poolLeft.map(id=>byId[id]); }
  if(!pool.length) return null;
  let cand = pool.filter(q=>q.id!==pr.last);
  if(!cand.length) cand=pool;
  if(pr.orden==="nuevas"){
    const unseen=cand.filter(q=>!S.prog[q.id]);
    if(unseen.length) cand=unseen;
    else { // las peor llevadas primero
      const score=q=>{const p=S.prog[q.id];return p.aciertos/p.intentos};
      const min=Math.min(...cand.map(score)); cand=cand.filter(q=>score(q)===min);
    }
  }
  return cand[Math.floor(Math.random()*cand.length)];
}
function newPracticeQ(){
  const q=pickNext(); const pr=S.pr;
  pr.q=q; pr.sel=[]; pr.done=false; pr.order=q?shuffle(Object.keys(q.opciones)):null;
  if(pr.askCtl){pr.askCtl.abort();pr.askCtl=null}
}
function renderPractice(app){
  const pr=S.pr;
  if(!pr.q) newPracticeQ();
  const seen=Object.keys(S.prog).length;
  const tot=Object.values(S.prog).reduce((a,p)=>[a[0]+p.aciertos,a[1]+p.intentos],[0,0]);
  const caps=[0,1,2,3,4,5,6].map(c=>`<button class="chip" data-cap="${c}" aria-pressed="${!pr.pool && pr.cap===c}">${c?("Cap. "+c):"Todo el temario"}</button>`).join("");
  let head;
  if(pr.pool){
    head=`<div class="row"><span class="pill bad">Repaso de falladas</span><span class="muted">${pr.poolLeft.length} pendientes en esta tanda</span><button class="btn ghost small" id="exitPool">Volver a todo el temario</button></div>`;
  } else {
    head=`<div class="row">${caps}</div>
    <div class="row muted" style="font-size:.9rem">Orden:
      <button class="chip" data-ord="nuevas" aria-pressed="${pr.orden==="nuevas"}">Nuevas primero</button>
      <button class="chip" data-ord="azar" aria-pressed="${pr.orden==="azar"}">Al azar</button>
      <span style="margin-left:auto" class="mono">${seen}/${BANCO.length} vistas · ${pct(tot[0],tot[1])} % de acierto</span></div>`;
  }
  const q=pr.q;
  if(!q){ app.innerHTML=head+`<div class="empty">No quedan preguntas en esta tanda. <button class="btn small" id="exitPool2">Volver a practicar</button></div>`; bindPracticeHead(); const b=$("#exitPool2"); if(b) b.onclick=()=>{pr.pool=null;pr.poolLeft=null;newPracticeQ();render()}; return; }
  const need=q.correcta.length;
  let body = `<section class="sheet" aria-live="polite">${qHead(q)}${optsHTML(q,pr.order,pr.sel,pr.done,pr.sel)}`;
  if(!pr.done){
    body+=`<div class="row"><button class="btn" id="check" ${pr.sel.length!==need?"disabled":""}>Comprobar</button><span class="muted" style="font-size:.85rem">Teclas <kbd>A</kbd>–<kbd>${LET[pr.order.length-1]}</kbd> para elegir · <kbd>Enter</kbd> para comprobar</span></div>`;
  } else {
    const ok=isRight(q,pr.sel);
    const corr=q.correcta.map(k=>letterOf(pr.order,k)).join(" y ");
    body+=`<div class="verdict ${ok?"ok":"bad"}">${ok?"Correcta.":"Incorrecta. La respuesta correcta es la "+corr+"."}</div>`;
    body+=explHTML(q);
    body+=askHTML();
    body+=`<div class="row"><button class="btn" id="next">Siguiente pregunta</button><span class="muted" style="font-size:.85rem"><kbd>Enter</kbd></span></div>`;
  }
  body+=`</section><p class="save" id="saveInfo"></p>`;
  app.innerHTML=head+body; saveLabel();
  bindPracticeHead();
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>toggleSel(b.dataset.key)));
  const c=$("#check"); if(c) c.onclick=checkPractice;
  const n=$("#next"); if(n) n.onclick=nextPractice;
  bindAsk(q, pr.order, pr.sel);
}
function bindPracticeHead(){
  const pr=S.pr;
  document.querySelectorAll("[data-cap]").forEach(b=>b.onclick=()=>{pr.cap=+b.dataset.cap;pr.last=null;newPracticeQ();render()});
  document.querySelectorAll("[data-ord]").forEach(b=>b.onclick=()=>{pr.orden=b.dataset.ord;render()});
  const e=$("#exitPool"); if(e) e.onclick=()=>{pr.pool=null;pr.poolLeft=null;newPracticeQ();render()};
}
function toggleSel(key){
  const pr=S.pr; if(pr.done) return; const need=pr.q.correcta.length;
  if(need===1) pr.sel=[key];
  else pr.sel = pr.sel.includes(key) ? pr.sel.filter(k=>k!==key) : (pr.sel.length<need ? [...pr.sel,key] : [pr.sel[1],key]);
  render();
}
function checkPractice(){
  const pr=S.pr; if(pr.done || pr.sel.length!==pr.q.correcta.length) return;
  pr.done=true; const ok=isRight(pr.q,pr.sel);
  recordAnswer(pr.q, ok, pr.sel);
  if(pr.pool && ok) pr.poolLeft=pr.poolLeft.filter(id=>id!==pr.q.id);
  render();
}
function nextPractice(){ S.pr.last=S.pr.q.id; newPracticeQ(); render(); window.scrollTo({top:0}); }
document.addEventListener("keydown",e=>{
  if(S.view!=="practicar" || !S.pr.q) return;
  if(e.target.closest("textarea,input")) return;
  const k=e.key.toUpperCase(); const i=LET.indexOf(k);
  if(i>=0 && i<S.pr.order.length && !S.pr.done){ e.preventDefault(); toggleSel(S.pr.order[i]); }
  else if(e.key==="Enter"){ e.preventDefault(); S.pr.done?nextPractice():checkPractice(); }
});

function md(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n/);
  let h="",ul=false;
  for(const l of lines){
    if(/^\s*[-•*]\s+/.test(l)){ if(!ul){h+="<ul>";ul=true} h+="<li>"+l.replace(/^\s*[-•*]\s+/,"")+"</li>"; }
    else { if(ul){h+="</ul>";ul=false} if(l.trim()) h+="<p>"+l+"</p>"; }
  }
  return h+(ul?"</ul>":"");
}

${opts}

RESPUESTA CORRECTA: ${q.correcta.map(k=>letterOf(order,k)).join(" y ")}
RESPUESTA DEL ALUMNO: ${sel.map(k=>letterOf(order,k)).join(" y ")} (${isRight(q,sel)?"acertó":"falló"})
EXPLICACIÓN DE REFERENCIA: ${q.explicacion}

DUDA DEL ALUMNO: ${pregunta}

Responde a su duda de forma clara y directa, en 120-250 palabras, con un ejemplo práctico si ayuda. Si ha fallado, explica qué confusión probable le llevó a elegir su opción. Ciñete al programa CTFL v4.0. Usa texto plano; puedes usar **negrita** y viñetas con "- ".`;
    const ctl=new AbortController(); S.pr.askCtl=ctl;
    btn.disabled=true; $("#askAlt").disabled=true; stop.hidden=false; out.innerHTML=`<p class="muted">Pensando…</p>`;
    stop.onclick=()=>ctl.abort();
    try{
      await S.sample(prompt,{signal:ctl.signal,onText:({text})=>{out.innerHTML=md(text)}});
    }catch(e){
      if(e && e.text) out.innerHTML=md(e.text); else if(!e || e.code!=="cancelled") out.innerHTML="";
      if(e && (e.code==="not_granted"||e.code==="sampling_disabled"||e.code==="not_declared")){ out.innerHTML=`<p class="muted">Las preguntas a Claude no están disponibles en esta vista. Puedes preguntarme en el chat.</p>`; }
      else if(e && e.code==="rate_limited"){ out.innerHTML+=`<p class="muted">Demasiadas preguntas seguidas. Prueba de nuevo dentro de un rato.</p>`; }
      else if(e && e.code!=="cancelled"){ out.innerHTML+=`<p class="muted">No se ha podido completar la respuesta. Vuelve a intentarlo.</p>`; }
    }finally{ btn.disabled=false; const a=$("#askAlt"); if(a) a.disabled=false; stop.hidden=true; }
  };
  btn.onclick=()=>{ const t=txt.value.trim(); if(t) run(t); else txt.focus(); };
  $("#askAlt").onclick=()=>run("Explícame esta pregunta con un ejemplo práctico distinto, y cómo reconocer este tipo de pregunta en el examen.");
}

/* ---------- Simulacro ---------- */
function buildSim(mins){
  const ids=[];
  for(const [cap,ks] of Object.entries(DIST)) for(const [k,n] of Object.entries(ks)){
    const pool=shuffle(BANCO.filter(q=>q.cap===+cap && q.k===k));
    // prioriza las menos vistas
    pool.sort((a,b)=>((S.prog[a.id]||{}).intentos||0)-((S.prog[b.id]||{}).intentos||0));
    ids.push(...pool.slice(0,n).map(q=>q.id));
  }
  ids.sort((a,b)=>byId[a].cap-byId[b].cap);
  return {ids, orders:Object.fromEntries(ids.map(id=>[id,shuffle(Object.keys(byId[id].opciones))])), ans:{}, flags:{}, cur:0, start:Date.now(), mins};
}
let tick=null;
function renderSim(app){
  if(S.simResult) return renderSimResult(app);
  if(!S.sim){ S.sim=lsGet("istqb.simDraft",null); }
  const sim=S.sim;
  if(!sim){
    const last=S.sims[0];
    app.innerHTML=`<section class="sheet"><h2>Simulacro de examen</h2>
    <p>40 preguntas elegidas al azar con el mismo reparto por capítulo y nivel K que el examen oficial. Se aprueba con <b>26 puntos (65 %)</b>. Puedes moverte entre preguntas y marcarlas para revisar. Las explicaciones aparecen al entregar.</p>
    <div class="scroll"><table class="tbl"><thead><tr><th>Capítulo</th><th>Preguntas</th><th>K1 / K2 / K3</th></tr></thead><tbody>
    ${Object.entries(DIST).map(([c,k])=>`<tr><td>${c}. ${CAPS[c]}</td><td class="mono">${Object.values(k).reduce((a,b)=>a+b,0)}</td><td class="mono">${k.K1||0} / ${k.K2||0} / ${k.K3||0}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="row"><button class="btn" data-min="60">Empezar · 60 min</button><button class="btn ghost" data-min="75">Empezar · 75 min (examen en un idioma no nativo)</button></div>
    ${last?`<p class="muted">Último simulacro: ${last.puntos}/40 · ${last.aprobado?"aprobado":"suspenso"} · ${new Date(last.fecha).toLocaleDateString("es-ES")}</p>`:""}
    </section>`;
    app.querySelectorAll("[data-min]").forEach(b=>b.onclick=()=>{S.sim=buildSim(+b.dataset.min);lsSet("istqb.simDraft",S.sim);render()});
    return;
  }
  const q=byId[sim.ids[sim.cur]], order=sim.orders[q.id], sel=sim.ans[q.id]||[];
  const answered=Object.values(sim.ans).filter(a=>a.length).length;
  app.innerHTML=`<div class="simhead"><div><h2 style="font-size:1.2rem">Pregunta ${sim.cur+1} de 40</h2><span class="muted">${answered} respondidas</span></div><div class="timer" id="timer"></div></div>
  <section class="sheet">${qHead(q)}${optsHTML(q,order,sel,false,[])}
  <div class="row"><button class="btn ghost small" id="prev" ${sim.cur===0?"disabled":""}>Anterior</button><button class="btn small" id="nxt" ${sim.cur===39?"disabled":""}>Siguiente</button>
  <button class="btn ghost small" id="flag">${sim.flags[q.id]?"Quitar marca":"Marcar para revisar"}</button></div></section>
  <section class="sheet"><div class="grid">${sim.ids.map((id,i)=>`<button class="cell ${(sim.ans[id]||[]).length?"done":""} ${i===sim.cur?"cur":""} ${sim.flags[id]?"flag":""}" data-i="${i}" aria-label="Pregunta ${i+1}">${i+1}</button>`).join("")}</div>
  <div class="row"><button class="btn" id="submit">Entregar examen</button><button class="btn ghost small" id="abandon">Abandonar</button><span class="muted" id="confirmTxt"></span></div></section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const key=b.dataset.key, need=q.correcta.length; let s=sim.ans[q.id]||[];
    if(need===1) s=[key]; else s=s.includes(key)?s.filter(k=>k!==key):(s.length<need?[...s,key]:[s[1],key]);
    sim.ans[q.id]=s; lsSet("istqb.simDraft",sim); render();
  });
  $("#prev").onclick=()=>{sim.cur--;render()}; $("#nxt").onclick=()=>{sim.cur++;render()};
  $("#flag").onclick=()=>{sim.flags[q.id]=!sim.flags[q.id];lsSet("istqb.simDraft",sim);render()};
  app.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{sim.cur=+b.dataset.i;render()});
  const sub=$("#submit");
  sub.onclick=()=>{
    const left=40-answered;
    if(left>0 && !sub.dataset.sure){ sub.dataset.sure="1"; sub.textContent="Sí, entregar"; $("#confirmTxt").textContent=`Te quedan ${left} sin responder.`; return; }
    finishSim();
  };
  const ab=$("#abandon");
  ab.onclick=()=>{ if(!ab.dataset.sure){ab.dataset.sure="1";ab.textContent="Confirmar: abandonar sin guardar";return} S.sim=null;lsSet("istqb.simDraft",null);clearInterval(tick);render(); };
  startTick();
}
function startTick(){
  clearInterval(tick);
  const upd=()=>{
    const sim=S.sim; const el=$("#timer"); if(!sim){clearInterval(tick);return}
    const rest=Math.max(0, sim.mins*60 - Math.floor((Date.now()-sim.start)/1000));
    if(el){ el.textContent=`${String(Math.floor(rest/60)).padStart(2,"0")}:${String(rest%60).padStart(2,"0")}`; el.classList.toggle("low",rest<300); }
    if(rest===0){ clearInterval(tick); finishSim(true); }
  };
  upd(); tick=setInterval(upd,1000);
}
async function finishSim(timeout){
  clearInterval(tick);
  const sim=S.sim; if(!sim) return;
  const porCap={}; let puntos=0; const respuestas=[];
  for(const id of sim.ids){
    const q=byId[id], sel=sim.ans[id]||[], ok=isRight(q,sel);
    if(ok) puntos++;
    porCap[q.cap]=porCap[q.cap]||{ok:0,total:0}; porCap[q.cap].total++; if(ok) porCap[q.cap].ok++;
    respuestas.push({qid:id,elegida:sel,ok});
  }
  const r={fecha:new Date().toISOString(),puntos,total:40,aprobado:puntos>=26,porCapitulo:porCap,duracionSeg:Math.min(sim.mins*60,Math.round((Date.now()-sim.start)/1000)),limiteMin:sim.mins,porTiempo:!!timeout,respuestas};
  S.simResult={...r, orders:sim.orders};
  S.sim=null; lsSet("istqb.simDraft",null);
  render();
  for(const a of respuestas){ if(a.elegida.length) await recordAnswer(byId[a.qid],a.ok,a.elegida); }
  await recordSim(r);
  render();
}
function renderSimResult(app){
  const r=S.simResult;
  const mm=Math.floor(r.duracionSeg/60), ss=r.duracionSeg%60;
  app.innerHTML=`<section class="sheet">
   <div class="row" style="justify-content:space-between"><div><div class="big">${r.puntos}<span class="muted" style="font-size:1.4rem">/40</span></div><p class="muted">${pct(r.puntos,40)} % · ${mm} min ${ss} s${r.porTiempo?" · se agotó el tiempo":""}</p></div>
   <span class="pill ${r.aprobado?"ok":"bad"}" style="font-size:1rem;padding:6px 14px">${r.aprobado?"Aprobado":"Suspenso"} (mínimo 26)</span></div>
   <div class="scroll"><table class="tbl"><thead><tr><th>Capítulo</th><th>Aciertos</th><th style="width:40%"></th></tr></thead><tbody>
   ${Object.entries(r.porCapitulo).map(([c,v])=>{const p=pct(v.ok,v.total);return `<tr><td>${c}. ${CAPS[c]}</td><td class="mono">${v.ok}/${v.total}</td><td><div class="meter ${p>=65?"ok":p>=50?"warn":"bad"}"><i style="width:${p}%"></i></div></td></tr>`}).join("")}
   </tbody></table></div>
   <div class="row"><button class="btn" id="again">Nuevo simulacro</button><button class="btn ghost" id="toFail">Repasar las falladas</button></div></section>
   <h3>Revisión pregunta a pregunta</h3>
   <div class="list">${r.respuestas.map((a,i)=>{const q=byId[a.qid],ord=r.orders[a.qid];
     return `<details class="rev"><summary><span class="pill ${a.ok?"ok":"bad"}">${a.ok?"Bien":(a.elegida.length?"Mal":"Sin responder")}</span><span><b class="mono">${i+1}.</b> ${esc(q.tema)} <span class="muted mono" style="font-size:.78rem">${q.lo} · ${q.k}</span></span></summary>
     <div class="inner">${qHead(q)}${optsHTML(q,ord,[],true,a.elegida)}${explHTML(q)}</div></details>`}).join("")}</div>`;
  $("#again").onclick=()=>{S.simResult=null;render()};
  $("#toFail").onclick=()=>{S.simResult=null;startFailedPractice()};
}

/* ---------- Falladas ---------- */
function startFailedPractice(){
  const ids=failed().map(q=>q.id); if(!ids.length){go("falladas");return}
  Object.assign(S.pr,{pool:ids,poolLeft:ids.slice(),last:null}); newPracticeQ(); go("practicar");
}
function renderFailed(app){
  const f=failed();
  if(!f.length){ app.innerHTML=`<h2>Falladas</h2><div class="empty">No tienes preguntas falladas pendientes. Cuando falles una, aparecerá aquí hasta que la aciertes.</div>`; return; }
  app.innerHTML=`<div class="row" style="justify-content:space-between"><h2>Falladas (${f.length})</h2><button class="btn" id="go">Practicar estas ${f.length}</button></div>
  <p class="muted">Preguntas cuya última respuesta fue incorrecta. Salen de la lista al acertarlas.</p>
  <div class="list">${f.sort((a,b)=>a.cap-b.cap||a.id.localeCompare(b.id)).map(q=>{const p=S.prog[q.id];return `<div class="item"><div class="t"><span><b>${esc(q.tema)}</b></span><span class="muted mono" style="font-size:.78rem">Cap. ${q.cap} · ${q.lo} · ${q.k} · ${p.aciertos}/${p.intentos} aciertos</span></div><button class="btn ghost small" data-q="${q.id}">Repetir</button></div>`}).join("")}</div>`;
  $("#go").onclick=startFailedPractice;
  app.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{Object.assign(S.pr,{pool:[b.dataset.q],poolLeft:[b.dataset.q],last:null}); newPracticeQ(); go("practicar");});
}

/* ---------- Progreso ---------- */
function renderProgress(app){
  const P=Object.values(S.prog);
  const tot=P.reduce((a,p)=>[a[0]+p.aciertos,a[1]+p.intentos],[0,0]);
  const firstTry=P.filter(p=>p.historial&&p.historial.length).map(p=>p.historial[p.historial.length-1]);
  const rows=Object.keys(CAPS).map(c=>{
    const qs=BANCO.filter(q=>q.cap===+c), ps=qs.map(q=>S.prog[q.id]).filter(Boolean);
    const a=ps.reduce((x,p)=>[x[0]+p.aciertos,x[1]+p.intentos],[0,0]);
    const ultimaOk=ps.filter(p=>p.ultimaCorrecta).length;
    return {c,total:qs.length,vistas:ps.length,acc:pct(a[0],a[1]),ultimaOk,intentos:a[1]};
  });
  const kr=["K1","K2","K3"].map(k=>{const ps=P.filter(p=>p.k===k);const a=ps.reduce((x,p)=>[x[0]+p.aciertos,x[1]+p.intentos],[0,0]);return {k,acc:pct(a[0],a[1]),n:a[1]}});
  const weak=rows.filter(r=>r.intentos>=3).sort((a,b)=>a.acc-b.acc)[0];
  const sims=S.sims;
  app.innerHTML=`<h2>Tu progreso</h2>
  <div class="stats">
    <div class="stat"><div class="v">${P.length}<span class="muted" style="font-size:1rem">/${BANCO.length}</span></div><div class="l">preguntas vistas</div></div>
    <div class="stat"><div class="v">${pct(tot[0],tot[1])} %</div><div class="l">acierto global (${tot[1]} respuestas)</div></div>
    <div class="stat"><div class="v">${pct(firstTry.filter(Boolean).length,firstTry.length)} %</div><div class="l">acierto en la última respuesta de cada pregunta</div></div>
    <div class="stat"><div class="v">${sims.length?Math.max(...sims.map(s=>s.puntos)):"—"}</div><div class="l">mejor simulacro (de 40)</div></div>
  </div>
  ${weak&&weak.acc<65?`<div class="tip"><b>Dónde reforzar</b>El capítulo ${weak.c} (${CAPS[weak.c]}) va al ${weak.acc} %. Practica ese capítulo hasta superar el 65 %.</div>`:""}
  <section class="sheet"><h3>Por capítulo</h3><div class="scroll"><table class="tbl"><thead><tr><th>Capítulo</th><th>Vistas</th><th>Acierto</th><th style="width:30%"></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r.c}. ${CAPS[r.c]}</td><td class="mono">${r.vistas}/${r.total}</td><td class="mono">${r.intentos?r.acc+" %":"—"}</td><td><div class="meter ${!r.intentos?"":r.acc>=65?"ok":r.acc>=50?"warn":"bad"}"><i style="width:${r.intentos?r.acc:0}%"></i></div></td></tr>`).join("")}
  </tbody></table></div>
  <div class="row mono" style="font-size:.85rem">${kr.map(x=>`<span><span class="k">${x.k}</span> ${x.n?x.acc+" %":"—"}</span>`).join(" · ")}</div></section>
  <section class="sheet"><h3>Simulacros</h3>${sims.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Fecha</th><th>Nota</th><th>Resultado</th><th>Tiempo</th></tr></thead><tbody>
  ${sims.map(s=>`<tr><td>${new Date(s.fecha).toLocaleString("es-ES",{dateStyle:"medium",timeStyle:"short"})}</td><td class="mono">${s.puntos}/40</td><td><span class="pill ${s.aprobado?"ok":"bad"}">${s.aprobado?"Aprobado":"Suspenso"}</span></td><td class="mono">${Math.round(s.duracionSeg/60)} / ${s.limiteMin} min</td></tr>`).join("")}
  </tbody></table></div>`:`<p class="muted">Aún no has hecho ningún simulacro. Cuando aciertes más del 70 % en práctica, prueba uno.</p>`}</section>
  <p class="save" id="saveInfo"></p>`;
  saveLabel();
}

/* ---------- Arranque ---------- */
const h=(location.hash||"").slice(1); if(VIEWS.includes(h)) S.view=h;
render();
initStore();
if(window.claude) window.claude.use("sample").then(s=>{ if(s){ S.sample=s; if(S.view==="practicar"&&S.pr.done) render(); } }).catch(()=>{});
</script>
