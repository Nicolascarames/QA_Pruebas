cación y análisis: se analizan y discuten las anomalías; después, corrección e informe."], "razones": {"a": "La planificación define el alcance, el esfuerzo y los plazos de la revisión.", "b": "Cada revisor examina el producto por su cuenta en esa fase.", "c": "Correcta. Es el contenido de la actividad de inicio.", "d": "Se analizan y discuten anomalías ya identificadas."}, "clave": "Inicio = todos preparados; individual = revisión por cuenta propia."}, {"id": "3-14", "cap": 3, "lo": "FL-3.2.3", "k": "K1", "fuente": "3.2.3", "tema": "Roles de revisión", "pregunta": "¿Qué rol de una revisión decide qué se va a revisar y proporciona los recursos, como personal y tiempo?", "opciones": {"a": "El gerente.", "b": "El autor.", "c": "El escriba.", "d": "El revisor."}, "correcta": ["a"], "concepto": "El gerente decide qué se va a revisar y proporciona recursos para la revisión, como personal y tiempo.", "explicacion": ["Gerente: decide qué se revisa y aporta personal y tiempo.", "Autor: crea y corrige el producto de trabajo revisado.", "Moderador (facilitador): garantiza el buen desarrollo de las reuniones.", "Escriba, revisor y líder de la revisión completan los roles principales."], "razones": {"a": "Correcta. Decide qué se revisa y aporta recursos.", "b": "El autor crea y corrige el producto.", "c": "El escriba recopila anomalías y registra decisiones.", "d": "El revisor realiza la revisión."}, "clave": "Gerente = qué revisar y recursos; autor = producto."}, {"id": "3-15", "cap": 3, "lo": "FL-3.2.4", "k": "K2", "fuente": "3.2.4", "tema": "Tipos de revisión", "pregunta": "¿En qué tipo de revisión el autor NO puede actuar como líder de la revisión ni como escriba?", "opciones": {"a": "Revisión informal.", "b": "Recorrido.", "c": "Revisión técnica.", "d": "Inspección."}, "correcta": ["d"], "concepto": "En la inspección, el tipo de revisión más formal, el autor no puede actuar como líder de la revisión ni como escriba.", "explicacion": ["Informal: sin proceso definido; objetivo principal, detectar anomalías.", "Recorrido: lo dirige el autor y puede servir a muchos objetivos, como educar o lograr consenso.", "Revisión técnica: revisores técnicamente cualificados, dirigida por un moderador; busca consenso y decisiones técnicas.", "Inspección: la más formal; recopila métricas y el autor no puede ser líder ni escriba."], "razones": {"a": "La informal no sigue un proceso definido.", "b": "En el recorrido es el autor quien lo dirige.", "c": "La dirige un moderador; la restricción sobre el autor es propia de la inspección.", "d": "Correcta. En la inspección el autor no puede ser líder ni escriba."}, "clave": "Autor dirige = recorrido; autor excluido de líder y escriba = inspección."}, {"id": "3-16", "cap": 3, "lo": "FL-3.2.5", "k": "K1", "fuente": "3.2.5", "tema": "Factores de éxito", "pregunta": "¿Cuál de las siguientes prácticas NO es un factor de éxito de las revisiones?", "opciones": {"a": "Definir objetivos claros y criterios de salida medibles.", "b": "Dividir los productos grandes en fragmentos pequeños.", "c": "Revisar el producto de trabajo completo en una única sesión larga.", "d": "Dar a los participantes tiempo suficiente para prepararse."}, "correcta": ["c"], "concepto": "Factores de éxito: objetivos claros, tipo de revisión adecuado, partes pequeñas, tiempo de preparación, apoyo de la gerencia, formación y reuniones facilitadas.", "explicacion": ["Objetivos claros y criterios de salida medibles.", "Tipo de revisión adecuado al objetivo, al producto y al contexto.", "Revisar partes pequeñas para que los revisores no pierdan la concentración.", "Tiempo para prepararse, apoyo de la gerencia, formación y revisiones como parte de la cultura."], "razones": {"a": "Es un factor de éxito.", "b": "Es un factor de éxito: partes pequeñas mantienen la concentración.", "c": "Correcta. Una sesión larga sobre todo el producto no es buena práctica: conviene revisar partes pequeñas.", "d": "Es un factor de éxito."}, "clave": "Revisar en trozos pequeños, no todo de golpe."}, {"id": "3-17", "cap": 3, "lo": "FL-3.2.2", "k": "K1", "fuente": "3.2.2", "tema": "Anomalía (anomaly)", "pregunta": "¿Cuál de las siguientes afirmaciones sobre las anomalías identificadas en una revisión es correcta?", "opciones": {"a": "Las anomalías no son necesariamente defectos, por lo que hay que analizarlas y decidir su estado, propietario y acciones necesarias.", "b": "Toda anomalía es un defecto y el autor debe corregirla sin más análisis.", "c": "Solo se registran anomalías durante la reunión de revisión, nunca en la revisión individual.", "d": "Solo las inspecciones permiten identificar anomalías."}, "correcta": ["a"], "concepto": "Las anomalías identificadas en una revisión no son necesariamente defectos, así que se analizan y se decide su estado, propietario y acciones requeridas.", "explicacion": ["Cada revisor registra anomalías, recomendaciones y preguntas durante su revisión individual.", "Las anomalías no son necesariamente defectos.", "Por eso se analizan y discuten, normalmente en una reunión de revisión.", "Para cada anomalía se decide su estado, propietario y acciones; solo para los defectos se crea un informe."], "razones": {"a": "Correcta.", "b": "Las anomalías no son necesariamente defectos; deben analizarse antes.", "c": "Los revisores las identifican y registran en la revisión individual; la reunión sirve para analizarlas.", "d": "Todos los tipos de revisión pueden detectar anomalías; es incluso el objetivo principal de la revisión informal."}, "clave": "Anomalía ≠ defecto: primero se analiza."}, {"id": "3-18", "cap": 3, "lo": "FL-3.1.2", "k": "K1", "fuente": "3.1", "tema": "Análisis estático (static analysis)", "pregunta": "¿Cuál de las siguientes afirmaciones sobre el análisis estático es correcta?", "opciones": {"a": "Puede identificar problemas antes de la prueba dinámica, a menudo con menos esfuerzo, porque no requiere casos de prueba y suele usar herramientas.", "b": "Requiere ejecutar el código con casos de prueba diseñados.", "c": "Solo se utiliza para detectar defectos de rendimiento.", "d": "Solo se puede aplicar a documentos en lenguaje natural sin estructura."}, "correcta": ["a"], "concepto": "El análisis estático identifica problemas antes de la prueba dinámica con menos esfuerzo, pues no requiere casos de prueba y se hace con herramientas.", "explicacion": ["Puede identificar problemas antes de la prueba dinámica, a menudo con menos esfuerzo.", "No requiere casos de prueba y suele usar herramientas.", "Suele incorporarse a los marcos de CI.", "Se usa sobre todo para detectar defectos de código concretos, y también para evaluar mantenibilidad y seguridad."], "razones": {"a": "Correcta.", "b": "No hace falta ejecutar el software: es prueba estática.", "c": "Detecta defectos de código concretos y también evalúa mantenibilidad y seguridad.", "d": "Al contrario: necesita productos con una estructura (modelos, código o texto con sintaxis formal)."}, "clave": "Análisis estático = herramientas, sin ejecutar ni casos de prueba, sobre productos con estructura."}, {"id": "3-19", "cap": 3, "lo": "FL-3.2.4", "k": "K1", "fuente": "3.2.4", "tema": "Recorrido (walkthrough)", "pregunta": "¿Qué tipo de revisión está dirigida por el autor y puede tener entre sus objetivos educar a los revisores, lograr consenso y generar ideas nuevas?", "opciones": {"a": "Revisión informal.", "b": "Recorrido.", "c": "Revisión técnica.", "d": "Inspección."}, "correcta": ["b"], "concepto": "El recorrido (walkthrough) lo dirige el autor y puede servir a muchos objetivos, como educar a los revisores, lograr consenso y generar ideas nuevas.", "explicacion": ["Lo dirige el autor.", "Objetivos: evaluar la calidad, generar confianza, educar a los revisores y lograr consenso.", "También: generar ideas nuevas, motivar a los autores a mejorar y detectar anomalías.", "Los revisores pueden hacer una revisión individual previa, pero no es obligatorio."], "razones": {"a": "No sigue un proceso definido y su objetivo principal es detectar anomalías.", "b": "Correcta. Dirigido por el autor = recorrido.", "c": "La dirige un moderador y la realizan revisores técnicamente cualificados.", "d": "Es la más formal y busca el máximo de anomalías; el autor no puede ser líder ni escriba."}, "clave": "Dirige el autor = recorrido."}, {"id": "3-20", "cap": 3, "lo": "FL-3.2.4", "k": "K1", "fuente": "3.2.4", "tema": "Revisión técnica (technical review)", "pregunta": "¿Qué afirmación describe correctamente la revisión técnica?", "opciones": {"a": "La realizan revisores técnicamente cualificados y la dirige un moderador, con el objetivo de lograr consenso y tomar decisiones sobre un problema técnico.", "b": "La dirige el autor y la revisión individual previa de los revisores no es obligatoria.", "c": "No sigue un proceso definido ni requiere un resultado documentado formal.", "d": "Su objetivo principal es encontrar el máximo número de anomalías y recopilar métricas para mejorar el ciclo de vida."}, "correcta": ["a"], "concepto": "La revisión técnica la hacen revisores técnicamente cualificados, dirigidos por un moderador, para lograr consenso y tomar decisiones sobre un problema técnico.", "explicacion": ["La realizan revisores técnicamente cualificados y la dirige un moderador.", "Objetivos principales: lograr consenso y tomar decisiones sobre un problema técnico.", "También: detectar anomalías, evaluar la calidad y generar confianza en el producto.", "Y generar ideas nuevas, motivar y capacitar a los autores para mejorar."], "razones": {"a": "Correcta.", "b": "Eso describe el recorrido.", "c": "Eso describe la revisión informal.", "d": "Eso describe la inspección."}, "clave": "Técnica = revisores cualificados + moderador + consenso técnico."}, {"id": "4-01", "cap": 4, "lo": "FL-4.2.1", "k": "K3", "fuente": "4.2.1", "tema": "Partición de equivalencia", "pregunta": "Un campo de una web de venta de entradas acepta números enteros:\n• menos de 1: se rechaza;\n• de 1 a 6: compra directa;\n• de 7 a 10: requiere aprobación del supervisor;\n• más de 10: se rechaza.\n¿Qué conjunto de valores cubre TODAS las particiones de equivalencia con el menor número de valores?", "opciones": {"a": "0, 3, 8, 11", "b": "1, 6, 7, 10", "c": "-1, 0, 5, 12", "d": "2, 4, 9, 15"}, "correcta": ["a"], "concepto": "En partición de equivalencia los elementos de cobertura son las particiones (válidas e inválidas); el 100 % exige ejercitar cada una al menos una vez.", "explicacion": ["Particiones: ≤ 0 (inválida), 1–6 y 7–10 (válidas), ≥ 11 (inválida): 4 en total.", "Un valor por partición basta: si uno detecta un defecto, otro de la misma partición también.", "0 → P1, 3 → P2, 8 → P3, 11 → P4.", "Las demás opciones dejan alguna partición sin ejercitar."], "razones": {"a": "Correcta. Un valor en cada una de las 4 particiones.", "b": "Solo cubre las dos particiones válidas (son valores frontera de P2 y P3).", "c": "-1 y 0 están ambos en P1, 5 en P2 y 12 en P4: falta P3 (7–10).", "d": "2 y 4 están en P2, 9 en P3 y 15 en P4: falta P1 (≤ 0)."}, "clave": "Primero dibuja las particiones en una recta; luego comprueba que cada opción toca TODAS."}, {"id": "4-02", "cap": 4, "lo": "FL-4.2.1", "k": "K3", "fuente": "4.2.1", "tema": "Partición de equivalencia (Each Choice)", "pregunta": "Un formulario tiene dos parámetros:\n• Tipo de cliente: Particular, Empresa\n• Método de pago: Tarjeta, Transferencia, Bizum\nConsiderando solo las particiones válidas, ¿cuál es el número MÍNIMO de casos de prueba para alcanzar el 100 % de cobertura 'Each Choice'?", "opciones": {"a": "2", "b": "3", "c": "5", "d": "6"}, "correcta": ["b"], "concepto": "Each Choice exige ejercitar cada partición de cada conjunto al menos una vez, sin considerar combinaciones.", "explicacion": ["Conjuntos de particiones: tipo de cliente (2) y método de pago (3).", "Un mismo caso cubre una partición de cada conjunto a la vez.", "El mínimo lo marca el conjunto con más particiones: 3 casos.", "Ej.: (Particular, Tarjeta), (Empresa, Transferencia), (Particular, Bizum)."], "razones": {"a": "Con 2 casos no puedes usar los 3 métodos de pago.", "b": "Correcta. Máximo entre 2 y 3 = 3.", "c": "Es la suma de particiones (2 + 3); no hace falta un caso por partición cuando se pueden combinar.", "d": "Es el producto cartesiano (todas las combinaciones), más de lo que pide Each Choice."}, "clave": "Each Choice → el mínimo es el número de particiones del parámetro que más tiene."}, {"id": "4-03", "cap": 4, "lo": "FL-4.2.2", "k": "K3", "fuente": "4.2.2", "tema": "Análisis de valores frontera (2 valores)", "pregunta": "Una contraseña es válida si tiene entre 8 y 16 caracteres, ambos incluidos. Usando el análisis de valores frontera de DOS valores, ¿qué conjunto de longitudes da el 100 % de cobertura?", "opciones": {"a": "7, 8, 16, 17", "b": "8, 16", "c": "7, 8, 9, 15, 16, 17", "d": "0, 8, 16, 20"}, "correcta": ["a"], "concepto": "En BVA de 2 valores cada frontera aporta dos elementos de cobertura: el valor frontera y su vecino más cercano de la partición adyacente.", "explicacion": ["Particiones: ≤ 7 (inválida), 8–16 (válida), ≥ 17 (inválida).", "Frontera inferior: 7 | 8.", "Frontera superior: 16 | 17.", "Elementos de cobertura: 7, 8, 16 y 17."], "razones": {"a": "Correcta.", "b": "Faltan los vecinos de las particiones inválidas (7 y 17).", "c": "Es el BVA de TRES valores (añade 9 y 15).", "d": "0 y 20 no son valores frontera."}, "clave": "2 valores → frontera + vecino del otro lado. 3 valores → frontera + los dos vecinos."}, {"id": "4-04", "cap": 4, "lo": "FL-4.2.2", "k": "K3", "fuente": "4.2.2", "tema": "Análisis de valores frontera (3 valores)", "pregunta": "Un termostato trabaja con temperaturas enteras en °C:\n• 15 o menos: calefacción encendida;\n• de 16 a 24: no hace nada;\n• 25 o más: aire acondicionado encendido.\nUsando el análisis de valores frontera de TRES valores (valores frontera = mínimo y máximo de cada partición), ¿cuántos valores DISTINTOS hacen falta para el 100 % de cobertura?", "opciones": {"a": "4", "b": "6", "c": "8", "d": "12"}, "correcta": ["c"], "concepto": "En BVA de 3 valores cada valor frontera aporta tres elementos de cobertura: él y sus dos vecinos; algunos pueden no ser valores frontera.", "explicacion": ["Particiones: ≤ 15, 16–24, ≥ 25. Valores frontera (mínimo y máximo de cada partición): 15, 16, 24 y 25.", "15 → {14, 15, 16}; 16 → {15, 16, 17}.", "24 → {23, 24, 25}; 25 → {24, 25, 26}.", "Unión sin duplicados: 14, 15, 16, 17, 23, 24, 25 y 26 = 8 valores."], "razones": {"a": "4 es el número de valores frontera (lo que daría el BVA de 2 valores: 15, 16, 24, 25).", "b": "Se olvida de algún vecino.", "c": "Correcta.", "d": "Cuenta los vecinos duplicados (4 fronteras × 3); hay que quitar los repetidos."}, "clave": "En el BVA de 3 valores, quita los duplicados al unir los vecinos."}, {"id": "4-05", "cap": 4, "lo": "FL-4.2.2", "k": "K3", "fuente": "4.2.2", "tema": "Cobertura de valores frontera", "pregunta": "Un seguro solo se puede contratar con una edad (entera) de 18 a 65 años, ambos incluidos. Se han ejecutado pruebas con las edades 17, 18, 40 y 65. Con el BVA de DOS valores, ¿qué cobertura se ha alcanzado?", "opciones": {"a": "50 %", "b": "75 %", "c": "100 %", "d": "67 %"}, "correcta": ["b"], "concepto": "La cobertura BVA es el número de elementos de cobertura ejercitados entre el total identificado; un valor que no es elemento de cobertura no suma.", "explicacion": ["Fronteras de 2 valores: 17 | 18 y 65 | 66.", "Elementos de cobertura: 17, 18, 65 y 66 (4).", "Ejercitados: 17, 18 y 65; el 40 no es elemento de cobertura.", "Cobertura = 3 / 4 = 75 %; falta el 66."], "razones": {"a": "Contaría solo 2 de 4.", "b": "Correcta. 3 de 4 elementos.", "c": "Falta el 66.", "d": "Sería 2 de 3, que no corresponde a ningún recuento correcto."}, "clave": "Cobertura = elementos ejercitados / elementos identificados. Los valores que no son frontera no suman."}, {"id": "4-06", "cap": 4, "lo": "FL-4.2.3", "k": "K3", "fuente": "4.2.3", "tema": "Tabla de decisión", "pregunta": "Esta tabla de decisión define el descuento de una tienda:", "anexo": "                    R1     R2     R3     R4\nSocio               S      S      N      N\nCompra > 100 €      S      N      S      N\n-------------------------------------------\nDescuento           15 %   10 %   5 %    0 %\n\nPruebas ejecutadas:\nTC1: socio, compra de 150 €\nTC2: no socio, compra de 80 €\nTC3: socio, compra de 120 €", "pregunta2": "¿Qué cobertura se ha alcanzado y qué caso de prueba adicional la AUMENTARÍA?", "opciones": {"a": "50 %; añadir un no socio con una compra de 200 €.", "b": "75 %; añadir un socio con una compra de 50 €.", "c": "50 %; añadir un socio con una compra de 130 €.", "d": "100 %; no hace falta ningún caso más."}, "correcta": ["a"], "concepto": "En tabla de decisión los elementos de cobertura son las columnas con combinaciones factibles; cobertura = columnas ejercitadas / columnas factibles.", "explicacion": ["Columnas: R1 (S,S), R2 (S,N), R3 (N,S), R4 (N,N): 4 factibles.", "TC1 → R1; TC2 → R4; TC3 → R1 (repite).", "Ejercitadas 2 de 4: 50 %.", "Un no socio con 200 € ejercita R3 y sube la cobertura al 75 %."], "razones": {"a": "Correcta.", "b": "La cobertura actual es 50 %, no 75 % (TC3 repite R1).", "c": "Un socio con 130 € vuelve a ser R1: no aumenta la cobertura.", "d": "Faltan R2 y R3."}, "clave": "Mapea cada caso a su columna; los repetidos no suman cobertura."}, {"id": "4-07", "cap": 4, "lo": "FL-4.2.3", "k": "K3", "fuente": "4.2.3", "tema": "Tabla de decisión minimizada", "pregunta": "Reglas de una tienda online:\n• Si el usuario NO está registrado, se le pide registrarse (tenga cupón o no).\n• Si está registrado y tiene cupón, se aplica el descuento.\n• Si está registrado y no tiene cupón, se cobra el precio normal.\nCondiciones: 'Registrado' (S/N) y 'Tiene cupón' (S/N). ¿Cuántas columnas tiene la tabla de decisión MINIMIZADA (colapsada)?", "opciones": {"a": "2", "b": "3", "c": "4", "d": "6"}, "correcta": ["b"], "concepto": "Una tabla de decisión se minimiza fusionando columnas en las que alguna condición no afecta al resultado, marcada con «–».", "explicacion": ["Tabla completa: 2² = 4 columnas.", "(S,S) → descuento; (S,N) → precio normal.", "(N,S) y (N,N) dan la misma acción: «Registrado = N» basta.", "Se fusionan en (N,–): quedan 3 columnas."], "razones": {"a": "No se pueden colapsar también las columnas de los usuarios registrados: tienen acciones distintas.", "b": "Correcta.", "c": "Es la tabla completa, sin minimizar.", "d": "No corresponde a ninguna construcción correcta."}, "clave": "Colapsa las columnas con la misma acción que solo difieren en una condición irrelevante (–)."}, {"id": "4-08", "cap": 4, "lo": "FL-4.2.4", "k": "K3", "fuente": "4.2.4", "tema": "Prueba de transición de estados", "pregunta": "Una tarjeta bancaria tiene este modelo de estados (estado inicial: Inactiva):", "anexo": "Inactiva  --activar-->          Activa\nActiva    --3 PIN erróneos-->   Bloqueada\nBloqueada --desbloquear-->      Activa\nActiva    --desactivar-->       Inactiva", "pregunta2": "Si todos los casos de prueba deben empezar en el estado Inactiva y pueden tener cualquier longitud, ¿cuál es el número MÍNIMO de casos de prueba para alcanzar el 100 % de cobertura de transiciones válidas (0-switch)?", "opciones": {"a": "1", "b": "2", "c": "3", "d": "4"}, "correcta": ["a"], "concepto": "En cobertura de transiciones válidas (0-switch) los elementos de cobertura son las transiciones válidas; un caso puede cubrir varias.", "explicacion": ["Hay 4 transiciones válidas.", "Un caso es una secuencia de eventos y puede cubrir varias transiciones.", "Camino: Inactiva → Activa → Bloqueada → Activa → Inactiva.", "Ese único caso ejercita las 4: el mínimo es 1."], "razones": {"a": "Correcta.", "b": "Sobra un caso: un solo camino recorre las 4.", "c": "Sobran casos.", "d": "Sería un caso por transición, pero se pueden encadenar en un camino."}, "clave": "Si no limitan la longitud del caso, busca un camino que encadene todas las transiciones."}, {"id": "4-09", "cap": 4, "lo": "FL-4.2.4", "k": "K3", "fuente": "4.2.4", "tema": "Prueba de transición de estados (todas las transiciones)", "pregunta": "Con el mismo modelo de la tarjeta (estados: Inactiva, Activa y Bloqueada; eventos: activar, 3 PIN erróneos, desbloquear y desactivar; 4 transiciones válidas), ¿cuántas transiciones INVÁLIDAS hay que intentar para alcanzar el 100 % de cobertura de todas las transiciones?", "anexo": "Inactiva  --activar-->          Activa\nActiva    --3 PIN erróneos-->   Bloqueada\nBloqueada --desbloquear-->      Activa\nActiva    --desactivar-->       Inactiva", "opciones": {"a": "4", "b": "8", "c": "12", "d": "3"}, "correcta": ["b"], "concepto": "En cobertura de todas las transiciones se ejercitan las válidas y se intenta ejecutar las inválidas, una por caso para evitar el enmascaramiento.", "explicacion": ["Tabla de estados: 3 estados × 4 eventos = 12 celdas.", "Transiciones válidas: 4.", "Inválidas (celdas vacías): 12 − 4 = 8.", "Cada inválida se intenta en un caso aparte para evitar el enmascaramiento de defectos."], "razones": {"a": "Es el número de transiciones válidas.", "b": "Correcta.", "c": "Es el número total de celdas de la tabla (válidas + inválidas).", "d": "Es el número de estados."}, "clave": "Inválidas = estados × eventos − válidas. Una inválida por caso."}, {"id": "4-10", "cap": 4, "lo": "FL-4.5.3", "k": "K3", "fuente": "4.5.3", "tema": "ATDD", "pregunta": "Historia de usuario: 'Como cliente quiero retirar efectivo del cajero para disponer de dinero.'", "anexo": "Criterios de aceptación:\n1. El importe debe ser múltiplo de 10 €.\n2. El máximo diario es de 600 €.\n3. El saldo debe ser suficiente.", "pregunta2": "¿Cuál es un caso de prueba NEGATIVO derivado correctamente de los criterios de aceptación?", "opciones": {"a": "Retirar 100 € con un saldo de 500 €: se entrega el dinero.", "b": "Retirar 610 € con un saldo de 1.000 € y nada retirado hoy: se rechaza por superar el límite diario.", "c": "Comprobar que el cajero muestra publicidad mientras se procesa la operación.", "d": "Retirar 600 € con un saldo de 1.000 €: se entrega el dinero."}, "correcta": ["b"], "concepto": "En ATDD las pruebas se derivan de los criterios de aceptación antes de implementar: primero las positivas, luego las negativas y por último las no funcionales.", "explicacion": ["Criterios: múltiplo de 10 €, máximo diario 600 € y saldo suficiente.", "Un caso negativo incumple un criterio y el sistema debe rechazarlo.", "610 € es múltiplo de 10 y hay saldo: solo viola el máximo diario.", "a y d son positivos; c no deriva de ningún criterio."], "razones": {"a": "Es un caso positivo.", "b": "Correcta. Negativo, deriva del criterio 2 y aísla la causa del rechazo.", "c": "No deriva de ningún criterio de aceptación.", "d": "Es positivo (en la frontera del límite diario)."}, "clave": "En ATDD: positivos → negativos → no funcionales. Un caso negativo debe violar un solo criterio."}, {"id": "4-11", "cap": 4, "lo": "FL-4.1.1", "k": "K2", "fuente": "4.1", "tema": "Categorías de técnicas", "pregunta": "¿Qué afirmación describe correctamente las técnicas de prueba de caja negra?", "opciones": {"a": "Se basan en el comportamiento especificado del objeto de prueba, sin hacer referencia a su estructura interna, por lo que los casos siguen siendo útiles aunque cambie la implementación pero no el comportamiento.", "b": "Se basan en el código y en la arquitectura del objeto de prueba.", "c": "Dependen sobre todo de la intuición y la experiencia del probador.", "d": "Solo se pueden aplicar en el nivel de prueba de componente."}, "correcta": ["a"], "concepto": "Las técnicas de caja negra se basan en el comportamiento especificado, sin referencia a la estructura interna, y no dependen de la implementación.", "explicacion": ["Caja negra (basada en la especificación): analiza el comportamiento especificado.", "No hace referencia a la estructura interna.", "Si cambia la implementación pero no el comportamiento, los casos siguen siendo útiles.", "Caja blanca: estructura interna. Experiencia: conocimiento del probador."], "razones": {"a": "Correcta.", "b": "Describe la caja blanca.", "c": "Describe las técnicas basadas en la experiencia.", "d": "La caja negra se aplica en todos los niveles."}, "clave": "Caja negra: independiente de la implementación."}, {"id": "4-12", "cap": 4, "lo": "FL-4.3.1", "k": "K2", "fuente": "4.3.1", "tema": "Prueba de sentencia", "pregunta": "Dado este pseudocódigo:", "anexo": "1  leer(importe)\n2  descuento = 0\n3  SI importe > 100 ENTONCES\n4      descuento = 10\n5  FIN SI\n6  total = importe - descuento\n7  mostrar(total)", "pregunta2": "¿Qué valor de 'importe', en un ÚNICO caso de prueba, consigue el 100 % de cobertura de sentencia?", "opciones": {"a": "50", "b": "100", "c": "150", "d": "Cualquier valor, porque todas las sentencias se ejecutan siempre."}, "correcta": ["c"], "concepto": "En prueba de sentencia los elementos de cobertura son las sentencias ejecutables; el 100 % exige ejecutarlas todas al menos una vez.", "explicacion": ["Sentencias ejecutables: 1, 2, 3, 4, 6 y 7.", "La sentencia 4 solo se ejecuta si importe > 100.", "Con 150 se entra en el SI y se ejecutan todas.", "50 y 100 no cumplen importe > 100 (100 no es mayor que 100)."], "razones": {"a": "No entra en el SI: la sentencia 4 no se ejecuta.", "b": "100 > 100 es falso: no entra en el SI.", "c": "Correcta.", "d": "La sentencia 4 depende de la condición."}, "clave": "Para la cobertura de sentencia basta con entrar en todos los bloques; no hace falta la rama falsa."}, {"id": "4-13", "cap": 4, "lo": "FL-4.3.2", "k": "K2", "fuente": "4.3.2", "tema": "Prueba de rama", "pregunta": "Con el mismo pseudocódigo (un único 'SI importe > 100' sin 'SINO'), ¿cuál es el número MÍNIMO de casos de prueba para alcanzar el 100 % de cobertura de rama?", "anexo": "1  leer(importe)\n2  descuento = 0\n3  SI importe > 100 ENTONCES\n4      descuento = 10\n5  FIN SI\n6  total = importe - descuento\n7  mostrar(total)", "opciones": {"a": "1", "b": "2", "c": "3", "d": "4"}, "correcta": ["b"], "concepto": "En prueba de rama los elementos de cobertura son las ramas; una decisión sin SINO tiene igualmente rama verdadera y falsa.", "explicacion": ["La decisión de la línea 3 tiene dos resultados: verdadero y falso.", "Verdadero entra en la línea 4; falso salta a la línea 6, aunque no haya SINO.", "Un caso con importe > 100 (150) cubre la rama verdadera.", "Otro con importe ≤ 100 (50) cubre la falsa: mínimo 2 casos."], "razones": {"a": "Con 1 caso solo cubres una de las dos ramas (cobertura del 50 %).", "b": "Correcta.", "c": "Sobra un caso.", "d": "Sobran casos."}, "clave": "Un IF sin ELSE también tiene rama falsa: 2 casos para la cobertura de rama."}, {"id": "4-14", "cap": 4, "lo": "FL-4.3.2", "k": "K2", "fuente": "4.3.2", "tema": "Relación sentencia-rama", "pregunta": "¿Qué afirmación sobre la cobertura de sentencia y la de rama es correcta?", "opciones": {"a": "Alcanzar el 100 % de cobertura de rama implica alcanzar el 100 % de cobertura de sentencia, pero no al revés.", "b": "Alcanzar el 100 % de cobertura de sentencia implica el 100 % de cobertura de rama.", "c": "Son equivalentes: siempre requieren el mismo número de casos.", "d": "Alcanzar el 100 % de cobertura de rama garantiza que se detectan todos los defectos del código."}, "correcta": ["a"], "concepto": "La cobertura de rama subsume a la de sentencia: 100 % de rama implica 100 % de sentencia, pero no al revés.", "explicacion": ["Todo conjunto de casos con 100 % de rama alcanza el 100 % de sentencia.", "No al revés: un SI sin SINO se cubre en sentencias sin probar la rama falsa.", "Ni el 100 % de rama garantiza detectar todos los defectos.", "Por ejemplo, los que requieren ejecutar un camino concreto del código."], "razones": {"a": "Correcta.", "b": "Es al revés.", "c": "La de rama suele necesitar más casos.", "d": "Nada garantiza encontrar todos los defectos."}, "clave": "Rama ⇒ sentencia. Sentencia ⇏ rama."}, {"id": "4-15", "cap": 4, "lo": "FL-4.3.3", "k": "K2", "fuente": "4.3.3", "tema": "Valor de la prueba de caja blanca", "pregunta": "¿Cuál es un punto FUERTE de las técnicas de caja blanca?", "opciones": {"a": "Pueden detectar defectos aunque la especificación del software sea vaga, esté obsoleta o esté incompleta.", "b": "Detectan con facilidad los requisitos que no se han implementado (omisiones).", "c": "No necesitan acceder al código ni a la estructura del sistema.", "d": "Una cobertura de rama del 100 % asegura que el software cumple los requisitos."}, "correcta": ["a"], "concepto": "La caja blanca considera toda la implementación y detecta defectos aunque la especificación sea vaga, obsoleta o incompleta, pero no los de omisión.", "explicacion": ["Fortaleza: tiene en cuenta toda la implementación del software.", "Detecta defectos aunque la especificación sea vaga, obsoleta o incompleta.", "Debilidad: si falta un requisito en el código, puede no detectar la omisión.", "También sirve en prueba estática (ejecuciones en seco) y mide la cobertura real."], "razones": {"a": "Correcta.", "b": "Es su debilidad: lo que no está en el código no se puede cubrir.", "c": "Al contrario: necesita la estructura interna.", "d": "La cobertura de código no demuestra que se cumplan los requisitos."}, "clave": "Caja blanca: no ve lo que FALTA en el código (omisiones)."}, {"id": "4-16", "cap": 4, "lo": "FL-4.4.1", "k": "K2", "fuente": "4.4.1", "tema": "Predicción de errores", "pregunta": "¿En qué se basa principalmente la técnica de predicción de errores?", "opciones": {"a": "En el conocimiento del probador sobre cómo ha funcionado la aplicación en el pasado, los tipos de errores que suelen cometer los desarrolladores y los fallos de aplicaciones similares.", "b": "En un análisis formal de las particiones del dominio de entrada.", "c": "En la medición de la cobertura de sentencia del código.", "d": "En las tablas de decisión derivadas de las reglas de negocio."}, "correcta": ["a"], "concepto": "La predicción de errores anticipa errores, defectos y fallos a partir del conocimiento y la experiencia del probador.", "explicacion": ["Se basa en cómo ha funcionado la aplicación en el pasado.", "También en los errores típicos de los desarrolladores y los defectos que causan.", "Y en los fallos ocurridos en otras aplicaciones similares.", "El ataque de faltas la aplica con una lista de posibles errores, defectos y fallos."], "razones": {"a": "Correcta.", "b": "Es partición de equivalencia (caja negra).", "c": "Es caja blanca.", "d": "Es la técnica de tabla de decisión."}, "clave": "Predicción de errores = experiencia + listas de defectos típicos (ataque de faltas)."}, {"id": "4-17", "cap": 4, "lo": "FL-4.4.2", "k": "K2", "fuente": "4.4.2", "tema": "Prueba exploratoria", "pregunta": "¿En qué situación es MÁS apropiada la prueba exploratoria?", "opciones": {"a": "Cuando las especificaciones son escasas o inadecuadas y hay mucha presión de tiempo.", "b": "Cuando la normativa exige casos de prueba detallados y guionizados como evidencia.", "c": "Cuando el equipo de prueba no tiene experiencia en el dominio ni en la aplicación.", "d": "Cuando el objetivo es alcanzar el 100 % de cobertura de rama."}, "correcta": ["a"], "concepto": "La prueba exploratoria diseña, ejecuta y evalúa pruebas a la vez mientras se aprende del objeto de prueba; es útil con pocas especificaciones o presión de tiempo.", "explicacion": ["Diseño, ejecución y evaluación son simultáneos.", "Puede estructurarse en sesiones con tiempo limitado, carta de prueba y puesta en común posterior.", "Útil con especificaciones escasas o inadecuadas, presión de tiempo, o como complemento de técnicas formales.", "Más eficaz con probadores experimentados, con conocimiento del dominio, curiosidad y creatividad."], "razones": {"a": "Correcta.", "b": "La normativa favorece pruebas guionizadas y documentadas.", "c": "Es menos eficaz con probadores sin experiencia.", "d": "La cobertura de rama se consigue con técnicas de caja blanca."}, "clave": "Exploratoria → poca especificación, poco tiempo y probadores con experiencia."}, {"id": "4-18", "cap": 4, "lo": "FL-4.4.3", "k": "K2", "fuente": "4.4.3", "tema": "Prueba basada en listas de comprobación", "pregunta": "¿Qué afirmación sobre la prueba basada en listas de comprobación es correcta?", "opciones": {"a": "Los elementos de la lista deben formularse como preguntas, y no deben incluirse los que se pueden comprobar automáticamente.", "b": "La lista debe ser lo más larga y genérica posible para cubrirlo todo.", "c": "Una vez creada, la lista no debe modificarse para mantener la consistencia.", "d": "Solo sirve para la prueba funcional."}, "correcta": ["a"], "concepto": "En la prueba basada en listas de comprobación se diseñan y ejecutan pruebas para cubrir las condiciones de una lista, que se actualiza con regularidad.", "explicacion": ["Los elementos se formulan como preguntas y se comprueban por separado y directamente.", "Excluir lo automatizable, lo propio de criterios de entrada o salida y lo demasiado general.", "Actualizar la lista según el análisis de defectos, sin dejar que crezca demasiado.", "Sirve para prueba funcional y no funcional; las listas de alto nivel dan menos repetibilidad."], "razones": {"a": "Correcta.", "b": "No deben ser demasiado largas ni incluir elementos demasiado generales.", "c": "Al contrario: deben actualizarse con regularidad.", "d": "Sirven para la funcional y la no funcional."}, "clave": "Lista de comprobación: preguntas concretas, actualizadas y nada que ya compruebe una herramienta."}, {"id": "4-19", "cap": 4, "lo": "FL-4.5.1", "k": "K2", "fuente": "4.5.1", "tema": "Redacción colaborativa de historias de usuario", "pregunta": "Las '3 C' de una historia de usuario son:", "opciones": {"a": "Tarjeta, Conversación y Confirmación.", "b": "Código, Compilación y Cobertura.", "c": "Cliente, Contrato y Criterio.", "d": "Contexto, Cambio y Control."}, "correcta": ["a"], "concepto": "Las 3 C de una historia de usuario son Card (tarjeta), Conversation (conversación) y Confirmation (confirmación, los criterios de aceptación).", "explicacion": ["Tarjeta: el medio que describe la historia.", "Conversación: explica cómo se usará el software; documentada o verbal.", "Confirmación: los criterios de aceptación.", "Formato habitual: «Como [rol], quiero [objetivo] para [valor de negocio]»."], "razones": {"a": "Correcta.", "b": "Términos técnicos sin relación con las historias de usuario.", "c": "Inventado.", "d": "Inventado."}, "clave": "Card, Conversation, Confirmation."}, {"id": "4-20", "cap": 4, "lo": "FL-4.5.1", "k": "K2", "fuente": "4.5.1", "tema": "INVEST", "pregunta": "Una historia de usuario dice: 'El sistema debe ser rápido y fácil de usar'. ¿Qué criterio INVEST incumple de forma MÁS evidente?", "opciones": {"a": "Independiente.", "b": "Negociable.", "c": "Pequeña.", "d": "Comprobable (Testable)."}, "correcta": ["d"], "concepto": "Una buena historia es Independiente, Negociable, Valiosa, Estimable, Pequeña y Comprobable (INVEST); si no se sabe probarla, puede no estar clara.", "explicacion": ["INVEST: Independent, Negotiable, Valuable, Estimable, Small, Testable.", "«Rápido» y «fácil de usar» no son medibles.", "No se puede definir una prueba objetiva: no es comprobable.", "No saber probar una historia indica que no está clara o no refleja valor."], "razones": {"a": "Nada sugiere que dependa de otras historias.", "b": "Es negociable; el problema es que no se puede verificar.", "c": "Puede ser grande, pero lo más evidente es que no se puede verificar.", "d": "Correcta."}, "clave": "Adjetivos vagos (rápido, fácil, intuitivo) → historia no comprobable."}, {"id": "4-21", "cap": 4, "lo": "FL-4.5.2", "k": "K2", "fuente": "4.5.2", "tema": "Criterios de aceptación", "pregunta": "¿Cuáles son los dos formatos más habituales para redactar criterios de aceptación?", "opciones": {"a": "Orientado a escenarios (Dado/Cuando/Entonces) y orientado a reglas (lista de verificación con viñetas o tabla de correspondencia entre entradas y salidas).", "b": "Diagrama de clases y diagrama de secuencia.", "c": "Casos de prueba de caja blanca y de caja negra.", "d": "Historia de usuario y épica."}, "correcta": ["a"], "concepto": "Los formatos más habituales de criterios de aceptación son el orientado a escenarios (Dado/Cuando/Entonces) y el orientado a reglas.", "explicacion": ["Son las condiciones que debe cumplir la implementación para ser aceptada.", "Definen el alcance, logran consenso y describen escenarios positivos y negativos.", "Escenarios: Dado/Cuando/Entonces (BDD).", "Reglas: lista con viñetas o tabla de entradas y salidas; otro formato vale si no es ambiguo."], "razones": {"a": "Correcta.", "b": "Son modelos de diseño UML.", "c": "Son categorías de técnicas, no formatos de criterios de aceptación.", "d": "Son unidades de requisito, no formatos de criterios."}, "clave": "Escenarios (Gherkin) o reglas (lista o tabla)."}, {"id": "4-22", "cap": 4, "lo": "FL-4.1.1", "k": "K2", "fuente": "4.1", "tema": "Categorías de técnicas", "pregunta": "Un probador diseña pruebas a partir de una lista de los defectos más frecuentes en aplicaciones de comercio electrónico en las que ha trabajado antes. ¿A qué categoría pertenece la técnica que usa?", "opciones": {"a": "Técnica de caja negra.", "b": "Técnica de caja blanca.", "c": "Técnica basada en la experiencia.", "d": "Técnica basada en la colaboración."}, "correcta": ["c"], "concepto": "Las técnicas basadas en la experiencia (predicción de errores, exploratoria, listas de comprobación) aprovechan el conocimiento del probador.", "explicacion": ["Una lista de defectos frecuentes de proyectos anteriores es un ataque de faltas.", "El ataque de faltas implementa la predicción de errores.", "La predicción de errores es una técnica basada en la experiencia.", "Su eficacia depende de las habilidades del probador."], "razones": {"a": "La caja negra se basa en la especificación.", "b": "La caja blanca se basa en la estructura.", "c": "Correcta. Es un ataque de faltas, una forma de predicción de errores.", "d": "Los enfoques colaborativos (capítulo 4.5) se centran en las historias de usuario, los criterios de aceptación y ATDD."}, "clave": "Lista de defectos del pasado → predicción de errores o ataque de faltas → experiencia."}, {"id": "4-23", "cap": 4, "lo": "FL-4.1.1", "k": "K2", "fuente": "4.1", "tema": "Categorías de técnicas", "pregunta": "Un equipo diseña casos de prueba a partir de la estructura interna del código y de la arquitectura del componente. ¿Qué base de prueba y qué categoría de técnicas está usando?", "opciones": {"a": "Los requisitos y casos de uso; técnicas de caja negra.", "b": "La estructura interna y la implementación; técnicas de caja blanca.", "c": "El conocimiento y la intuición del probador; técnicas basadas en la experiencia.", "d": "Los entregables revisados sin ejecutar el código; técnicas de prueba estática."}, "correcta": ["b"], "concepto": "Las técnicas de caja blanca derivan las pruebas de la estructura interna y el procesamiento del objeto de prueba, por lo que dependen de cómo se ha implementado.", "explicacion": ["Caja negra: la base es el comportamiento especificado (requisitos, casos de uso).", "Caja blanca: la base es la estructura interna y la implementación.", "Basadas en la experiencia: la base es el conocimiento del probador.", "Aquí la base es el código y la arquitectura, luego es caja blanca."], "razones": {"a": "Eso describe la caja negra, que parte del comportamiento especificado y no de la implementación.", "b": "Correcta. Partir de la estructura interna y de la implementación es la característica definitoria de la caja blanca.", "c": "La experiencia se apoya en el conocimiento y la intuición, no en analizar la estructura del código.", "d": "La prueba estática examina productos sin ejecutarlos; no es una categoría de técnicas de diseño de pruebas dinámicas."}, "clave": "Estructura interna o código en el enunciado: caja blanca."}, {"id": "4-24", "cap": 4, "lo": "FL-4.3.3", "k": "K2", "fuente": "4.3.3", "tema": "Valor de la prueba de caja blanca", "pregunta": "Un equipo alcanza el 100 % de cobertura de sentencia, pero el sistema no envía el correo de confirmación que exigía un requisito. ¿Por qué las técnicas de caja blanca no detectaron este problema?", "opciones": {"a": "Porque la cobertura de sentencia no llega a ejecutar el código del componente.", "b": "Porque la caja blanca solo es aplicable a la prueba de aceptación.", "c": "Porque se basan en la implementación existente y, por sí solas, no detectan funcionalidad omitida.", "d": "Porque el 100 % de cobertura de sentencia garantiza que el requisito era incorrecto."}, "correcta": ["c"], "concepto": "La caja blanca evalúa el software tal como está implementado, por lo que puede pasar por alto defectos de omisión: requisitos no implementados.", "explicacion": ["Las pruebas de caja blanca derivan del código existente.", "Si falta el código que envía el correo, no hay sentencia que cubrir.", "Los defectos por omisión de requisitos pueden pasar desapercibidos.", "Una cobertura alta no equivale a ausencia de defectos."], "razones": {"a": "Alcanzar el 100 % de cobertura de sentencia implica precisamente que todas las sentencias se ejecutaron.", "b": "La caja blanca no se limita a un nivel: se basa en la estructura interna del código.", "c": "Correcta. Al basarse en la implementación, no revelan por sí solas lo que debería existir y no se implementó.", "d": "La cobertura no valida los requisitos ni garantiza que estén bien; el requisito simplemente no se implementó."}, "clave": "Caja blanca: puede no detectar los defectos de omisión (requisitos no implementados)."}, {"id": "4-25", "cap": 4, "lo": "FL-4.4.2", "k": "K2", "fuente": "4.4.2", "tema": "Prueba exploratoria basada en sesiones", "pregunta": "En la prueba exploratoria basada en sesiones, ¿qué es una carta de prueba?", "opciones": {"a": "Un documento con los objetivos de la sesión, que se desarrolla en un tiempo limitado.", "b": "Un guion detallado paso a paso con el resultado esperado de cada acción.", "c": "La lista de defectos detectados que el probador debe verificar de nuevo.", "d": "El informe final firmado por el cliente que acepta el producto."}, "correcta": ["a"], "concepto": "En la prueba exploratoria basada en sesiones, la carta de prueba contiene los objetivos de la sesión, que se realiza en un tiempo limitado.", "explicacion": ["La prueba exploratoria diseña, ejecuta y evalúa pruebas a la vez.", "Puede estructurarse en sesiones con tiempo limitado.", "La carta de prueba contiene los objetivos que guían la sesión.", "Tras la sesión hay una puesta en común con los interesados."], "razones": {"a": "Correcta. La carta de prueba contiene los objetivos y la sesión tiene tiempo limitado.", "b": "Eso es un procedimiento de prueba escrito, contrario a la naturaleza exploratoria.", "c": "Una lista de defectos a reverificar corresponde a la prueba de confirmación, no a la carta.", "d": "La aceptación formal del cliente no tiene relación con la carta de una sesión."}, "clave": "Carta de prueba = objetivos de la sesión + tiempo limitado, no pasos detallados."}, {"id": "4-26", "cap": 4, "lo": "FL-4.4.1", "k": "K2", "fuente": "4.4.1", "tema": "Ataque de faltas", "pregunta": "En el contexto de la predicción de errores, ¿en qué consiste el enfoque del «ataque de faltas»?", "opciones": {"a": "En lanzar herramientas de seguridad para intentar penetrar en el sistema.", "b": "En revisar el código fuente para hallar defectos sin ejecutarlo.", "c": "En dividir los datos de entrada en particiones y probar un valor de cada una.", "d": "En enumerar los posibles defectos o fallos y diseñar pruebas que los provoquen o expongan."}, "correcta": ["d"], "concepto": "El ataque de faltas es una forma de implementar la predicción de errores: se elabora una lista de posibles errores, defectos y fallos y se diseñan pruebas para provocarlos.", "explicacion": ["La predicción de errores anticipa defectos según la experiencia del probador.", "Se crea o se obtiene una lista de errores, defectos y fallos posibles.", "Se diseñan pruebas que expongan los defectos o provoquen los fallos.", "La lista puede basarse en experiencia, datos de defectos o conocimiento común."], "razones": {"a": "Eso se parece a una prueba de penetración, no a la técnica descrita.", "b": "Revisar el código sin ejecutarlo es prueba estática.", "c": "Esa es la partición de equivalencia, técnica de caja negra.", "d": "Correcta. Se listan los fallos posibles y se diseñan pruebas que los hagan aparecer."}, "clave": "Ataque de faltas: lista de errores probables y una prueba por cada uno."}, {"id": "4-28", "cap": 4, "lo": "FL-4.5.2", "k": "K2", "fuente": "4.5.2", "tema": "Criterios de aceptación orientados a reglas", "pregunta": "¿Cuál de las siguientes opciones es un ejemplo de criterio de aceptación ORIENTADO A REGLAS?", "opciones": {"a": "«Dado un usuario registrado, cuando introduce credenciales válidas, entonces accede a su panel».", "b": "«Como cliente quiero recuperar mi contraseña para poder volver a entrar».", "c": "«La contraseña tendrá de 8 a 16 caracteres; contendrá al menos un número; no podrá coincidir con las tres últimas usadas».", "d": "«Paso 1: abrir la página de acceso. Paso 2: introducir datos. Resultado esperado: se muestra el panel»."}, "correcta": ["c"], "concepto": "Los criterios de aceptación pueden ser orientados a escenarios (Dado/Cuando/Entonces) u orientados a reglas (lista de viñetas o tabla de entradas y salidas).", "explicacion": ["Orientados a escenarios: formato Dado/Cuando/Entonces.", "Orientados a reglas: enumeran reglas o condiciones del comportamiento.", "Una lista de reglas verificables encaja en este segundo tipo.", "Una historia o un caso con pasos no son criterios de aceptación."], "razones": {"a": "Es un criterio orientado a escenarios (formato Dado/Cuando/Entonces).", "b": "Es el enunciado de una historia de usuario, no un criterio.", "c": "Correcta. Es una lista de reglas verificables, típica de los criterios orientados a reglas.", "d": "Es un caso de prueba con pasos y resultado esperado."}, "clave": "Dado/Cuando/Entonces = escenario; lista de reglas o tabla = reglas."}, {"id": "4-29", "cap": 4, "lo": "FL-4.5.3", "k": "K2", "fuente": "4.5.3", "tema": "ATDD", "pregunta": "En el desarrollo dirigido por pruebas de aceptación (ATDD), ¿cuándo se diseñan las pruebas de aceptación?", "opciones": {"a": "Una vez terminada la implementación, por un equipo de pruebas independiente.", "b": "Al final de la iteración, durante la demostración al cliente.", "c": "Después de las pruebas de componente, solo por los desarrolladores.", "d": "Antes de implementar la historia, de forma colaborativa, y guían el desarrollo."}, "correcta": ["d"], "concepto": "ATDD es un enfoque test-first: las pruebas de aceptación se crean antes de implementar, de forma colaborativa, a partir de los criterios de aceptación.", "explicacion": ["ATDD es un enfoque de pruebas primero (test-first).", "Cliente, desarrollador y probador colaboran en un taller de especificación.", "De los criterios de aceptación salen las pruebas antes de programar.", "Esas pruebas guían el desarrollo de la historia."], "razones": {"a": "En ATDD las pruebas se diseñan antes, no tras la implementación.", "b": "La demostración es posterior; las pruebas ya existen.", "c": "No es un trabajo exclusivo de desarrolladores; es colaborativo.", "d": "Correcta. Son pruebas de aceptación creadas antes de implementar, entre todos los roles."}, "clave": "ATDD: pruebas de aceptación primero, en colaboración, antes de programar."}, {"id": "4-30", "cap": 4, "lo": "FL-4.2.1", "k": "K3", "fuente": "4.2.1", "tema": "Partición de equivalencia (número de particiones)", "pregunta": "Un comercio aplica descuento según la cantidad de unidades (número entero, sin máximo): 1 a 9, sin descuento; 10 a 49, 5 %; 50 a 99, 10 %; 100 o más, 15 %. Cantidades menores que 1 se rechazan. ¿Cuántos casos de prueba hacen falta como mínimo para cubrir todas las particiones de equivalencia (una vez cada una)?", "opciones": {"a": "5", "b": "4", "c": "6", "d": "8"}, "correcta": ["a"], "concepto": "La cobertura de partición de equivalencia es el número de particiones probadas entre el total; se necesita al menos un caso por partición, válida o no válida.", "explicacion": ["Identificar particiones válidas: 1-9, 10-49, 50-99 y 100 o más (4).", "Identificar la partición no válida: menores que 1 (1).", "Total de particiones: 4 + 1 = 5.", "Un caso por partición: 5 casos."], "razones": {"a": "Correcta. 4 particiones válidas más 1 no válida dan 5.", "b": "Solo cuenta las válidas y olvida la partición no válida.", "c": "No existe ninguna otra partición: no hay máximo, luego no hay partición superior no válida.", "d": "Corresponde a probar valores frontera, no particiones."}, "clave": "Cuenta particiones válidas Y no válidas: un caso por cada una."}, {"id": "4-31", "cap": 4, "lo": "FL-4.2.2", "k": "K3", "fuente": "4.2.2", "tema": "Análisis de valores frontera (2 valores)", "pregunta": "Una tarifa joven se aplica a edades enteras de 12 a 25 años, ambos incluidos. Aplicando análisis de valores frontera de 2 valores, ¿qué conjunto de valores se prueba?", "opciones": {"a": "12, 13, 24, 25", "b": "12, 25", "c": "11, 12, 25, 26", "d": "11, 12, 13, 24, 25, 26"}, "correcta": ["c"], "concepto": "En BVA de 2 valores, para cada frontera se prueba el valor de la frontera y su vecino más cercano que pertenece a la partición contigua.", "explicacion": ["Particiones: menores de 12 (no válida), 12-25 (válida), mayores de 25 (no válida).", "Frontera inferior: 11 y 12.", "Frontera superior: 25 y 26.", "Conjunto: 11, 12, 25, 26."], "razones": {"a": "Prueba valores internos y no sale de la partición válida.", "b": "Solo cubre los límites válidos, sin sus vecinos no válidos.", "c": "Correcta. Cada frontera con su vecino de la partición contigua: 11-12 y 25-26.", "d": "Es el conjunto de 3 valores, no de 2."}, "clave": "2 valores: 4 casos en un rango continuo con dos fronteras."}, {"id": "4-32", "cap": 4, "lo": "FL-4.2.2", "k": "K3", "fuente": "4.2.2", "tema": "Análisis de valores frontera (3 valores)", "pregunta": "Un cupón solo es válido para pedidos de importe mayor que 50 € y como máximo 200 € (importes enteros en euros). Aplicando análisis de valores frontera de 3 valores a las dos fronteras del rango válido (su valor mínimo y su valor máximo), ¿qué valores se prueban?", "opciones": {"a": "50, 51, 200, 201", "b": "50, 51, 52, 199, 200, 201", "c": "51, 52, 199, 200", "d": "49, 50, 51, 200, 201, 202"}, "correcta": ["b"], "concepto": "En BVA de 3 valores, para cada valor frontera se prueban él y sus dos vecinos: uno por debajo y otro por encima.", "explicacion": ["Rango válido en enteros: de 51 a 200.", "Frontera inferior 51: se prueban 50, 51 y 52.", "Frontera superior 200: se prueban 199, 200 y 201.", "Conjunto: 50, 51, 52, 199, 200, 201."], "razones": {"a": "Es el conjunto de 2 valores; faltan los vecinos interiores.", "b": "Correcta. Cada frontera (51 y 200) con su vecino inferior y superior.", "c": "Solo contiene valores válidos y deja fuera los no válidos 50 y 201.", "d": "Se desplaza una posición hacia fuera; el valor frontera superior es 200, no 201."}, "clave": "«Mayor que 50» sitúa la frontera válida en 51, no en 50."}, {"id": "4-33", "cap": 4, "lo": "FL-4.2.3", "k": "K3", "fuente": "4.2.3", "tema": "Tabla de decisión", "pregunta": "La tabla describe las reglas de una tienda. Según ella, ¿en cuántas reglas se concede envío gratis pero NO el descuento del 10 %?", "anexo": "Reglas:            R1 R2 R3 R4 R5 R6 R7 R8\nCliente premium:    S  S  S  S  N  N  N  N\nPedido >= 50 EUR:   S  S  N  N  S  S  N  N\nCupón:              S  N  S  N  S  N  S  N\n-------------------------------------------\nEnvío gratis:       X  X  X  X  X  X  -  -\nDescuento 10 %:     X  -  X  -  X  -  X  -", "opciones": {"a": "3", "b": "2", "c": "4", "d": "6"}, "correcta": ["a"], "concepto": "En una tabla de decisión cada columna es una regla; la cobertura se mide con las reglas probadas y las acciones se leen por columna.", "explicacion": ["Envío gratis: R1 a R6 (6 reglas).", "De ellas, descuento: R1, R3 y R5.", "Envío sin descuento: R2, R4 y R6.", "Total: 3 reglas."], "razones": {"a": "Correcta. R2, R4 y R6 tienen envío gratis y no descuento.", "b": "Se deja una regla sin contar.", "c": "Se cuenta una regla con descuento, como R7, que no tiene envío gratis.", "d": "Es el total con envío gratis, sin descontar las que también tienen descuento."}, "clave": "Lee columna por columna y resta las que cumplen ambas acciones."}, {"id": "4-34", "cap": 4, "lo": "FL-4.3.2", "k": "K3", "fuente": "4.3.2", "tema": "Cobertura de rama", "pregunta": "Se ejecuta el pseudocódigo con dos casos de prueba: T1 (x=5, y=10) y T2 (x=3, y=2). Considerando solo las ramas condicionales (los resultados verdadero y falso de cada decisión), ¿qué cobertura de rama se obtiene?", "anexo": "1  LEER x, y\n2  SI x > 0 ENTONCES\n3     y = y + 1\n4  FIN SI\n5  SI y > 10 ENTONCES\n6     x = 0\n7  SINO\n8     x = x + 1\n9  FIN SI", "opciones": {"a": "25 %", "b": "50 %", "c": "100 %", "d": "75 %"}, "correcta": ["d"], "concepto": "La cobertura de rama es el número de ramas de decisión ejecutadas dividido entre el número total de ramas, expresado en porcentaje.", "explicacion": ["Ramas totales: 2 decisiones por 2 resultados = 4.", "T1: x>0 verdadero, y=11 y y>10 verdadero.", "T2: x>0 verdadero, y=3 y y>10 falso.", "Cubiertas 3 (falta x>0 falso): 3/4 = 75 %."], "razones": {"a": "Solo cuenta 1 rama de 4.", "b": "Cuenta 2 de 4 y no tiene en cuenta T2.", "c": "Faltaría ejecutar el caso con x ≤ 0 (rama falsa de la primera decisión).", "d": "Correcta. Se cubren 3 de 4 ramas: quedaría sin cubrir x > 0 falso."}, "clave": "Cuenta ramas verdadero y falso de cada decisión; ambos casos entran en la primera."}, {"id": "4-35", "cap": 4, "lo": "FL-4.1.1", "k": "K1", "fuente": "4.1", "tema": "Elemento de cobertura (coverage item)", "pregunta": "Según el temario, ¿qué son los elementos de cobertura en la partición de equivalencia, en las tablas de decisión y en la prueba de sentencia, respectivamente?", "opciones": {"a": "Los valores frontera, las filas de condiciones y las ramas.", "b": "Las particiones, las columnas con combinaciones factibles de condiciones y las sentencias ejecutables.", "c": "Las particiones válidas, las acciones y los bloques de código.", "d": "Los casos de prueba, las reglas inválidas y las decisiones."}, "correcta": ["b"], "concepto": "Un elemento de cobertura es lo que identifica cada técnica para ejercitarlo: particiones en EP, columnas factibles en tablas de decisión, sentencias ejecutables en prueba de sentencia.", "explicacion": ["Las técnicas ayudan a identificar elementos de cobertura durante el análisis y diseño.", "En EP son las particiones; en tablas de decisión, las columnas con combinaciones factibles.", "En prueba de sentencia son las sentencias ejecutables.", "La cobertura se mide sobre ellos."], "razones": {"a": "Los valores frontera lo son en BVA; en tablas de decisión son columnas, no filas.", "b": "Correcta.", "c": "En EP cuentan también las particiones inválidas; los elementos en tablas son columnas, no acciones.", "d": "Los casos de prueba ejercitan los elementos; no son los elementos."}, "clave": "Cada técnica define su propio elemento de cobertura."}, {"id": "4-36", "cap": 4, "lo": "FL-4.1.1", "k": "K1", "fuente": "4.2.1", "tema": "Cobertura (coverage)", "pregunta": "¿Cómo se mide la cobertura según el temario?", "opciones": {"a": "Casos de prueba ejecutados dividido entre casos de prueba diseñados, en porcentaje.", "b": "Defectos encontrados dividido entre defectos totales, en porcentaje.", "c": "Elementos de cobertura ejercitados por los casos de prueba dividido entre el total de elementos de cobertura identificados, en porcentaje.", "d": "Tiempo de ejecución de las pruebas dividido entre el tiempo planificado."}, "correcta": ["c"], "concepto": "La cobertura es el porcentaje de elementos de cobertura ejercitados por los casos de prueba respecto al total identificado.", "explicacion": ["Primero se identifican los elementos de cobertura de la técnica.", "Se cuentan los ejercitados por al menos un caso de prueba.", "Se divide entre el total identificado.", "Se expresa como porcentaje."], "razones": {"a": "Es un avance de ejecución, no cobertura de elementos.", "b": "Es un indicador de eficacia en detección, no cobertura.", "c": "Correcta.", "d": "Es un indicador de progreso en tiempo, no cobertura."}, "clave": "Cobertura = elementos ejercitados / elementos identificados."}, {"id": "4-37", "cap": 4, "lo": "FL-4.5.1", "k": "K1", "fuente": "4.5", "tema": "Enfoque de prueba colaborativo (collaboration-based test approach)", "pregunta": "¿Qué distingue a los enfoques de prueba basados en la colaboración de las técnicas de caja negra, caja blanca y basadas en la experiencia?", "opciones": {"a": "Además de detectar defectos, se centran en evitarlos mediante la colaboración y la comunicación.", "b": "Se basan en el análisis de la estructura interna del código.", "c": "Dependen únicamente de la experiencia individual del probador.", "d": "Se aplican solo tras implementar el software y sustituyen a las demás técnicas."}, "correcta": ["a"], "concepto": "Los enfoques colaborativos se centran también en la evitación de defectos mediante la colaboración y la comunicación.", "explicacion": ["Las técnicas de 4.2, 4.3 y 4.4 tienen como objetivo la detección de defectos.", "Los enfoques colaborativos añaden la evitación de defectos.", "Lo logran mediante colaboración y comunicación entre roles.", "Ejemplos: historias de usuario colaborativas, criterios de aceptación y ATDD."], "razones": {"a": "Correcta.", "b": "Eso describe la caja blanca.", "c": "Eso describe las técnicas basadas en la experiencia.", "d": "ATDD, por ejemplo, crea pruebas antes de implementar y no sustituye al resto de técnicas."}, "clave": "Colaborativo = evitar defectos mediante comunicación, además de detectarlos."}, {"id": "4-38", "cap": 4, "lo": "FL-4.1.1", "k": "K1", "fuente": "4.1", "tema": "Técnica de prueba (test technique)", "pregunta": "Según el temario, ¿para qué sirven las técnicas de prueba?", "opciones": {"a": "Para sustituir el análisis de requisitos por casos de prueba aleatorios.", "b": "Para ejecutar todas las combinaciones posibles de entradas.", "c": "Para decidir qué defectos se corrigen primero.", "d": "Para desarrollar de forma sistemática un conjunto de casos de prueba pequeño pero suficiente."}, "correcta": ["d"], "concepto": "Las técnicas de prueba apoyan el análisis (qué probar) y el diseño (cómo probar), generando de forma sistemática pocos casos pero suficientes.", "explicacion": ["Apoyan el análisis de la prueba (qué probar).", "Apoyan el diseño de la prueba (cómo probar).", "Ayudan a definir condiciones de prueba, identificar elementos de cobertura y datos de prueba.", "Se clasifican en caja negra, caja blanca y basadas en la experiencia."], "razones": {"a": "Los casos no son aleatorios: se derivan de forma sistemática.", "b": "La prueba exhaustiva no es el objetivo; se busca un conjunto relativamente pequeño.", "c": "Priorizar la corrección de defectos no es función de una técnica de prueba.", "d": "Correcta."}, "clave": "Técnica = conjunto de casos pequeño pero suficiente, de forma sistemática."}, {"id": "4-39", "cap": 4, "lo": "FL-4.2.4", "k": "K1", "fuente": "4.2.4", "tema": "Prueba de transición de estados (state transition testing)", "pregunta": "¿Qué afirmación sobre la prueba de transición de estados es correcta?", "opciones": {"a": "Un caso de prueba basado en un diagrama de estados cubre siempre una única transición.", "b": "Un caso de prueba suele ser una secuencia de eventos que provoca una secuencia de cambios de estado y puede cubrir varias transiciones.", "c": "La tabla de estados oculta las transiciones inválidas, que solo muestra el diagrama de estados.", "d": "Una transición la inicia siempre una acción, y el evento es su resultado."}, "correcta": ["b"], "concepto": "En la prueba de transición de estados un caso es una secuencia de eventos que produce una secuencia de cambios de estado, y puede cubrir varias transiciones.", "explicacion": ["El diagrama de estados muestra estados y transiciones válidas.", "Un evento inicia una transición, con condición de guarda opcional.", "Un caso es una secuencia de eventos y cambios de estado.", "La tabla de estados muestra las transiciones inválidas como celdas vacías."], "razones": {"a": "Un caso puede, y normalmente suele, cubrir varias transiciones.", "b": "Correcta.", "c": "Es al revés: la tabla de estados muestra explícitamente las inválidas.", "d": "Las inicia un evento; la acción es resultado de la transición."}, "clave": "Un caso de prueba = secuencia de eventos; cubre varias transiciones."}, {"id": "4-40", "cap": 4, "lo": "FL-4.5.2", "k": "K1", "fuente": "4.5.2", "tema": "Criterios de aceptación (acceptance criteria)", "pregunta": "¿Qué son los criterios de aceptación de una historia de usuario?", "opciones": {"a": "Las tareas técnicas que el equipo debe completar para terminar la historia.", "b": "El conjunto de casos de prueba automatizados que ya pasan.", "c": "Las condiciones que debe cumplir una implementación de la historia para ser aceptada por las partes interesadas.", "d": "Los criterios de salida del nivel de prueba de sistema."}, "correcta": ["c"], "concepto": "Los criterios de aceptación son las condiciones que debe cumplir la implementación de una historia de usuario para que las partes interesadas la acepten.", "explicacion": ["Son condiciones que la implementación debe cumplir para ser aceptada.", "Pueden verse como las condiciones de prueba que deben ejercitarse.", "Suelen ser fruto de la conversación (las 3 C).", "Sirven de base para la prueba de aceptación de la historia."], "razones": {"a": "Son tareas de desarrollo, no condiciones de aceptación.", "b": "Los criterios son anteriores a los casos de prueba: de ellos derivan.", "c": "Correcta.", "d": "Los criterios de salida se refieren a un nivel de prueba, no a una historia."}, "clave": "Criterios de aceptación = condiciones para aceptar la historia (Confirmación)."}, {"id": "5-01", "cap": 5, "lo": "FL-5.1.4", "k": "K3", "fuente": "5.1.4", "tema": "Estimación de tres puntos", "pregunta": "Para estimar el esfuerzo de prueba de una funcionalidad, los expertos dan estos valores: optimista (a) = 6 días-persona, más probable (m) = 9 días-persona, pesimista (b) = 18 días-persona. Usando la estimación de tres puntos, ¿cuál es la estimación (E) y su desviación típica (SD)?", "opciones": {"a": "E = 10; SD = 2", "b": "E = 11; SD = 2", "c": "E = 10; SD = 12", "d": "E = 9; SD = 2"}, "correcta": ["a"], "concepto": "La estimación de tres puntos usa la media ponderada E = (a + 4m + b) / 6 y permite calcular el error de medición SD = (b − a) / 6.", "explicacion": ["Tres estimaciones de expertos: optimista a = 6, más probable m = 9, pesimista b = 18.", "E = (a + 4m + b) / 6 = (6 + 36 + 18) / 6 = 10.", "SD = (b − a) / 6 = (18 − 6) / 6 = 2.", "Resultado: 10 ± 2 días-persona, es decir, entre 8 y 12."], "razones": {"a": "Correcta.", "b": "11 es la media simple (6 + 9 + 18) / 3; no aplica la ponderación 4m.", "c": "12 es b − a sin dividir entre 6.", "d": "9 es el valor más probable, no la estimación ponderada."}, "clave": "E = (a + 4m + b) / 6; SD = (b − a) / 6. Apréndetela de memoria."}, {"id": "5-02", "cap": 5, "lo": "FL-5.1.4", "k": "K3", "fuente": "5.1.4", "tema": "Estimación basada en ratios", "pregunta": "En el proyecto anterior de la organización, el esfuerzo de desarrollo fue de 800 días-persona y el de prueba de 200 días-persona. El nuevo proyecto, similar, tiene un esfuerzo de desarrollo estimado de 1.200 días-persona. Con la estimación basada en ratios, ¿cuál es el esfuerzo de prueba estimado?", "opciones": {"a": "240 días-persona", "b": "300 días-persona", "c": "400 días-persona", "d": "1.500 días-persona"}, "correcta": ["b"], "concepto": "En la estimación basada en ratios se derivan ratios estándar de proyectos anteriores de la propia organización y se aplican al nuevo proyecto.", "explicacion": ["Ratio histórico desarrollo:prueba = 800:200 = 4:1.", "Esfuerzo de desarrollo del nuevo proyecto: 1.200 días-persona.", "Esfuerzo de prueba = 1.200 / 4 = 300 días-persona.", "Los ratios de los proyectos propios de la organización son la mejor fuente."], "razones": {"a": "Aplicaría un 20 %, que no es el ratio histórico (25 %).", "b": "Correcta.", "c": "Sería un ratio 3:1 (1.200 / 3), que no es el histórico.", "d": "Suma el esfuerzo de prueba al de desarrollo (1.200 + 300); no es el esfuerzo de prueba."}, "clave": "Ratio histórico × tamaño nuevo."}, {"id": "5-03", "cap": 5, "lo": "FL-5.1.5", "k": "K3", "fuente": "5.1.5", "tema": "Priorización basada en el riesgo", "pregunta": "Hay que ejecutar estos casos de prueba, priorizados según el riesgo:", "anexo": "Caso   Riesgo      Dependencia\nTC1    Muy alto    requiere que antes se haya ejecutado TC3\nTC2    Medio       —\nTC3    Bajo        —\nTC4    Alto        —", "pregunta2": "¿En qué orden deben ejecutarse?", "opciones": {"a": "TC1, TC4, TC2, TC3", "b": "TC3, TC1, TC4, TC2", "c": "TC4, TC1, TC2, TC3", "d": "TC3, TC2, TC4, TC1"}, "correcta": ["b"], "concepto": "En la priorización basada en el riesgo se ejecutan primero los casos que cubren los riesgos más importantes, salvo que una dependencia obligue a ejecutar antes uno de menor prioridad.", "explicacion": ["Orden por riesgo: TC1 (muy alto), TC4 (alto), TC2 (medio), TC3 (bajo).", "TC1 requiere TC3, que es de menor prioridad: TC3 debe ejecutarse antes.", "TC3 pasa por delante de TC1.", "Orden final: TC3, TC1, TC4, TC2."], "razones": {"a": "TC1 no puede ejecutarse antes de TC3.", "b": "Correcta.", "c": "Ignora la dependencia y pone TC4 antes que TC1, de riesgo mayor.", "d": "Ordena de menor a mayor riesgo."}, "clave": "Riesgo de mayor a menor, PERO las dependencias mandan."}, {"id": "5-04", "cap": 5, "lo": "FL-5.1.5", "k": "K3", "fuente": "5.1.5", "tema": "Priorización basada en la cobertura", "pregunta": "Se usa la priorización basada en la cobertura ADICIONAL. Los casos cubren estos requisitos:", "anexo": "TC-A: R1, R2, R3\nTC-B: R3, R4\nTC-C: R1, R2\nTC-D: R4, R5", "pregunta2": "¿Qué dos casos se ejecutan primero, en este orden?", "opciones": {"a": "TC-A y TC-B", "b": "TC-A y TC-D", "c": "TC-D y TC-A", "d": "TC-A y TC-C"}, "correcta": ["b"], "concepto": "En la priorización por cobertura adicional se ejecuta primero el caso de mayor cobertura y después, en cada paso, el que más cobertura adicional aporta.", "explicacion": ["Primero TC-A: es el de mayor cobertura (3 requisitos: R1, R2, R3).", "Quedan por cubrir R4 y R5.", "Cobertura adicional: TC-B aporta 1 (R4), TC-C aporta 0 y TC-D aporta 2 (R4, R5).", "El segundo es TC-D; el orden es TC-A, TC-D."], "razones": {"a": "TC-B solo añade R4; TC-D añade dos requisitos.", "b": "Correcta.", "c": "TC-A tiene más cobertura inicial (3 frente a 2), así que va primero.", "d": "TC-C no añade nada nuevo tras TC-A."}, "clave": "Cobertura adicional: después del primero, mira solo lo que AÑADE cada caso."}, {"id": "5-05", "cap": 5, "lo": "FL-5.5.1", "k": "K3", "fuente": "5.5", "tema": "Informe de defecto", "pregunta": "Un probador registra este informe de defecto:", "anexo": "Título: Error en el pago\nDescripción: No funciona el pago con tarjeta.\nSeveridad: Alta", "pregunta2": "¿Qué información es MÁS importante añadir para que el informe sea útil?", "opciones": {"a": "El nombre del desarrollador que lo corregirá.", "b": "Los pasos para reproducirlo, el resultado esperado y el real, y el entorno y la versión del objeto de prueba.", "c": "Una estimación del coste de la corrección.", "d": "El código fuente corregido."}, "correcta": ["b"], "concepto": "Un informe de defecto debe permitir reproducir y resolver la anomalía: incluye la descripción del fallo con pasos, resultados esperados y reales, y la identificación del objeto de prueba y del entorno.", "explicacion": ["El informe solo tiene título, una descripción vaga y la severidad: no permite reproducir el fallo.", "Debe incluir la descripción del fallo con los pasos que detectaron la anomalía.", "Debe recoger los resultados esperados y los reales.", "Debe identificar el objeto de prueba y el entorno de prueba.", "Así quien lo resuelve puede reproducirlo."], "razones": {"a": "El responsable de la corrección no figura entre el contenido típico de un informe de defecto.", "b": "Correcta.", "c": "La estimación del coste de la corrección no figura entre el contenido típico de un informe de defecto.", "d": "El informe describe el fallo; la corrección la hace desarrollo y no forma parte del informe."}, "clave": "Un informe de defecto útil es REPRODUCIBLE: pasos, esperado frente a real, entorno."}, {"id": "5-06", "cap": 5, "lo": "FL-5.5.1", "k": "K3", "fuente": "5.5", "tema": "Severidad y prioridad", "pregunta": "Justo antes de lanzar una campaña publicitaria, se detecta que el nombre de la empresa aparece mal escrito en el logotipo de la página de inicio. Ninguna funcionalidad se ve afectada. ¿Cómo debería clasificarse el defecto?", "opciones": {"a": "Severidad alta, prioridad alta.", "b": "Severidad baja, prioridad alta.", "c": "Severidad alta, prioridad baja.", "d": "Severidad baja, prioridad baja."}, "correcta": ["b"], "concepto": "El informe de defecto incluye la severidad (grado de impacto en los intereses de las partes interesadas o en los requisitos) y la prioridad de corrección, dos campos distintos.", "explicacion": ["Severidad: grado de impacto del defecto en los intereses de las partes interesadas o en los requisitos.", "Prioridad: la urgencia con que debe corregirse.", "Un logotipo mal escrito no afecta a ninguna funcionalidad: severidad baja.", "La campaña inminente hace urgente corregirlo: prioridad alta."], "razones": {"a": "El impacto técnico es bajo: nada deja de funcionar.", "b": "Correcta.", "c": "Está al revés.", "d": "Por el contexto de negocio la urgencia es alta."}, "clave": "Severidad = grado de impacto. Prioridad = urgencia de corrección. Pueden ir en direcciones opuestas."}, {"id": "5-07", "cap": 5, "lo": "FL-5.1.1", "k": "K2", "fuente": "5.1.1", "tema": "Plan de prueba", "pregunta": "¿Qué elemento forma parte típicamente del contenido de un plan de prueba?", "opciones": {"a": "El enfoque de prueba: niveles, tipos y técnicas de prueba, y criterios de entrada y salida.", "b": "El código fuente de los componentes que se van a probar.", "c": "Las correcciones aplicadas a los defectos encontrados.", "d": "El manual de usuario final del producto."}, "correcta": ["a"], "concepto": "El plan de prueba describe los objetivos, recursos y procesos de un proyecto de prueba; su enfoque de prueba incluye niveles, tipos, técnicas, entregables y criterios de entrada y salida.", "explicacion": ["Contenido típico: contexto, supuestos y restricciones, partes interesadas y comunicación.", "También: registro de riesgos, enfoque de prueba, presupuesto y calendario.", "El enfoque de prueba incluye niveles, tipos, técnicas, entregables, criterios de entrada y salida, independencia, métricas y requisitos de datos y entorno.", "El código y las correcciones no forman parte del plan."], "razones": {"a": "Correcta.", "b": "El código es el objeto de prueba, no contenido del plan.", "c": "No figura en el contenido típico de un plan de prueba.", "d": "No figura en el contenido típico de un plan de prueba."}, "clave": "El plan responde a: qué, por qué, cómo, quién, cuándo y con qué riesgos."}, {"id": "5-08", "cap": 5, "lo": "FL-5.1.2", "k": "K1", "fuente": "5.1.2", "tema": "Contribución del probador a la planificación", "pregunta": "¿Cómo contribuye el probador a la planificación de la ITERACIÓN?", "opciones": {"a": "Participa en el análisis de riesgo detallado de las historias de usuario, determina su comprobabilidad, las descompone en tareas de prueba y estima el esfuerzo.", "b": "Define la visión del producto y el presupuesto de la versión.", "c": "Decide en solitario qué historias entran en la iteración.", "d": "Escribe el código de las historias de mayor riesgo."}, "correcta": ["a"], "concepto": "En la planificación de la iteración el probador participa en el análisis de riesgo detallado de las historias, determina su comprobabilidad, las descompone en tareas y estima el esfuerzo de prueba.", "explicacion": ["Planificación de la versión: historias y criterios de aceptación comprobables, análisis de riesgos, estimación y enfoque de prueba.", "Planificación de la iteración: análisis de riesgo detallado de las historias y su comprobabilidad.", "Descompone las historias en tareas, sobre todo de prueba, y estima su esfuerzo.", "Identifica y refina los aspectos funcionales y no funcionales del objeto de prueba."], "razones": {"a": "Correcta.", "b": "La visión del producto y el presupuesto no figuran entre las contribuciones del probador a la planificación.", "c": "No figura entre las contribuciones del probador a la planificación de la iteración.", "d": "Programar no es una contribución del probador a la planificación."}, "clave": "Versión = visión amplia. Iteración = historias concretas → tareas y estimación."}, {"id": "5-09", "cap": 5, "lo": "FL-5.1.3", "k": "K2", "fuente": "5.1.3", "tema": "Criterios de entrada y salida", "pregunta": "¿Cuál de los siguientes es un ejemplo de criterio de SALIDA?", "opciones": {"a": "Se ha alcanzado el 90 % de cobertura de requisitos y no quedan defectos críticos abiertos.", "b": "El entorno de prueba está disponible y configurado.", "c": "El objeto de prueba ha superado las pruebas de humo.", "d": "Los probadores han recibido formación sobre la herramienta."}, "correcta": ["a"], "concepto": "Los criterios de entrada definen las precondiciones para empezar una actividad; los de salida, lo que debe lograrse para darla por completada.", "explicacion": ["Salida: medidas de exhaustividad como cobertura alcanzada, defectos sin resolver, densidad de defectos o casos fallidos.", "También criterios binarios sí/no: pruebas planificadas ejecutadas, defectos notificados.", "Entrada: recursos, productos de prueba y calidad inicial del objeto (por ejemplo, pruebas de humo superadas).", "La opción a mide cobertura y defectos abiertos: es de salida."], "razones": {"a": "Correcta.", "b": "Es criterio de entrada (recursos).", "c": "Es criterio de entrada (calidad inicial del objeto de prueba).", "d": "Es criterio de entrada (recursos)."}, "clave": "Entrada = ¿podemos empezar? Salida = ¿podemos terminar?"}, {"id": "5-10", "cap": 5, "lo": "FL-5.1.3", "k": "K1", "fuente": "5.1.3", "tema": "Definición de Hecho", "pregunta": "En el desarrollo de software ágil, ¿cómo se suelen denominar los criterios de salida?", "opciones": {"a": "Definición de Preparado (Definition of Ready).", "b": "Definición de Hecho (Definition of Done).", "c": "Criterios de aceptación.", "d": "Carta de prueba."}, "correcta": ["b"], "concepto": "En ágil, los criterios de salida se llaman Definición de Hecho (DoD) y los criterios de entrada de una historia de usuario, Definición de Preparado (DoR).", "explicacion": ["En desarrollo ágil, los criterios de salida suelen llamarse Definición de Hecho (DoD).", "La DoD define las métricas objetivas del equipo para un elemento listo para entregar.", "Los criterios de entrada de una historia para empezar desarrollo o prueba son la DoR.", "Por tanto, la respuesta es la Definición de Hecho."], "razones": {"a": "La DoR son los criterios de ENTRADA.", "b": "Correcta.", "c": "Son las condiciones que debe cumplir una historia de usuario para ser aceptada; no son los criterios de salida.", "d": "Una carta de prueba guía una sesión de prueba exploratoria."}, "clave": "DoR = entrada. DoD = salida."}, {"id": "5-11", "cap": 5, "lo": "FL-5.1.7", "k": "K2", "fuente": "5.1.7", "tema": "Cuadrantes de prueba", "pregunta": "Según el modelo de cuadrantes de prueba, ¿en qué cuadrante se sitúan la prueba exploratoria, la prueba de usabilidad y la prueba de aceptación de usuario?", "opciones": {"a": "Q1: orientado a la tecnología, apoya al equipo.", "b": "Q2: orientado al negocio, apoya al equipo.", "c": "Q3: orientado al negocio, critica el producto.", "d": "Q4: orientado a la tecnología, critica el producto."}, "correcta": ["c"], "concepto": "Los cuadrantes combinan pruebas orientadas al negocio o a la tecnología con apoyar al equipo o criticar el producto; Q3 incluye exploratoria, usabilidad y aceptación de usuario.", "explicacion": ["Q1 (tecnología, apoya al equipo): pruebas de componente y de integración de componentes.", "Q2 (negocio, apoya al equipo): pruebas funcionales, de historias de usuario, de API y simulaciones.", "Q3 (negocio, critica el producto): exploratoria, usabilidad y aceptación de usuario.", "Q4 (tecnología, critica el producto): pruebas de humo y no funcionales, salvo usabilidad."], "razones": {"a": "Q1: componente e integración de componentes.", "b": "Q2: pruebas funcionales y de historias.", "c": "Correcta.", "d": "Q4: pruebas de humo y pruebas no funcionales, excepto usabilidad."}, "clave": "Q3 = el usuario critica el producto (exploratoria, usabilidad, UAT)."}, {"id": "5-12", "cap": 5, "lo": "FL-5.1.6", "k": "K1", "fuente": "5.1.6", "tema": "Pirámide de prueba", "pregunta": "¿Qué afirmación sobre la pirámide de prueba es correcta?", "opciones": {"a": "Las pruebas de las capas inferiores son pequeñas, aisladas y rápidas, y hay más pruebas en la base que en la cima.", "b": "Las pruebas de extremo a extremo de la cima son las más rápidas y deben ser las más numerosas.", "c": "Todas las capas deben tener el mismo número de pruebas.", "d": "La pirámide solo se aplica a la prueba manual."}, "correcta": ["a"], "concepto": "La pirámide de prueba muestra que las pruebas tienen distinta granularidad: abajo, muchas pruebas pequeñas, aisladas y rápidas; arriba, pocas pruebas de extremo a extremo, más lentas.", "explicacion": ["Capas inferiores: pruebas pequeñas, aisladas y rápidas que comprueban poca funcionalidad.", "Por eso hacen falta muchas para una cobertura razonable.", "Capas superiores: pruebas complejas de extremo a extremo, más lentas, que comprueban mucha funcionalidad.", "Bastan pocas arriba; el número y el nombre de las capas pueden variar."], "razones": {"a": "Correcta.", "b": "Las de extremo a extremo son las más lentas y menos numerosas.", "c": "El número de pruebas disminuye al subir.", "d": "El modelo apoya la automatización de la prueba y el reparto del esfuerzo; no se limita a la prueba manual."}, "clave": "Base: muchas, rápidas y aisladas. Cima: pocas, lentas y de extremo a extremo."}, {"id": "5-13", "cap": 5, "lo": "FL-5.2.2", "k": "K2", "fuente": "5.2.2", "tema": "Riesgos de proyecto y de producto", "pregunta": "¿Cuáles de los siguientes son riesgos de PROYECTO? (Selecciona DOS)", "opciones": {"a": "El proveedor externo entrega el entorno de prueba con tres semanas de retraso.", "b": "El tiempo de respuesta del sistema puede ser inadecuado con carga alta.", "c": "El equipo no tiene suficiente experiencia con la herramienta de automatización elegida.", "d": "El cálculo de intereses puede ser incorrecto en años bisiestos.", "e": "La aplicación puede tener vulnerabilidades de seguridad en el inicio de sesión."}, "correcta": ["a", "c"], "concepto": "Los riesgos de proyecto afectan a la gestión y el control del proyecto; los de producto, a las características de calidad del producto.", "explicacion": ["Proyecto: cuestiones organizativas, de personas, técnicas y de proveedores.", "Producto: relacionados con las características de calidad del producto.", "a es un riesgo de proveedores y c, de personas (falta de habilidades): ambos de proyecto.", "b, d y e afectan a la calidad del producto: tiempo de respuesta, cálculos y seguridad."], "razones": {"a": "Correcta. Riesgo de proveedores (proyecto).", "b": "Riesgo de producto (tiempo de resp
