<title>Aula ISTQB CTFL</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: hoja de examen centrada (columna de lectura ~760px), barra de pestañas fija arriba; opciones como burbujas de hoja de respuestas */
:root{
  --paper:#f2f4f7; --sheet:#ffffff; --ink:#172031; --muted:#5b6678; --line:#d9dee7;
  --accent:#2747c9; --accent-soft:#e6ebfb;
  --ok:#17804a; --ok-soft:#e3f4ea; --bad:#c23a2b; --bad-soft:#fbe7e4; --warn:#a96a00; --warn-soft:#fdf1dc;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f141d; --sheet:#171e2a; --ink:#e6eaf2; --muted:#9aa5b8; --line:#2a3445;
  --accent:#8ea4ff; --accent-soft:#1f2a4a;
  --ok:#4cc985; --ok-soft:#14301f; --bad:#ff8a7a; --bad-soft:#3a1b18; --warn:#f0b54a; --warn-soft:#352812;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0f141d; --sheet:#171e2a; --ink:#e6eaf2; --muted:#9aa5b8; --line:#2a3445;
  --accent:#8ea4ff; --accent-soft:#1f2a4a;
  --ok:#4cc985; --ok-soft:#14301f; --bad:#ff8a7a; --bad-soft:#3a1b18; --warn:#f0b54a; --warn-soft:#352812;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar-in{max-width:820px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:.7rem;font-weight:400;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:700;font-size:.92rem}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:.75rem;margin-left:4px}
main{max-width:820px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.5rem}
h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--sheet);padding:4px 11px;border-radius:999px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--f-mono);font-size:.76rem;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.meta b{color:var(--ink);font-weight:600}
.k{padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.qtext{font-size:1.08rem;white-space:pre-line}
.anexo{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--f-mono);font-size:.84rem;line-height:1.5;overflow-x:auto;white-space:pre}
.two{display:inline-block;font-family:var(--f-mono);font-size:.75rem;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:4px;letter-spacing:.04em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.bub{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem;color:var(--muted)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.opt.sel{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.otext{min-width:0}
.why{display:block;margin-top:6px;font-size:.9rem;color:var(--muted)}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--sheet)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:.88rem}
.verdict{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:8px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.expl{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.expl p{max-width:68ch}
.tip{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.tip b{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);display:block;margin-bottom:2px}
.ask{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:14px}
.ask textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--sheet)}
.answer{white-space:normal;max-width:68ch}
.answer p+p{margin-top:8px}
.answer ul{margin:6px 0;padding-left:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat .v{font-family:var(--f-display);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:.85rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.93rem}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.ok i{background:var(--ok)} .meter.bad i{background:var(--bad)} .meter.warn i{background:var(--warn)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.timer{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{height:36px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);cursor:pointer;font-family:var(--f-mono);font-size:.82rem;position:relative}
.cell.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.cell.r-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.r-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.simhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.item .t{min-width:0}
.item .t span{display:block}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--sheet);border:1px dashed var(--line);border-radius:10px}
.save{font-size:.8rem;color:var(--muted)}
.big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
details.rev{border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
details.rev>summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;list-style:none}
details.rev>summary::-webkit-details-marker{display:none}
details.rev[open]>summary{border-bottom:1px solid var(--line)}
details.rev .inner{padding:14px;display:flex;flex-direction:column;gap:12px}
kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
@media (max-width:560px){.tabs{margin-left:0;width:100%}.tab{flex:1;padding:6px 6px}.big{font-size:2.4rem}}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.tab{transition:border-color .15s,background .15s}}
</style>

<script>
const BANCO = [{"id": "1-01", "cap": 1, "lo": "FL-1.1.1", "k": "K1", "tema": "Objetivos de la prueba", "pregunta": "¿Cuál de los siguientes es un objetivo típico de la prueba?", "opciones": {"a": "Depurar el código para eliminar los defectos encontrados.", "b": "Provocar fallos y encontrar defectos.", "c": "Garantizar que el software no contiene defectos.", "d": "Corregir la causa raíz de los fallos detectados en producción."}, "correcta": ["b"], "explicacion": "El programa de estudio enumera los objetivos típicos de la prueba: evaluar productos de trabajo, provocar fallos y encontrar defectos, asegurar la cobertura requerida, reducir el nivel de riesgo, verificar que se cumplen los requisitos, verificar el cumplimiento de contratos y normas, proporcionar información a las partes interesadas, generar confianza y validar que el objeto de prueba está completo y funciona como esperan los usuarios. 'Provocar fallos y encontrar defectos' aparece literalmente en esa lista.", "razones": {"a": "Depurar (localizar, analizar y eliminar las causas) es una actividad de desarrollo, distinta de la prueba.", "b": "Correcta. Es uno de los objetivos de la prueba que recoge el programa de estudio.", "c": "Imposible: el principio 1 dice que la prueba muestra la presencia de defectos, no su ausencia.", "d": "Corregir causas raíz corresponde a la depuración y a la mejora de procesos, no a la prueba."}, "clave": "Si una opción habla de 'garantizar' o 'demostrar ausencia de defectos', casi seguro es falsa."}, {"id": "1-02", "cap": 1, "lo": "FL-1.1.2", "k": "K2", "tema": "Prueba y depuración", "pregunta": "Un probador ejecuta un caso de prueba que falla y lo registra. Un desarrollador reproduce el fallo, localiza la causa en el código y la corrige. Después, el probador vuelve a ejecutar el caso y comprueba que ya pasa. ¿Qué parte de este escenario corresponde a la depuración?", "opciones": {"a": "Ejecutar el caso de prueba que falla y registrar el fallo.", "b": "Reproducir el fallo, diagnosticar la causa y corregir el código.", "c": "Volver a ejecutar el caso para confirmar que la corrección funciona.", "d": "Ejecutar pruebas de regresión sobre las zonas cercanas al cambio."}, "correcta": ["b"], "explicacion": "La prueba puede provocar fallos (prueba dinámica) o encontrar defectos directamente (prueba estática). La depuración se ocupa de encontrar las causas de esos fallos, analizarlas y eliminarlas. Tras un fallo, la depuración típica es: reproducción, diagnóstico (encontrar la causa raíz) y corrección. Después, el probador realiza la prueba de confirmación y, si procede, la de regresión.", "razones": {"a": "Es prueba dinámica: provocar y registrar el fallo.", "b": "Correcta. Reproducir, diagnosticar y corregir son las tres fases de la depuración.", "c": "Es prueba de confirmación, una actividad de prueba posterior a la depuración.", "d": "Es prueba de regresión, también actividad de prueba."}, "clave": "Prueba = encontrar o provocar. Depuración = reproducir, diagnosticar y corregir."}, {"id": "1-03", "cap": 1, "lo": "FL-1.2.1", "k": "K2", "tema": "Por qué es necesaria la prueba", "pregunta": "¿Cuál de las siguientes situaciones es el MEJOR ejemplo de cómo la prueba contribuye al éxito de un proyecto?", "opciones": {"a": "Los probadores participan en la revisión de los requisitos y detectan ambigüedades antes de que se implementen.", "b": "Los probadores garantizan que el producto entregado tendrá una calidad alta.", "c": "Los probadores corrigen los defectos para reducir la carga de trabajo de los desarrolladores.", "d": "La prueba sustituye la necesidad de aplicar aseguramiento de la calidad en la organización."}, "correcta": ["a"], "explicacion": "La prueba ofrece un medio rentable de detectar defectos, que luego se eliminan (por depuración). También permite evaluar directamente la calidad del objeto de prueba en distintas fases del ciclo de vida. Implicar a los probadores pronto, por ejemplo en las revisiones de requisitos, detecta defectos cuando corregirlos es más barato y reduce el riesgo de desarrollar funcionalidad incorrecta.", "razones": {"a": "Correcta. Es la contribución directa y temprana que describe el programa (prueba estática y shift-left).", "b": "La prueba no garantiza la calidad: la mide y aporta información para mejorarla.", "c": "Corregir defectos es tarea de desarrollo (depuración), no de los probadores.", "d": "La prueba es una forma de control de calidad y no sustituye al aseguramiento de la calidad (QA)."}, "clave": "La prueba aporta información y detección temprana; nunca 'garantiza' calidad."}, {"id": "1-04", "cap": 1, "lo": "FL-1.2.2", "k": "K2", "tema": "Prueba y aseguramiento de la calidad", "pregunta": "¿Qué afirmación describe correctamente la relación entre la prueba y el aseguramiento de la calidad (QA)?", "opciones": {"a": "El QA se orienta al producto y es correctivo; la prueba se orienta a los procesos y es preventiva.", "b": "La prueba es una forma de control de calidad, orientada al producto y correctiva; el QA se orienta a los procesos y es preventivo.", "c": "La prueba y el QA son sinónimos y los realiza siempre el mismo equipo.", "d": "El QA solo se aplica al final del proyecto, cuando ya han terminado todas las pruebas."}, "correcta": ["b"], "explicacion": "El programa distingue entre control de calidad (QC) y aseguramiento de la calidad (QA). El QC es un enfoque correctivo orientado al producto, centrado en las actividades que ayudan a alcanzar niveles de calidad adecuados; la prueba es una forma importante de QC. El QA es un enfoque preventivo orientado a los procesos: si se sigue un buen proceso, se obtiene un buen producto. Los resultados de la prueba se usan en ambos: en el QC para corregir defectos y en el QA como retroalimentación sobre el rendimiento de los procesos.", "razones": {"a": "Está al revés: es justo la opción trampa.", "b": "Correcta. La prueba es QC, orientado al producto y correctivo; el QA, a los procesos y preventivo.", "c": "No son sinónimos; además, el QA es responsabilidad de todos en el proyecto.", "d": "El QA abarca todo el ciclo de vida y se centra en la implantación y mejora de los procesos."}, "clave": "QA = procesos y prevención. QC (prueba) = producto y corrección."}, {"id": "1-05", "cap": 1, "lo": "FL-1.2.3", "k": "K2", "tema": "Error, defecto y fallo", "pregunta": "Un desarrollador entiende mal un requisito y escribe 'edad > 18' en lugar de 'edad >= 18'. Al usar la aplicación, un cliente de exactamente 18 años no puede registrarse. ¿Qué opción identifica correctamente el error, el defecto y el fallo?", "opciones": {"a": "Error: la condición 'edad > 18'. Defecto: el malentendido del requisito. Fallo: el cliente no puede registrarse.", "b": "Error: el malentendido del requisito. Defecto: la condición 'edad > 18' en el código. Fallo: el cliente de 18 años no puede registrarse.", "c": "Error: el cliente no puede registrarse. Defecto: el malentendido. Fallo: la condición en el código.", "d": "Error y defecto son lo mismo (la condición incorrecta). Fallo: el cliente no puede registrarse."}, "correcta": ["b"], "explicacion": "Las personas cometen errores (equivocaciones), que producen defectos (faltas o bugs) en el código o en otros productos de trabajo. Si se ejecuta el código con el defecto, el sistema puede no hacer lo que debería, o hacer algo que no debería: eso es un fallo. Aquí la equivocación humana es el malentendido, el defecto es la condición '>' y el fallo es lo que observa el usuario.", "razones": {"a": "Intercambia error y defecto. El error es la acción humana; el defecto, su resultado en el producto.", "b": "Correcta. La cadena es error (humano) → defecto (en el producto) → fallo (comportamiento observable).", "c": "Mezcla los tres conceptos al revés.", "d": "Error y defecto son conceptos distintos en el programa de estudio."}, "clave": "Error (persona) → defecto (en el producto) → fallo (en ejecución, visible)."}, {"id": "1-06", "cap": 1, "lo": "FL-1.2.3", "k": "K1", "tema": "Causa raíz", "pregunta": "¿Qué término designa la razón fundamental por la que aparece un problema, por ejemplo una situación que conduce a un error?", "opciones": {"a": "Fallo.", "b": "Defecto.", "c": "Causa raíz.", "d": "Incidencia."}, "correcta": ["c"], "explicacion": "Una causa raíz es la razón fundamental de la aparición de un problema (por ejemplo, la situación que lleva a cometer un error). Se identifican mediante el análisis de causa raíz, que normalmente se hace cuando ocurre un fallo o se detecta un defecto. Eliminar la causa raíz evita que vuelvan a aparecer fallos o defectos similares.", "razones": {"a": "Un fallo es el comportamiento incorrecto observable al ejecutar.", "b": "Un defecto es la imperfección en el producto de trabajo.", "c": "Correcta. Es la definición de causa raíz.", "d": "'Incidencia' es un término genérico para un evento que requiere investigación; no es la razón fundamental."}, "clave": "Causa raíz = el porqué de fondo (presión de plazos, falta de formación, requisitos ambiguos...)."}, {"id": "1-07", "cap": 1, "lo": "FL-1.3.1", "k": "K2", "tema": "Siete principios", "pregunta": "Un equipo lleva dos años ejecutando la misma suite de regresión sin cambios. Ya no detecta ningún defecto, pero los usuarios siguen informando de fallos nuevos. ¿Qué principio de la prueba ilustra mejor esta situación?", "opciones": {"a": "Los defectos se agrupan.", "b": "Las pruebas se desgastan.", "c": "La prueba exhaustiva es imposible.", "d": "La falacia de la ausencia de errores."}, "correcta": ["b"], "explicacion": "El principio 'las pruebas se desgastan' (antes llamado 'paradoja del pesticida') dice que, si se repiten muchas veces las mismas pruebas, cada vez detectan menos defectos nuevos. Para superarlo hay que modificar las pruebas y los datos existentes y quizá escribir pruebas nuevas. Hay una excepción: en la regresión automatizada, la repetición puede ser beneficiosa, porque confirma que no hay efectos indeseados.", "razones": {"a": "Ese principio habla de que la mayoría de los defectos están en pocos componentes, no de repetir pruebas.", "b": "Correcta. La suite repetida ha perdido eficacia para encontrar defectos nuevos.", "c": "Es cierto en general, pero no explica por qué una suite repetida deja de encontrar defectos.", "d": "Ese principio trata de un sistema sin defectos que no satisface las necesidades del usuario."}, "clave": "Mismas pruebas una y otra vez → encuentran cada vez menos: 'se desgastan'."}, {"id": "1-08", "cap": 1, "lo": "FL-1.3.1", "k": "K1", "tema": "Siete principios", "pregunta": "¿Cuál de los siguientes es uno de los siete principios de la prueba?", "opciones": {"a": "La prueba demuestra la ausencia de defectos.", "b": "La prueba temprana ahorra tiempo y dinero.", "c": "La prueba independiente siempre es más eficaz que la realizada por el autor.", "d": "Todas las pruebas deben automatizarse para ser fiables."}, "correcta": ["b"], "explicacion": "Los siete principios del CTFL 4.0 son: 1) La prueba muestra la presencia, no la ausencia de defectos. 2) La prueba exhaustiva es imposible. 3) La prueba temprana ahorra tiempo y dinero. 4) Los defectos se agrupan. 5) Las pruebas se desgastan. 6) La prueba depende del contexto. 7) Falacia de la ausencia de errores.", "razones": {"a": "Es lo contrario del principio 1.", "b": "Correcta. Es el principio 3: los defectos eliminados pronto no provocan defectos derivados y son más baratos de corregir.", "c": "La independencia tiene ventajas e inconvenientes, pero no es un principio ni es 'siempre' más eficaz.", "d": "No es un principio; además, no todo es apropiado para automatizar."}, "clave": "Memoriza los 7 principios en orden; aparecen en casi todos los exámenes."}, {"id": "1-09", "cap": 1, "lo": "FL-1.3.1", "k": "K2", "tema": "Siete principios", "pregunta": "Un sistema supera todas las pruebas planificadas y no tiene defectos conocidos, pero los usuarios lo rechazan porque no se ajusta a su forma de trabajar. ¿Qué principio describe esta situación?", "opciones": {"a": "La prueba depende del contexto.", "b": "Los defectos se agrupan.", "c": "La falacia de la ausencia de errores.", "d": "La prueba muestra la presencia, no la ausencia de defectos."}, "correcta": ["c"], "explicacion": "La falacia de la ausencia de errores es la idea equivocada de que la verificación del software asegura el éxito de un sistema. Probar a fondo todos los requisitos especificados y corregir todos los defectos encontrados puede producir un sistema que no satisface las necesidades y expectativas de los usuarios. Por eso, además de verificar, hay que validar.", "razones": {"a": "Habla de adaptar la prueba a cada contexto, no de un sistema sin defectos que no sirve.", "b": "Trata de la concentración de defectos en pocos componentes.", "c": "Correcta. 'Sin defectos' no significa 'útil para el usuario'.", "d": "Habla de que la prueba no puede demostrar que no hay defectos; aquí el problema es la validación."}, "clave": "'Sin defectos pero los usuarios no lo quieren' = falacia de la ausencia de errores."}, {"id": "1-10", "cap": 1, "lo": "FL-1.4.1", "k": "K2", "tema": "Actividades de prueba", "pregunta": "¿En qué actividad de prueba se analiza la base de prueba para identificar las condiciones de prueba ('qué probar') y se evalúa su comprobabilidad, pudiendo encontrar defectos en ella?", "opciones": {"a": "Análisis de la prueba.", "b": "Diseño de la prueba.", "c": "Implementación de la prueba.", "d": "Ejecución de la prueba."}, "correcta": ["a"], "explicacion": "El análisis de la prueba responde a '¿qué probar?': se analiza la base de prueba para identificar características comprobables, definir y priorizar las condiciones de prueba asociadas teniendo en cuenta los riesgos, y evaluar la base de prueba y los objetos de prueba para identificar defectos y su comprobabilidad. El diseño responde a '¿cómo probar?'.", "razones": {"a": "Correcta. 'Qué probar', condiciones de prueba y evaluación de la base de prueba son tareas del análisis.", "b": "El diseño elabora casos de prueba, elementos de cobertura y requisitos de datos y de entorno ('cómo probar').", "c": "La implementación crea los productos de prueba necesarios para la ejecución (procedimientos, juegos, entorno).", "d": "La ejecución ejecuta las pruebas y compara los resultados."}, "clave": "Análisis = QUÉ (condiciones). Diseño = CÓMO (casos de prueba)."}, {"id": "1-11", "cap": 1, "lo": "FL-1.4.1", "k": "K2", "tema": "Actividades de prueba", "pregunta": "¿Cuál de las siguientes tareas pertenece a la implementación de la prueba?", "opciones": {"a": "Derivar casos de prueba a partir de las condiciones de prueba.", "b": "Organizar los procedimientos de prueba en juegos de prueba y preparar el calendario de ejecución.", "c": "Comparar los resultados reales con los esperados.", "d": "Archivar los productos de prueba para su uso futuro."}, "correcta": ["b"], "explicacion": "La implementación de la prueba crea o adquiere los productos de prueba necesarios para la ejecución (por ejemplo, los datos de prueba). Los casos de prueba se organizan en procedimientos de prueba, que a menudo se agrupan en juegos de prueba; se crean scripts de prueba manuales y automatizados; se priorizan y ordenan los procedimientos en un calendario de ejecución, y se construye y verifica el entorno de prueba.", "razones": {"a": "Es diseño de la prueba.", "b": "Correcta. Juegos de prueba y calendario de ejecución son tareas de implementación.", "c": "Es ejecución de la prueba.", "d": "Es compleción de la prueba."}, "clave": "Implementación = dejar todo listo para ejecutar: procedimientos, juegos, scripts, calendario y entorno."}, {"id": "1-12", "cap": 1, "lo": "FL-1.4.1", "k": "K2", "tema": "Actividades de prueba", "pregunta": "¿Qué tarea es característica de la compleción de la prueba?", "opciones": {"a": "Registrar los resultados de la ejecución y notificar los defectos.", "b": "Identificar lecciones aprendidas, archivar los productos de prueba y elaborar el informe de compleción.", "c": "Identificar los requisitos de entorno y de datos de prueba.", "d": "Evaluar la comprobabilidad de la base de prueba."}, "correcta": ["b"], "explicacion": "La compleción de la prueba suele producirse en los hitos del proyecto (por ejemplo, en una entrega, al final de una iteración o al completar un nivel de prueba). Incluye: crear solicitudes de cambio o elementos de backlog para los defectos no resueltos; identificar, archivar o entregar los productos de prueba que puedan ser útiles en el futuro; desactivar el entorno de prueba; analizar las actividades para extraer lecciones aprendidas y mejoras, y crear y comunicar el informe de compleción de la prueba.", "razones": {"a": "Es ejecución de la prueba.", "b": "Correcta. Las tres tareas son típicas de la compleción.", "c": "Es diseño de la prueba.", "d": "Es análisis de la prueba."}, "clave": "Compleción = cerrar: archivar, lecciones aprendidas, informe final, apagar el entorno."}, {"id": "1-13", "cap": 1, "lo": "FL-1.4.2", "k": "K2", "tema": "El proceso de prueba en contexto", "pregunta": "¿Qué factor de contexto es MÁS probable que haga que el proceso de prueba sea más formal y esté más documentado?", "opciones": {"a": "El sistema está sujeto a una normativa de seguridad (por ejemplo, un dispositivo médico).", "b": "El equipo es pequeño y trabaja en la misma oficina.", "c": "El producto es un prototipo interno de vida corta.", "d": "El plazo de entrega es muy corto."}, "correcta": ["a"], "explicacion": "La forma de probar depende de factores de contexto como: las partes interesadas (necesidades, expectativas, requisitos, disposición a cooperar), los miembros del equipo (habilidades, conocimientos, experiencia), el dominio del negocio (criticidad del objeto de prueba, riesgos identificados, necesidades del mercado, normativas legales específicas), los factores técnicos, las restricciones del proyecto (alcance, tiempo, presupuesto, recursos), los factores organizativos y el ciclo de vida. Las exigencias regulatorias suelen obligar a más formalidad, trazabilidad y evidencias documentadas.", "razones": {"a": "Correcta. La normativa exige evidencias, trazabilidad y un proceso documentado.", "b": "Un equipo pequeño y co-ubicado tiende a ser menos formal.", "c": "Un prototipo de vida corta justifica menos formalidad.", "d": "Un plazo corto suele empujar a menos documentación, no a más."}, "clave": "Regulación y criticidad → más formalidad. Prototipos y equipos pequeños → menos."}, {"id": "1-14", "cap": 1, "lo": "FL-1.4.4", "k": "K2", "tema": "Trazabilidad", "pregunta": "¿Cuál es un beneficio de mantener la trazabilidad entre la base de prueba y los productos de prueba?", "opciones": {"a": "Permite hacer análisis de impacto de los cambios y evaluar la cobertura.", "b": "Elimina la necesidad de la prueba de regresión.", "c": "Garantiza que el producto no tiene defectos.", "d": "Reduce automáticamente el número de casos de prueba necesarios."}, "correcta": ["a"], "explicacion": "Una trazabilidad precisa respalda la evaluación de la cobertura; por ejemplo, la trazabilidad de los casos de prueba con los requisitos permite verificar si los requisitos están cubiertos. Además facilita el análisis de impacto de los cambios, las auditorías y el cumplimiento de criterios de gobernanza, hace los informes de avance y compleción más comprensibles y ayuda a comunicar los aspectos técnicos de la prueba a las partes interesadas.", "razones": {"a": "Correcta. Cobertura y análisis de impacto son los beneficios principales.", "b": "La trazabilidad ayuda a elegir qué regresión ejecutar, pero no la elimina.", "c": "Nada garantiza la ausencia de defectos.", "d": "No reduce casos por sí misma; ayuda a saber qué cubre cada uno."}, "clave": "Trazabilidad → cobertura + análisis de impacto + auditoría + informes comprensibles."}, {"id": "1-15", "cap": 1, "lo": "FL-1.4.5", "k": "K1", "tema": "Roles en la prueba", "pregunta": "Según el programa de estudio, ¿qué rol asume la responsabilidad general del proceso de prueba, del equipo y del liderazgo de las actividades, centrándose sobre todo en la planificación, la monitorización y control, y la compleción?", "opciones": {"a": "El rol de gestión de la prueba.", "b": "El rol de prueba.", "c": "El propietario del producto.", "d": "El moderador."}, "correcta": ["a"], "explicacion": "El CTFL 4.0 describe dos roles principales. El rol de gestión de la prueba asume la responsabilidad general del proceso de prueba, del equipo y del liderazgo de las actividades, y se centra en la planificación, la monitorización y control, y la compleción. El rol de prueba asume la responsabilidad del aspecto de ingeniería (técnico) y se centra en el análisis, el diseño, la implementación y la ejecución. Una misma persona puede asumir ambos roles, y en ágil parte de la gestión la puede hacer el propio equipo.", "razones": {"a": "Correcta.", "b": "El rol de prueba se centra en el análisis, el diseño, la implementación y la ejecución.", "c": "El propietario del producto es un rol de Scrum, no uno de los dos roles de prueba del programa.", "d": "El moderador es un rol de las revisiones (capítulo 3)."}, "clave": "Gestión → planificar, controlar, cerrar. Prueba → analizar, diseñar, implementar, ejecutar."}, {"id": "1-16", "cap": 1, "lo": "FL-1.5.3", "k": "K2", "tema": "Independencia de la prueba", "pregunta": "¿Cuáles de los siguientes son posibles INCONVENIENTES de la independencia de la prueba? (Selecciona DOS)", "opciones": {"a": "Los probadores independientes pueden quedar aislados del equipo de desarrollo, con falta de colaboración y problemas de comunicación.", "b": "Los probadores independientes detectan tipos de fallos distintos porque tienen otra formación y otras perspectivas.", "c": "Los desarrolladores pueden perder el sentido de responsabilidad sobre la calidad.", "d": "Los probadores independientes pueden cuestionar o refutar las suposiciones de las partes interesadas.", "e": "La prueba independiente reduce los sesgos del autor sobre su propio trabajo."}, "correcta": ["a", "c"], "explicacion": "Beneficio principal de la independencia: los probadores independientes tienen más probabilidad de reconocer distintos tipos de fallos y defectos, porque tienen formación, perspectivas técnicas y sesgos diferentes, y pueden verificar, cuestionar o refutar las suposiciones hechas durante la especificación y la implementación. Inconvenientes: pueden quedar aislados del equipo de desarrollo (falta de colaboración, problemas de comunicación o una relación de enfrentamiento), los desarrolladores pueden perder el sentido de responsabilidad sobre la calidad, y los probadores pueden verse como un cuello de botella o ser culpados de los retrasos.", "razones": {"a": "Correcta. Aislamiento y problemas de comunicación son un inconveniente.", "b": "Es un beneficio, no un inconveniente.", "c": "Correcta. Es un inconveniente que recoge explícitamente el programa.", "d": "Es un beneficio.", "e": "Es un beneficio (menos sesgo del autor)."}, "clave": "En las preguntas 'Selecciona DOS' solo puntúas si aciertas las dos. Clasifica cada opción como beneficio o inconveniente."}, {"id": "2-01", "cap": 2, "lo": "FL-2.1.2", "k": "K2", "tema": "Buenas prácticas en cualquier ciclo de vida", "pregunta": "¿Cuál de las siguientes es una buena práctica de prueba aplicable a CUALQUIER modelo de ciclo de vida de desarrollo?", "opciones": {"a": "Para cada actividad de desarrollo existe una actividad de prueba correspondiente.", "b": "La prueba solo debe empezar cuando el código esté completo, para no hacer trabajo dos veces.", "c": "Todos los niveles de prueba deben tener los mismos objetivos, para que sean coherentes.", "d": "Los probadores solo deben revisar las versiones finales y aprobadas de los productos de trabajo."}, "correcta": ["a"], "explicacion": "El programa de estudio recoge cuatro buenas prácticas independientes del ciclo de vida: 1) para cada actividad de desarrollo hay una actividad de prueba correspondiente, de modo que todas las actividades estén sujetas a control de calidad; 2) los distintos niveles de prueba tienen objetivos específicos y diferentes, lo que permite que sean adecuadamente completos sin redundancia; 3) el análisis y el diseño de la prueba de un nivel empiezan durante la fase de desarrollo correspondiente, siguiendo el principio de prueba temprana; 4) los probadores participan en la revisión de los productos de trabajo en cuanto hay borradores disponibles.", "razones": {"a": "Correcta. Es la primera buena práctica del programa.", "b": "Contradice el principio de prueba temprana.", "c": "Al revés: cada nivel tiene objetivos específicos y diferentes.", "d": "Deben participar en cuanto hay borradores, no solo en las versiones finales."}, "clave": "Las 4 buenas prácticas: actividad espejo, objetivos distintos por nivel, empezar pronto y revisar borradores."}, {"id": "2-02", "cap": 2, "lo": "FL-2.1.3", "k": "K1", "tema": "Enfoques 'primero la prueba'", "pregunta": "¿Qué enfoque dirige la codificación mediante casos de prueba de componente escritos antes que el código, y después refactoriza ese código?", "opciones": {"a": "Desarrollo guiado por pruebas (TDD).", "b": "Desarrollo guiado por pruebas de aceptación (ATDD).", "c": "Desarrollo guiado por el comportamiento (BDD).", "d": "Prueba exploratoria."}, "correcta": ["a"], "explicacion": "En TDD se escriben primero las pruebas (normalmente de componente), luego el código mínimo para que pasen, y después se refactorizan tanto las pruebas como el código. En ATDD las pruebas se derivan de los criterios de aceptación como parte del diseño del sistema. En BDD el comportamiento deseado se expresa con casos de prueba en lenguaje natural, normalmente con el formato Dado/Cuando/Entonces.", "razones": {"a": "Correcta. Prueba de componente primero, luego código y luego refactorización = TDD.", "b": "ATDD trabaja a nivel de criterios de aceptación, no de componente.", "c": "BDD expresa el comportamiento en lenguaje natural (Dado/Cuando/Entonces).", "d": "No es un enfoque 'primero la prueba' de desarrollo; es una técnica basada en la experiencia."}, "clave": "TDD → componente. ATDD → criterios de aceptación. BDD → Dado/Cuando/Entonces."}, {"id": "2-03", "cap": 2, "lo": "FL-2.1.3", "k": "K2", "tema": "Enfoques 'primero la prueba'", "pregunta": "¿Qué afirmación describe MEJOR el desarrollo guiado por el comportamiento (BDD)?", "opciones": {"a": "Expresa el comportamiento deseado de la aplicación con casos de prueba en lenguaje natural, fáciles de entender por las partes interesadas, normalmente con el formato Dado/Cuando/Entonces.", "b": "Escribe pruebas unitarias antes del código y las ejecuta en cada compilación.", "c": "Diseña las pruebas a partir de la estructura interna del código.", "d": "Sustituye a los criterios de aceptación por scripts de prueba automatizados escritos solo por los desarrolladores."}, "correcta": ["a"], "explicacion": "En BDD el comportamiento deseado se expresa con casos de prueba escritos en una forma sencilla de lenguaje natural, fácil de entender por las partes interesadas, normalmente con el formato Dado/Cuando/Entonces. Después, los casos de prueba se traducen automáticamente a pruebas ejecutables. Favorece una comprensión compartida entre negocio, desarrollo y prueba.", "razones": {"a": "Correcta.", "b": "Describe TDD.", "c": "Describe la prueba de caja blanca.", "d": "BDD busca precisamente que negocio participe; no lo excluye ni sustituye los criterios de aceptación."}, "clave": "BDD = lenguaje natural compartido con negocio."}, {"id": "2-04", "cap": 2, "lo": "FL-2.1.4", "k": "K2", "tema": "DevOps y prueba", "pregunta": "¿Cuál de los siguientes es un BENEFICIO de DevOps para la prueba?", "opciones": {"a": "Retroalimentación rápida sobre la calidad del código y sobre si los cambios afectan negativamente al código existente.", "b": "Elimina por completo la necesidad de la prueba manual.", "c": "El pipeline de entrega no necesita mantenimiento una vez configurado.", "d": "Ya no hace falta disponer de entornos de prueba."}, "correcta": ["a"], "explicacion": "Beneficios de DevOps para la prueba según el programa: retroalimentación rápida sobre la calidad del código y sobre si los cambios afectan negativamente al código existente; la integración continua fomenta el shift-left, animando a entregar código de alta calidad acompañado de pruebas de componente y análisis estático; promueve procesos automatizados como CI/CD que facilitan entornos de prueba estables; aumenta la visibilidad de las características de calidad no funcionales; la automatización mediante el pipeline reduce la necesidad de prueba manual repetitiva, y se minimiza el riesgo de regresión. Riesgos: hay que definir y establecer el pipeline, introducir y mantener herramientas de CI/CD, y la automatización requiere recursos adicionales.", "razones": {"a": "Correcta.", "b": "Reduce la prueba manual REPETITIVA, pero no la elimina (exploratoria, usabilidad...).", "c": "Mantener el pipeline y sus herramientas es precisamente un riesgo de DevOps.", "d": "Al contrario: DevOps facilita entornos de prueba estables."}, "clave": "Reduce ≠ elimina. Las opciones absolutas ('elimina por completo') suelen ser incorrectas."}, {"id": "2-05", "cap": 2, "lo": "FL-2.1.5", "k": "K2", "tema": "Shift-left", "pregunta": "¿Cuál de las siguientes prácticas NO es un ejemplo del enfoque shift-left?", "opciones": {"a": "Revisar la especificación desde la perspectiva de la prueba.", "b": "Escribir los casos de prueba antes de escribir el código.", "c": "Hacer análisis estático del código fuente antes de la prueba dinámica.", "d": "Dejar toda la prueba no funcional para después de terminar la prueba de sistema."}, "correcta": ["d"], "explicacion": "Shift-left significa hacer la prueba antes en el ciclo de vida. Las buenas prácticas que recoge el programa son: revisar la especificación desde la perspectiva de la prueba, escribir los casos de prueba antes que el código y ejecutarlos en un entorno de prueba durante la implementación, usar CI (y a ser posible CD) con pruebas de componente automatizadas, completar el análisis estático del código antes de la prueba dinámica y, cuando sea posible, empezar la prueba no funcional ya en el nivel de componente.", "razones": {"a": "Es shift-left.", "b": "Es shift-left.", "c": "Es shift-left.", "d": "Correcta. Retrasar la prueba no funcional al final va en contra del shift-left, que propone empezarla en el nivel de componente cuando sea posible."}, "clave": "Ojo a los 'NO' en el enunciado: subráyalos mentalmente."}, {"id": "2-06", "cap": 2, "lo": "FL-2.1.6", "k": "K1", "tema": "Retrospectivas", "pregunta": "En una retrospectiva, ¿qué se trata típicamente?", "opciones": {"a": "Qué ha ido bien, qué no ha ido bien y cómo mejorar.", "b": "La asignación de culpas por los defectos que se han escapado.", "c": "La planificación detallada del calendario de la siguiente versión.", "d": "La revisión técnica del código fuente."}, "correcta": ["a"], "explicacion": "Las retrospectivas (o 'reuniones post-proyecto') se celebran normalmente al final de un proyecto o de una iteración, en un hito de entrega, o cuando hace falta. En ellas los participantes (no solo los probadores) discuten qué ha tenido éxito y debe mantenerse, qué no ha tenido éxito y podría mejorarse, y cómo incorporar las mejoras y mantener los éxitos en el futuro. Beneficios para la prueba: más eficacia y eficiencia, más calidad de los productos de prueba, unión del equipo, mejor calidad de la base de prueba y mejor cooperación entre desarrollo y prueba.", "razones": {"a": "Correcta.", "b": "Una retrospectiva busca la mejora, no culpables.", "c": "Eso es planificación (de versión o de iteración).", "d": "Eso es una revisión (prueba estática)."}, "clave": "Retrospectiva = mejora continua: bien / mal / cómo mejorar."}, {"id": "2-07", "cap": 2, "lo": "FL-2.2.1", "k": "K2", "tema": "Niveles de prueba", "pregunta": "Un equipo prueba las interfaces y la interacción entre su sistema de reservas y la pasarela de pago externa de un proveedor. ¿Qué nivel de prueba es?", "opciones": {"a": "Prueba de integración de componentes.", "b": "Prueba de integración de sistemas.", "c": "Prueba de sistema.", "d": "Prueba de aceptación."}, "correcta": ["b"], "explicacion": "La prueba de integración de sistemas se centra en las interfaces del sistema que se prueba con otros sistemas y con servicios externos. Requiere entornos de prueba adecuados, preferiblemente parecidos al entorno operativo. La de integración de componentes se centra en las interfaces e interacciones entre componentes de UN sistema. La de sistema se centra en el comportamiento y las capacidades generales de un sistema o producto completo.", "razones": {"a": "Esa sería entre componentes internos del mismo sistema.", "b": "Correcta. Sistema propio ↔ servicio externo = integración de sistemas.", "c": "La prueba de sistema evalúa el sistema completo, no específicamente la interfaz con otro sistema externo.", "d": "La aceptación valida la preparación para el despliegue según las necesidades del negocio."}, "clave": "¿Es 'otro sistema' o 'servicio externo'? → integración de SISTEMAS."}, {"id": "2-08", "cap": 2, "lo": "FL-2.2.1", "k": "K2", "tema": "Niveles de prueba", "pregunta": "Antes de la puesta en producción, un banco pide a un grupo de empleados de sus oficinas que usen el nuevo sistema con sus tareas diarias reales en un entorno parecido al de producción, para confirmar que satisface sus necesidades. ¿Qué tipo de prueba es?", "opciones": {"a": "Prueba de sistema.", "b": "Prueba de aceptación de usuario.", "c": "Prueba de aceptación operativa.", "d": "Prueba de integración de componentes."}, "correcta": ["b"], "explicacion": "La prueba de aceptación se centra en la validación y en demostrar la preparación para el despliegue, es decir, que el sistema satisface las necesidades del negocio del usuario. Sus formas principales son: aceptación de usuario (UAT), aceptación operativa, aceptación contractual y regulatoria, prueba alfa y prueba beta. Si son los usuarios finales los que validan con sus tareas reales, es UAT. La aceptación operativa la hacen normalmente los administradores u operadores (copias de seguridad, recuperación, mantenimiento...).", "razones": {"a": "La prueba de sistema la suele hacer un equipo de prueba independiente y verifica el sistema frente a sus especificaciones.", "b": "Correcta. Usuarios reales, tareas reales, validar sus necesidades → UAT.", "c": "La aceptación operativa se centra en aspectos de operación (copias de seguridad, instalación, recuperación).", "d": "Es un nivel técnico entre componentes."}, "clave": "Usuarios finales validando = UAT. Operadores y administradores = aceptación operativa."}, {"id": "2-09", "cap": 2, "lo": "FL-2.2.2", "k": "K2", "tema": "Tipos de prueba", "pregunta": "¿Cuál de los siguientes es un ejemplo de prueba NO funcional?", "opciones": {"a": "Comprobar que el carrito suma bien el precio de los productos.", "b": "Comprobar que la página de búsqueda responde en menos de 2 segundos con 500 usuarios concurrentes.", "c": "Comprobar que un usuario bloqueado no puede iniciar sesión.", "d": "Comprobar que se aplica el descuento del 10 % a los socios."}, "correcta": ["b"], "explicacion": "La prueba funcional evalúa las funciones que debe realizar un componente o sistema: 'qué' debe hacer. La prueba no funcional evalúa atributos distintos de las características funcionales: 'cómo de bien' se comporta. Según ISO/IEC 25010 se incluyen la eficiencia de desempeño (rendimiento), la compatibilidad, la usabilidad, la fiabilidad, la seguridad, la mantenibilidad y la portabilidad. El tiempo de respuesta bajo carga es eficiencia de desempeño.", "razones": {"a": "Funcional: resultado de un cálculo.", "b": "Correcta. Tiempo de respuesta con carga = eficiencia de desempeño (no funcional).", "c": "Funcional: regla de negocio de acceso.", "d": "Funcional: regla de negocio."}, "clave": "Funcional = QUÉ hace. No funcional = CÓMO DE BIEN lo hace."}, {"id": "2-10", "cap": 2, "lo": "FL-2.2.3", "k": "K2", "tema": "Prueba de confirmación y de regresión", "pregunta": "Se corrige un defecto en el cálculo del IVA. El probador vuelve a ejecutar el caso de prueba que había fallado y además ejecuta pruebas sobre la facturación y los descuentos, que usan ese mismo cálculo. ¿Qué tipos de prueba ha realizado?", "opciones": {"a": "Regresión en ambos casos.", "b": "Confirmación al repetir el caso que falló, y regresión al probar la facturación y los descuentos.", "c": "Confirmación en ambos casos.", "d": "Prueba de mantenimiento al repetir el caso, y prueba de sistema al probar la facturación."}, "correcta": ["b"], "explicacion": "La prueba de confirmación confirma que se ha corregido el defecto original: se repiten las pruebas que fallaron (o se añaden pruebas nuevas si la corrección lo requiere). La prueba de regresión confirma que un cambio, incluida una corrección que ya ha pasado la confirmación, no ha provocado consecuencias negativas en otras partes. Conviene hacer análisis de impacto para decidir el alcance de la regresión, y las suites de regresión son buenas candidatas para la automatización.", "razones": {"a": "Repetir el caso que falló es confirmación, no regresión.", "b": "Correcta.", "c": "Probar otras zonas afectadas es regresión.", "d": "Mezcla conceptos; mantenimiento y sistema no describen lo que ha hecho."}, "clave": "Confirmación = ¿se arregló? Regresión = ¿se ha roto algo más?"}, {"id": "2-11", "cap": 2, "lo": "FL-2.3.1", "k": "K1", "tema": "Prueba de mantenimiento", "pregunta": "¿Cuál de los siguientes es un desencadenante de la prueba de mantenimiento?", "opciones": {"a": "La migración de la base de datos del sistema en producción a una plataforma nueva.", "b": "La redacción de la primera historia de usuario de un producto nuevo.", "c": "La prueba de aceptación inicial de un sistema que aún no se ha desplegado.", "d": "La contratación de nuevos probadores para el equipo."}, "correcta": ["a"], "explicacion": "La prueba de mantenimiento se aplica a sistemas ya en operación. Sus desencadenantes son: modificaciones (mejoras planificadas, cambios correctivos o arreglos urgentes), actualizaciones o migraciones del entorno operativo (por ejemplo, de una plataforma a otra, lo que puede requerir probar la conversión de datos) y la retirada de una aplicación (puede requerir probar el archivado de datos y los procedimientos de restauración). Antes de un cambio conviene hacer un análisis de impacto.", "razones": {"a": "Correcta. Una migración del entorno operativo es un desencadenante típico.", "b": "Es el inicio de un desarrollo nuevo, no mantenimiento.", "c": "El sistema aún no está en operación.", "d": "No tiene relación con el objeto de prueba."}, "clave": "Mantenimiento = sistema YA en producción: modificación, migración o retirada."}, {"id": "2-12", "cap": 2, "lo": "FL-2.2.2", "k": "K1", "tema": "Tipos de prueba", "pregunta": "¿En qué se basa la prueba de caja blanca?", "opciones": {"a": "En la estructura interna o la implementación del sistema.", "b": "En las especificaciones externas del sistema.", "c": "En la experiencia y la intuición del probador.", "d": "En las opiniones de los usuarios finales."}, "correcta": ["a"], "explicacion": "La prueba de caja blanca está basada en la estructura y deriva las pruebas a partir de la estructura interna o de la implementación del sistema (código, arquitectura, flujos de trabajo y de datos). La de caja negra está basada en la especificación y deriva las pruebas a partir de documentación externa al objeto de prueba, comprobando su comportamiento frente a las especificaciones.", "razones": {"a": "Correcta.", "b": "Eso es caja negra.", "c": "Eso son técnicas basadas en la experiencia.", "d": "No define ningún tipo de prueba del programa."}, "clave": "Caja blanca = estructura. Caja negra = especificación."}, {"id": "3-01", "cap": 3, "lo": "FL-3.1.1", "k": "K1", "tema": "Productos examinables por prueba estática", "pregunta": "¿Cuál de los siguientes conjuntos de productos de trabajo puede examinarse mediante prueba estática?", "opciones": {"a": "Solo el código fuente.", "b": "Solo los productos ejecutables.", "c": "Especificaciones de requisitos, código fuente, planes de prueba, casos de prueba y contratos.", "d": "Solo los documentos con una estructura formal que pueda analizar una herramienta."}, "correcta": ["c"], "explicacion": "Casi cualquier producto de trabajo puede examinarse con prueba estática: especificaciones de requisitos, código fuente, planes de prueba, casos de prueba, elementos del backlog del producto, cartas de prueba, documentación del proyecto, contratos y modelos. Cualquier producto que pueda leerse y entenderse puede ser objeto de una revisión. El análisis estático, en cambio, necesita productos con una estructura contra la que se pueda comprobar (modelos, código o texto con una sintaxis formal).", "razones": {"a": "Demasiado restrictivo.", "b": "La prueba estática no necesita ejecutar; justamente sirve para productos no ejecutables.", "c": "Correcta.", "d": "Eso es lo que necesita el ANÁLISIS ESTÁTICO con herramientas, no la revisión."}, "clave": "Revisión → cualquier cosa legible. Análisis estático → necesita una estructura formal."}, {"id": "3-02", "cap": 3, "lo": "FL-3.1.2", "k": "K2", "tema": "Valor de la prueba estática", "pregunta": "¿Qué defecto se detecta más fácilmente con prueba estática que con prueba dinámica?", "opciones": {"a": "Un tiempo de respuesta excesivo con 1.000 usuarios.", "b": "Una fuga de memoria que aparece tras horas de funcionamiento.", "c": "Una variable que se usa antes de haber recibido un valor.", "d": "Un fallo intermitente que solo ocurre con cierta configuración de red."}, "correcta": ["c"], "explicacion": "La prueba estática encuentra con más facilidad: defectos en los requisitos (inconsistencias, ambigüedades, contradicciones, omisiones, inexactitudes, duplicidades), defectos de diseño (estructuras de base de datos ineficientes, mala modularización), ciertos defectos de codificación (variables con valores no definidos, variables no declaradas, código inalcanzable o duplicado, complejidad excesiva), desviaciones de estándares, especificaciones de interfaz incorrectas, vulnerabilidades de seguridad (por ejemplo, desbordamientos de búfer) y huecos o inexactitudes en la cobertura de la base de prueba.", "razones": {"a": "El rendimiento depende de la ejecución: prueba dinámica.", "b": "Una fuga de memoria con el tiempo se detecta ejecutando.", "c": "Correcta. Variable con valor no definido = defecto típico del análisis estático.", "d": "Depende de la ejecución en un entorno concreto."}, "clave": "Si hace falta EJECUTAR para verlo (rendimiento, memoria, tiempos) → dinámica."}, {"id": "3-03", "cap": 3, "lo": "FL-3.1.3", "k": "K2", "tema": "Prueba estática y dinámica", "pregunta": "¿Qué afirmación sobre las diferencias entre la prueba estática y la dinámica es correcta?", "opciones": {"a": "La prueba estática encuentra defectos directamente, mientras que la dinámica provoca fallos a partir de los cuales se determinan los defectos asociados.", "b": "La prueba estática es la más adecuada para medir la eficiencia de desempeño.", "c": "La prueba dinámica se puede aplicar a productos de trabajo no ejecutables, como los requisitos.", "d": "La prueba estática no puede detectar vulnerabilidades de seguridad."}, "correcta": ["a"], "explicacion": "Ambas se complementan, pero: la estática encuentra defectos directamente y la dinámica provoca fallos y luego se analizan los defectos; la estática puede detectar defectos en caminos de código que rara vez se ejecutan o son difíciles de alcanzar; la estática se puede aplicar a productos no ejecutables y la dinámica solo a ejecutables; la estática puede medir características que no dependen de ejecutar el código (por ejemplo, la mantenibilidad) y la dinámica las que sí (por ejemplo, la eficiencia de desempeño).", "razones": {"a": "Correcta.", "b": "La eficiencia de desempeño depende de la ejecución: prueba dinámica.", "c": "Es al revés: la estática se aplica a no ejecutables.", "d": "Sí puede: por ejemplo, desbordamientos de búfer con análisis estático."}, "clave": "Estática → defectos. Dinámica → fallos."}, {"id": "3-04", "cap": 3, "lo": "FL-3.2.1", "k": "K1", "tema": "Retroalimentación temprana", "pregunta": "¿Qué beneficio aporta la retroalimentación temprana y frecuente de las partes interesadas?", "opciones": {"a": "Permite comunicar pronto posibles problemas de calidad y evitar malentendidos sobre los requisitos.", "b": "Elimina la necesidad de la prueba de aceptación.", "c": "Hace innecesarias las revisiones formales.", "d": "Garantiza que no habrá cambios en los requisitos."}, "correcta": ["a"], "explicacion": "La retroalimentación temprana y frecuente permite comunicar pronto posibles problemas de calidad. Si las partes interesadas participan poco, el producto puede no cumplir su visión original o actual, lo que provoca retrabajos costosos, plazos incumplidos, culpas y hasta el fracaso del proyecto. La retroalimentación frecuente evita malentendidos sobre los requisitos y asegura que los cambios se entienden y se implementan antes. Ayuda al equipo a centrarse en las funcionalidades que aportan más valor y a reducir riesgos.", "razones": {"a": "Correcta.", "b": "No sustituye la prueba de aceptación.", "c": "No elimina las revisiones; se complementan.", "d": "No evita los cambios; ayuda a entenderlos e incorporarlos antes."}, "clave": "Retroalimentación temprana → menos malentendidos y menos retrabajo."}, {"id": "3-05", "cap": 3, "lo": "FL-3.2.2", "k": "K2", "tema": "Proceso de revisión", "pregunta": "Cada revisor examina el documento por su cuenta, usando técnicas como listas de comprobación, y anota anomalías, recomendaciones y preguntas. ¿A qué actividad del proceso de revisión corresponde?", "opciones": {"a": "Inicio de la revisión.", "b": "Revisión individual.", "c": "Comunicación y análisis.", "d": "Corrección e informe."}, "correcta": ["b"], "explicacion": "El proceso genérico de revisión del CTFL 4.0 tiene cinco actividades: 1) planificación (alcance, objetivo, características de calidad, criterios de salida); 2) inicio de la revisión (asegurar que todos están preparados, tienen acceso al producto y entienden su rol); 3) revisión individual (cada revisor evalúa la calidad del producto e identifica anomalías, recomendaciones y preguntas aplicando técnicas como listas de comprobación o revisión basada en escenarios); 4) comunicación y análisis (se analizan las anomalías, se decide su estado, propietario y acciones, normalmente en una reunión, y se evalúa la calidad y se decide si se cumplen los criterios de salida); 5) corrección e informe (se crean informes de defecto, el autor corrige y se comunican los resultados).", "razones": {"a": "El inicio asegura la preparación y el acceso; no se revisa todavía.", "b": "Correcta.", "c": "Ahí se analizan conjuntamente las anomalías ya identificadas.", "d": "Ahí se corrige y se informa del resultado."}, "clave": "Planificación → Inicio → Revisión individual → Comunicación y análisis → Corrección e informe."}, {"id": "3-06", "cap": 3, "lo": "FL-3.2.3", "k": "K1", "tema": "Roles en las revisiones", "pregunta": "¿Qué rol de una revisión garantiza el buen desarrollo de las reuniones, incluidas la mediación, la gestión del tiempo y un ambiente seguro en el que todos puedan hablar con libertad?", "opciones": {"a": "Líder de la revisión.", "b": "Moderador (facilitador).", "c": "Escriba (registrador).", "d": "Gerente."}, "correcta": ["b"], "explicacion": "Roles de la revisión en el CTFL 4.0: el gerente decide qué se revisa y aporta recursos (personal y tiempo); el autor crea y corrige el producto; el moderador (facilitador) garantiza el buen desarrollo de las reuniones, incluidas la mediación, la gestión del tiempo y un ambiente seguro; el escriba (registrador) recopila las anomalías y registra la información de la revisión (decisiones, anomalías nuevas); el revisor realiza las revisiones; el líder de la revisión asume la responsabilidad general (decide quién participa y organiza cuándo y dónde).", "razones": {"a": "El líder tiene la responsabilidad general y organiza, pero no es quien modera la reunión.", "b": "Correcta.", "c": "El escriba registra; no modera.", "d": "El gerente decide qué revisar y aporta recursos."}, "clave": "Moderador = reunión. Líder = organización general. Escriba = registro."}, {"id": "3-07", "cap": 3, "lo": "FL-3.2.4", "k": "K2", "tema": "Tipos de revisión", "pregunta": "Se necesita el tipo de revisión más formal, que siga el proceso genérico completo, en el que se recopilen métricas y cuyo objetivo principal sea encontrar el máximo número de anomalías. ¿Cuál es?", "opciones": {"a": "Revisión informal.", "b": "Revisión guiada.", "c": "Revisión técnica.", "d": "Inspección."}, "correcta": ["d"], "explicacion": "Tipos de revisión: la revisión informal no sigue un proceso definido ni exige un resultado documentado formal; su objetivo principal es detectar anomalías. La revisión guiada (walkthrough) la dirige el autor y tiene objetivos como evaluar la calidad, generar confianza, formar a los revisores, alcanzar consenso, generar ideas nuevas y detectar anomalías. La revisión técnica la hacen revisores técnicamente cualificados y la dirige un moderador; busca consenso y decisiones sobre problemas técnicos, además de detectar anomalías. La inspección es la más formal: sigue el proceso genérico completo, su objetivo principal es encontrar el máximo número de anomalías, se recopilan métricas para mejorar el proceso, y el autor no puede actuar como líder de la revisión ni como escriba.", "razones": {"a": "Es la menos formal.", "b": "La dirige el autor y tiene objetivos más amplios (formación, consenso...).", "c": "Es formal, pero su foco es el consenso y las decisiones técnicas.", "d": "Correcta."}, "clave": "Máxima formalidad + métricas + máximo de anomalías = inspección."}, {"id": "3-08", "cap": 3, "lo": "FL-3.2.5", "k": "K1", "tema": "Factores de éxito de las revisiones", "pregunta": "¿Cuál de los siguientes es un factor de éxito de las revisiones?", "opciones": {"a": "Usar los resultados de la revisión para evaluar el rendimiento de los participantes.", "b": "Revisar el producto en partes pequeñas para que los revisores no pierdan la concentración.", "c": "No dejar tiempo de preparación, para que la revisión sea más espontánea.", "d": "Que solo la dirección decida si el producto supera la revisión."}, "correcta": ["b"], "explicacion": "Factores de éxito según el programa: definir objetivos claros y criterios de salida medibles (la evaluación de los participantes nunca debe ser un objetivo); elegir el tipo de revisión adecuado; hacer revisiones sobre partes pequeñas para que los revisores no pierdan la concentración; proporcionar retroalimentación a las partes interesadas y a los autores para que puedan mejorar; dar tiempo suficiente para prepararse; contar con el apoyo de la dirección; hacer que las revisiones formen parte de la cultura de la organización; dar formación adecuada y facilitar las reuniones.", "razones": {"a": "Expresamente desaconsejado: evaluar a los participantes nunca debe ser un objetivo.", "b": "Correcta.", "c": "Al contrario: hay que dar tiempo suficiente para prepararse.", "d": "No es un factor de éxito del programa."}, "clave": "Nunca se evalúa a las personas en una revisión: se evalúa el producto."}, {"id": "4-01", "cap": 4, "lo": "FL-4.2.1", "k": "K3", "tema": "Partición de equivalencia", "pregunta": "Un campo de una web de venta de entradas acepta números enteros:\n• menos de 1: se rechaza;\n• de 1 a 6: compra directa;\n• de 7 a 10: requiere aprobación del supervisor;\n• más de 10: se rechaza.\n¿Qué conjunto de valores cubre TODAS las particiones de equivalencia con el menor número de valores?", "opciones": {"a": "0, 3, 8, 11", "b": "1, 6, 7, 10", "c": "-1, 0, 5, 12", "d": "2, 4, 9, 15"}, "correcta": ["a"], "explicacion": "Hay 4 particiones: P1 (≤ 0, inválida), P2 (1–6, válida), P3 (7–10, válida) y P4 (≥ 11, inválida). La cobertura de partición de equivalencia se mide como particiones ejercitadas / particiones identificadas; para el 100 % basta un valor de cada partición. 0 → P1, 3 → P2, 8 → P3 y 11 → P4: cuatro valores, uno por partición.", "razones": {"a": "Correcta. Un valor en cada una de las 4 particiones.", "b": "Solo cubre las dos particiones válidas (son valores frontera de P2 y P3).", "c": "-1 y 0 están ambos en P1, 5 en P2 y 12 en P4: falta P3 (7–10).", "d": "2 y 4 están en P2, 9 en P3 y 15 en P4: falta P1 (≤ 0)."}, "clave": "Primero dibuja las particiones en una recta; luego comprueba que cada opción toca TODAS."}, {"id": "4-02", "cap": 4, "lo": "FL-4.2.1", "k": "K3", "tema": "Partición de equivalencia (Each Choice)", "pregunta": "Un formulario tiene dos parámetros:\n• Tipo de cliente: Particular, Empresa\n• Método de pago: Tarjeta, Transferencia, Bizum\nConsiderando solo las particiones válidas, ¿cuál es el número MÍNIMO de casos de prueba para alcanzar el 100 % de cobertura 'Each Choice'?", "opciones": {"a": "2", "b": "3", "c": "5", "d": "6"}, "correcta": ["b"], "explicacion": "La cobertura Each Choice exige que cada partición de cada conjunto se ejercite al menos una vez, sin tener en cuenta las combinaciones. El mínimo es el número de particiones del parámetro con más particiones: 3. Por ejemplo: (Particular, Tarjeta), (Empresa, Transferencia), (Particular, Bizum). Las 6 combinaciones (2 × 3) solo harían falta para probar todas las combinaciones, que no es lo que pide Each Choice.", "razones": {"a": "Con 2 casos no puedes usar los 3 métodos de pago.", "b": "Correcta. Máximo entre 2 y 3 = 3.", "c": "Es la suma de particiones (2 + 3); no hace falta un caso por partición cuando se pueden combinar.", "d": "Es el producto cartesiano (todas las combinaciones), más de lo que pide Each Choice."}, "clave": "Each Choice → el mínimo es el número de particiones del parámetro que más tiene."}, {"id": "4-03", "cap": 4, "lo": "FL-4.2.2", "k": "K3", "tema": "Análisis de valores frontera (2 valores)", "pregunta": "Una contraseña es válida si tiene entre 8 y 16 caracteres, ambos incluidos. Usando el análisis de valores frontera de DOS valores, ¿qué conjunto de longitudes da el 100 % de cobertura?", "opciones": {"a": "7, 8, 16, 17", "b": "8, 16", "c": "7, 8, 9, 15, 16, 17", "d": "0, 8, 16, 20"}, "correcta": ["a"], "explicacion": "En el BVA de 2 valores, para cada frontera se prueba el valor frontera y su vecino más cercano de la partición adyacente. Particiones: ≤ 7 (inválida), 8–16 (válida) y ≥ 17 (inválida). Fronteras inferiores: 7 | 8. Fronteras superiores: 16 | 17. Elementos de cobertura: 7, 8, 16 y 17.", "razones": {"a": "Correcta.", "b": "Faltan los vecinos de las particiones inválidas (7 y 17).", "c": "Es el BVA de TRES valores (añade 9 y 15).", "d": "0 y 20 no son valores frontera."}, "clave": "2 valores → frontera + vecino del otro lado. 3 valores → frontera + los dos vecinos."}, {"id": "4-04", "cap": 4, "lo": "FL-4.2.2", "k": "K3", "tema": "Análisis de valores frontera (3 valores)", "pregunta": "Un termostato trabaja con temperaturas enteras en °C:\n• 15 o menos: calefacción encendida;\n• de 16 a 24: no hace nada;\n• 25 o más: aire acondicionado encendido.\nUsando el análisis de valores frontera de TRES valores, ¿cuántos valores DISTINTOS hacen falta para el 100 % de cobertura?", "opciones": {"a": "4", "b": "6", "c": "8", "d": "12"}, "correcta": ["c"], "explicacion": "Los valores frontera son 15 y 16 (entre la primera y la segunda partición) y 24 y 25 (entre la segunda y la tercera). Las particiones de los extremos no tienen frontera exterior (≤ 15 y ≥ 25 no tienen límite). En el BVA de 3 valores, para cada valor frontera se prueban él y sus dos vecinos: 15 → {14, 15, 16}; 16 → {15, 16, 17}; 24 → {23, 24, 25}; 25 → {24, 25, 26}. La unión es {14, 15, 16, 17, 23, 24, 25, 26} = 8 valores distintos.", "razones": {"a": "4 es el número de valores frontera (lo que daría el BVA de 2 valores: 15, 16, 24, 25).", "b": "Se olvida de algún vecino.", "c": "Correcta.", "d": "Cuenta los vecinos duplicados (4 fronteras × 3); hay que quitar los repetidos."}, "clave": "En el BVA de 3 valores, quita los duplicados al unir los vecinos."}, {"id": "4-05", "cap": 4, "lo": "FL-4.2.2", "k": "K3", "tema": "Cobertura de valores frontera", "pregunta": "Un seguro solo se puede contratar con una edad (entera) de 18 a 65 años, ambos incluidos. Se han ejecutado pruebas con las edades 17, 18, 40 y 65. Con el BVA de DOS valores, ¿qué cobertura se ha alcanzado?", "opciones": {"a": "50 %", "b": "75 %", "c": "100 %", "d": "67 %"}, "correcta": ["b"], "explicacion": "Elementos de cobertura del BVA de 2 valores: 17 y 18 (frontera inferior) y 65 y 66 (frontera superior), 4 en total. Las pruebas ejercitan 17, 18 y 65; 40 no es un valor frontera. Cobertura = 3 / 4 = 75 %. Falta 66.", "razones": {"a": "Contaría solo 2 de 4.", "b": "Correcta. 3 de 4 elementos.", "c": "Falta el 66.", "d": "Sería 2 de 3, que no corresponde a ningún recuento correcto."}, "clave": "Cobertura = elementos ejercitados / elementos identificados. Los valores que no son frontera no suman."}, {"id": "4-06", "cap": 4, "lo": "FL-4.2.3", "k": "K3", "tema": "Tabla de decisión", "pregunta": "Esta tabla de decisión define el descuento de una tienda:", "anexo": "                    R1     R2     R3     R4\nSocio               S      S      N      N\nCompra > 100 €      S      N      S      N\n-------------------------------------------\nDescuento           15 %   10 %   5 %    0 %\n\nPruebas ejecutadas:\nTC1: socio, compra de 150 €\nTC2: no socio, compra de 80 €\nTC3: socio, compra de 120 €", "pregunta2": "¿Qué cobertura se ha alcanzado y qué caso de prueba adicional la AUMENTARÍA?", "opciones": {"a": "50 %; añadir un no socio con una compra de 200 €.", "b": "75 %; añadir un socio con una compra de 50 €.", "c": "50 %; añadir un socio con una compra de 130 €.", "d": "100 %; no hace falta ningún caso más."}, "correcta": ["a"], "explicacion": "TC1 (S, S) → R1. TC2 (N, N) → R4. TC3 (S, S) → R1 otra vez. Se han ejercitado 2 de las 4 columnas factibles: 50 %. Un no socio con 200 € cumple (N, S) → R3, columna no cubierta, y la cobertura sube al 75 %. La cobertura de una tabla de decisión es el número de columnas ejercitadas dividido entre el número de columnas factibles.", "razones": {"a": "Correcta.", "b": "La cobertura actual es 50 %, no 75 % (TC3 repite R1).", "c": "Un socio con 130 € vuelve a ser R1: no aumenta la cobertura.", "d": "Faltan R2 y R3."}, "clave": "Mapea cada caso a su columna; los repetidos no suman cobertura."}, {"id": "4-07", "cap": 4, "lo": "FL-4.2.3", "k": "K3", "tema": "Tabla de decisión minimizada", "pregunta": "Reglas de una tienda online:\n• Si el usuario NO está registrado, se le pide registrarse (tenga cupón o no).\n• Si está registrado y tiene cupón, se aplica el descuento.\n• Si está registrado y no tiene cupón, se cobra el precio normal.\nCondiciones: 'Registrado' (S/N) y 'Tiene cupón' (S/N). ¿Cuántas columnas tiene la tabla de decisión MINIMIZADA (colapsada)?", "opciones": {"a": "2", "b": "3", "c": "4", "d": "6"}, "correcta": ["b"], "explicacion": "La tabla completa tiene 2² = 4 columnas: (S, S) descuento, (S, N) precio normal, (N, S) pedir registro, (N, N) pedir registro. Las dos últimas tienen la misma acción y solo difieren en una condición que no influye, así que se colapsan en una columna (N, –) donde '–' significa 'indiferente'. La tabla minimizada queda con 3 columnas.", "razones": {"a": "No se pueden colapsar también las columnas de los usuarios registrados: tienen acciones distintas.", "b": "Correcta.", "c": "Es la tabla completa, sin minimizar.", "d": "No corresponde a ninguna construcción correcta."}, "clave": "Colapsa las columnas con la misma acción que solo difieren en una condición irrelevante (–)."}, {"id": "4-08", "cap": 4, "lo": "FL-4.2.4", "k": "K3", "tema": "Prueba de transición de estados", "pregunta": "Una tarjeta bancaria tiene este modelo de estados (estado inicial: Inactiva):", "anexo": "Inactiva  --activar-->          Activa\nActiva    --3 PIN erróneos-->   Bloqueada\nBloqueada --desbloquear-->      Activa\nActiva    --desactivar-->       Inactiva", "pregunta2": "Si todos los casos de prueba deben empezar en el estado Inactiva y pueden tener cualquier longitud, ¿cuál es el número MÍNIMO de casos de prueba para alcanzar el 100 % de cobertura de transiciones válidas (0-switch)?", "opciones": {"a": "1", "b": "2", "c": "3", "d": "4"}, "correcta": ["a"], "explicacion": "Hay 4 transiciones válidas. Todas caben en un solo camino: Inactiva →(activar) Activa →(3 PIN erróneos) Bloqueada →(desbloquear) Activa →(desactivar) Inactiva. Un único caso de prueba ejercita las 4 transiciones, así que el mínimo es 1. La cobertura de transiciones válidas es la más usada; exige ejercitar todas las transiciones válidas al menos una vez.", "razones": {"a": "Correcta.", "b": "Sobra un caso: un solo camino recorre las 4.", "c": "Sobran casos.", "d": "Sería un caso por transición, pero se pueden encadenar en un camino."}, "clave": "Si no limitan la longitud del caso, busca un camino que encadene todas las transiciones."}, {"id": "4-09", "cap": 4, "lo": "FL-4.2.4", "k": "K3", "tema": "Prueba de transición de estados (todas las transiciones)", "pregunta": "Con el mismo modelo de la tarjeta (estados: Inactiva, Activa y Bloqueada; eventos: activar, 3 PIN erróneos, desbloquear y desactivar; 4 transiciones válidas), ¿cuántas transiciones INVÁLIDAS hay que intentar para alcanzar el 100 % de cobertura de todas las transiciones?", "anexo": "Inactiva  --activar-->          Activa\nActiva    --3 PIN erróneos-->   Bloqueada\nBloqueada --desbloquear-->      Activa\nActiva    --desactivar-->       Inactiva", "opciones": {"a": "4", "b": "8", "c": "12", "d": "3"}, "correcta": ["b"], "explicacion": "La tabla de estados tiene 3 estados × 4 eventos = 12 celdas. 4 son transiciones válidas, así que las otras 12 − 4 = 8 son transiciones inválidas. La cobertura de todas las transiciones exige ejercitar todas las válidas e INTENTAR todas las inválidas. El programa recomienda probar una sola transición inválida por caso de prueba, para evitar el enmascaramiento de defectos.", "razones": {"a": "Es el número de transiciones válidas.", "b": "Correcta.", "c": "Es el número total de celdas de la tabla (válidas + inválidas).", "d": "Es el número de estados."}, "clave": "Inválidas = estados × eventos − válidas. Una inválida por caso."}, {"id": "4-10", "cap": 4, "lo": "FL-4.5.3", "k": "K3", "tema": "ATDD", "pregunta": "Historia de usuario: 'Como cliente quiero retirar efectivo del cajero para disponer de dinero.'", "anexo": "Criterios de aceptación:\n1. El importe debe ser múltiplo de 10 €.\n2. El máximo diario es de 600 €.\n3. El saldo debe ser suficiente.", "pregunta2": "¿Cuál es un caso de prueba NEGATIVO derivado correctamente de los criterios de aceptación?", "opciones": {"a": "Retirar 100 € con un saldo de 500 €: se entrega el dinero.", "b": "Retirar 610 € con un saldo de 1.000 € y nada retirado hoy: se rechaza por superar el límite diario.", "c": "Comprobar que el cajero muestra publicidad mientras se procesa la operación.", "d": "Retirar 600 € con un saldo de 1.000 €: se entrega el dinero."}, "correcta": ["b"], "explicacion": "En ATDD los casos de prueba se derivan de los criterios de aceptación (por ejemplo, en un taller de especificación) antes de implementar la historia. Primero se escriben las pruebas positivas, después las negativas y, por último, las no funcionales. La opción b viola SOLO el criterio 2 (610 sí es múltiplo de 10 y hay saldo suficiente), así que es un caso negativo limpio y aislado.", "razones": {"a": "Es un caso positivo.", "b": "Correcta. Negativo, deriva del criterio 2 y aísla la causa del rechazo.", "c": "No deriva de ningún criterio de aceptación.", "d": "Es positivo (en la frontera del límite diario)."}, "clave": "En ATDD: positivos → negativos → no funcionales. Un caso negativo debe violar un solo criterio."}, {"id": "4-11", "cap": 4, "lo": "FL-4.1.1", "k": "K2", "tema": "Categorías de técnicas", "pregunta": "¿Qué afirmación describe correctamente las técnicas de prueba de caja negra?", "opciones": {"a": "Se basan en el comportamiento especificado del objeto de prueba, sin hacer referencia a su estructura interna, por lo que los casos siguen siendo útiles aunque cambie la implementación pero no el comportamiento.", "b": "Se basan en el código y en la arquitectura del objeto de prueba.", "c": "Dependen sobre todo de la intuición y la experiencia del probador.", "d": "Solo se pueden aplicar en el nivel de prueba de componente."}, "correcta": ["a"], "explicacion": "Las técnicas de caja negra (basadas en la especificación) se basan en un análisis del comportamiento especificado del objeto de prueba sin hacer referencia a su estructura interna. Por eso los casos de prueba no dependen de cómo se ha implementado el software, y si la implementación cambia pero el comportamiento requerido se mantiene, los casos siguen siendo útiles. Las de caja blanca se basan en la estructura interna. Las basadas en la experiencia aprovechan el conocimiento y la experiencia de los probadores.", "razones": {"a": "Correcta.", "b": "Describe la caja blanca.", "c": "Describe las técnicas basadas en la experiencia.", "d": "La caja negra se aplica en todos los niveles."}, "clave": "Caja negra: independiente de la implementación."}, {"id": "4-12", "cap": 4, "lo": "FL-4.3.1", "k": "K2", "tema": "Prueba de sentencia", "pregunta": "Dado este pseudocódigo:", "anexo": "1  leer(importe)\n2  descuento = 0\n3  SI importe > 100 ENTONCES\n4      descuento = 10\n5  FIN SI\n6  total = importe - descuento\n7  mostrar(total)", "pregunta2": "¿Qué valor de 'importe', en un ÚNICO caso de prueba, consigue el 100 % de cobertura de sentencia?", "opciones": {"a": "50", "b": "100", "c": "150", "d": "Cualquier valor, porque todas las sentencias se ejecutan siempre."}, "correcta": ["c"], "explicacion": "La cobertura de sentencia es el porcentaje de sentencias ejecutables ejercitadas. La sentencia 4 (descuento = 10) solo se ejecuta si importe > 100. Con 150 se ejecutan todas las sentencias (1, 2, 3, 4, 6 y 7). Con 50 o 100 se salta la 4. Ojo: 100 no es mayor que 100.", "razones": {"a": "No entra en el SI: la sentencia 4 no se ejecuta.", "b": "100 > 100 es falso: no entra en el SI.", "c": "Correcta.", "d": "La sentencia 4 depende de la condición."}, "clave": "Para la cobertura de sentencia basta con entrar en todos los bloques; no hace falta la rama falsa."}, {"id": "4-13", "cap": 4, "lo": "FL-4.3.2", "k": "K2", "tema": "Prueba de rama", "pregunta": "Con el mismo pseudocódigo (un único 'SI importe > 100' sin 'SINO'), ¿cuál es el número MÍNIMO de casos de prueba para alcanzar el 100 % de cobertura de rama?", "anexo": "1  leer(importe)\n2  descuento = 0\n3  SI importe > 100 ENTONCES\n4      descuento = 10\n5  FIN SI\n6  total = importe - descuento\n7  mostrar(total)", "opciones": {"a": "1", "b": "2", "c": "3", "d": "4"}, "correcta": ["b"], "explicacion": "Una rama es una transferencia de control entre dos nodos del grafo de flujo de control. La decisión de la línea 3 tiene dos resultados: verdadero (entra en la línea 4) y falso (salta a la línea 6). Aunque no haya 'SINO', la rama falsa existe. Hacen falta 2 casos: uno con importe > 100 (por ejemplo, 150) y otro con importe ≤ 100 (por ejemplo, 50).", "razones": {"a": "Con 1 caso solo cubres una de las dos ramas (cobertura del 50 %).", "b": "Correcta.", "c": "Sobra un caso.", "d": "Sobran casos."}, "clave": "Un IF sin ELSE también tiene rama falsa: 2 casos para la cobertura de rama."}, {"id": "4-14", "cap": 4, "lo": "FL-4.3.2", "k": "K2", "tema": "Relación sentencia-rama", "pregunta": "¿Qué afirmación sobre la cobertura de sentencia y la de rama es correcta?", "opciones": {"a": "Alcanzar el 100 % de cobertura de rama implica alcanzar el 100
