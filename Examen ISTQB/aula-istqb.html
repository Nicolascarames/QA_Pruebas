uesta inadecuado).", "c": "Correcta. Riesgo de personas: habilidades insuficientes (proyecto).", "d": "Riesgo de producto (cálculo incorrecto).", "e": "Riesgo de producto (vulnerabilidad de seguridad)."}, "clave": "¿Afecta al PRODUCTO que se entrega o a CÓMO se gestiona el proyecto?"}, {"id": "5-14", "cap": 5, "lo": "FL-5.2.4", "k": "K2", "fuente": "5.2.4", "tema": "Control del riesgo de producto", "pregunta": "Se ha identificado un riesgo de producto de alto impacto: el cálculo de intereses podría ser incorrecto. ¿Qué acción es una MITIGACIÓN de ese riesgo mediante la prueba?", "opciones": {"a": "Aplicar técnicas de prueba adecuadas (por ejemplo, valores frontera) con un nivel de cobertura más alto sobre el módulo de cálculo, y asignar probadores con experiencia en el dominio.", "b": "Aceptar el riesgo sin hacer nada más.", "c": "Contratar un seguro que cubra posibles reclamaciones.", "d": "Eliminar el módulo del registro de riesgos para centrarse en otros."}, "correcta": ["a"], "concepto": "Tras analizar un riesgo de producto hay varias respuestas posibles: mitigación mediante la prueba, aceptación, transferencia o plan de contingencia.", "explicacion": ["El control del riesgo de producto consta de mitigación y monitorización.", "Respuestas: mitigación mediante la prueba, aceptación, transferencia o plan de contingencia.", "Mitigar con prueba: probadores adecuados, técnicas y coberturas adecuadas, revisiones, regresión.", "La opción a aplica técnicas, cobertura y probadores adecuados al riesgo."], "razones": {"a": "Correcta. Técnicas y cobertura adecuadas y probadores con la experiencia adecuada mitigan mediante la prueba.", "b": "Es aceptar el riesgo, no mitigarlo mediante la prueba.", "c": "Es transferir el riesgo, no mitigarlo mediante la prueba.", "d": "Retirar el riesgo del registro no es ninguna de las respuestas descritas."}, "clave": "Respuestas al riesgo: mitigar (con prueba), aceptar, transferir o plan de contingencia."}, {"id": "5-15", "cap": 5, "lo": "FL-5.3.1", "k": "K1", "fuente": "5.3.1", "tema": "Métricas de prueba", "pregunta": "¿Cuál de las siguientes es una métrica de CALIDAD DEL PRODUCTO?", "opciones": {"a": "Tiempo medio hasta el fallo (MTTF).", "b": "Porcentaje de casos de prueba ejecutados.", "c": "Esfuerzo de prueba consumido hasta la fecha.", "d": "Grado de avance en la preparación del entorno de prueba."}, "correcta": ["a"], "concepto": "Las métricas de calidad del producto incluyen disponibilidad, tiempo de respuesta y tiempo medio hasta el fallo.", "explicacion": ["Avance del proyecto: finalización de tareas, uso de recursos, esfuerzo de prueba.", "Avance de la prueba: casos ejecutados o no, superados o fallidos, preparación del entorno.", "Calidad del producto: disponibilidad, tiempo de respuesta, tiempo medio hasta el fallo.", "Otras: defectos, riesgo, cobertura y coste."], "razones": {"a": "Correcta.", "b": "Métrica de avance de la prueba.", "c": "Métrica de avance del proyecto.", "d": "Métrica de avance de la prueba."}, "clave": "Calidad del producto: disponibilidad, tiempo de respuesta, MTTF."}, {"id": "5-16", "cap": 5, "lo": "FL-5.3.2", "k": "K2", "fuente": "5.3.2", "tema": "Informes de prueba", "pregunta": "¿Qué contenido es propio del informe de COMPLECIÓN de la prueba y no del informe de avance?", "opciones": {"a": "Lecciones aprendidas y riesgos no mitigados al final de la prueba.", "b": "Las pruebas planificadas para el siguiente periodo.", "c": "Los impedimentos actuales y sus soluciones provisionales.", "d": "El avance respecto al plan durante el periodo actual."}, "correcta": ["a"], "concepto": "El informe de avance se emite periódicamente durante la prueba; el de compleción resume una actividad terminada e incluye riesgos no mitigados, defectos sin corregir y lecciones aprendidas.", "explicacion": ["Avance: periodo, avance con desviaciones, impedimentos, métricas, riesgos nuevos o cambiados y prueba del siguiente periodo.", "Compleción: resumen, evaluación frente al plan, desviaciones, impedimentos y métricas.", "Además: riesgos no mitigados, defectos no corregidos y lecciones aprendidas.", "Riesgos no mitigados y lecciones aprendidas son propios del informe de compleción."], "razones": {"a": "Correcta.", "b": "Es propio del informe de avance.", "c": "Es propio del informe de avance.", "d": "Es propio del informe de avance."}, "clave": "Avance = mirar hacia delante (siguiente periodo). Compleción = balance final y lecciones aprendidas."}, {"id": "5-17", "cap": 5, "lo": "FL-5.3.2", "k": "K2", "fuente": "5.3", "tema": "Control de la prueba", "pregunta": "¿Cuál es un ejemplo de CONTROL de la prueba?", "opciones": {"a": "Volver a priorizar las pruebas cuando un riesgo identificado se materializa.", "b": "Recopilar el número de casos superados y fallidos.", "c": "Archivar los productos de prueba al terminar el proyecto.", "d": "Diseñar casos de prueba a partir de las condiciones de prueba."}, "correcta": ["a"], "concepto": "La monitorización de la prueba recopila información; el control de la prueba la usa para dar directrices y acciones correctivas, como volver a priorizar las pruebas.", "explicacion": ["Monitorización: reunir información para evaluar el avance y comprobar los criterios de salida.", "Control: usar esa información para emitir directivas y acciones correctivas.", "Ejemplo: volver a priorizar las pruebas cuando un riesgo identificado se convierte en problema.", "Otros: ajustar el calendario por un retraso del entorno o añadir recursos."], "razones": {"a": "Correcta.", "b": "Es monitorización: reunir información.", "c": "Es una actividad de compleción de la prueba.", "d": "Es una tarea de diseño de la prueba, no de control."}, "clave": "Monitorizar = medir. Controlar = actuar sobre lo medido."}, {"id": "5-18", "cap": 5, "lo": "FL-5.4.1", "k": "K1", "fuente": "5.4", "tema": "Gestión de la configuración", "pregunta": "En la prueba, ¿qué proporciona la gestión de la configuración?", "opciones": {"a": "Una disciplina para identificar, controlar y hacer el seguimiento de productos de trabajo como planes, casos y resultados de prueba, como elementos de configuración con sus versiones y líneas base.", "b": "Un método para estimar el esfuerzo de prueba.", "c": "Una técnica de caja negra para derivar casos de prueba.", "d": "Una forma de evaluar el rendimiento de los probadores."}, "correcta": ["a"], "concepto": "La gestión de la configuración identifica, controla y hace seguimiento de los productos de trabajo de prueba como elementos de configuración, con versiones y líneas base.", "explicacion": ["Planes, casos, scripts, resultados e informes de prueba son elementos de configuración.", "Un elemento aprobado para prueba pasa a ser línea base y solo cambia mediante control formal de cambios.", "Se identifican de forma única, se versionan y se relacionan para mantener la trazabilidad.", "Permite volver a una línea base anterior para reproducir resultados."], "razones": {"a": "Correcta.", "b": "La estimación es otro tema del capítulo 5.", "c": "No es una técnica de prueba.", "d": "No tiene relación."}, "clave": "CM = versiones + líneas base + trazabilidad de los productos de prueba."}, {"id": "5-19", "cap": 5, "lo": "FL-5.2.1", "k": "K1", "fuente": "5.2.3", "tema": "Nivel de riesgo", "pregunta": "Se han valorado cuatro riesgos de producto (escala de 1 a 5). ¿Cuál tiene el nivel de riesgo MÁS ALTO y debería probarse en primer lugar?", "anexo": "Riesgo                                Probabilidad  Impacto\nR1 Error en el cálculo de impuestos        2           5\nR2 Interfaz poco intuitiva                 5           3\nR3 Pérdida de pedidos en el pago           4           4\nR4 Error ortográfico en la ayuda           5           1", "opciones": {"a": "R1", "b": "R2", "c": "R3", "d": "R4"}, "correcta": ["c"], "concepto": "El nivel de riesgo se determina por la probabilidad y el impacto; en el enfoque cuantitativo se calcula multiplicándolos.", "explicacion": ["Enfoque cuantitativo: nivel = probabilidad × impacto.", "R1 = 10, R2 = 15, R3 = 16, R4 = 5.", "El mayor es R3, con 16.", "No basta fijarse solo en la probabilidad o solo en el impacto."], "razones": {"a": "Tiene el máximo impacto, pero su probabilidad es baja: nivel 10.", "b": "Tiene alta probabilidad, pero su nivel es 15, inferior al de R3.", "c": "Correcta. 4 × 4 = 16, el nivel más alto.", "d": "Tiene la máxima probabilidad pero impacto mínimo: nivel 5."}, "clave": "Multiplica probabilidad por impacto; no elijas por un solo factor."}, {"id": "5-20", "cap": 5, "lo": "FL-5.1.4", "k": "K3", "fuente": "5.1.4", "tema": "Estimación de tres puntos", "pregunta": "Para un módulo se estima: caso optimista 4 días-persona, más probable 10 y pesimista 22. Con estimación de tres puntos E = (a + 4m + b) / 6, ¿cuál es el esfuerzo estimado?", "opciones": {"a": "11 días-persona", "b": "12 días-persona", "c": "10 días-persona", "d": "13 días-persona"}, "correcta": ["a"], "concepto": "La estimación de tres puntos calcula E = (a + 4m + b) / 6, con a optimista, m más probable y b pesimista, dando más peso al valor más probable.", "explicacion": ["a = 4, m = 10, b = 22.", "Numerador: 4 + 4×10 + 22 = 66.", "E = 66 / 6.", "E = 11 días-persona."], "razones": {"a": "Correcta. (4 + 40 + 22) / 6 = 11.", "b": "Es el promedio simple (4 + 10 + 22) / 3, no la fórmula pedida.", "c": "Es el valor más probable, sin ponderar los extremos.", "d": "Es el punto medio entre optimista y pesimista, (4 + 22) / 2."}, "clave": "El valor más probable pesa ×4 y se divide entre 6."}, {"id": "5-21", "cap": 5, "lo": "FL-5.2.3", "k": "K2", "fuente": "5.2.3", "tema": "Influencia del análisis de riesgos en la prueba", "pregunta": "¿Cómo influyen los resultados del análisis de riesgos de producto en la minuciosidad y el alcance de la prueba?", "opciones": {"a": "Todas las funciones reciben el mismo esfuerzo para ser equitativos.", "b": "Los riesgos más altos justifican pruebas más minuciosas, más tempranas y con técnicas más rigurosas; los bajos reciben menos.", "c": "El análisis solo sirve para decidir qué pruebas no funcionales se excluyen.", "d": "El análisis determina la severidad de los defectos una vez encontrados."}, "correcta": ["b"], "concepto": "El análisis de riesgos de producto permite adaptar la minuciosidad y el alcance de la prueba: más pruebas, antes y con técnicas más rigurosas para los riesgos altos.", "explicacion": ["Los resultados determinan el alcance, los niveles y los tipos de prueba.", "Determinan las técnicas a emplear y la cobertura a alcanzar.", "Sirven para estimar el esfuerzo de cada tarea de prueba.", "Priorizan la prueba para hallar cuanto antes los defectos críticos.", "Riesgo alto: más cobertura y técnicas más rigurosas; riesgo bajo: menos."], "razones": {"a": "Repartir igual el esfuerzo ignora el riesgo, justo lo que el análisis permite evitar.", "b": "Correcta. Se ajustan minuciosidad, momento y alcance al nivel de riesgo.", "c": "Influye en todo el alcance de la prueba, no solo en lo no funcional.", "d": "La severidad se evalúa sobre el defecto concreto, no sale del análisis de riesgos."}, "clave": "Más riesgo implica más pruebas, antes y más rigurosas."}, {"id": "5-22", "cap": 5, "lo": "FL-5.3.3", "k": "K2", "fuente": "5.3.3", "tema": "Comunicación del estado de la prueba", "pregunta": "Un equipo ágil repartido en tres zonas horarias no puede comunicarse cara a cara y todos necesitan conocer a diario el estado de la prueba. ¿Qué forma de comunicar el estado es más adecuada?", "opciones": {"a": "Un informe formal de 40 páginas al final de cada mes.", "b": "Esperar a la reunión de cierre del proyecto para presentar los resultados.", "c": "Comunicación verbal con quienes coincidan en la oficina.", "d": "Un cuadro de mando en línea compartido (por ejemplo, un tablero de tareas) apoyado en mensajes electrónicos."}, "correcta": ["d"], "concepto": "El estado de la prueba se comunica por conversación verbal, cuadros de mando, canales electrónicos, documentación en línea o informes formales; la elección depende del contexto.", "explicacion": ["Opciones: verbal, cuadros de mando, canales electrónicos, documentación en línea, informes formales.", "Se pueden usar una o varias, según el contexto.", "En equipos distribuidos la comunicación cara a cara no siempre es posible.", "Un cuadro de mando en línea con mensajes electrónicos informa a todos a diario."], "razones": {"a": "Un informe formal mensual no ofrece información diaria.", "b": "Llega demasiado tarde para controlar la prueba.", "c": "La comunicación verbal directa no es viable cuando el equipo está distribuido.", "d": "Correcta. Es continua y visible para todos, y adecuada para equipos distribuidos."}, "clave": "El canal de comunicación se adapta al contexto del equipo."}, {"id": "5-23", "cap": 5, "lo": "FL-5.1.1", "k": "K2", "fuente": "5.1.1", "tema": "Propósito del plan de prueba", "pregunta": "¿Qué afirmación sobre el plan de prueba es correcta?", "opciones": {"a": "Sirve de comunicación con el equipo y las partes interesadas, y demuestra que la prueba se ajustará a la política y la estrategia de prueba, o explica por qué se desviará.", "b": "Sustituye a la política y a la estrategia de prueba de la organización.", "c": "Contiene exclusivamente los casos de prueba y sus resultados reales.", "d": "Solo se elabora una vez ejecutadas las pruebas, para documentar lo que se hizo."}, "correcta": ["a"], "concepto": "El plan de prueba documenta medios y calendario, sirve de comunicación con el equipo y demuestra que la prueba seguirá la política y la estrategia de prueba, o explica por qué se desvía.", "explicacion": ["Describe los objetivos, recursos y procesos de un proyecto de prueba.", "Documenta los medios y el calendario para alcanzar los objetivos.", "Ayuda a asegurar que las actividades cumplirán los criterios establecidos.", "Comunica con el equipo y demuestra adherencia a política y estrategia, o explica la desviación."], "razones": {"a": "Correcta. Comunica y vincula la prueba con la política y la estrategia de prueba.", "b": "El plan no sustituye a la política y la estrategia: demuestra que se siguen o explica la desviación.", "c": "El contenido típico es el contexto, los riesgos, el enfoque, el presupuesto y el calendario, no solo casos de prueba.", "d": "La planificación guía el pensamiento sobre los desafíos futuros, por lo que se hace antes de ejecutar."}, "clave": "El plan comunica la prueba y la vincula con la política y la estrategia."}, {"id": "5-24", "cap": 5, "lo": "FL-5.1.2", "k": "K1", "fuente": "5.1.2", "tema": "Contribución del probador a la planificación de la versión", "pregunta": "¿Cuál es una contribución típica del probador a la planificación de la VERSIÓN en un ciclo de vida iterativo?", "opciones": {"a": "Aprobar el presupuesto global de la versión.", "b": "Escribir el código de producción de las historias de usuario.", "c": "Participar en escribir historias de usuario comprobables y criterios de aceptación, y en los análisis de riesgos del proyecto y de calidad.", "d": "Asignar a los desarrolladores sus tareas de programación de la versión."}, "correcta": ["c"], "concepto": "En la planificación de la versión el probador participa en historias de usuario y criterios de aceptación comprobables, análisis de riesgos, estimación del esfuerzo y definición del enfoque de prueba.", "explicacion": ["La planificación de la versión mira a la entrega del producto y es la base del enfoque y del plan de prueba.", "El probador participa en escribir historias de usuario comprobables y criterios de aceptación.", "Participa en los análisis de riesgos del proyecto y de calidad.", "Estima el esfuerzo de prueba, determina el enfoque y planifica la prueba de la versión."], "razones": {"a": "Aprobar el presupuesto no es un rol del probador.", "b": "Programar el producto es tarea de desarrollo.", "c": "Correcta. Aporta la visión de pruebas sobre historias, criterios y riesgos.", "d": "La asignación de tareas de programación no corresponde al probador."}, "clave": "El probador aporta testabilidad, riesgos y estimación en la planificación."}, {"id": "5-25", "cap": 5, "lo": "FL-5.1.3", "k": "K1", "fuente": "5.1.3", "tema": "Definición de preparado", "pregunta": "En proyectos ágiles, ¿qué es la definición de preparado (DoR)?", "opciones": {"a": "El conjunto de criterios que debe cumplir un incremento para considerarse terminado.", "b": "El plan de prueba aprobado para la versión.", "c": "La lista de defectos abiertos que quedan al cerrar la iteración.", "d": "Los criterios de entrada que debe cumplir una historia de usuario para empezar las actividades de desarrollo y/o prueba."}, "correcta": ["d"], "concepto": "La definición de preparado (DoR) son los criterios de entrada ágiles: lo que una historia de usuario debe cumplir para empezar el desarrollo y/o la prueba.", "explicacion": ["Los criterios de entrada definen las precondiciones para empezar una actividad.", "En ágil, los de entrada de una historia se llaman Definición de Preparado (DoR).", "Los de salida se llaman Definición de Hecho (DoD).", "La DoR actúa antes de empezar; la DoD define cuándo un elemento está listo para entregar."], "razones": {"a": "Eso describe la definición de hecho (DoD), criterios de salida.", "b": "El plan de prueba es otro documento distinto.", "c": "Una lista de defectos abiertos no define criterios de entrada.", "d": "Correcta. La DoR son los criterios de entrada de las historias de usuario."}, "clave": "DoR = entrada (antes); DoD = salida (después)."}, {"id": "5-26", "cap": 5, "lo": "FL-5.1.5", "k": "K3", "fuente": "5.1.5", "tema": "Priorización con dependencias", "pregunta": "Se priorizan los casos de prueba por su prioridad (1 es la más alta), pero respetando las dependencias. ¿Cuál es el orden de ejecución correcto?", "anexo": "Caso   Prioridad   Depende de\nTC1       1          TC4\nTC2       2          -\nTC3       3          -\nTC4       4          TC3\nTC5       5          TC2", "opciones": {"a": "TC1, TC2, TC3, TC4, TC5", "b": "TC3, TC4, TC1, TC2, TC5", "c": "TC3, TC1, TC4, TC2, TC5", "d": "TC2, TC5, TC3, TC4, TC1"}, "correcta": ["b"], "concepto": "En la priorización, un caso con dependencias debe ejecutarse después de aquellos de los que depende, aunque estos tengan menor prioridad.", "explicacion": ["Por prioridad sería: TC1, TC2, TC3, TC4, TC5.", "TC1 depende de TC4, y TC4 depende de TC3.", "Para ejecutar TC1 primero se ejecutan TC3 y TC4: TC3, TC4, TC1.", "Después TC2 y TC5, que depende de TC2."], "razones": {"a": "Ignora las dependencias: TC1 se ejecuta antes que TC4 y TC3.", "b": "Correcta. TC3, TC4 y TC1 respetan la cadena y luego TC2 y TC5.", "c": "Ejecuta TC1 antes que TC4, de quien depende.", "d": "No respeta la prioridad: ejecuta TC2 y TC5 antes que TC1, que es el más prioritario."}, "clave": "Resuelve primero las dependencias, luego el orden por prioridad."}, {"id": "5-27", "cap": 5, "lo": "FL-5.1.7", "k": "K2", "fuente": "5.1.7", "tema": "Cuadrantes de prueba", "pregunta": "Según el modelo de cuadrantes de prueba, ¿en qué cuadrante se sitúan las pruebas de rendimiento y de seguridad?", "opciones": {"a": "Cuadrante Q4: orientadas a la tecnología y que critican el producto.", "b": "Cuadrante Q1: orientadas a la tecnología y que apoyan al equipo.", "c": "Cuadrante Q2: orientadas al negocio y que apoyan al equipo.", "d": "Cuadrante Q3: orientadas al negocio y que critican el producto."}, "correcta": ["a"], "concepto": "Cuadrantes: Q1 tecnología y apoyo al equipo; Q2 negocio y apoyo al equipo; Q3 negocio y crítica del producto; Q4 tecnología y crítica del producto.", "explicacion": ["Q1: pruebas de componente e integración de componentes.", "Q2: pruebas funcionales y de historias de usuario.", "Q3: exploratoria, usabilidad y aceptación de usuario.", "Q4: pruebas de humo y no funcionales (salvo usabilidad), como rendimiento y seguridad."], "razones": {"a": "Correcta. Rendimiento y seguridad son pruebas técnicas que critican el producto.", "b": "Q1 contiene pruebas de componente e integración que apoyan al equipo.", "c": "Q2 contiene pruebas funcionales de negocio que apoyan al equipo.", "d": "Q3 contiene pruebas como exploratoria y usabilidad, orientadas al negocio."}, "clave": "Q1 y Q2 apoyan al equipo; Q3 y Q4 critican; rendimiento y seguridad en Q4."}, {"id": "5-28", "cap": 5, "lo": "FL-5.4.1", "k": "K2", "fuente": "5.4", "tema": "Gestión de la configuración", "pregunta": "Un defecto se reproduce con la versión 2.3 pero no con la 2.4 del software. ¿Qué aporta la gestión de la configuración a la prueba en esta situación?", "opciones": {"a": "Prioriza automáticamente los defectos abiertos según su severidad.", "b": "Automatiza la ejecución de los casos de prueba de regresión.", "c": "Identifica y versiona de forma única los elementos de prueba y el objeto de prueba, con trazabilidad entre ellos.", "d": "Estima el esfuerzo necesario para corregir el defecto."}, "correcta": ["c"], "concepto": "La gestión de la configuración identifica de forma única, controla y versiona los elementos de configuración y mantiene la trazabilidad entre elementos de prueba, objeto de prueba y resultados.", "explicacion": ["Los elementos de configuración, incluidos los de prueba, se identifican de forma única.", "Se versionan y se controla su cambio, y se relacionan para mantener la trazabilidad.", "Los elementos aprobados forman líneas base a las que se puede volver.", "Así se reproducen resultados previos y se localiza la versión donde aparece el defecto."], "razones": {"a": "Priorizar defectos es parte de la gestión de defectos, no de configuración.", "b": "Automatizar la ejecución corresponde a herramientas de automatización.", "c": "Correcta. Permite saber qué versión de qué elemento se probó y reproducir el defecto.", "d": "La estimación del esfuerzo de corrección no es función de la gestión de la configuración."}, "clave": "Versión exacta + trazabilidad: gestión de la configuración."}, {"id": "5-29", "cap": 5, "lo": "FL-5.2.4", "k": "K2", "fuente": "5.2.4", "tema": "Respuestas al riesgo de producto", "pregunta": "Se identifica el riesgo de que la pasarela de pago de un proveedor externo falle y cause pérdidas económicas. La organización contrata un seguro que cubre esas pérdidas. ¿Qué respuesta al riesgo se ha adoptado?", "opciones": {"a": "Mitigación mediante más pruebas", "b": "Aceptación del riesgo", "c": "Plan de contingencia", "d": "Transferencia del riesgo"}, "correcta": ["d"], "concepto": "Respuestas al riesgo: mitigación (por ejemplo, con pruebas), aceptación, transferencia a un tercero o plan de contingencia si el riesgo se materializa.", "explicacion": ["Mitigación: reducir el riesgo, por ejemplo con pruebas adicionales.", "Aceptación: asumir el riesgo sin actuar.", "Transferencia: trasladar el impacto a un tercero, como un seguro.", "Plan de contingencia: acciones previstas si ocurre."], "razones": {"a": "No se han añadido pruebas para reducir la probabilidad del fallo.", "b": "Aceptar es asumir el riesgo sin medidas, y aquí se ha contratado un seguro.", "c": "Un plan de contingencia define qué hacer si ocurre; aquí se traslada el impacto económico.", "d": "Correcta. El seguro traslada las pérdidas a un tercero."}, "clave": "Seguro o tercero que asume el impacto: transferencia."}, {"id": "5-30", "cap": 5, "lo": "FL-5.5.1", "k": "K2", "fuente": "5.5", "tema": "Objetivos del informe de defecto", "pregunta": "¿Cuáles son los objetivos de un informe de defecto?", "opciones": {"a": "Evaluar el rendimiento individual del desarrollador que introdujo el defecto.", "b": "Dar información suficiente para identificar, reproducir y resolver el defecto, y permitir seguir la calidad del producto y mejorar el proceso.", "c": "Sustituir al plan de prueba como documento de seguimiento.", "d": "Garantizar que todo defecto notificado se corregirá antes de la entrega."}, "correcta": ["b"], "concepto": "El informe de defecto proporciona información para resolver el problema, permite a los participantes seguir la calidad del producto y aporta ideas para mejorar el proceso de desarrollo y de prueba.", "explicacion": ["Debe permitir identificar y reproducir el defecto.", "Debe dar información suficiente para resolverlo.", "Facilita el seguimiento de la calidad del producto.", "Aporta ideas de mejora del proceso de desarrollo y prueba."], "razones": {"a": "El informe no sirve para evaluar a personas, sino para resolver y mejorar.", "b": "Correcta. Cubre resolución del defecto, seguimiento de calidad y mejora de proceso.", "c": "El informe de defecto no reemplaza al plan de prueba.", "d": "Notificar un defecto no garantiza corregirlo antes de la entrega; eso se decide después."}, "clave": "Informe de defecto: reproducir, resolver, seguir calidad y mejorar proceso."}, {"id": "5-31", "cap": 5, "lo": "FL-5.2.1", "k": "K1", "fuente": "5.2.1", "tema": "Riesgo (risk)", "pregunta": "¿Cómo se denomina un evento, peligro, amenaza o situación potencial cuya ocurrencia causa un efecto adverso?", "opciones": {"a": "Defecto", "b": "Riesgo", "c": "Restricción", "d": "Anomalía"}, "correcta": ["b"], "concepto": "Un riesgo es un evento, peligro, amenaza o situación potencial cuya ocurrencia causa un efecto adverso; se caracteriza por su probabilidad y su impacto.", "explicacion": ["Riesgo: evento, peligro, amenaza o situación potencial con efecto adverso si ocurre.", "Se caracteriza por dos factores: probabilidad e impacto.", "La probabilidad es mayor que cero y menor que uno.", "Probabilidad e impacto expresan el nivel de riesgo."], "razones": {"a": "Un defecto ya existe en un producto de trabajo; el riesgo es un evento potencial futuro.", "b": "Correcta. Es la definición de riesgo.", "c": "Una restricción limita el proyecto; no es un evento potencial con efecto adverso.", "d": "Una anomalía es una desviación observada, no un evento potencial."}, "clave": "Riesgo = algo que puede ocurrir y sería adverso; se mide con probabilidad e impacto."}, {"id": "5-32", "cap": 5, "lo": "FL-5.2.3", "k": "K1", "fuente": "5.2", "tema": "Pruebas basadas en el riesgo (risk-based testing)", "pregunta": "¿Qué describe mejor las pruebas basadas en el riesgo (risk-based testing)?", "opciones": {"a": "Un enfoque en el que se prueba cada requisito con la misma profundidad, sin importar su criticidad.", "b": "Un enfoque centrado solo en los riesgos de proyecto, como retrasos y falta de personal.", "c": "Un enfoque de prueba en el que las actividades se seleccionan, priorizan y gestionan según el análisis y el control de riesgos.", "d": "Una técnica de caja blanca que elige casos según la complejidad del código."}, "correcta": ["c"], "concepto": "Las pruebas basadas en el riesgo son el enfoque de prueba en que las actividades se seleccionan, priorizan y gestionan según el análisis y el control de riesgos.", "explicacion": ["Las actividades principales de gestión del riesgo son el análisis y el control de riesgos.", "El análisis consta de identificación y evaluación de riesgos.", "El control consta de mitigación y monitorización de riesgos.", "El enfoque que usa ambos para seleccionar, priorizar y gestionar la prueba es el basado en el riesgo."], "razones": {"a": "Ignora el riesgo: es justo lo contrario de un enfoque basado en el riesgo.", "b": "El enfoque se basa en el análisis de riesgos de producto, no solo en los de proyecto.", "c": "Correcta. Es la definición de pruebas basadas en el riesgo.", "d": "No es una técnica de caja blanca, sino un enfoque de prueba."}, "clave": "Basado en el riesgo: analizar y controlar riesgos para seleccionar, priorizar y gestionar la prueba."}, {"id": "5-33", "cap": 5, "lo": "FL-5.2.3", "k": "K1", "fuente": "5.2.3", "tema": "Identificación de riesgos (risk identification)", "pregunta": "¿Qué afirmación sobre la identificación de riesgos (risk identification) es correcta?", "opciones": {"a": "Consiste en generar una lista completa de riesgos, por ejemplo con tormenta de ideas, talleres, entrevistas o diagramas causa-efecto.", "b": "Consiste en calcular el nivel de riesgo multiplicando la probabilidad por el impacto.", "c": "Consiste en comprobar que las acciones de mitigación son eficaces.", "d": "Consiste en aplicar medidas para reducir el nivel de riesgo."}, "correcta": ["a"], "concepto": "La identificación de riesgos genera una lista completa de riesgos; junto con la evaluación de riesgos forma el análisis de riesgos.", "explicacion": ["El análisis de riesgos consta de identificación y evaluación de riesgos.", "La identificación genera una lista completa de riesgos.", "Las partes interesadas pueden usar tormenta de ideas, talleres, entrevistas o diagramas causa-efecto.", "Determinar probabilidad, impacto y nivel es tarea de la evaluación."], "razones": {"a": "Correcta. Es la definición de identificación de riesgos.", "b": "Calcular el nivel de riesgo es parte de la evaluación de riesgos.", "c": "Eso es la monitorización de riesgos.", "d": "Eso es la mitigación de riesgos."}, "clave": "Identificar = listar los riesgos; evaluar = medirlos y priorizarlos."}, {"id": "5-34", "cap": 5, "lo": "FL-5.2.4", "k": "K1", "fuente": "5.2.4", "tema": "Monitorización de riesgos (risk monitoring)", "pregunta": "¿Cuál es el objetivo de la monitorización de riesgos (risk monitoring)?", "opciones": {"a": "Implementar las acciones propuestas en la evaluación para reducir el nivel de riesgo.", "b": "Asegurar que las acciones de mitigación son eficaces, obtener más información para mejorar la evaluación de riesgos e identificar riesgos emergentes.", "c": "Generar una lista completa de riesgos al inicio del proyecto.", "d": "Eliminar los riesgos de proyecto trasladándolos a los proveedores."}, "correcta": ["b"], "concepto": "La monitorización de riesgos asegura que las acciones de mitigación son eficaces, aporta información para mejorar la evaluación e identifica riesgos emergentes.", "explicacion": ["El control de riesgos consta de mitigación y monitorización.", "La mitigación implementa las acciones propuestas para reducir el nivel de riesgo.", "La monitorización comprueba que esas acciones son eficaces.", "También obtiene información para mejorar la evaluación e identifica riesgos emergentes."], "razones": {"a": "Eso es la mitigación de riesgos.", "b": "Correcta. Es el objetivo de la monitorización de riesgos.", "c": "Eso es la identificación de riesgos.", "d": "No es el objetivo de la monitorización; trasladar el impacto a un tercero sería transferir el riesgo."}, "clave": "Mitigar = actuar; monitorizar = comprobar que funciona y buscar riesgos nuevos."}, {"id": "5-35", "cap": 5, "lo": "FL-5.3.2", "k": "K1", "fuente": "5.3", "tema": "Monitorización de la prueba (test monitoring)", "pregunta": "¿Qué describe la monitorización de la prueba (test monitoring)?", "opciones": {"a": "Recopilar información sobre la prueba para evaluar su avance y medir si se cumplen los criterios de salida.", "b": "Dar directrices y acciones correctivas para lograr una prueba eficaz y eficiente.", "c": "Recoger datos de actividades terminadas para consolidar la experiencia y los productos de prueba.", "d": "Definir los criterios de entrada de cada nivel de prueba."}, "correcta": ["a"], "concepto": "La monitorización de la prueba recopila información sobre la prueba para evaluar su avance y medir si se cumplen los criterios de salida o las tareas asociadas.", "explicacion": ["Monitorización: reunir información sobre la prueba.", "Sirve para evaluar el avance y medir si se cumplen los criterios de salida.", "El control usa esa información para dar directrices y acciones correctivas.", "La compleción consolida la experiencia y los productos de prueba."], "razones": {"a": "Correcta. Es la definición de monitorización de la prueba.", "b": "Eso es el control de la prueba.", "c": "Eso es la compleción de la prueba.", "d": "Los criterios de entrada se definen en la planificación, no son la monitorización."}, "clave": "Monitorizar = recoger información; controlar = actuar; completar = consolidar."}, {"id": "5-36", "cap": 5, "lo": "FL-5.5.1", "k": "K1", "fuente": "5.5", "tema": "Gestión de defectos (defect management)", "pregunta": "¿Qué incluye, como mínimo, el proceso de gestión de defectos (defect management)?", "opciones": {"a": "Solo el registro del defecto en una herramienta, sin análisis posterior.", "b": "Únicamente la corrección del defecto por el desarrollador.", "c": "Un flujo de trabajo para tratar cada defecto o anomalía desde su descubrimiento hasta su cierre, y reglas para su clasificación.", "d": "Un plan de contingencia para cada riesgo de producto identificado."}, "correcta": ["c"], "concepto": "La gestión de defectos incluye, como mínimo, un flujo de trabajo desde el descubrimiento hasta el cierre de cada defecto o anomalía y reglas de clasificación.", "explicacion": ["Como mínimo: flujo de trabajo y reglas de clasificación.", "El flujo va del descubrimiento al cierre de cada defecto o anomalía.", "Incluye registrar, analizar y clasificar, decidir la respuesta y cerrar el informe.", "Todas las partes interesadas implicadas deben seguir el proceso."], "razones": {"a": "El flujo incluye también analizar, clasificar, decidir la respuesta y cerrar el informe.", "b": "La corrección es solo una de las respuestas posibles al defecto.", "c": "Correcta. Es el contenido mínimo del proceso de gestión de defectos.", "d": "Los planes de contingencia pertenecen a la gestión de riesgos, no a la de defectos."}, "clave": "Gestión de defectos: flujo de descubrimiento a cierre más reglas de clasificación."}, {"id": "5-37", "cap": 5, "lo": "FL-5.2.3", "k": "K1", "fuente": "5.2.3", "tema": "Evaluación de riesgos (risk assessment)", "pregunta": "¿Qué actividades abarca la evaluación de riesgos (risk assessment)?", "opciones": {"a": "Generar una lista completa de riesgos mediante tormenta de ideas y entrevistas.", "b": "Implementar las acciones de mitigación y comprobar su eficacia.", "c": "Elaborar el informe de compleción con los riesgos no mitigados.", "d": "Categorizar los riesgos identificados, determinar su probabilidad, impacto y nivel, priorizarlos y proponer formas de tratarlos."}, "correcta": ["d"], "concepto": "La evaluación de riesgos categoriza los riesgos identificados, determina su probabilidad, impacto y nivel, los prioriza y propone formas de tratarlos.", "explicacion": ["La evaluación de riesgos sigue a la identificación y forma con ella el análisis.", "Categoriza los riesgos: los de una misma categoría suelen mitigarse de forma parecida.", "Determina probabilidad, impacto y nivel de riesgo.", "Prioriza los riesgos y propone formas de tratarlos."], "razones": {"a": "Eso es la identificación de riesgos.", "b": "Eso es la mitigación y la monitorización, es decir, el control de riesgos.", "c": "El informe de compleción pertenece a la compleción de la prueba.", "d": "Correcta. Es el contenido de la evaluación de riesgos."}, "clave": "Evaluar = categorizar, medir (probabilidad, impacto, nivel), priorizar y proponer tratamiento."}, {"id": "6-01", "cap": 6, "lo": "FL-6.1.1", "k": "K2", "fuente": "6.1", "tema": "Herramientas de prueba", "pregunta": "¿Qué tipo de herramienta aumenta la eficiencia del proceso de prueba facilitando la gestión del ciclo de vida de desarrollo, los requisitos, las pruebas, los defectos y la configuración?", "opciones": {"a": "Herramientas de gestión de la prueba.", "b": "Herramientas de prueba estática.", "c": "Herramientas de prueba no funcional.", "d": "Herramientas de colaboración."}, "correcta": ["a"], "concepto": "Las herramientas de gestión de la prueba aumentan la eficiencia del proceso al facilitar la gestión del ciclo de vida, los requisitos, las pruebas, los defectos y la configuración.", "explicacion": ["Gestión: ciclo de vida, requisitos, pruebas, defectos y configuración.", "Prueba estática: apoyan revisiones y análisis estático.", "Diseño e implementación: generan casos, datos y procedimientos de prueba.", "Ejecución y cobertura: ejecución automatizada y medición de cobertura.", "Otras: no funcional, DevOps, colabor empre ofrece menos funcionalidad que las herramientas comerciales.", "d": "Hace innecesario el mantenimiento de los scripts de prueba."}, "correcta": ["a"], "concepto": "Un riesgo de la automatización es usar software de código abierto que puede ser abandonado o cuyos componentes internos requieran actualizaciones frecuentes.", "explicacion": ["El software de código abierto puede abandonarse.", "Entonces no habría más actualizaciones disponibles.", "Sus componentes internos pueden requerir actualizaciones frecuentes por su desarrollo posterior.", "Es distinto de la dependencia de un proveedor comercial."], "razones": {"a": "Correcta. Es el riesgo que describe el programa para el código abierto.", "b": "Es el riesgo de dependencia del proveedor, no del código abierto.", "c": "El programa no afirma eso.", "d": "El mantenimiento de scripts sigue siendo necesario; subestimarlo es un riesgo."}, "clave": "Código abierto: riesgo de abandono y actualizaciones frecuentes."}];

const S = {
  view:"practicar", prog:{}, sims:[], db:null, sample:null, store:"local",

function saveLabel(){
  const el=$("#saveInfo"); if(!el) return;
  el.textContent = S.store==="db" ? "Tu progreso se guarda en tu cuenta (lo ves en cualquier dispositivo)." : "Tu progreso se guarda en este navegador.";
}
async function initStore(){
  S.prog = lsGet("istqb.prog",{}); S.sims = lsGet("istqb.sims",[]);
  try{
    const db = window.claude ? await window.claude.use("db") : null;
    if(db){
      const [p,s] = await Promise.all([db.collection("progreso").get(), db.collection("simulacros").orderBy("fecha","desc").limit(50).get()]);
      const remote={}; p.docs.forEach(d=>{const v=d.data(); if(v) remote[d.id]=v});
      // fusionar: lo local que no esté en remoto se sube
      for(const [id,v] of Object.entries(S.prog)){ if(!remote[id] || (remote[id].ultima||"")<(v.ultima||"")){ remote[id]=v; try{await db.doc("progreso/"+id).set(v)}catch(e){} } }
      S.prog=remote; S.sims=s.docs.map(d=>({...d.data(),_id:d.id}));
      S.db=db; S.store="db"; lsSet("istqb.prog",S.prog);
    }
  }catch(e){ /* sigue en local */ }
  render();
}
async function recordAnswer(q, ok, elegida){
  const prev = S.prog[q.id] || {qid:q.id,cap:q.cap,k:q.k,intentos:0,aciertos:0,historial:[]};
  const v = {...prev, intentos:prev.intentos+1, aciertos:prev.aciertos+(ok?1:0), ultimaCorrecta:ok, ultima:new Date().toISOString(), ultimaElegida:elegida, historial:[...(prev.historial||[]),ok].slice(-10)};
  S.prog[q.id]=v; lsSet("istqb.prog",S.prog);
  if(S.db){ try{ await S.db.doc("progreso/"+q.id).set(v) }catch(e){} }
}
async function recordSim(r){
  S.sims.unshift(r); lsSet("istqb.sims",S.sims.slice(0,50));
  if(S.db){ try{ await S.db.collection("simulacros").add(r) }catch(e){} }
}
const failed = ()=>BANCO.filter(q=>S.prog[q.id] && S.prog[q.id].ultimaCorrecta===false);

document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>go(b.dataset.v)));
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected", String(b.dataset.v===S.view)));
  const nf=failed().length; $("#nFall").textContent = nf? nf : "";

}

function qHead(q){
  return `<div class="meta"><span>Cap. <b>${q.cap}</b></span><span>${esc(q.lo)}</span><span class="k">${q.k}</span>${q.fuente?`<span>Programa §${esc(q.fuente)}</span>`:""}<span>${esc(q.tema)}</span></div>
  <div class="qtext">${esc(q.pregunta)}</div>
  ${q.anexo?`<pre class="anexo">${esc(q.anexo)}</pre>`:""}
  ${q.pregunta2?`<div class="qtext">${esc(q.pregunta2)}</div>`:""}
  ${q.correcta.length>1?`<span class="two">SELECCIONA DOS</span>`:""}`;
}
function optsHTML(q, order, sel, reveal, chosen){
  return `<div class="opts" role="${q.correcta.length>1?"group":"radiogroup"}">`+order.map((key,i)=>{
    let cls="opt";
    if(!reveal && sel.includes(key)) cls+=" sel";
    if(reveal){ if(q.correcta.includes(key)) cls+=" right"; else if(chosen.includes(key)) cls+=" wrong"; }
    const good=q.correcta.includes(key), mine=reveal && chosen.includes(key);
    const razon = String(q.razones[key]||"").replace(/^Correcta\.\s*/,"") || "Es la respuesta correcta; mira la explicación.";
    const why = reveal ? `<span class="why ${good?"y":"n"}"><b>${good?"✓ Por qué es correcta":"✗ Por qué no"}</b>${esc(razon)}</span>` : "";
    const tag = mine ? `<span class="mine">Tu respuesta</span>` : "";
    return `<button class="${cls}" data-key="${key}" ${reveal?"disabled":""} aria-pressed="${sel.includes(key)}"><span class="bub">${LET[i]}</span><span class="otext">${tag}${esc(q.opciones[key])}${why}</span></button>`;
  }).join("")+`</div>`;
}
const isRight=(q,sel)=>sel.length===q.correcta.length && sel.every(k=>q.correcta.includes(k));
const letterOf=(order,key)=>LET[order.indexOf(key)];
/* Explicación en puntos: las preguntas nuevas ya traen una lista; las antiguas (texto seguido)
   se parten en frases, y las enumeraciones "1) … 2) …" o "x: a, b, c, d" se convierten en sublistas. */
function explPoints(q){
  if(Array.isArray(q.explicacion)) return q.explicacion.map(t=>({t,sub:[]}));
  const frases=String(q.explicacion).split(/(?<=[.!?])\s+(?=[A-ZÁÉÍÓÚÑ¿¡'"(])/);
  return frases.map(f=>{
    const num=f.split(/\s(?=\d+\)\s)/);
    if(num.length>=3) return {t:num[0].replace(/:\s*$/,":"), sub:num.slice(1).map(s=>s.replace(/^\d+\)\s*/,"").replace(/[.;]\s*$/,""))};
    const m=f.match(/^(.{12,160}?):\s+(.+)$/);
    if(m){
      const parts=m[2].replace(/\.$/,"").split(/,\s+(?:y\s+)?|\s+y\s+(?=[^,]+$)/);
      if(parts.length>=4 && parts.every(p=>p.length<95)) return {t:m[1]+":", sub:parts};
    }
    return {t:f,sub:[]};
  });
}
function explHTML(q){
  const pts=explPoints(q).map(p=>`<li>${esc(p.t)}${p.sub.length?`<ul>${p.sub.map(s=>`<li>${esc(s)}</li>`).join("")}</ul>`:""}</li>`).join("");
  return `<div class="expl">
    ${q.concepto?`<div class="concept"><b>La teoría en una frase</b>${esc(q.concepto)}</div>`:""}
    <div class="blk"><h3>Explicación</h3><ul class="pts">${pts}</ul></div>
    <div class="tip"><b>Truco para el examen</b>${esc(q.clave)}</div>
    ${q.fuente?`<p class="src">Para repasarlo: <b>sección ${esc(q.fuente)}</b> del programa oficial CTFL v4.0.1.</p>`:""}</div>`;
}
function verdictHTML(q, order, sel){
  const ok=isRight(q,sel), L=ks=>ks.map(k=>letterOf(order,k)).join(" y ");
  return `<div class="verdict ${ok?"ok":"bad"}"><span class="ico" aria-hidden="true">${ok?"✓":"✗"}</span>

}

/* ---------- Práctica ---------- */
function pickNext(){
  const pr=S.pr;
  let pool = pr.pool ? pr.pool.map(id=>byId[id]).filter(Boolean) : BANCO.filter(q=>!pr.cap || q.cap===pr.cap);
  if(pr.pool && pr.poolLeft){ pool = pr.poolLeft.map(id=>byId[id]); }
  if(!pool.length) return null;
  let cand = pool.filter(q=>q.id!==pr.last);
  if(!cand.length) cand=pool;
  if(pr.orden==="nuevas"){
    const unseen=cand.filter(q=>!S.prog[q.id]);
    if(unseen.length) cand=unseen;
    else { // las peor llevadas primero
      const score=q=>{const p=S.prog[q.id];return p.aciertos/p.intentos};
      const min=Math.min(...cand.map(score)); cand=cand.filter(q=>score(q)===min);
    }
  }
  return cand[Math.floor(Math.random()*cand.length)];
}
function newPracticeQ(){
  const q=pickNext(); const pr=S.pr;
  pr.q=q; pr.sel=[]; pr.done=false; pr.order=q?shuffle(Object.keys(q.opciones)):null;
  if(pr.askCtl){pr.askCtl.abort();pr.askCtl=null}
}
function renderPractice(app){
  const pr=S.pr;
  if(!pr.q) newPracticeQ();
  const seen=Object.keys(S.prog).length;
  const tot=Object.values(S.prog).reduce((a,p)=>[a[0]+p.aciertos,a[1]+p.intentos],[0,0]);
  const caps=[0,1,2,3,4,5,6].map(c=>`<button class="chip" data-cap="${c}" aria-pressed="${!pr.pool && pr.cap===c}">${c?("Cap. "+c):"Todo el temario"}</button>`).join("");
  let head;
  if(pr.pool){
    head=`<div class="row"><span class="pill bad">Repaso de falladas</span><span class="muted">${pr.poolLeft.length} pendientes en esta tanda</span><button class="btn ghost small" id="exitPool">Volver a todo el temario</button></div>`;
  } else {
    head=`<div class="row">${caps}</div>
    <div class="row muted" style="font-size:.9rem">Orden:
      <button class="chip" data-ord="nuevas" aria-pressed="${pr.orden==="nuevas"}">Nuevas primero</button>
      <button class="chip" data-ord="azar" aria-pressed="${pr.orden==="azar"}">Al azar</button>
      <span style="margin-left:auto" class="mono">${seen}/${BANCO.length} vistas · ${pct(tot[0],tot[1])} % de acierto</span></div>`;
  }
  const q=pr.q;
  if(!q){ app.innerHTML=head+`<div class="empty">No quedan preguntas en esta tanda. <button class="btn small" id="exitPool2">Volver a practicar</button></div>`; bindPracticeHead(); const b=$("#exitPool2"); if(b) b.onclick=()=>{pr.pool=null;pr.poolLeft=null;newPracticeQ();render()}; return; }
  const need=q.correcta.length;
  let body = `<section class="sheet" aria-live="polite">${qHead(q)}${pr.done?verdictHTML(q,pr.order,pr.sel):""}${optsHTML(q,pr.order,pr.sel,pr.done,pr.sel)}`;
  if(!pr.done){
    body+=`<div class="row"><button class="btn" id="check" ${pr.sel.length!==need?"disabled":""}>Comprobar</button><span class="muted" style="font-size:.85rem">Teclas <kbd>A</kbd>–<kbd>${LET[pr.order.length-1]}</kbd> para elegir · <kbd>Enter</kbd> para comprobar</span></div>`;
  } else {
    body+=explHTML(q);
    body+=askHTML();
    body+=programaHTML(q.fuente);
    body+=`<div class="row"><button class="btn" id="next">Siguiente pregunta</button><span class="muted" style="font-size:.85rem"><kbd>Enter</kbd></span></div>`;
  }
  body+=`</section><p class="save" id="saveInfo"></p>`;
  app.innerHTML=head+body; saveLabel();
  bindPracticeHead();
  app.querySelectorAll(".opt").forEach(b=>b.addEventListener("click",()=>toggleSel(b.dataset.key)));
  const c=$("#check"); if(c) c.onclick=checkPractice;
  const n=$("#next"); if(n) n.onclick=nextPractice;
  bindAsk(q, pr.order, pr.sel);
}
function bindPracticeHead(){
  const pr=S.pr;
  document.querySelectorAll("[data-cap]").forEach(b=>b.onclick=()=>{pr.cap=+b.dataset.cap;pr.last=null;newPracticeQ();render()});
  document.querySelectorAll("[data-ord]").forEach(b=>b.onclick=()=>{pr.orden=b.dataset.ord;render()});
  const e=$("#exitPool"); if(e) e.onclick=()=>{pr.pool=null;pr.poolLeft=null;newPracticeQ();render()};
}
function toggleSel(key){
  const pr=S.pr; if(pr.done) return; const need=pr.q.correcta.length;
  if(need===1) pr.sel=[key];
  else pr.sel = pr.sel.includes(key) ? pr.sel.filter(k=>k!==key) : (pr.sel.length<need ? [...pr.sel,key] : [pr.sel[1],key]);
  render();
}
function checkPractice(){
  const pr=S.pr; if(pr.done || pr.sel.length!==pr.q.correcta.length) return;
  pr.done=true; const ok=isRight(pr.q,pr.sel);
  recordAnswer(pr.q, ok, pr.sel);
  if(pr.pool && ok) pr.poolLeft=pr.poolLeft.filter(id=>id!==pr.q.id);
  render();
}
function nextPractice(){ S.pr.last=S.pr.q.id; newPracticeQ(); render(); window.scrollTo({top:0}); }
document.addEventListener("keydown",e=>{
  if(S.view!=="practicar" || !S.pr.q) return;
  if(e.target.closest("textarea,input,summary,a")) return;
  const k=e.key.toUpperCase(); const i=LET.indexOf(k);
  if(i>=0 && i<S.pr.order.length && !S.pr.done){ e.preventDefault(); toggleSel(S.pr.order[i]); }
  else if(e.key==="Enter"){ e.preventDefault(); S.pr.done?nextPractice():checkPractice(); }
});

/* ---------- Pregúntale a Claude ---------- */
function askHTML(){
  if(!S.sample) return "";
  return `<div class="ask"><h3>¿Te queda alguna duda?</h3>
  <p class="muted" style="font-size:.9rem">Pregunta lo que no te haya quedado claro sobre esta pregunta y te lo explico con otro enfoque.</p>
  <textarea id="askTxt" placeholder="Por ejemplo: no entiendo por qué la C no vale"></textarea>
  <div class="row"><button class="btn small" id="askBtn">Preguntar</button><button class="btn ghost small" id="askAlt">Explícamelo con un ejemplo</button><button class="btn ghost small" id="askStop" hidden>Parar</button></div>
  <div class="answer" id="askOut"></div></div>`;
}
function md(t){
  const lines=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").split(/\n/);
  let h="",list=null;
  const close=()=>{ if(list){h+=`</${list}>`;list=null} };
  for(const l of lines){
    let m;
    if((m=l.match(/^\s*#{1,6}\s+(.+)$/))){ close(); h+="<h4>"+m[1].replace(/<\/?b>/g,"")+"</h4>"; }
    else if((m=l.match(/^\s*[-•*]\s+(.+)$/))){ if(list!=="ul"){close();h+="<ul>";list="ul"} h+="<li>"+m[1]+"</li>"; }
    else if((m=l.match(/^\s*\d+[.)]\s+(.+)$/))){ if(list!=="ol"){close();h+="<ol>";list="ol"} h+="<li>"+m[1]+"</li>"; }
    else { close(); if(l.trim()) h+="<p>"+l+"</p>"; }
  }
  close(); return h;
}
function bindAsk(q, order, sel){
  const btn=$("#askBtn"); if(!btn) return;
  const out=$("#askOut"), stop=$("#askStop"), txt=$("#askTxt");
  const run=async(pregunta)=>{
    const opts=order.map((k,i)=>`${LET[i]}) ${q.opciones[k]}`).join("\n");
    const prompt=`Eres un tutor experto en la certificación ISTQB Certified Tester Foundation Level (CTFL) v4.0. Respondes en español de España, con la terminología del programa de estudio en español (SSTQB). El alumno aprende practicando: acaba de contestar una pregunta de examen y quiere entenderla mejor.

PREGUNTA (capítulo ${q.cap}, ${q.lo}, nivel ${q.k}):
${q.pregunta}${q.anexo?"\n"+q.anexo:""}${q.pregunta2?"\n"+q.pregunta2:""}

OPCIONES:
${opts}

RESPUESTA CORRECTA: ${q.correcta.map(k=>letterOf(order,k)).join(" y ")}
RESPUESTA DEL ALUMNO: ${sel.map(k=>letterOf(order,k)).join(" y ")} (${isRight(q,sel)?"acertó":"falló"})
EXPLICACIÓN DE REFERENCIA: ${q.concepto?q.concepto+" ":""}${[].concat(q.explicacion).join(" ")}

DUDA DEL ALUMNO: ${pregunta}

Responde a su duda ciñéndote al programa CTFL v4.0, en 120-220 palabras. Al alumno le cuesta leer párrafos largos: estructura SIEMPRE la respuesta con estos apartados, en este orden, usando exactamente este formato de texto plano:

### En una frase
(una sola frase con la idea clave que responde a su duda)

### Por qué
- (2 a 4 viñetas cortas, máximo 20 palabras cada una)

### Ejemplo
- (un ejemplo práctico y cotidiano en 1 a 3 viñetas)
${isRight(q,sel)?"":`
### Tu error
- (qué confusión probable le llevó a elegir su opción, en 1 o 2 viñetas)
`}
### Para el examen
(una frase con el truco para reconocer este tipo de pregunta)

Reglas: nunca escribas más de 2 frases seguidas sin cambiar de viñeta o apartado. Usa **negrita** solo para los términos del programa. No añadas introducciones ni despedidas.`;
    const ctl=new AbortController(); S.pr.askCtl=ctl;
    btn.disabled=true; $("#askAlt").disabled=true; stop.hidden=false; out.innerHTML=`<p class="muted">Pensando…</p>`;
    stop.onclick=()=>ctl.abort();
    try{
      await S.sample(prompt,{signal:ctl.signal,onText:({text})=>{out.innerHTML=md(text)}});
    }catch(e){
      if(e && e.text) out.innerHTML=md(e.text); else if(!e || e.code!=="cancelled") out.innerHTML="";
      if(e && (e.code==="not_granted"||e.code==="sampling_disabled"||e.code==="not_declared")){ out.innerHTML=`<p class="muted">Las preguntas a Claude no están disponibles en esta vista. Puedes preguntarme en el chat.</p>`; }
      else if(e && e.code==="rate_limited"){ out.innerHTML+=`<p class="muted">Demasiadas preguntas seguidas. Prueba de nuevo dentro de un rato.</p>`; }
      else if(e && e.code!=="cancelled"){ out.innerHTML+=`<p class="muted">No se ha podido completar la respuesta. Vuelve a intentarlo.</p>`; }
    }finally{ btn.disabled=false; const a=$("#askAlt"); if(a) a.disabled=false; stop.hidden=true; }
  };
  btn.onclick=()=>{ const t=txt.value.trim(); if(t) run(t); else txt.focus(); };
  $("#askAlt").onclick=()=>run("Explícame esta pregunta con un ejemplo práctico distinto, y cómo reconocer este tipo de pregunta en el examen.");
}

/* ---------- Simulacro ---------- */
function buildSim(mins){
  const ids=[];
  for(const [cap,ks] of Object.entries(DIST)) for(const [k,n] of Object.entries(ks)){
    const pool=shuffle(BANCO.filter(q=>q.cap===+cap && q.k===k));
    // prioriza las menos vistas
    pool.sort((a,b)=>((S.prog[a.id]||{}).intentos||0)-((S.prog[b.id]||{}).intentos||0));
    ids.push(...pool.slice(0,n).map(q=>q.id));
  }
  ids.sort((a,b)=>byId[a].cap-byId[b].cap);
  return {ids, orders:Object.fromEntries(ids.map(id=>[id,shuffle(Object.keys(byId[id].opciones))])), ans:{}, flags:{}, cur:0, start:Date.now(), mins};
}
let tick=null;
function renderSim(app){
  if(S.simResult) return renderSimResult(app);
  if(!S.sim){ S.sim=lsGet("istqb.simDraft",null); }

  if(!sim){
    const last=S.sims[0];
    app.innerHTML=`<section class="sheet"><h2>Simulacro de examen</h2>
    <p>40 preguntas elegidas al azar con el mismo reparto por capítulo y nivel K que el examen oficial. Se aprueba con <b>26 puntos (65 %)</b>. Puedes moverte entre preguntas y marcarlas para revisar. Las explicaciones aparecen al entregar.</p>
    <div class="scroll"><table class="tbl"><thead><tr><th>Capítulo</th><th>Preguntas</th><th>K1 / K2 / K3</th></tr></thead><tbody>
    ${Object.entries(DIST).map(([c,k])=>`<tr><td>${c}. ${CAPS[c]}</td><td class="mono">${Object.values(k).reduce((a,b)=>a+b,0)}</td><td class="mono">${k.K1||0} / ${k.K2||0} / ${k.K3||0}</td></tr>`).join("")}
    </tbody></table></div>
    <div class="row"><button class="btn" data-min="60">Empezar · 60 min</button><button class="btn ghost" data-min="75">Empezar · 75 min (examen en un idioma no nativo)</button></div>
    ${last?`<p class="muted">Último simulacro: ${last.puntos}/40 · ${last.aprobado?"aprobado":"suspenso"} · ${new Date(last.fecha).toLocaleDateString("es-ES")}</p>`:""}
    </section>`;
    app.querySelectorAll("[data-min]").forEach(b=>b.onclick=()=>{S.sim=buildSim(+b.dataset.min);lsSet("istqb.simDraft",S.sim);render()});
    return;
  }
  const q=byId[sim.ids[sim.cur]], order=sim.orders[q.id], sel=sim.ans[q.id]||[];
  const answered=Object.values(sim.ans).filter(a=>a.length).length;
  app.innerHTML=`<div class="simhead"><div><h2 style="font-size:1.2rem">Pregunta ${sim.cur+1} de 40</h2><span class="muted">${answered} respondidas</span></div><div class="timer" id="timer"></div></div>
  <section class="sheet">${qHead(q)}${optsHTML(q,order,sel,false,[])}
  <div class="row"><button class="btn ghost small" id="prev" ${sim.cur===0?"disabled":""}>Anterior</button><button class="btn small" id="nxt" ${sim.cur===39?"disabled":""}>Siguiente</button>
  <button class="btn ghost small" id="flag">${sim.flags[q.id]?"Quitar marca":"Marcar para revisar"}</button></div></section>
  <section class="sheet"><div class="grid">${sim.ids.map((id,i)=>`<button class="cell ${(sim.ans[id]||[]).length?"done":""} ${i===sim.cur?"cur":""} ${sim.flags[id]?"flag":""}" data-i="${i}" aria-label="Pregunta ${i+1}">${i+1}</button>`).join("")}</div>
  <div class="row"><button class="btn" id="submit">Entregar examen</button><button class="btn ghost small" id="abandon">Abandonar</button><span class="muted" id="confirmTxt"></span></div></section>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const key=b.dataset.key, need=q.correcta.length; let s=sim.ans[q.id]||[];
    if(need===1) s=[key]; else s=s.includes(key)?s.filter(k=>k!==key):(s.length<need?[...s,key]:[s[1],key]);
    sim.ans[q.id]=s; lsSet("istqb.simDraft",sim); render();
  });
  $("#prev").onclick=()=>{sim.cur--;render()}; $("#nxt").onclick=()=>{sim.cur++;render()};
  $("#flag").onclick=()=>{sim.flags[q.id]=!sim.flags[q.id];lsSet("istqb.simDraft",sim);render()};
  app.querySelectorAll(".cell").forEach(b=>b.onclick=()=>{sim.cur=+b.dataset.i;render()});

  startTick();
}
function startTick(){
  clearInterval(tick);
  const upd=()=>{
    const sim=S.sim; const el=$("#timer"); if(!sim){clearInterval(tick);return}
    const rest=Math.max(0, sim.mins*60 - Math.floor((Date.now()-sim.start)/1000));
    if(el){ el.textContent=`${String(Math.floor(rest/60)).padStart(2,"0")}:${String(rest%60).padStart(2,"0")}`; el.classList.toggle("low",rest<300); }
    if(rest===0){ clearInterval(tick); finishSim(true); }
  };
  upd(); tick=setInterval(upd,1000);
}
async function finishSim(timeout){
  clearInterval(tick);
  const sim=S.sim; if(!sim) return;
  const porCap={}; let puntos=0; const respuestas=[];
  for(const id of sim.ids){
    const q=byId[id], sel=sim.ans[id]||[], ok=isRight(q,sel);
    if(ok) puntos++;
    porCap[q.cap]=porCap[q.cap]||{ok:0,total:0}; porCap[q.cap].total++; if(ok) porCap[q.cap].ok++;
    respuestas.push({qid:id,elegida:sel,ok});
  }
  const r={fecha:new Date().toISOString(),puntos,total:40,aprobado:puntos>=26,porCapitulo:porCap,duracionSeg:Math.min(sim.mins*60,Math.round((Date.now()-sim.start)/1000)),limiteMin:sim.mins,porTiempo:!!timeout,respuestas};
  S.simResult={...r, orders:sim.orders};
  S.sim=null; lsSet("istqb.simDraft",null);
  render();
  for(const a of respuestas){ if(a.elegida.length) await recordAnswer(byId[a.qid],a.ok,a.elegida); }

}

/* ---------- Progreso ---------- */
function renderProgress(app){
  const P=Object.values(S.prog);
  const tot=P.reduce((a,p)=>[a[0]+p.aciertos,a[1]+p.intentos],[0,0]);
  const firstTry=P.filter(p=>p.historial&&p.historial.length).map(p=>p.historial[p.historial.length-1]);
  const rows=Object.keys(CAPS).map(c=>{
    const qs=BANCO.filter(q=>q.cap===+c), ps=qs.map(q=>S.prog[q.id]).filter(Boolean);
    const a=ps.reduce((x,p)=>[x[0]+p.aciertos,x[1]+p.intentos],[0,0]);
    const ultimaOk=ps.filter(p=>p.ultimaCorrecta).length;
    return {c,total:qs.length,vistas:ps.length,acc:pct(a[0],a[1]),ultimaOk,intentos:a[1]};
  });
  const kr=["K1","K2","K3"].map(k=>{const ps=P.filter(p=>p.k===k);const a=ps.reduce((x,p)=>[x[0]+p.aciertos,x[1]+p.intentos],[0,0]);return {k,acc:pct(a[0],a[1]),n:a[1]}});
  const weak=rows.filter(r=>r.intentos>=3).sort((a,b)=>a.acc-b.acc)[0];
  const sims=S.sims;
  app.innerHTML=`<h2>Tu progreso</h2>
  <div class="stats">
    <div class="stat"><div class="v">${P.length}<span class="muted" style="font-size:1rem">/${BANCO.length}</span></div><div class="l">preguntas vistas</div></div>
    <div class="stat"><div class="v">${pct(tot[0],tot[1])} %</div><div class="l">acierto global (${tot[1]} respuestas)</div></div>
    <div class="stat"><div class="v">${pct(firstTry.filter(Boolean).length,firstTry.length)} %</div><div class="l">acierto en la última respuesta de cada pregunta</div></div>
    <div class="stat"><div class="v">${sims.length?Math.max(...sims.map(s=>s.puntos)):"—"}</div><div class="l">mejor simulacro (de 40)</div></div>
  </div>
  ${weak&&weak.acc<65?`<div class="tip"><b>Dónde reforzar</b>El capítulo ${weak.c} (${CAPS[weak.c]}) va al ${weak.acc} %. Practica ese capítulo hasta superar el 65 %.</div>`:""}
  <section class="sheet"><h3>Por capítulo</h3><div class="scroll"><table class="tbl"><thead><tr><th>Capítulo</th><th>Vistas</th><th>Acierto</th><th style="width:30%"></th></tr></thead><tbody>
  ${rows.map(r=>`<tr><td>${r.c}. ${CAPS[r.c]}</td><td class="mono">${r.vistas}/${r.total}</td><td class="mono">${r.intentos?r.acc+" %":"—"}</td><td><div class="meter ${!r.intentos?"":r.acc>=65?"ok":r.acc>=50?"warn":"bad"}"><i style="width:${r.intentos?r.acc:0}%"></i></div></td></tr>`).join("")}
  </tbody></table></div>
  <div class="row mono" style="font-size:.85rem">${kr.map(x=>`<span><span class="k">${x.k}</span> ${x.n?x.acc+" %":"—"}</span>`).join(" · ")}</div></section>
  <section class="sheet"><h3>Simulacros</h3>${sims.length?`<div class="scroll"><table class="tbl"><thead><tr><th>Fecha</th><th>Nota</th><th>Resultado</th><th>Tiempo</th></tr></thead><tbody>
  ${sims.map(s=>`<tr><td>${new Date(s.fecha).toLocaleString("es-ES",{dateStyle:"medium",timeStyle:"short"})}</td><td class="mono">${s.puntos}/40</td><td><span class="pill ${s.aprobado?"ok":"bad"}">${s.aprobado?"Aprobado":"Suspenso"}</span></td><td class="mono">${Math.round(s.duracionSeg/60)} / ${s.limiteMin} min</td></tr>`).join("")}
  </tbody></table></div>`:`<p class="muted">Aún no has hecho ningún simulacro. Cuando aciertes más del 70 % en práctica, prueba uno.</p>`}</section>
  <p class="save" id="saveInfo"></p>`;
  saveLabel();
}

/* ---------- Arranque ---------- */
const h=(location.hash||"").slice(1); if(VIEWS.includes(h)) S.view=h;
render();
initStore();
if(window.claude) window.claude.use("sample").then(s=>{ if(s){ S.sample=s; if(S.view==="practicar"&&S.pr.done) render(); } }).catch(()=>{});
</script>
