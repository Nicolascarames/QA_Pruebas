ase de prueba","en":"test basis","definicion":"Conjunto de conocimientos utilizados como base para el análisis y diseño de una prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/base-de-prueba/2"},{"es":"caso de prueba","en":"test case","definicion":"Conjunto de precondiciones, entradas, acciones (cuando proceda), resultados esperados y postcondiciones, desarrollado conforme a las condiciones de prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/caso-de-prueba/2"},{"es":"compleción de la prueba","en":"test completion","definicion":"Actividad que hace que los productos de prueba estén disponibles para un uso posterior, deja los entornos de prueba en condiciones satisfactorias y comunica los resultados de la prueba a los implicados relevantes.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/complecion-de-prueba/2","variantes":["compleción de prueba"]},{"es":"condición de prueba","en":"test condition","definicion":"Aspecto que puede ser objeto de prueba de un componente o sistema.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/condicion-de-prueba/4"},{"es":"control de la prueba","en":"test control","definicion":"Actividad que desarrolla y aplica acciones correctivas para encauzar un proyecto de prueba cuando se desvía de lo previsto.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/control-de-prueba/2","variantes":["control de prueba"]},{"es":"datos de prueba","en":"test data","definicion":"Datos necesarios para la ejecución de una prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/datos-de-prueba/3"},{"es":"diseño de la prueba","en":"test design","definicion":"Actividad que obtiene y especifica los casos de prueba a partir de las condiciones de prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/diseno-de-prueba/3","variantes":["diseño de prueba"]},{"es":"ejecución de prueba","en":"test execution","definicion":"Actividad que ejecuta una prueba sobre un componente o sistema que genera resultados reales.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/ejecucion-de-prueba/2"},{"es":"implementación de prueba","en":"test implementation","definicion":"Actividad que prepara los productos de prueba necesarios para la ejecución de la prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/implementacion-de-prueba/3"},{"es":"monitorización de la prueba","en":"test monitoring","definicion":"Actividad que registra el estado de las actividades de prueba, identifica las desviaciones con respecto a lo previsto o esperado e informa del estado a los implicados.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/monitorizacion-de-prueba/3","variantes":["monitorización de prueba"]},{"es":"objeto de prueba","en":"test object","definicion":"Producto de trabajo al que se va a someter a prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/objeto-de-prueba/2"},{"es":"objetivo de prueba","en":"test objective","definicion":"Propósito de la prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/objetivo-de-prueba/3"},{"es":"planificación de prueba","en":"test planning","definicion":"Actividad consistente en establecer o actualizar un plan de prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/planificacion-de-prueba/1"},{"es":"procedimiento de prueba","en":"test procedure","definicion":"Secuencia de casos de prueba en orden de ejecución, y cualquier acción asociada que pueda ser necesaria para establecer las precondiciones iniciales y cualquier actividad de cierre posterior a la ejecución.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/procedimiento-de-prueba/1"},{"es":"resultado de prueba","en":"test result","definicion":"Estado de la ejecución de una prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/resultado-de-prueba/2"},{"es":"prueba","en":"testing","definicion":"Proceso dentro del ciclo de vida de desarrollo del software que evalúa la calidad de un componente o sistema y de los productos de trabajo relacionados.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba/3"},{"es":"producto de prueba","en":"testware","definicion":"Productos de trabajo producidos durante el proceso de prueba para su uso en la planificación, diseño, ejecución, evaluación y suministro de información sobre la prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/producto-de-prueba/2"},{"es":"prueba de aceptación","en":"acceptance testing","definicion":"Nivel de prueba que se concentra en determinar si se acepta el sistema.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-aceptacion/2"},{"es":"prueba de caja negra","en":"black-box testing","definicion":"Enfoque de prueba basado en la especificación de un componente o sistema.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-caja-negra/3"},{"es":"prueba de integración de componentes","en":"component integration testing","definicion":"La prueba de integración de componentes.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-integracion-de-componentes/3"},{"es":"prueba de componentes","en":"component testing","definicion":"Un nivel de prueba que se concentra en componentes hardware o software individuales.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-componente/3","variantes":["prueba de componente"]},{"es":"prueba de confirmación","en":"confirmation testing","definicion":"Un tipo de prueba relacionada con el cambio que se realiza después de corregir un defecto para confirmar que el fallo causado por ese defecto no se vuelve a producir.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-confirmacion/3"},{"es":"prueba funcional","en":"functional testing","definicion":"Un tipo de prueba destinado a determinar la adecuación funcional de un objeto de prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-funcional/4"},{"es":"prueba de integración","en":"integration testing","definicion":"Nivel de prueba que se concentra en las interacciones entre componentes o sistemas.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-integracion/2"},{"es":"prueba de mantenimiento","en":"maintenance testing","definicion":"Prueba de los cambios en un sistema operativo o del impacto de un entorno modificado en un sistema operativo.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-mantenimiento/1"},{"es":"prueba no funcional","en":"non-functional testing","definicion":"Prueba realizada para evaluar si un componente o sistema cumple los requisitos no funcionales.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-no-funcional/3"},{"es":"prueba de regresión","en":"regression testing","definicion":"Tipo de prueba relacionada con el cambio para detectar si se han introducido o descubierto defectos en zonas no modificadas del software.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-regresion/3"},{"es":"desplazamiento a la izquierda","en":"shift-left","definicion":"Un enfoque para realizar actividades de prueba y aseguramiento de la calidad tan pronto como sea posible en el ciclo de vida del desarrollo de software.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/desplazamiento-a-la-izquierda/1"},{"es":"prueba de integración de sistemas","en":"system integration testing","definicion":"La prueba de integración de sistemas.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-integracion-de-sistemas/4"},{"es":"prueba de sistema","en":"system testing","definicion":"Nivel de prueba que se concentra en verificar que un sistema como un todo cumple los requisitos especificados.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-sistema/2"},{"es":"nivel de prueba","en":"test level","definicion":"Instancia específica de un proceso de prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/nivel-de-prueba/2"},{"es":"tipo de prueba","en":"test type","definicion":"Conjunto de actividades de prueba basadas en objetivos de prueba específicos dirigidos a características concretas de un componente o sistema.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/tipo-de-prueba/2"},{"es":"prueba de caja blanca","en":"white-box testing","definicion":"Enfoque de prueba basado en la estructura interna de un componente o sistema.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-caja-blanca/2"},{"es":"anomalía","en":"anomaly","definicion":"Condición que se desvía de lo esperado.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/anomalia/1"},{"es":"prueba dinámica","en":"dynamic testing","definicion":"Prueba que implica la ejecución del elemento de prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-dinamica/2"},{"es":"revisión formal","en":"formal review","definicion":"Revisión que sigue un proceso definido con una salida formalmente documentada.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/revision-formal/2"},{"es":"revisión informal","en":"informal review","definicion":"Tipo de revisión que no sigue un proceso definido y no tiene una salida formalmente documentada.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/revision-informal/3"},{"es":"inspección","en":"inspection","definicion":"Tipo de revisión formal que utiliza roles de equipo definidos y mediciones para identificar defectos en un producto de trabajo, mejorar el proceso de revisión y el proceso de desarrollo de software.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/inspeccion/3"},{"es":"revisión","en":"review","definicion":"Tipo de prueba estática en la que la calidad de un producto de trabajo o proceso es evaluada por personas.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/revision/4"},{"es":"análisis estático","en":"static analysis","definicion":"Proceso de evaluación de un componente o sistema sin ejecutarlo, basado en su forma, estructura, contenido o documentación.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/analisis-estatico/2"},{"es":"prueba estática","en":"static testing","definicion":"Prueba de un producto de trabajo sin que se ejecute el código del producto de trabajo.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-estatica/4"},{"es":"revisión técnica","en":"technical review","definicion":"Revisión formal realizada por expertos técnicos que examinan la calidad de un producto de trabajo e identifican las discrepancias respecto de especificaciones y estándares.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/revision-tecnica/3"},{"es":"revisión guiada","en":"walkthrough","definicion":"Tipo de revisión en la que un autor guía a los miembros de la revisión a través de un producto de trabajo y los miembros hacen preguntas y comentarios sobre posibles problemas.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/revision-guiada/3"},{"es":"criterios de aceptación","en":"acceptance criteria","definicion":"Criterios que debe satisfacer un producto del trabajo para ser aceptado por los implicados.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/criterios-de-aceptacion/3"},{"es":"desarrollo guiado por prueba de aceptación","en":"acceptance test-driven development","definicion":"Enfoque de \"probar primero\" basado en la colaboración que define las pruebas de aceptación en el lenguaje del dominio de los implicados.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/desarrollo-guiado-por-prueba-de-aceptacion/1"},{"es":"técnica de prueba de caja negra","en":"black-box test technique","definicion":"Técnica de prueba basada en un análisis de la especificación de un componente o sistema.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/tecnica-de-prueba-de-caja-negra/3"},{"es":"análisis del valor frontera","en":"boundary value analysis","definicion":"Técnica de prueba de caja negra en la que las condiciones de prueba son valores frontera.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/analisis-del-valor-frontera/3"},{"es":"cobertura de rama","en":"branch coverage","definicion":"Cobertura de ramas en un grafo del flujo de control.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/cobertura-de-rama/2"},{"es":"prueba basada en lista de comprobación","en":"checklist-based testing","definicion":"Técnica de prueba basada en la experiencia en la que se diseñan casos de prueba para practicar los elementos de una lista de comprobación.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-basada-en-lista-de-comprobacion/3"},{"es":"enfoque de prueba basado en la colaboración","en":"collaboration-based test approach","definicion":"Enfoque de prueba que se centra en evitar defectos mediante la colaboración entre implicados.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/enfoque-de-prueba-basado-en-la-colaboracion/1"},{"es":"elemento de cobertura","en":"coverage item","definicion":"Atributo o combinación de atributos procedentes de una o varias condiciones de prueba al utilizar una técnica de prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/elemento-de-cobertura/2"},{"es":"prueba de tabla de decisión","en":"decision table testing","definicion":"Técnica de prueba de caja negra en la que las condiciones de prueba son las combinaciones de condiciones y las acciones resultantes que se muestran en una tabla de decisión.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-tabla-de-decision/4"},{"es":"partición de equivalencia","en":"equivalence partitioning","definicion":"Técnica de prueba de caja negra en la que las condiciones de prueba son particiones de equivalencia practicadas por un miembro representante de cada partición.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/particion-de-equivalencia-1/3"},{"es":"predicción de errores","en":"error guessing","definicion":"Técnica de prueba en la que las condiciones de prueba se basan en el conocimiento que tiene el probador de fallos o modos de fallo ocurridos en el pasado.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prediccion-de-errores/3"},{"es":"técnica de prueba basada en la experiencia","en":"experience-based test technique","definicion":"Técnica de prueba basada en la experiencia, los conocimientos y la intuición del probador.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/tecnica-de-prueba-basada-en-la-experiencia/4"},{"es":"prueba exploratoria","en":"exploratory testing","definicion":"Enfoque de prueba en el que las pruebas se diseñan y ejecutan dinámicamente basándose en los conocimientos del probador, la exploración de un elemento de prueba y los resultados de pruebas anteriores.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-exploratoria/4"},{"es":"prueba de transición de estado","en":"state transition testing","definicion":"Técnica de prueba de caja negra en la que se practican casos de prueba para practicar elementos de un modelo de transición de estado.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-de-transicion-de-estado/3"},{"es":"cobertura de sentencia","en":"statement coverage","definicion":"Cobertura de las sentencias fuente ejecutables.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/cobertura-de-sentencia/3"},{"es":"técnica de prueba","en":"test technique","definicion":"Procedimiento utilizado para definir las condiciones de prueba, diseñar casos de prueba y especificar datos de prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/tecnica-de-prueba/3"},{"es":"técnica de prueba de caja blanca","en":"white-box test technique","definicion":"Técnica de prueba basada únicamente en la estructura interna de un componente o sistema.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/tecnica-de-prueba-de-caja-blanca/3"},{"es":"gestión de defectos","en":"defect management","definicion":"Proceso de reconocimiento, registro, clasificación, investigación, reparación y eliminación de defectos.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/gestion-de-defectos/4"},{"es":"informe de defecto","en":"defect report","definicion":"Documentación de la ocurrencia, naturaleza y estado de un defecto.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/informe-de-defecto/2"},{"es":"criterios de entrada","en":"entry criteria","definicion":"Conjunto de condiciones para iniciar oficialmente una tarea definida.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/criterios-de-entrada/2"},{"es":"criterios de salida","en":"exit criteria","definicion":"Conjunto de condiciones para completar formalmente una tarea definida.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/criterios-de-salida/2"},{"es":"riesgo de producto","en":"product risk","definicion":"Riesgo que impacta la calidad de un producto.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/riesgo-de-producto/2"},{"es":"riesgo de proyecto","en":"project risk","definicion":"Riesgo que impacta el éxito de un proyecto.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/riesgo-de-proyecto/2"},{"es":"riesgo","en":"risk","definicion":"Factor que podría dar lugar a consecuencias negativas futuras.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/riesgo/1"},{"es":"análisis del riesgo","en":"risk analysis","definicion":"Proceso global de identificación del riesgo y evaluación del riesgo.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/analisis-del-riesgo/2"},{"es":"evaluación del riesgo","en":"risk assessment","definicion":"Proceso para analizar los riesgos identificados y determinar el nivel de riesgo.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/evaluacion-del-riesgo/2"},{"es":"control del riesgo","en":"risk control","definicion":"Proceso global de mitigación del riesgo y monitorización del riesgo.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/control-del-riesgo/1"},{"es":"identificación del riesgo","en":"risk identification","definicion":"Proceso de hallazgo, reconocimiento y descripción de riesgos.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/identificacion-del-riesgo/2"},{"es":"nivel de riesgo","en":"risk level","definicion":"Medición de un riesgo definida por el impacto y la probabilidad.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/nivel-de-riesgo/2"},{"es":"gestión del riesgo","en":"risk management","definicion":"Proceso para gestionar riesgos.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/gestion-del-riesgo/3"},{"es":"mitigación del riesgo","en":"risk mitigation","definicion":"Proceso mediante el cual se toman decisiones y se implementan medidas de protección para reducir o mantener los riesgos a niveles especificados.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/mitigacion-del-riesgo/2"},{"es":"monitorización del riesgo","en":"risk monitoring","definicion":"Actividad que comprueba e informa del estado de los riesgos conocidos a los implicados.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/monitorizacion-del-riesgo/1"},{"es":"pruebas basadas en el riesgo","en":"risk-based testing","definicion":"Enfoque de prueba en el que la gestión, selección, priorización y uso de las actividades y recursos de la prueba se basan en los tipos y niveles de riesgo correspondientes.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/prueba-basada-en-el-riesgo/3","variantes":["prueba basada en el riesgo"]},{"es":"enfoque de prueba","en":"test approach","definicion":"Forma de implementar las tareas de prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/enfoque-de-prueba/3"},{"es":"informe de compleción de la prueba","en":"test completion report","definicion":"Tipo de informe de prueba elaborado en los hitos de compleción que proporciona una evaluación de los elementos de prueba correspondientes en función de los criterios de salida.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/informe-de-complecion-de-prueba/3","variantes":["informe de compleción de prueba"]},{"es":"plan de prueba","en":"test plan","definicion":"Documentación en la que se describen los objetivos de la prueba, los medios y el calendario para llevar a cabo la coordinación de la misma.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/plan-de-prueba/3"},{"es":"informe del avance de la prueba","en":"test progress report","definicion":"Tipo de informe de prueba periódico que incluye el avance de las actividades de prueba con respecto a una línea base, los riesgos y las alternativas que requieren una decisión.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/informe-del-avance-de-la-prueba/4"},{"es":"pirámide de prueba","en":"test pyramid","definicion":"Modelo gráfico que representa la relación de la cantidad de pruebas por nivel, con más cantidad en la parte inferior que en la superior.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/piramide-de-prueba/1"},{"es":"cuadrantes de prueba","en":"testing quadrants","definicion":"Modelo de clasificación de los tipos/niveles de prueba en cuatro cuadrantes, que los relaciona con dos dimensiones de los objetivos de prueba: el apoyo al equipo frente a la crítica al producto, y la orientación a la tecnología frente a la orientación al negocio","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/cuadrantes-de-prueba/1"},{"es":"automatización de la prueba","en":"test automation","definicion":"Conversión de las actividades de prueba en operaciones automáticas.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/automatizacion-de-prueba/3","variantes":["automatización de prueba"]},{"es":"proceso de prueba","en":"test process","definicion":"Conjunto de actividades de prueba realizadas para alcanzar un objetivo de prueba.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/proceso-de-prueba/3"},{"es":"trazabilidad","en":"traceability","definicion":"Capacidad de establecer relaciones explícitas entre productos de trabajo relacionados o elementos dentro de productos de trabajo.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/trazabilidad/3"},{"es":"estrategia de prueba","en":"test strategy","definicion":"Descripción de cómo realizar la prueba para alcanzar los objetivos de prueba en unas circunstancias determinadas.","fuente":"glosario ISTQB (es) · https://glossary.istqb.org/es_ES/term/estrategia-de-prueba/4"}],"diferencias":[{"id":"1","tipo":"v4.0.1","importancia":"baja","es":"procedimiento de prueba test procedure resultado de prueba test result prueba testing producto de prueba testware","en":"test procedure, test process, test result, testing, testware, traceability","en_es":"procedimiento de prueba, proceso de prueba, resultado de prueba, prueba, producto de prueba, trazabilidad","resumen":"Se añadieron dos palabras clave al capítulo 1, «test process» (proceso de prueba) y «traceability» (trazabilidad), que no figuran en la lista española."},{"id":"1.1.2","tipo":"v4.0.1","importancia":"alta","es":"Diagnóstico (hallazgo de la causa raíz).","en":"Diagnosis (finding the defect)","en_es":"Diagnóstico (hallazgo del defecto)","resumen":"El diagnóstico consiste en encontrar el defecto, no la causa raíz, y el último paso es corregir el defecto, no la causa."},{"id":"1.2.2","tipo":"v4.0.1","importancia":"media","es":"El CC es un enfoque correctivo orientado al producto que se concentra en aquellas actividades que contribuyen a la consecución de unos niveles de calidad adecuados.","en":"Testing is a product-oriented, corrective approach that focuses on those activities supporting the achievement of appropriate levels of quality.","en_es":"La prueba es un enfoque correctivo orientado al producto que se concentra en aquellas actividades que contribuyen a la consecución de unos niveles de calidad adecuados.","resumen":"Este apartado compara el AC con la prueba, no con el control de la calidad (CC): el enfoque correctivo orientado al producto se atribuye a la prueba."},{"id":"1.4.3","tipo":"v4.0.1","importancia":"baja","es":"procedimientos de prueba, guiones de prueba automatizados, juegos de prueba","en":"test procedures, manual and automated test scripts, test suites","en_es":"procedimientos de prueba, guiones de prueba manuales y automatizados, juegos de prueba","resumen":"Los productos de implementación de la prueba incluyen guiones de prueba manuales y automatizados, no solo automatizados."},{"id":"1.5.3","tipo":"traducción","importancia":"baja","es":"que el equipo de pruebas realice las pruebas de integración de sistemas y sistemas","en":"test team performing system and system integration testing","en_es":"el equipo de pruebas realiza la prueba de sistema y la prueba de integración de sistemas","resumen":"Se tradujo «system and system integration testing» como «integración de sistemas y sistemas»; son dos niveles: prueba de sistema y prueba de integración de sistemas."},{"id":"2","tipo":"traducción","importancia":"media","es":"prueba no funcional non-functional testing prueba no funcional regression testing","en":"non-functional testing, regression testing","en_es":"prueba no funcional, prueba de regresión","resumen":"En la tabla de palabras clave «regression testing» aparece como «prueba no funcional», repetida de la fila anterior; debería ser «prueba de regresión»."},{"id":"2.1.3","tipo":"v4.0.1","importancia":"baja","es":"A continuación, los casos de prueba se traducen automáticamente en pruebas ejecutables.","en":"Test cases should then automatically be translated into executable tests","en_es":"A continuación, los casos de prueba deberían traducirse automáticamente en pruebas ejecutables.","resumen":"En BDD la traducción automática de los casos de prueba es una recomendación («deberían»), no algo que ocurra siempre."},{"id":"2.1.4","tipo":"v4.0.1","importancia":"baja","es":"(por ejemplo, rendimiento, fiabilidad)","en":"(e.g., performance efficiency, reliability)","en_es":"(por ejemplo, eficiencia de desempeño, fiabilidad)","resumen":"Se usa el nombre de característica ISO 25010 «eficiencia de desempeño» en lugar de «rendimiento»."},{"id":"2.1.4","tipo":"traducción","importancia":"baja","es":"La tubería3 de entrega DevOps debe ser definida y establecida.","en":"The DevOps delivery pipeline must be defined and established","en_es":"El canal de entrega DevOps debe definirse y establecerse","resumen":"«Tubería» lleva una nota del traductor sin resolver («Buscar/Confirmar traducción del término») y en el mismo apartado se dice «canal de entrega»; el término no es coherente."},{"id":"2.1.5","tipo":"v4.0.1","importancia":"baja","es":"Revisión de la especificación desde la perspectiva de la prueba.","en":"Reviewing the specification from the perspective of testers.","en_es":"Revisión de la especificación desde la perspectiva de los probadores.","resumen":"La revisión de la especificación se hace desde la perspectiva de los probadores, no «de la prueba»."},{"id":"2.1.6","tipo":"v4.0.1","importancia":"baja","es":"(también conocidas como \"reuniones post proyecto\" y retrospectivas de proyecto)","en":"Retrospectives are often held at the end of a project or an iteration, at a release milestone, or can be held when needed.","en_es":"Las retrospectivas suelen celebrarse al final de un proyecto o de una iteración, en un hito de entrega, o pueden celebrarse cuando se necesiten.","resumen":"Se eliminó la aclaración «también conocidas como reuniones post proyecto»; la versión inglesa ya no la incluye."},{"id":"2.2.2","tipo":"v4.0.1","importancia":"alta","es":"Usabilidad. - Fiabilidad. - Seguridad. - Mantenibilidad. - Portabilidad.","en":"Usability (also known as interaction capability) • Reliability • Security • Maintainability • Portability (also known as flexibility) • Safety","en_es":"Usabilidad (también conocida como capacidad de interacción) • Fiabilidad • Seguridad • Mantenibilidad • Portabilidad (también conocida como flexibilidad) • Seguridad funcional (safety)","resumen":"La lista ISO 25010 pasa a ocho características: se añade «Safety» (seguridad funcional) y usabilidad/portabilidad reciben los nombres nuevos «capacidad de interacción»/«flexibilidad»."},{"id":"2.2.2","tipo":"v4.0.1","importancia":"media","es":"se basa en la especificación y obtiene pruebas a partir de documentación externa al objeto de prueba.","en":"is specification-based and derives tests from documentation not related to the internal structure of the test object.","en_es":"se basa en la especificación y obtiene pruebas a partir de documentación no relacionada con la estructura interna del objeto de prueba.","resumen":"La base de la prueba de caja negra es la documentación no relacionada con la estructura interna del objeto de prueba, no la «externa al objeto»."},{"id":"2.2.2","tipo":"v4.0.1","importancia":"baja","es":"(por ejemplo, como parte de las revisiones y prueba de componente o prueba de sistema)","en":"(e.g., as part of reviews or component testing)","en_es":"(por ejemplo, como parte de las revisiones o de la prueba de componente)","resumen":"Se quitó la prueba de sistema como ejemplo de prueba no funcional temprana en el CVDS."},{"id":"2.2.3","tipo":"traducción","importancia":"baja","es":"Es aconsejable realizar primero un análisis de impacto para optimizar el alcance de la prueba de regresión.","en":"It is advisable first to perform an impact analysis to recognize the extent of the regression testing.","en_es":"Es aconsejable realizar primero un análisis de impacto para reconocer el alcance de la prueba de regresión.","resumen":"El análisis de impacto sirve para reconocer el alcance de la prueba de regresión, no para «optimizarlo»."},{"id":"3.1","tipo":"v4.0.1","importancia":"baja","es":"Los probadores, los representantes de negocio y los desarrolladores trabajan juntos","en":"Testers, business representatives (Product Owner, business analyst etc.) and developers work together","en_es":"Los probadores, los representantes de negocio (propietario de producto, analista de negocio, etc.) y los desarrolladores trabajan juntos","resumen":"Se detalla quiénes son los representantes de negocio: propietario de producto, analista de negocio, etc."},{"id":"3.1.1","tipo":"traducción","importancia":"baja","es":"los contratos de prueba, la documentación del proyecto y los modelos","en":"test charters, project documentation, contracts and models","en_es":"los contratos de prueba (test charters), la documentación del proyecto, los contratos y los modelos","resumen":"En la lista de productos examinables falta «contracts» (contratos); en español solo aparecen los «contratos de prueba»."},{"id":"3.1.2","tipo":"v4.0.1","importancia":"media","es":"Los defectos de código pueden detectarse utilizando el análisis estático de forma más eficiente que en la prueba dinámica","en":"Certain code defects can be detected using static analysis more efficiently than in dynamic testing","en_es" /* Bloque «📖 Ver en el programa»: texto oficial del programa CTFL v4.0 (ES) bajo cada corrección.
   Script clásico (sin export). Lee el global PROGRAMA = { apartados, glosario, diferencias } y usa esc() del aula. */

const PROG_COPY = "© ISTQB® · Traducción oficial SSTQB del programa CTFL v4.0 · Uso personal de estudio";

// Negrita sobre texto ya escapado
function mdInline(s){ return s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }

// Markdown del programa → HTML. Escapa antes de convertir (nada de HTML crudo del texto).
function mdAHtml(md){
  const lineas = String(md == null ? "" : md).split("\n");
  const out = [];
  let i = 0;
  while (i < lineas.length){
    const l = lineas[i];
    if (!l.trim()){ i++; continue; }
    // Tabla
    if (/^\s*\|/.test(l)){
      const filas = [];
      while (i < lineas.length && /^\s*\|/.test(lineas[i])){ filas.push(lineas[i]); i++; }
      const celdas = f => f.trim().replace(/^\||\|$/g, "").split("|").map(c => mdInline(esc(c.trim())));
      const datos = filas.filter(f => !/^\s*\|[\s:|-]+\|?\s*$/.test(f));
      let h = "<table>";
      datos.forEach((f, k) => {
        const tag = k === 0 && datos.length > 1 ? "th" : "td";
        h += "<tr>" + celdas(f).map(c => `<${tag}>${c}</${tag}>`).join("") + "</tr>";
      });
      out.push(h + "</table>");
      continue;
    }
    // Lista con anidado por sangría (2 espacios por nivel)
    if (/^\s*- /.test(l)){
      let h = "", nivel = -1;
      while (i < lineas.length && /^\s*- /.test(lineas[i])){
        const m = lineas[i].match(/^(\s*)- (.*)$/);
        const n = Math.floor(m[1].length / 2);
        if (nivel === -1){ h += "<ul><li>"; nivel = 0; }
        else if (n > nivel){ h += "<ul><li>"; nivel++; }
        else {
          h += "</li>";
          while (nivel > n){ h += "</ul></li>"; nivel--; }
          h += "<li>";
        }
        h += mdInline(esc(m[2]));
        i++;
      }
      while (nivel > 0){ h += "</li></ul>"; nivel--; }
      out.push(h + "</li></ul>");
      continue;
    }
    // Encabezado de apartado hijo
    const enc = l.match(/^###\s+(.*)$/);
    if (enc){ out.push(`<h4 class="prog-h">${mdInline(esc(enc[1]))}</h4>`); i++; continue; }
    // Nota al pie: «> N texto»
    const nota = l.match(/^>\s?(.*)$/);
    if (nota){ out.push(`<p class="nota">${mdInline(esc(nota[1]))}</p>`); i++; continue; }
    // Figura
    if (/^\[Figura:/.test(l.trim())){ out.push(`<p class="fig">${esc(l.trim())}</p>`); i++; continue; }
    // Párrafo: líneas seguidas hasta hueco u otro bloque
    const p = [];
    while (i < lineas.length && lineas[i].trim() && !/^\s*(\||- |###|>|\[Figura:)/.test(lineas[i])){ p.push(lineas[i].trim()); i++; }
    if (!p.length){ p.push(l.trim()); i++; }
    out.push("<p>" + mdInline(esc(p.join(" "))) + "</p>");
  }
  return out.join("");
}

function progApartado(id){ return PROGRAMA.apartados.find(a => a.id === id); }

// Apartado + todos sus descendientes en orden; cada hijo precedido de «### id título»
function apartadoCompleto(id){
  const a = progApartado(id);
  if (!a) return "";
  const partes = [a.texto || ""];
  (function rec(padre){
    PROGRAMA.apartados.filter(x => x.padre === padre).forEach(h => {
      partes.push(`### ${h.id} ${h.titulo}`, h.texto || "");
      rec(h.id);
    });
  })(id);
  return partes.filter(Boolean).join("\n\n");
}

// «Cap. 1 Título › 1.4 Título › 1.4.2 Título»
function rutaDe(id){
  const cadena = [];
  for (let a = progApartado(id); a; a = a.padre ? progApartado(a.padre) : null) cadena.unshift(a);
  return cadena.map(a => (a.padre ? a.id : "Cap. " + a.id) + " " + a.titulo).join(" › ");
}

// Plural de la primera palabra: vocal +s, consonante +es, -ión → -iones; las acabadas en s no cambian
function progPlural(p){
  if (/ión$/i.test(p)) return p.slice(0, -3) + "iones";
  if (/[aeiouáéíóú]$/i.test(p)) return p + "s";
  if (/s$/i.test(p)) return p;
  return p + "es";
}

let _progMapa = null, _progRe = null;
function progPrepararTerminos(){
  if (_progMapa) return;
  _progMapa = new Map();
  const gl = PROGRAMA.glosario || [];
  const poner = (f, k) => { const c = f.toLowerCase(); if (c && !_progMapa.has(c)) _progMapa.set(c, k); };
  gl.forEach((t, k) => { poner(t.es, k); (t.variantes || []).forEach(v => poner(v, k)); });
  gl.forEach((t, k) => {
    [t.es, ...(t.variantes || [])].forEach(f => {
      const [p, ...resto] = f.split(" ");
      poner([progPlural(p), ...resto].join(" "), k);
    });
  });
  const formas = [..._progMapa.keys()].sort((a, b) => b.length - a.length)
    .map(f => f.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  // Palabra completa con letras españolas: lookarounds sobre \p{L}\p{N} (\b no sirve con acentos)
  _progRe = formas.length ? new RegExp("(?<![\\p{L}\\p{N}])(?:" + formas.join("|") + ")(?![\\p{L}\\p{N}])", "giu") : null;
}

// Envuelve términos del glosario en <span class="term">. Solo texto (no etiquetas), nunca dentro de otro .term;
// solo la primera aparición de cada término en el HTML recibido.
function marcarTerminos(html){
  progPrepararTerminos();
  if (!_progRe) return html;
  const vistos = new Set();
  let dentro = 0, enTitulo = 0;
  return String(html).split(/(<[^>]*>)/).map(seg => {
    if (seg[0] === "<"){
      if (/^<h[1-6]\b/i.test(seg)) enTitulo++;
      else if (/^<\/h[1-6]>/i.test(seg)) enTitulo = Math.max(0, enTitulo - 1);
      if (/^<span\b[^>]*class="[^"]*\bterm\b/.test(seg)) dentro++;
      else if (dentro && /^<span\b/.test(seg)) dentro++;
      else if (dentro && /^<\/span>/.test(seg)) dentro--;
      return seg;
    }
    // Ni dentro de otro término ni en títulos (gastarían el único hueco del término)
    if (dentro || enTitulo) return seg;
    return seg.replace(_progRe, m => {
      const k = _progMapa.get(m.toLowerCase());
      if (k === undefined || vistos.has(k)) return m;
      vistos.add(k);
      return `<span class="term" data-t="${k}">${m}</span>`;
    });
  }).join("");
}

// Avisos: id igual, descendiente, o ancestro que no sea capítulo. Los de capítulo (sin punto) nunca.
function progAvisos(f){
  return (PROGRAMA.diferencias || []).filter(e =>
    e.id.includes(".") && (e.id === f || e.id.startsWith(f + ".") || f.startsWith(e.id + ".")));
}

function programaHTML(fuente){
  if (!fuente || !progApartado(fuente)) return "";
  const txt = marcarTerminos(mdAHtml(apartadoCompleto(fuente)));
  const avisos = progAvisos(fuente).map(e => {
    const pre = e.tipo === "traducción" ? "⚠️ Error de traducción: " : "⚠️ Actualizado en v4.0.1: ";
    return `<div class="prog-aviso"><div>${esc(pre + e.resumen)}</div>` +
      `<small><b>ES:</b> ${esc(e.es)}<br><b>EN:</b> ${esc(e.en)}<br><b>EN en español:</b> ${esc(e.en_es)}</small></div>`;
  }).join("");
  return `<details class="prog"><summary>📖 Ver en el programa (${esc(fuente)})</summary><div class="prog-in">` +
    `<div class="prog-ruta">${esc(rutaDe(fuente))}</div>` +
    `<div class="prog-txt">${txt}</div>` +
    (avisos ? `<div class="prog-avisos">${avisos}</div>` : "") +
    `<div class="prog-copy">${esc(PROG_COPY)}</div></div></details>`;
}

// Clic delegado en document, registrado una sola vez: abre/cierra el recuadro de definición del término
function activarTerminos(){
  if (window.__progTerm) return;
  window.__progTerm = true;
  document.addEventListener("click", ev => {
    const t = ev.target && ev.target.closest ? ev.target.closest(".term") : null;
    if (ev.target && ev.target.closest && ev.target.closest(".term-pop")) return;
    const previo = document.querySelector(".term-pop");
    const eraEste = previo && previo.__term === t;
    if (previo) previo.remove();
    if (!t || eraEste) return;
    const g = PROGRAMA.glosario[+t.dataset.t];
    const cont = t.closest(".prog-in");
    if (!g || !cont) return;
    const url = (String(g.fuente || "").match(/https?:\/\/\S+/) || [])[0];
    const pop = document.createElement("div");
    pop.className = "term-pop";
    pop.__term = t;
    pop.innerHTML = `<b>${esc(g.es)}</b> <i>${esc(g.en)}</i><div>${esc(g.definicion)}</div>` +
      (url
        ? `<small><a href="${esc(url)}" target="_blank" rel="noopener">${esc(g.fuente.replace(url, "").replace(/[\s·]+$/, "") || "fuente")}</a></small>`
        : `<small>${esc(g.fuente || "")}</small>`);
    cont.appendChild(pop);
    // Posición relativa al contenedor con getBoundingClientRect (offsetTop/Left van contra el offsetParent: dentro de un <td> sería la celda)
    const rt = t.getBoundingClientRect(), rc = cont.getBoundingClientRect();
    pop.style.top = (rt.bottom - rc.top - cont.clientTop + cont.scrollTop + 4) + "px";
    pop.style.left = Math.max(0, Math.min(rt.left - rc.left - cont.clientLeft + cont.scrollLeft, cont.clientWidth - pop.offsetWidth)) + "px";
  });
}

activarTerminos();

const BANCO = [{"id": "1-01", "cap": 1, "lo": "FL-1.1.1", "k": "K1", "fuente": "1.1.1", "tema": "Objetivos de la prueba", "pregunta": "¿Cuál de los siguientes es un objetivo típico de la prueba?", "opciones": {"a": "Depurar el código para eliminar los defectos encontrados.", "b": "Provocar fallos y encontrar defectos.", "c": "Garantizar que el software no contiene defectos.", "d": "Corregir la causa raíz de los fallos detectados en producción."}, "correcta": ["b"], "concepto": "Los objetivos típicos de la prueba incluyen provocar fallos y encontrar defectos, evaluar productos de trabajo, reducir riesgos, dar información y generar confianza.", "explicacion": ["Evaluar productos de trabajo (requisitos, historias de usuario, diseños, código).", "Provocar fallos y encontrar defectos.", "Asegurar la cobertura requerida y reducir el riesgo de calidad inadecuada del software.", "Verificar requisitos y cumplimiento contractual, legal y normativo; validar el objeto de prueba.", "Informar a las partes interesadas y generar confianza en la calidad."], "razones": {"a": "La depuración es una actividad distinta de la prueba (1.1.2).", "b": "Correcta. Es uno de los objetivos de la prueba que recoge el programa de estudio.", "c": "Imposible: el principio 1 dice que la prueba muestra la presencia de defectos, no su ausencia.", "d": "Eliminar la causa de los fallos es depuración, no un objetivo de la prueba."}, "clave": "Si una opción habla de 'garantizar' o 'demostrar ausencia de defectos', casi seguro es falsa."}, {"id": "1-02", "cap": 1, "lo": "FL-1.1.2", "k": "K2", "fuente": "1.1.2", "tema": "Prueba y depuración", "pregunta": "Un probador ejecuta un caso de prueba que falla y lo registra. Un desarrollador reproduce el fallo, localiza la causa en el código y la corrige. Después, el probador vuelve a ejecutar el caso y comprueba que ya pasa. ¿Qué parte de este escenario corresponde a la depuración?", "opciones": {"a": "Ejecutar el caso de prueba que falla y registrar el fallo.", "b": "Reproducir el fallo, diagnosticar la causa y corregir el código.", "c": "Volver a ejecutar el caso para confirmar que la corrección funciona.", "d": "Ejecutar pruebas de regresión sobre las zonas cercanas al cambio."}, "correcta": ["b"], "concepto": "La prueba provoca fallos o encuentra defectos; la depuración reproduce el fallo, diagnostica el defecto y lo corrige.", "explicacion": ["La prueba dinámica puede provocar fallos causados por defectos; la estática encuentra defectos directamente.", "Depuración tras un fallo: reproducción, diagnóstico (encontrar el defecto) y corrección.", "La prueba de confirmación comprueba después si la corrección resolvió el problema.", "La prueba de regresión comprueba que la corrección no causa fallos en otras partes."], "razones": {"a": "Es prueba dinámica: provocar y registrar el fallo.", "b": "Correcta. Reproducir, diagnosticar y corregir son las tres fases de la depuración.", "c": "Es prueba de confirmación, una actividad de prueba posterior a la depuración.", "d": "Es prueba de regresión, también actividad de prueba."}, "clave": "Prueba = encontrar o provocar. Depuración = reproducir, diagnosticar y corregir."}, {"id": "1-03", "cap": 1, "lo": "FL-1.2.1", "k": "K2", "fuente": "1.2.1", "tema": "Por qué es necesaria la prueba", "pregunta": "¿Cuál de las siguientes situaciones es el MEJOR ejemplo de cómo la prueba contribuye al éxito de un proyecto?", "opciones": {"a": "Los probadores participan en la revisión de los requisitos y detectan ambigüedades antes de que se implementen.", "b": "Los probadores garantizan que el producto entregado tendrá una calidad alta.", "c": "Los probadores corrigen los defectos para reducir la carga de trabajo de los desarrolladores.", "d": "La prueba sustituye la necesidad de aplicar aseguramiento de la calidad en la organización."}, "correcta": ["a"], "concepto": "La prueba es un medio rentable de detectar defectos y evalúa directamente la calidad del objeto de prueba, contribuyendo a las decisiones del proyecto.", "explicacion": ["La prueba detecta defectos de forma rentable; luego se eliminan mediante depuración, una actividad que no es de prueba.", "Evalúa directamente la calidad del objeto de prueba en distintas fases del ciclo de vida.", "Esas medidas apoyan decisiones como la de liberar el producto.", "Los probadores representan indirectamente a los usuarios durante el desarrollo."], "razones": {"a": "Correcta. Detecta defectos de forma rentable en productos de trabajo antes de que se conviertan en fallos.", "b": "La prueba mide la calidad y aporta información; contribuye indirectamente a una mayor calidad, pero no la garantiza.", "c": "Eliminar defectos es depuración, una actividad que no es de prueba.", "d": "Prueba y aseguramiento de la calidad (QA) no son lo mismo (1.2.2); una no sustituye al otro."}, "clave": "La prueba aporta información y detección temprana; nunca 'garantiza' calidad."}, {"id": "1-04", "cap": 1, "lo": "FL-1.2.2", "k": "K1", "fuente": "1.2.2", "tema": "Prueba y aseguramiento de la calidad", "pregunta": "¿Qué afirmación describe correctamente la relación entre la prueba y el aseguramiento de la calidad (QA)?", "opciones": {"a": "El QA se orienta al producto y es correctivo; la prueba se orienta a los procesos y es preventiva.", "b": "La prueba es una forma de control de calidad, orientada al producto y correctiva; el QA se orienta a los procesos y es preventivo.", "c": "La prueba y el QA son sinónimos y los realiza siempre el mismo equipo.", "d": "El QA solo se aplica al final del proyecto, cuando ya han terminado todas las pruebas."}, "correcta": ["b"], "concepto": "La prueba es un enfoque correctivo orientado al producto (control de calidad); el QA es un enfoque preventivo orientado a los procesos.", "explicacion": ["La prueba es una forma principal de control de calidad, orientada al producto y correctiva.", "El QA es preventivo y se orienta a la implantación y mejora de los procesos.", "Con un buen proceso bien seguido se obtiene un buen producto.", "El QA afecta a los procesos de desarrollo y de prueba y es responsabilidad de todos.", "Los resultados de la prueba sirven para corregir defectos (prueba) y como retroalimentación de los procesos (QA)."], "razones": {"a": "Invierte los conceptos: el QA es preventivo y de procesos; la prueba, correctiva y de producto.", "b": "Correcta. La prueba es QC, orientado al producto y correctivo; el QA, a los procesos y preventivo.", "c": "No son lo mismo, aunque se usen indistintamente; el QA es responsabilidad de todos en el proyecto.", "d": "El QA se aplica a los procesos de desarrollo y de prueba, no solo al final."}, "clave": "QA = procesos y prevención. QC (prueba) = producto y corrección."}, {"id": "1-05", "cap": 1, "lo": "FL-1.2.3", "k": "K2", "fuente": "1.2.3", "tema": "Error, defecto y fallo", "pregunta": "Un desarrollador entiende mal un requisito y escribe 'edad > 18' en lugar de 'edad >= 18'. Al usar la aplicación, un cliente de exactamente 18 años no puede registrarse. ¿Qué opción identifica correctamente el error, el defecto y el fallo?", "opciones": {"a": "Error: la condición 'edad > 18'. Defecto: el malentendido del requisito. Fallo: el cliente no puede registrarse.", "b": "Error: el malentendido del requisito. Defecto: la condición 'edad > 18' en el código. Fallo: el cliente de 18 años no puede registrarse.", "c": "Error: el cliente no puede registrarse. Defecto: el malentendido. Fallo: la condición en el código.", "d": "Error y defecto son lo mismo (la condición incorrecta). Fallo: el cliente no puede registrarse."}, "correcta": ["b"], "concepto": "Las personas cometen errores que producen defectos en los productos de trabajo, y un defecto ejecutado puede causar un fallo.", "explicacion": ["Error (equivocación): la acción humana, por ejemplo entender mal un requisito.", "Defecto (falta, bug): la imperfección resultante en un producto de trabajo, como la condición incorrecta.", "Fallo: si se ejecuta el defecto, el sistema no hace lo que debería o hace algo que no debe.", "Algunos defectos siempre causan fallos, otros solo en ciertas circunstancias y otros nunca."], "razones": {"a": "Intercambia error y defecto. El error es la acción humana; el defecto, su resultado en el producto.", "b": "Correcta. La cadena es error (humano) → defecto (en el producto) → fallo (comportamiento observable).", "c": "Mezcla los tres conceptos al revés.", "d": "Error y defecto son conceptos distintos en el programa de estudio."}, "clave": "Error (persona) → defecto (en el producto) → fallo (en ejecución, visible)."}, {"id": "1-06", "cap": 1, "lo": "FL-1.2.3", "k": "K1", "fuente": "1.2.3", "tema": "Causa raíz", "pregunta": "¿Qué término designa la razón fundamental por la que aparece un problema, por ejemplo una situación que conduce a un error?", "opciones": {"a": "Fallo.", "b": "Defecto.", "c": "Causa raíz.", "d": "Error."}, "correcta": ["c"], "concepto": "Una causa raíz es la razón fundamental de un problema y se identifica mediante el análisis de causa raíz.", "explicacion": ["Causa raíz: razón fundamental por la que ocurre un problema, por ejemplo una situación que lleva a un error.", "Se identifica con el análisis de causa raíz, normalmente tras un fallo o la detección de un defecto.", "Actuar sobre ella puede evitar fallos y defectos similares o reducir su frecuencia."], "razones": {"a": "Un fallo es el resultado observable cuando se ejecuta un defecto.", "b": "Un defecto es la imperfección en un producto de trabajo.", "c": "Correcta. Es la definición de causa raíz.", "d": "Un error es la equivocación humana; la causa raíz es la situación que lo origina."}, "clave": "Causa raíz = el porqué de fondo (presión de plazos, falta de formación, requisitos ambiguos...)."}, {"id": "1-07", "cap": 1, "lo": "FL-1.3.1", "k": "K2", "fuente": "1.3", "tema": "Siete principios", "pregunta": "Un equipo lleva dos años ejecutando la misma suite de regresión sin cambios. Ya no detecta ningún defecto, pero los usuarios siguen informando de fallos nuevos. ¿Qué principio de la prueba ilustra mejor esta situación?", "opciones": {"a": "Los defectos se agrupan.", "b": "Las pruebas se desgastan.", "c": "La prueba exhaustiva es imposible.", "d": "La falacia de la ausencia de errores."}, "correcta": ["b"], "concepto": "Principio 5: si se repiten muchas veces las mismas pruebas, se vuelven cada vez menos eficaces para detectar defectos nuevos.", "explicacion": ["Las mismas pruebas repetidas muchas veces detectan cada vez menos defectos nuevos.", "Hay que modificar las pruebas y los datos existentes y escribir pruebas nuevas.", "Excepción: repetir pruebas puede ser beneficioso, por ejemplo en la regresión automatizada."], "razones": {"a": "Ese principio habla de que la mayoría de los defectos están en pocos componentes, no de repetir pruebas.", "b": "Correcta. La suite repetida ha perdido eficacia para encontrar defectos nuevos.", "c": "Es cierto, pero no explica por qué una suite repetida deja de encontrar defectos.", "d": "Ese principio trata de un sistema sin defectos que no satisface las necesidades del usuario."}, "clave": "Mismas pruebas una y otra vez → encuentran cada vez menos: 'se desgastan'."}, {"id": "1-08", "cap": 1, "lo": "FL-1.3.1", "k": "K1", "fuente": "1.3", "tema": "Siete principios", "pregunta": "¿Cuál de los siguientes es uno de los siete principios de la prueba?", "opciones": {"a": "La prueba demuestra la ausencia de defectos.", "b": "La prueba temprana ahorra tiempo y dinero.", "c": "La prueba independiente siempre es más eficaz que la realizada por el autor.", "d": "Todas las pruebas deben automatizarse para ser fiables."}, "correcta": ["b"], "concepto": "Los siete principios: presencia (no ausencia) de defectos, prueba exhaustiva imposible, prueba temprana, agrupación de defectos, desgaste, contexto y falacia de ausencia de errores.", "explicacion": ["1) La prueba muestra la presencia, no la ausencia de defectos. 2) La prueba exhaustiva es imposible.", "3) La prueba temprana ahorra tiempo y dinero. 4) Los defectos se agrupan.", "5) Las pruebas se desgastan. 6) La prueba depende del contexto.", "7) Falacia de la ausencia de errores."], "razones": {"a": "Es lo contrario del principio 1.", "b": "Correcta. Es el principio 3: los defectos eliminados pronto no provocan defectos derivados y son más baratos de corregir.", "c": "No es uno de los siete principios.", "d": "No es uno de los siete principios."}, "clave": "Memoriza los 7 principios en orden; aparecen en casi todos los exámenes."}, {"id": "1-09", "cap": 1, "lo": "FL-1.3.1", "k": "K2", "fuente": "1.3", "tema": "Siete principios", "pregunta": "Un sistema supera todas las pruebas planificadas y no tiene defectos conocidos, pero los usuarios lo rechazan porque no se ajusta a su forma de trabajar. ¿Qué principio describe esta situación?", "opciones": {"a": "La prueba depende del contexto.", "b": "Los defectos se agrupan.", "c": "La falacia de la ausencia de errores.", "d": "La prueba muestra la presencia, no la ausencia de defectos."}, "correcta": ["c"], "concepto": "Principio 7: probar a fondo y corregir todos los defectos no asegura el éxito; además de verificar hay que validar las necesidades de los usuarios.", "explicacion": ["Es una falacia pensar que verificar el software asegura el éxito del sistema.", "Un sistema sin defectos puede no satisfacer las necesidades y expectativas de los usuarios.", "Puede no ayudar a lograr los objetivos de negocio ni ser competitivo.", "Además de la verificación, debe realizarse la validación."], "razones": {"a": "Habla de adaptar la prueba a cada contexto, no de un sistema sin defectos que no sirve.", "b": "Trata de la concentración de defectos en pocos componentes.", "c": "Correcta. 'Sin defectos' no significa 'útil para el usuario'.", "d": "Habla de que la prueba no puede demostrar que no hay defectos; aquí el problema es la validación."}, "clave": "'Sin defectos pero los usuarios no lo quieren' = falacia de la ausencia de errores."}, {"id": "1-10", "cap": 1, "lo": "FL-1.4.1", "k": "K2", "fuente": "1.4.1", "tema": "Actividades de prueba", "pregunta": "¿En qué actividad de prueba se analiza la base de prueba para identificar las condiciones de prueba ('qué probar') y se evalúa su comprobabilidad, pudiendo encontrar defectos en ella?", "opciones": {"a": "Análisis de la prueba.", "b": "Diseño de la prueba.", "c": "Implementación de la prueba.", "d": "Ejecución de la prueba."}, "correcta": ["a"], "concepto": "El análisis de la prueba analiza la base de prueba para identificar características comprobables y definir y priorizar condiciones de prueba (qué probar).", "explicacion": ["Analiza la base de prueba para identificar características comprobables.", "Define y prioriza las condiciones de prueba asociadas, según riesgos y niveles de riesgo.", "Evalúa la base de prueba y el objeto de prueba para encontrar defectos y valorar su comprobabilidad.", "Responde a la pregunta '¿qué probar?' en términos de criterios de cobertura medibles."], "razones": {"a": "Correcta. 'Qué probar', condiciones de prueba y evaluación de la base de prueba son tareas del análisis.", "b": "El diseño elabora las condiciones en casos de prueba y otros productos de prueba ('cómo probar').", "c": "La implementación crea o adquiere los productos de prueba necesarios para la ejecución.", "d": "La ejecución ejecuta las pruebas y compara los resultados."}, "clave": "Análisis = QUÉ (condiciones). Diseño = CÓMO (casos de prueba)."}, {"id": "1-11", "cap": 1, "lo": "FL-1.4.1", "k": "K2", "fuente": "1.4.1", "tema": "Actividades de prueba", "pregunta": "¿Cuál de las siguientes tareas pertenece a la implementación de la prueba?", "opciones": {"a": "Derivar casos de prueba a partir de las condiciones de prueba.", "b": "Organizar los procedimientos de prueba en juegos de prueba y preparar el calendario de ejecución.", "c": "Comparar los resultados reales con los esperados.", "d": "Archivar los productos de prueba para su uso futuro."}, "correcta": ["b"], "concepto": "La implementación de la prueba crea o adquiere los productos de prueba para la ejecución: procedimientos, juegos de prueba, scripts, calendario y entorno.", "explicacion": ["Crea o adquiere los productos de prueba necesarios, como los datos de prueba.", "Los casos de prueba se organizan en procedimientos de prueba, que suelen agruparse en juegos de prueba.", "Se crean scripts de prueba manuales y automatizados.", "Se priorizan los procedimientos en un calendario de ejecución y se construye y verifica el entorno."], "razones": {"a": "Es diseño de la prueba.", "b": "Correcta. Juegos de prueba y calendario de ejecución son tareas de implementación.", "c": "Es ejecución de la prueba.", "d": "Es compleción de la prueba."}, "clave": "Implementación = dejar todo listo para ejecutar: procedimientos, juegos, scripts, calendario y entorno."}, {"id": "1-12", "cap": 1, "lo": "FL-1.4.1", "k": "K2", "fuente": "1.4.1", "tema": "Actividades de prueba", "pregunta": "¿Qué tarea es característica de la compleción de la prueba?", "opciones": {"a": "Registrar los resultados de la ejecución y notificar los defectos.", "b": "Identificar lecciones aprendidas, archivar los productos de prueba y elaborar el informe de compleción.", "c": "Identificar los requisitos de entorno y de datos de prueba.", "d": "Evaluar la comprobabilidad de la base de prueba."}, "correcta": ["b"], "concepto": "La compleción de la prueba, en los hitos del proyecto, cierra la actividad: defectos pendientes, archivo de productos de prueba, lecciones aprendidas e informe.", "explicacion": ["Suele ocurrir en hitos del proyecto: entrega, fin de iteración o fin de un nivel de prueba.", "Se crean solicitudes de cambio o elementos del backlog para los defectos sin resolver.", "Se archivan o entregan los productos de prueba útiles y se desactiva el entorno.", "Se analizan las actividades para extraer lecciones aprendidas y se comunica el informe de compleción."], "razones": {"a": "Es ejecución de la prueba.", "b": "Correcta. Las tres tareas son típicas de la compleción.", "c": "Es diseño de la prueba.", "d": "Es análisis de la prueba."}, "clave": "Compleción = cerrar: archivar, lecciones aprendidas, informe final, apagar el entorno."}, {"id": "1-13", "cap": 1, "lo": "FL-1.4.2", "k": "K2", "fuente": "1.4.2", "tema": "El proceso de prueba en contexto", "pregunta": "¿Cuál de los siguientes factores de contexto que influyen en el proceso de prueba pertenece al dominio del negocio?", "opciones": {"a": "La criticidad del objeto de prueba y las normativas legales específicas.", "b": "La disponibilidad y la facilidad de uso de las herramientas.", "c": "Las habilidades y la experiencia de los miembros del equipo.", "d": "El alcance, el tiempo y el presupuesto del proyecto."}, "correcta": ["a"], "concepto": "La forma de probar depende del contexto: partes interesadas, equipo, dominio del negocio, factores técnicos, restricciones del proyecto, organización, ciclo de vida y herramientas.", "explicacion": ["Partes interesadas: necesidades, expectativas, requisitos y disposición a cooperar.", "Dominio del negocio: criticidad del objeto de prueba, riesgos, necesidades del mercado y normativas.", "Equipo, factores técnicos, restricciones del proyecto, factores organizativos, ciclo de vida y herramientas.", "Influyen en la estrategia, las técnicas, la automatización, la cobertura, el detalle del testware y los informes."], "razones": {"a": "Correcta. Criticidad, riesgos, mercado y normativas son factores del dominio del negocio.", "b": "Es el factor de herramientas.", "c": "Es el factor de miembros del equipo.", "d": "Son restricciones del proyecto."}, "clave": "Aprende las categorías de contexto: partes interesadas, equipo, negocio, técnicos, proyecto, organización, ciclo de vida y herramientas."}, {"id": "1-14", "cap": 1, "lo": "FL-1.4.4", "k": "K2", "fuente": "1.4.4", "tema": "Trazabilidad", "pregunta": "¿Cuál es un beneficio de mantener la trazabilidad entre la base de prueba y los productos de prueba?", "opciones": {"a": "Permite hacer análisis de impacto de los cambios y evaluar la cobertura.", "b": "Elimina la necesidad de la prueba de regresión.", "c": "Garantiza que el producto no tiene defectos.", "d": "Reduce automáticamente el número de casos de prueba necesarios."}, "correcta": ["a"], "concepto": "La trazabilidad entre la base de prueba y el testware permite evaluar la cobertura y el impacto de los cambios, y facilita auditorías y la comprensión de informes.", "explicacion": ["Respalda la evaluación de la cobertura, por ejemplo casos de prueba trazados a requisitos.", "Los resultados trazados a riesgos permiten evaluar el riesgo residual.", "Permite determinar el impacto de los cambios y facilita las auditorías.", "Ayuda a cumplir criterios de gobernanza de TI y hace más comprensibles los informes de prueba."], "razones": {"a": "Correcta. Cobertura y análisis de impacto son los beneficios principales.", "b": "No es un beneficio recogido en el programa de estudio.", "c": "Nada garantiza la ausencia de defectos (principio 1).", "d": "No es un beneficio que recoja el programa; la trazabilidad informa sobre qué cubre cada prueba."}, "clave": "Trazabilidad → cobertura + análisis de impacto + auditoría + informes comprensibles."}, {"id": "1-15", "cap": 1, "lo": "FL-1.4.5", "k": "K1", "fuente": "1.4.5", "tema": "Roles en la prueba", "pregunta": "Según el programa de estudio, ¿qué rol asume la responsabilidad general del proceso de prueba, del equipo y del liderazgo de las actividades, centrándose sobre todo en la planificación, la monitorización y control, y la compleción?", "opciones": {"a": "El rol de gestión de la prueba.", "b": "El rol de prueba.", "c": "El propietario del producto.", "d": "El moderador."}, "correcta": ["a"], "concepto": "El rol de gestión de la prueba asume la responsabilidad general del proceso, del equipo y del liderazgo, centrándose en planificación, monitorización, control y compleción.", "explicacion": ["Gestión de la prueba: responsabilidad general del proceso, el equipo y el liderazgo de las actividades.", "Se centra en planificación, monitorización, control y compleción.", "El rol de prueba se ocupa del aspecto técnico: análisis, diseño, implementación y ejecución.", "Una persona puede asumir ambos roles; en ágil parte de la gestión la hace el equipo."], "razones": {"a": "Correcta.", "b": "El rol de prueba se centra en el análisis, el diseño, la implementación y la ejecución.", "c": "No es uno de los dos roles principales de prueba descritos en el programa.", "d": "No es uno de los dos roles principales de prueba descritos en el programa."}, "clave": "Gestión → planificar, controlar, cerrar. Prueba → analizar, diseñar, implementar, ejecutar."}, {"id": "1-16", "cap": 1, "lo": "FL-1.5.3", "k": "K2", "fuente": "1.5.3", "tema": "Independencia de la prueba", "pregunta": "¿Cuáles de los siguientes son posibles INCONVENIENTES de la independencia de la prueba? (Selecciona DOS)", "opciones": {"a": "Los probadores independientes pueden quedar aislados del equipo de desarrollo, con falta de colaboración y problemas de comunicación.", "b": "Los probadores independientes detectan tipos de fallos distintos porque tienen otra formación y otras perspectivas.", "c": "Los desarrolladores pueden perder el sentido de responsabilidad sobre la calidad.", "d": "Los probadores independientes pueden cuestionar o refutar las suposiciones de las partes interesadas.", "e": "La prueba independiente reduce los sesgos del autor sobre su propio trabajo."}, "correcta": ["a", "c"], "concepto": "La independencia permite ver otros defectos por sesgos distintos, pero puede aislar a los probadores y diluir la responsabilidad de los desarrolladores.", "explicacion": ["Beneficio: los probadores independientes reconocen otros tipos de fallos y defectos por su distinta formación, perspectivas y sesgos.", "Beneficio: pueden verificar, cuestionar o refutar suposiciones de las partes interesadas.", "Inconveniente: aislamiento del equipo de desarrollo, falta de colaboración y problemas de comunicación.", "Inconveniente: los desarrolladores pueden perder el sentido de responsabilidad sobre la calidad.", "Inconveniente: los probadores pueden verse como un cuello de botella o ser culpados de los retrasos."], "razones": {"a": "Correcta. Aislamiento y problemas de comunicación son un inconveniente.", "b": "Es un beneficio, no un inconveniente.", "c": "Correcta. Es un inconveniente que recoge explícitamente el programa.", "d": "Es un beneficio.", "e": "Es un beneficio: los sesgos cognitivos del autor y del probador son distintos."}, "clave": "En las preguntas 'Selecciona DOS' solo puntúas si aciertas las dos. Clasifica cada opción como beneficio o inconveniente."}, {"id": "1-17", "cap": 1, "lo": "FL-1.4.3", "k": "K2", "fuente": "1.4.3", "tema": "Productos de prueba (testware)", "pregunta": "¿Cuál de las siguientes opciones enumera productos de prueba que se crean típicamente durante la implementación de la prueba?", "opciones": {"a": "Condiciones de prueba priorizadas e informes de defecto sobre la base de prueba.", "b": "Procedimientos de prueba, scripts automatizados, juegos de prueba y calendario de ejecución de la prueba.", "c": "Informe de compleción de la prueba y solicitudes de cambio.", "d": "Casos de prueba priorizados, cartas de prueba, elementos de cobertura y requisitos de datos de prueba."}, "correcta": ["b"], "concepto": "La implementación de la prueba produce procedimientos de prueba, scripts, juegos de prueba, datos de prueba, calendario de ejecución y elementos del entorno.", "explicacion": ["Análisis: condiciones de prueba (priorizadas) e informes de defecto sobre la base de prueba.", "Diseño: casos de prueba, cartas, elementos de cobertura y requisitos de datos y de entorno.", "Implementación: procedimientos, scripts, juegos, datos de prueba, calendario y elementos de entorno.", "Compleción: informe de compleción, elementos de acción, lecciones aprendidas y solicitudes de cambio."], "razones": {"a": "Son productos del análisis de la prueba.", "b": "Correcta. Son productos típicos de la implementación de la prueba.", "c": "Son productos de la compleción de la prueba.", "d": "Son productos del diseño de la prueba."}, "clave": "Implementación = procedimientos + scripts + juegos + datos + calendario; diseño = casos + cartas + elementos de cobertura."}, {"id": "1-18", "cap": 1, "lo": "FL-1.4.3", "k": "K2", "fuente": "1.4.3", "tema": "Productos de prueba (testware)", "pregunta": "Un equipo termina la ejecución de la prueba y cierra la iteración. ¿Qué producto de prueba corresponde a la actividad de compleción de la prueba?", "opciones": {"a": "El calendario de ejecución de la prueba.", "b": "Las condiciones de prueba priorizadas.", "c": "Los informes de defecto generados durante la ejecución.", "d": "El informe de compleción de la prueba."}, "correcta": ["d"], "concepto": "La compleción de la prueba genera el informe de compleción, elementos de acción de mejora, lecciones aprendidas documentadas y solicitudes de cambio.", "explicacion": ["Compleción: informe de compleción de la prueba.", "También produce elementos de acción para mejorar futuros proyectos o iteraciones.", "También genera lecciones aprendidas documentadas y solicitudes de cambio, por ejemplo como elementos del backlog.", "Los informes de defecto y los registros de prueba son productos de la ejecución."], "razones": {"a": "Es un producto de la implementación de la prueba.", "b": "Es un producto del análisis de la prueba.", "c": "Los informes de defecto se generan durante la ejecución, no en la compleción.", "d": "Correcta. Es el producto característico de la compleción de la prueba."}, "clave": "Al cierre: informe de compleción, elementos de acción y solicitudes de cambio."}, {"id": "1-19", "cap": 1, "lo": "FL-1.5.1", "k": "K1", "fuente": "1.5.1", "tema": "Habilidades genéricas del probador", "pregunta": "¿Cuál de las siguientes es una habilidad genérica que se espera de un probador con éxito según el programa de estudio?", "opciones": {"a": "Capacidad para programar la totalidad del sistema bajo prueba.", "b": "Conocimiento exclusivo de herramientas de automatización.", "c": "Pensamiento analítico, pensamiento crítico y creatividad.", "d": "Capacidad para aprobar la liberación del producto sin consultar al equipo."}, "correcta": ["c"], "concepto": "Las habilidades genéricas del probador incluyen conocimiento de prueba, minuciosidad, curiosidad, comunicación, pensamiento analítico y crítico, creatividad, conocimiento técnico y del dominio.", "explicacion": ["Conocimiento de prueba para aumentar la eficacia.", "Minuciosidad, cuidado, curiosidad, atención al detalle y método.", "Buena comunicación, escucha activa y trabajo en equipo.", "Pensamiento analítico, pensamiento crítico y creatividad.", "Conocimiento técnico (eficiencia) y del dominio (entender a los usuarios y al negocio)."], "razones": {"a": "El programa pide conocimiento técnico para ser más eficiente, no programar todo el sistema.", "b": "Las herramientas son un apoyo; el conocimiento técnico es solo una de varias habilidades.", "c": "Correcta. Figuran entre las habilidades genéricas listadas.", "d": "No es una habilidad listada; la prueba da información a las partes interesadas para que decidan."}, "clave": "Habilidades genéricas: blandas y analíticas, no solo técnicas."}, {"id": "1-20", "cap": 1, "lo": "FL-1.5.1", "k": "K2", "fuente": "1.5.1", "tema": "Habilidades genéricas del probador", "pregunta": "¿Por qué las habilidades de comunicación son especialmente importantes para un probador?", "opciones": {"a": "Porque los probadores suelen dar malas noticias y comunicar resultados puede percibirse como una crítica al producto y a su autor.", "b": "Porque una buena comunicación elimina el sesgo de confirmación de los miembros del equipo.", "c": "Porque la prueba es una actividad destructiva y debe presentarse como tal.", "d": "Porque la información sobre defectos y fallos nunca debe comunicarse por escrito."}, "correcta": ["a"], "concepto": "Los probadores suelen dar malas noticias, por lo que la comunicación es crucial y los defectos y fallos deben comunicarse de forma constructiva.", "explicacion": ["Los probadores suelen ser portadores de malas noticias y es común culpar a quien las trae.", "Comunicar resultados puede percibirse como una crítica al producto y a su autor.", "El sesgo de confirmación dificulta aceptar información contraria a las creencias propias.", "Algunos ven la prueba como destructiva, aunque contribuye al éxito del proyecto.", "La información sobre defectos y fallos debe comunicarse de forma constructiva."], "razones": {"a": "Correcta. Es la razón que da el programa de estudio.", "b": "La comunicación no elimina el sesgo de confirmación; este dificulta aceptar información contraria.", "c": "Algunos perciben la prueba como destructiva, pero contribuye mucho al éxito del proyecto y a la calidad.", "d": "El programa no lo dice; pide comunicar la información sobre defectos de forma constructiva."}, "clave": "Malas noticias + sesgo de confirmación = comunicar los defectos de forma constructiva."}, {"id": "1-21", "cap": 1, "lo": "FL-1.5.2", "k": "K1", "fuente": "1.5.2", "tema": "Enfoque de equipo completo", "pregunta": "¿Qué describe mejor el enfoque de equipo completo (whole team approach)?", "opciones": {"a": "Todos los probadores del proyecto se agrupan en un único equipo independiente.", "b": "Un equipo externo realiza toda la prueba para garantizar objetividad.", "c": "El jefe de proyecto asume toda la responsabilidad de la calidad.", "d": "Cualquier miembro del equipo con los conocimientos y habilidades necesarios puede realizar cualquier tarea, y todos son responsables de la calidad."}, "correcta": ["d"], "concepto": "En el enfoque de equipo completo, cualquier miembro con los conocimientos y habilidades necesarios puede realizar cualquier tarea y todos son responsables de la calidad.", "explicacion": ["Es una práctica que proviene de Extreme Programming.", "Cualquier miembro con los conocimientos y habilidades necesarios puede realizar cualquier tarea.", "Todos son responsables de la calidad.", "El equipo comparte espacio de trabajo, físico o virtual, para facilitar la comunicación."], "razones": {"a": "Eso es agrupar a los probadores, lo contrario a integrarlos en el equipo.", "b": "Describe la prueba independiente, no el equipo completo.", "c": "La calidad es responsabilidad de todos, no de una sola persona.", "d": "Correcta. Es la definición del enfoque."}, "clave": "Equipo completo = calidad responsabilidad de todos, tareas intercambiables según habilidades."}, {"id": "1-22", "cap": 1, "lo": "FL-1.5.2", "k": "K1", "fuente": "1.5.2", "tema": "Enfoque de equipo completo", "pregunta": "¿Cuál de las siguientes afirmaciones sobre el enfoque de equipo completo es correcta?", "opciones": {"a": "Elimina la necesidad de que existan probadores en el equipo.", "b": "Exige que todos los miembros trabajen siempre en la misma sala física.", "c": "Mejora la dinámica de comunicación y permite aprovechar sinergias entre las habilidades de los miembros.", "d": "Impide que los probadores colaboren con los representantes del negocio."}, "correcta": ["c"], "concepto": "El enfoque de equipo completo mejora la comunicación y la colaboración, permite sinergias de habilidades y hace de la calidad una responsabilidad compartida.", "explicacion": ["Beneficio: mejora la dinámica del equipo y la comunicación y colaboración.", "Beneficio: crea sinergia al aprovechar las distintas habilidades del equipo.", "Los probadores colaboran con el negocio para crear pruebas de aceptación y con desarrolladores en la estrategia y la automatización.", "El espacio compartido puede ser físico o virtual."], "razones": {"a": "Los probadores trabajan estrechamente con el resto del equipo y transfieren su conocimiento; no desaparecen.", "b": "El espacio compartido puede ser físico o virtual.", "c": "Correcta. Es un beneficio recogido en el programa de estudio.", "d": "Al contrario: los probadores colaboran con los representantes del negocio."}, "clave": "Equipo completo no elimina a los probadores: los integra."}, {"id": "1-23", "cap": 1, "lo": "FL-1.3.1", "k": "K2", "fuente": "1.3", "tema": "Siete principios: prueba exhaustiva", "pregunta": "Un director pide probar todas las combinaciones posibles de datos de entrada y precondiciones de una aplicación grande antes de liberarla. ¿Qué principio de la prueba justifica rechazar esta petición?", "opciones": {"a": "La prueba exhaustiva es imposible.", "b": "La prueba temprana ahorra tiempo y dinero.", "c": "Los defectos se agrupan.", "d": "La prueba depende del contexto."}, "correcta": ["a"], "concepto": "Principio 2: la prueba exhaustiva es imposible; salvo en casos triviales, hay que usar análisis de riesgos, técnicas y prioridades para centrar el esfuerzo.", "explicacion": ["Probar todo no es factible salvo en casos triviales.", "En su lugar se usan técnicas de prueba, priorización de casos y prueba basada en riesgos.", "Así se centra el esfuerzo de prueba donde más importa."], "razones": {"a": "Correcta. Es el principio 2.", "b": "Trata de empezar pronto, no del alcance total.", "c": "Trata de concentrar defectos en pocos módulos.", "d": "Trata de adaptar el enfoque al contexto del producto."}, "clave": "Todas las combinaciones = imposible; se prioriza por riesgo."}, {"id": "1-24", "cap": 1, "lo": "FL-1.3.1", "k": "K2", "fuente": "1.3", "tema": "Siete principios: agrupación de defectos", "pregunta": "En una versión, el 70 % de los defectos detectados se localiza en solo dos módulos de los treinta que componen el sistema. ¿Qué principio ilustra esta situación?", "opciones": {"a": "Las pruebas se desgastan.", "b": "Los defectos se agrupan.", "c": "La prueba muestra la presencia de defectos, no su ausencia.", "d": "La falacia de la ausencia de errores."}, "correcta": ["b"], "concepto": "Principio 4: un pequeño número de módulos suele contener la mayoría de los defectos descubiertos o ser responsable de la mayoría de los fallos operativos.", "explicacion": ["Los defectos no se distribuyen de manera uniforme.", "Pocos componentes contienen la mayoría de los defectos o causan la mayoría de los fallos operativos.", "Es una ilustración del principio de Pareto.", "Los agrupamientos predichos y observados son entrada importante de la prueba basada en riesgos."], "razones": {"a": "Trata de que las pruebas repetidas pierden eficacia para encontrar defectos nuevos.", "b": "Correcta. Es el principio 4.", "c": "Trata de que la prueba no demuestra ausencia de defectos.", "d": "Trata de que un sistema sin defectos puede no satisfacer al usuario."}, "clave": "Pocos módulos, muchos defectos = agrupación."}, {"id": "1-25", "cap": 1, "lo": "FL-1.3.1", "k": "K2", "fuente": "1.3", "tema": "Siete principios: prueba temprana", "pregunta": "Un equipo incorpora a los probadores a la revisión de los requisitos antes de escribir código. ¿Qué principio de la prueba respalda esta práctica?", "opciones": {"a": "La prueba depende del contexto.", "b": "La prueba exhaustiva es imposible.", "c": "La prueba temprana ahorra tiempo y dinero.", "d": "Los defectos se agrupan."}, "correcta": ["c"], "concepto": "Principio 3: la prueba temprana ahorra tiempo y dinero, porque los defectos eliminados pronto no causan defectos en productos derivados ni fallos tardíos.", "explicacion": ["Los defectos eliminados pronto no causan defectos en los productos de trabajo derivados.", "Se reduce el coste de la calidad porque ocurren menos fallos más adelante.", "Hay que empezar pronto tanto la prueba estática como la dinámica."], "razones": {"a": "Trata de adaptar la prueba al tipo de sistema y su riesgo.", "b": "Trata de la imposibilidad de probarlo todo.", "c": "Correcta. Es el principio 3.", "d": "Trata de concentración de defectos en pocos módulos."}, "clave": "Probar pronto, revisar requisitos = prueba temprana."}, {"id": "1-26", "cap": 1,
