 "lo": "FL-1.1.1", "k": "K1", "fuente": "1.1.1", "tema": "Verificación y validación", "pregunta": "Un equipo comprueba que el producto terminado satisface las necesidades reales de los usuarios en su entorno de uso. ¿Qué objetivo de la prueba se persigue?", "opciones": {"a": "Verificar que se cumplen los requisitos especificados únicamente.", "b": "Provocar fallos para encontrar defectos del código.", "c": "Validar que el objeto de prueba está completo y funciona como esperan los usuarios y otras partes interesadas.", "d": "Reducir el nivel de riesgo eliminando las causas raíz."}, "correcta": ["c"], "concepto": "Validar es comprobar que el objeto de prueba está completo y funciona como esperan los usuarios y otras partes interesadas.", "explicacion": ["Verificación: comprobar si el sistema cumple los requisitos especificados.", "Validación: comprobar si cumple las necesidades de usuarios y otras partes interesadas en su entorno operativo.", "Validar que el objeto de prueba está completo y funciona como esperan las partes interesadas es un objetivo típico de la prueba."], "razones": {"a": "Eso es verificar, no validar.", "b": "Eso es otro objetivo: provocar fallos y encontrar defectos.", "c": "Correcta. Es la validación.", "d": "Reducir el riesgo de calidad inadecuada es otro objetivo distinto de validar."}, "clave": "Verificar = requisitos; validar = necesidades reales de usuarios."}, {"id": "1-27", "cap": 1, "lo": "FL-1.4.4", "k": "K2", "fuente": "1.4.4", "tema": "Trazabilidad", "pregunta": "Cambia un requisito en mitad del proyecto. ¿De qué forma ayuda la trazabilidad entre la base de prueba y los productos de prueba?", "opciones": {"a": "Permite evaluar el impacto del cambio sobre las pruebas afectadas.", "b": "Garantiza que el nuevo requisito no contenga defectos.", "c": "Elimina la necesidad de repetir pruebas de regresión.", "d": "Sustituye la necesidad de un plan de prueba."}, "correcta": ["a"], "concepto": "La trazabilidad permite evaluar el impacto de los cambios, facilitar auditorías y comprobar la cobertura de la base de prueba por los productos de prueba.", "explicacion": ["Permite determinar el impacto de los cambios.", "Facilita las auditorías y ayuda a cumplir criterios de gobernanza de TI.", "Hace más comprensibles los informes de progreso y de compleción.", "Permite evaluar la cobertura de la base de prueba."], "razones": {"a": "Correcta. Es un beneficio recogido en el programa de estudio.", "b": "La trazabilidad no garantiza la ausencia de defectos (principio 1).", "c": "La trazabilidad informa del impacto del cambio; no suprime ninguna prueba.", "d": "Son productos distintos; no se sustituyen."}, "clave": "Trazabilidad = impacto de cambios, cobertura y auditoría."}, {"id": "1-28", "cap": 1, "lo": "FL-1.4.1", "k": "K1", "fuente": "1.4.1", "tema": "Actividades de prueba", "pregunta": "¿Qué tarea forma parte de la ejecución de la prueba?", "opciones": {"a": "Priorizar las condiciones de prueba.", "b": "Ejecutar las pruebas según el calendario de ejecución y comparar los resultados reales con los esperados.", "c": "Crear los datos de prueba y construir el entorno.", "d": "Archivar los productos de prueba y elaborar el informe de compleción."}, "correcta": ["b"], "concepto": "La ejecución de la prueba ejecuta las pruebas según el calendario, compara resultados reales con esperados, registra los resultados y analiza las anomalías.", "explicacion": ["Ejecutar las pruebas según el calendario de ejecución, manual o automáticamente.", "Comparar los resultados reales con los esperados.", "Registrar los resultados de la prueba.", "Analizar las anomalías para identificar sus causas probables y notificarlas según los fallos observados."], "razones": {"a": "Es una tarea del análisis de la prueba.", "b": "Correcta. Es una tarea de la ejecución.", "c": "Es una tarea de la implementación de la prueba.", "d": "Es una tarea de la compleción de la prueba."}, "clave": "Ejecución = ejecutar, comparar, analizar anomalías y registrar."}, {"id": "1-29", "cap": 1, "lo": "FL-1.4.5", "k": "K1", "fuente": "1.4.5", "tema": "Roles en la prueba", "pregunta": "Según el programa de estudio, ¿qué tarea corresponde principalmente al rol de probador y no al de gestión de la prueba?", "opciones": {"a": "Dirigir el plan de prueba y el seguimiento del progreso.", "b": "Responsabilizarse de la compleción de la prueba.", "c": "Decidir las acciones de control cuando se desvía el avance.", "d": "Analizar la base de prueba y diseñar e implementar las pruebas."}, "correcta": ["d"], "concepto": "El rol de gestión de la prueba lidera planificación, monitorización, control y compleción; el rol de probador lidera análisis, diseño, implementación y ejecución.", "explicacion": ["Gestión de la prueba: planificación, monitorización, control y compleción.", "Probador: análisis, diseño, implementación y ejecución de la prueba.", "Una misma persona puede asumir ambos roles.", "Las tareas de cada rol dependen del contexto, las habilidades y la organización."], "razones": {"a": "Es una tarea típica de gestión de la prueba.", "b": "Es una tarea típica de gestión de la prueba (compleción).", "c": "Es una tarea típica de gestión de la prueba (control).", "d": "Correcta. Es característica del rol de probador."}, "clave": "Gestión = planificar y controlar; probador = analizar, diseñar, ejecutar."}, {"id": "1-30", "cap": 1, "lo": "FL-1.5.3", "k": "K1", "fuente": "1.5.3", "tema": "Independencia de la prueba", "pregunta": "¿Cuál es un posible BENEFICIO de la independencia de la prueba?", "opciones": {"a": "Los probadores independientes pueden reconocer fallos distintos de los que ven los desarrolladores por sus sesgos diferentes.", "b": "Los desarrolladores se sienten más responsables de la calidad.", "c": "La comunicación con el equipo de desarrollo es más rápida.", "d": "Los probadores independientes conocen mejor el código."}, "correcta": ["a"], "concepto": "Los probadores independientes tienen sesgos cognitivos distintos a los de los autores, por lo que pueden reconocer tipos de defectos diferentes y verificar suposiciones.", "explicacion": ["Beneficio: sesgos distintos hacen que se reconozcan otros tipos de fallos y defectos.", "Beneficio: pueden verificar, cuestionar o refutar suposiciones de la especificación.", "Inconveniente: aislamiento del equipo de desarrollo y problemas de comunicación.", "Inconveniente: los desarrolladores pueden perder el sentido de responsabilidad sobre la calidad."], "razones": {"a": "Correcta. Es un beneficio recogido en el programa de estudio.", "b": "Es un posible inconveniente: puede disminuir la responsabilidad de los desarrolladores.", "c": "La independencia suele dificultar la comunicación; es un inconveniente.", "d": "La independencia no sustituye a la familiaridad: los desarrolladores pueden encontrar muchos defectos en su propio código."}, "clave": "Independencia: sesgos distintos (beneficio); aislamiento (inconveniente)."}, {"id": "1-31", "cap": 1, "lo": "FL-1.1.1", "k": "K1", "fuente": "1.1", "tema": "Objeto de prueba (test object)", "pregunta": "¿Cómo se denominan los productos de trabajo de software cuando se están sometiendo a prueba?", "opciones": {"a": "Bases de prueba.", "b": "Objetos de prueba.", "c": "Productos de prueba (testware).", "d": "Elementos de cobertura."}, "correcta": ["b"], "concepto": "Los productos de trabajo de software que se están probando se denominan objetos de prueba.", "explicacion": ["La prueba evalúa la calidad de productos de trabajo de software y busca defectos en ellos.", "Esos productos de trabajo, mientras se prueban, son los objetos de prueba.", "Pueden ser componentes, sistemas y productos asociados como la documentación.", "No confundir con el testware, que son los productos de salida de las actividades de prueba."], "razones": {"a": "La base de prueba es lo que se analiza para identificar qué probar, no lo que se prueba.", "b": "Correcta. Es la denominación del programa para los productos de trabajo sometidos a prueba.", "c": "El testware es lo que se produce como salida de las actividades de prueba.", "d": "Los elementos de cobertura guían las entradas de los casos de prueba."}, "clave": "Objeto de prueba = lo que se prueba; testware = lo que se produce al probar."}, {"id": "1-32", "cap": 1, "lo": "FL-1.4.1", "k": "K1", "fuente": "1.4.1", "tema": "Monitorización y control de la prueba (test monitoring, test control)", "pregunta": "¿Qué afirmación diferencia correctamente la monitorización de la prueba y el control de la prueba?", "opciones": {"a": "La monitorización toma las acciones necesarias para cumplir los objetivos; el control compara el progreso real con el plan.", "b": "La monitorización define los objetivos de la prueba y el control selecciona el enfoque.", "c": "La monitorización comprueba de forma continua las actividades y compara el progreso real con el plan; el control toma las acciones necesarias para cumplir los objetivos.", "d": "Ambas consisten en analizar la base de prueba para identificar condiciones de prueba."}, "correcta": ["c"], "concepto": "La monitorización comprueba de forma continua las actividades y compara el progreso real con el plan; el control adopta las acciones necesarias para cumplir los objetivos.", "explicacion": ["Monitorización: comprobación continua de todas las actividades de prueba.", "Monitorización: compara el progreso real con el plan.", "Control: toma las acciones necesarias para cumplir los objetivos de la prueba.", "Ambas se explican con más detalle en la sección 5.3."], "razones": {"a": "Invierte los conceptos de monitorización y control.", "b": "Eso es la planificación de la prueba.", "c": "Correcta. Describe cada actividad como la define el programa de estudio.", "d": "Eso es el análisis de la prueba."}, "clave": "Monitorizar = observar y comparar con el plan; controlar = actuar."}, {"id": "1-33", "cap": 1, "lo": "FL-1.4.4", "k": "K1", "fuente": "1.4.4", "tema": "Cobertura (coverage)", "pregunta": "¿Qué función pueden desempeñar los criterios de cobertura medibles definidos en la base de prueba?", "opciones": {"a": "Funcionan como indicadores clave de rendimiento que muestran en qué medida se han logrado los objetivos de la prueba.", "b": "Sustituyen a los casos de prueba al demostrar que no quedan defectos.", "c": "Determinan qué desarrollador debe corregir cada defecto.", "d": "Definen la herramienta de prueba que se debe adquirir."}, "correcta": ["a"], "concepto": "Los criterios de cobertura medibles pueden funcionar como indicadores clave de rendimiento que muestran en qué medida se han alcanzado los objetivos de la prueba.", "explicacion": ["La trazabilidad precisa respalda la evaluación de la cobertura.", "Es muy útil que haya criterios de cobertura medibles definidos en la base de prueba.", "Actúan como indicadores clave de rendimiento de los objetivos de la prueba.", "Ejemplo: trazar casos de prueba a requisitos verifica que los requisitos están cubiertos."], "razones": {"a": "Correcta. Es lo que indica el programa de estudio.", "b": "La cobertura no demuestra la ausencia de defectos (principio 1).", "c": "No tiene relación con la asignación de defectos.", "d": "No tiene relación con la elección de herramientas."}, "clave": "Cobertura medible + trazabilidad = saber hasta qué punto se cumplen los objetivos."}, {"id": "1-34", "cap": 1, "lo": "FL-1.1.1", "k": "K1", "fuente": "1.1", "tema": "Verificación (verification)", "pregunta": "En el contexto de la prueba, ¿qué significa verificar?", "opciones": {"a": "Comprobar si el sistema satisface las necesidades de los usuarios y otras partes interesadas en su entorno operativo.", "b": "Encontrar las causas de un fallo, analizarlas y eliminarlas.", "c": "Evaluar la comprobabilidad de la base de prueba.", "d": "Comprobar si el sistema cumple los requisitos especificados."}, "correcta": ["d"], "concepto": "Verificar es comprobar si el sistema cumple los requisitos especificados; validar es comprobar si satisface las necesidades de los usuarios y otras partes interesadas.", "explicacion": ["La prueba incluye verificación: comprobar si el sistema cumple los requisitos especificados.", "También incluye validación, que mira las necesidades de usuarios y partes interesadas en su entorno operativo.", "Es un error pensar que la prueba solo verifica el objeto de prueba.", "Verificar requisitos y validar son objetivos típicos de la prueba."], "razones": {"a": "Eso es validar.", "b": "Eso es depurar.", "c": "Eso es una tarea del análisis de la prueba.", "d": "Correcta. Es la definición de verificación del programa."}, "clave": "Verificar = requisitos especificados; validar = necesidades reales."}, {"id": "1-35", "cap": 1, "lo": "FL-1.4.3", "k": "K1", "fuente": "1.4.1", "tema": "Procedimiento de prueba (test procedure)", "pregunta": "En la implementación de la prueba, los casos de prueba se organizan en...", "opciones": {"a": "Condiciones de prueba, que se agrupan en cartas de prueba.", "b": "Elementos de cobertura, que se agrupan en bases de prueba.", "c": "Procedimientos de prueba, que a menudo se agrupan en juegos de prueba.", "d": "Informes de prueba, que se agrupan en calendarios de ejecución."}, "correcta": ["c"], "concepto": "Durante la implementación, los casos de prueba se organizan en procedimientos de prueba, que a menudo se agrupan en juegos de prueba.", "explicacion": ["La implementación crea o adquiere el testware necesario para la ejecución.", "Los casos de prueba se organizan en procedimientos de prueba.", "Los procedimientos suelen ensamblarse en juegos de prueba.", "Los procedimientos se priorizan y ordenan en el calendario de ejecución."], "razones": {"a": "Las condiciones de prueba se definen en el análisis.", "b": "Los elementos de cobertura se identifican en el diseño.", "c": "Correcta. Es la organización que describe la implementación de la prueba.", "d": "El calendario se prepara ordenando los procedimientos, no agrupando informes."}, "clave": "Casos -> procedimientos -> juegos de prueba -> calendario de ejecución."}, {"id": "1-36", "cap": 1, "lo": "FL-1.4.1", "k": "K1", "fuente": "1.4.1", "tema": "Condición de prueba (test condition)", "pregunta": "¿Qué afirmación sobre las condiciones de prueba es correcta?", "opciones": {"a": "Se definen en la implementación de la prueba a partir de los procedimientos de prueba.", "b": "Se crean en la compleción de la prueba para resumir lo probado.", "c": "Se obtienen al ejecutar las pruebas y comparar resultados.", "d": "Se definen y priorizan durante el análisis de la prueba, teniendo en cuenta los riesgos."}, "correcta": ["d"], "concepto": "Las condiciones de prueba se definen y priorizan en el análisis de la prueba, teniendo en cuenta los riesgos, y se elaboran en casos de prueba durante el diseño.", "explicacion": ["En el análisis se identifican características comprobables en la base de prueba.", "Se definen y priorizan las condiciones de prueba asociadas según los riesgos.", "Ejemplo: los criterios de aceptación son condiciones de prueba.", "En el diseño, las condiciones se elaboran en casos de prueba y otro testware."], "razones": {"a": "Los procedimientos se crean en la implementación a partir de los casos de prueba.", "b": "En la compleción se crea el informe de compleción, no las condiciones.", "c": "Los resultados reales se comparan en la ejecución.", "d": "Correcta. Es una tarea del análisis de la prueba."}, "clave": "Condiciones de prueba = qué probar; se definen en el análisis."}, {"id": "1-37", "cap": 1, "lo": "FL-1.2.2", "k": "K1", "fuente": "1.2.2", "tema": "Resultado de la prueba (test result)", "pregunta": "Según el programa de estudio, ¿cómo se usan los resultados de la prueba?", "opciones": {"a": "Solo para decidir qué desarrollador corrige cada defecto.", "b": "En la prueba para corregir defectos y en el QA como retroalimentación sobre el rendimiento de los procesos de desarrollo y de prueba.", "c": "Solo para demostrar que el software no contiene defectos.", "d": "Exclusivamente por el equipo de QA, nunca por los probadores."}, "correcta": ["b"], "concepto": "Los resultados de la prueba los usan tanto la prueba, para corregir defectos, como el QA, como retroalimentación del rendimiento de los procesos.", "explicacion": ["Los resultados de la prueba los usan tanto el QA como la prueba.", "En la prueba se usan para corregir defectos.", "En el QA ofrecen retroalimentación sobre el rendimiento de los procesos de desarrollo y de prueba.", "Los resultados trazados a riesgos permiten evaluar el riesgo residual."], "razones": {"a": "No es el único uso descrito en el programa.", "b": "Correcta. Son los dos usos que recoge el programa de estudio.", "c": "La prueba no puede demostrar ausencia de defectos (principio 1).", "d": "Los usan tanto el QA como la prueba."}, "clave": "Resultados: la prueba corrige defectos; el QA mejora procesos."}, {"id": "1-38", "cap": 1, "lo": "FL-1.4.1", "k": "K1", "fuente": "1.4.1", "tema": "Planificación de la prueba (test planning)", "pregunta": "¿Qué actividad de prueba consiste en definir los objetivos de la prueba y seleccionar el enfoque que mejor los logre dentro de las restricciones del contexto?", "opciones": {"a": "Análisis de la prueba.", "b": "Monitorización de la prueba.", "c": "Planificación de la prueba.", "d": "Compleción de la prueba."}, "correcta": ["c"], "concepto": "La planificación de la prueba define los objetivos y selecciona el enfoque que mejor los logra dentro de las restricciones impuestas por el contexto.", "explicacion": ["Define los objetivos de la prueba.", "Selecciona el enfoque que mejor los alcanza dentro de las restricciones del contexto.", "Sus productos incluyen plan de prueba, calendario, registro de riesgos y criterios de entrada y salida.", "Se explica en detalle en la sección 5.1."], "razones": {"a": "El análisis identifica condiciones de prueba a partir de la base de prueba.", "b": "La monitorización comprueba el progreso real frente al plan.", "c": "Correcta. Es la definición de planificación de la prueba.", "d": "La compleción cierra la actividad: archivo, lecciones aprendidas e informe."}, "clave": "Planificar = objetivos + enfoque dentro de las restricciones."}, {"id": "2-01", "cap": 2, "lo": "FL-2.1.2", "k": "K1", "fuente": "2.1.2", "tema": "Buenas prácticas en cualquier ciclo de vida", "pregunta": "¿Cuál de las siguientes es una buena práctica de prueba aplicable a CUALQUIER modelo de ciclo de vida de desarrollo?", "opciones": {"a": "Para cada actividad de desarrollo existe una actividad de prueba correspondiente.", "b": "La prueba solo debe empezar cuando el código esté completo, para no hacer trabajo dos veces.", "c": "Todos los niveles de prueba deben tener los mismos objetivos, para que sean coherentes.", "d": "Los probadores solo deben revisar las versiones finales y aprobadas de los productos de trabajo."}, "correcta": ["a"], "concepto": "Con cualquier ciclo de vida: cada actividad de desarrollo tiene su actividad de prueba, cada nivel tiene objetivos propios, el diseño de la prueba empieza pronto y los probadores revisan borradores.", "explicacion": ["Para cada actividad de desarrollo hay una actividad de prueba correspondiente, así todas quedan sujetas a control de calidad.", "Cada nivel de prueba tiene objetivos específicos y distintos: se evita la redundancia y se logra exhaustividad.", "El análisis y diseño de la prueba de un nivel empiezan durante la fase de desarrollo correspondiente (prueba temprana).", "Los probadores participan en la revisión de los productos de trabajo en cuanto hay borradores."], "razones": {"a": "Correcta. Es la primera buena práctica del programa.", "b": "Contradice el principio de prueba temprana.", "c": "Al revés: cada nivel tiene objetivos específicos y diferentes.", "d": "Deben participar en cuanto hay borradores, no solo en las versiones finales."}, "clave": "Las 4 buenas prácticas: actividad espejo, objetivos distintos por nivel, empezar pronto y revisar borradores."}, {"id": "2-02", "cap": 2, "lo": "FL-2.1.3", "k": "K1", "fuente": "2.1.3", "tema": "Enfoques 'primero la prueba'", "pregunta": "¿Qué enfoque dirige la codificación mediante casos de prueba escritos antes que el código y, después, refactoriza las pruebas y el código?", "opciones": {"a": "Desarrollo guiado por pruebas (TDD).", "b": "Desarrollo guiado por pruebas de aceptación (ATDD).", "c": "Desarrollo guiado por el comportamiento (BDD).", "d": "Prueba exploratoria."}, "correcta": ["a"], "concepto": "TDD dirige la codificación con casos de prueba: se escriben primero las pruebas, luego el código que las satisface, y después se refactorizan pruebas y código.", "explicacion": ["TDD: las pruebas se escriben primero, después el código para satisfacerlas y luego se refactorizan ambos.", "ATDD: las pruebas se derivan de los criterios de aceptación como parte del proceso de diseño del sistema.", "BDD: el comportamiento deseado se expresa con casos de prueba en lenguaje natural, normalmente Given/When/Then.", "En los tres las pruebas se definen antes que el código y pueden mantenerse como pruebas automatizadas."], "razones": {"a": "Correcta. Pruebas primero, luego código y luego refactorización = TDD.", "b": "ATDD deriva las pruebas de los criterios de aceptación.", "c": "BDD expresa el comportamiento en lenguaje natural (Given/When/Then).", "d": "No es un enfoque 'primero la prueba' de desarrollo; es una técnica basada en la experiencia."}, "clave": "TDD → pruebas dirigen el código. ATDD → criterios de aceptación. BDD → Given/When/Then."}, {"id": "2-03", "cap": 2, "lo": "FL-2.1.3", "k": "K1", "fuente": "2.1.3", "tema": "Enfoques 'primero la prueba'", "pregunta": "¿Qué afirmación describe MEJOR el desarrollo guiado por el comportamiento (BDD)?", "opciones": {"a": "Expresa el comportamiento deseado de la aplicación con casos de prueba en lenguaje natural, fáciles de entender por las partes interesadas, normalmente con el formato Given/When/Then.", "b": "Escribe primero las pruebas, después el código que las satisface y luego refactoriza pruebas y código.", "c": "Diseña las pruebas a partir de la estructura interna del código.", "d": "Se limita a automatizar las pruebas de regresión una vez terminado el código."}, "correcta": ["a"], "concepto": "BDD expresa el comportamiento deseado con casos de prueba en lenguaje natural sencillo, comprensible para las partes interesadas, normalmente en formato Given/When/Then.", "explicacion": ["El comportamiento se describe con casos de prueba en una forma simple de lenguaje natural.", "Es fácil de entender por las partes interesadas; el formato habitual es Given/When/Then.", "Los casos de prueba deben traducirse después automáticamente a pruebas ejecutables.", "Como TDD y ATDD, define las pruebas antes de escribir el código."], "razones": {"a": "Correcta.", "b": "Describe TDD.", "c": "Describe la prueba de caja blanca.", "d": "BDD define las pruebas antes de escribir el código, no después."}, "clave": "BDD = comportamiento en lenguaje natural (Given/When/Then)."}, {"id": "2-04", "cap": 2, "lo": "FL-2.1.4", "k": "K2", "fuente": "2.1.4", "tema": "DevOps y prueba", "pregunta": "¿Cuál de los siguientes es un BENEFICIO de DevOps para la prueba?", "opciones": {"a": "Retroalimentación rápida sobre la calidad del código y sobre si los cambios afectan negativamente al código existente.", "b": "Elimina por completo la necesidad de la prueba manual.", "c": "El pipeline de entrega no necesita mantenimiento una vez configurado.", "d": "Ya no hace falta disponer de entornos de prueba."}, "correcta": ["a"], "concepto": "DevOps aporta retroalimentación rápida, más shift left con CI, entornos estables, más visibilidad no funcional y menos prueba manual repetitiva y riesgo de regresión.", "explicacion": ["Da retroalimentación rápida sobre la calidad del código y sobre el efecto de los cambios en el código existente.", "La CI promueve el shift left: código de calidad con pruebas de componente y análisis estático.", "CI/CD facilita entornos de prueba estables y aumenta la visibilidad de las características no funcionales.", "La automatización reduce la prueba manual repetitiva y minimiza el riesgo de regresión.", "Riesgos: definir el pipeline, mantener las herramientas CI/CD y los recursos extra de automatización."], "razones": {"a": "Correcta.", "b": "Reduce la prueba manual repetitiva, pero la prueba manual, sobre todo desde la perspectiva del usuario, sigue haciendo falta.", "c": "Introducir y mantener las herramientas de CI/CD es precisamente un riesgo de DevOps.", "d": "Al contrario: CI/CD facilita establecer entornos de prueba estables."}, "clave": "Reduce ≠ elimina. Las opciones absolutas ('elimina por completo') suelen ser incorrectas."}, {"id": "2-05", "cap": 2, "lo": "FL-2.1.5", "k": "K2", "fuente": "2.1.5", "tema": "Shift-left", "pregunta": "¿Cuál de las siguientes prácticas NO es un ejemplo del enfoque shift-left?", "opciones": {"a": "Revisar la especificación desde la perspectiva de la prueba.", "b": "Escribir los casos de prueba antes de escribir el código.", "c": "Hacer análisis estático del código fuente antes de la prueba dinámica.", "d": "Dejar toda la prueba no funcional para después de terminar la prueba de sistema."}, "correcta": ["d"], "concepto": "Shift left es hacer la prueba antes en el ciclo de vida, sin descuidar la prueba posterior; supone más esfuerzo inicial para ahorrar después.", "explicacion": ["Prácticas: revisar la especificación como probador y escribir los casos de prueba antes que el código.", "También: usar CI (mejor CD) y completar el análisis estático antes de la prueba dinámica.", "La prueba no funcional debe empezar, si es posible, ya en el nivel de componente.", "No significa descuidar la prueba posterior; puede costar más al inicio pero ahorra esfuerzo después."], "razones": {"a": "Es shift-left.", "b": "Es shift-left.", "c": "Es shift-left.", "d": "Correcta. Retrasar la prueba no funcional va en contra del shift-left, que propone empezarla en el nivel de componente cuando sea posible."}, "clave": "Ojo a los 'NO' en el enunciado: subráyalos mentalmente."}, {"id": "2-06", "cap": 2, "lo": "FL-2.1.6", "k": "K2", "fuente": "2.1.6", "tema": "Retrospectivas", "pregunta": "En una retrospectiva, ¿qué se trata típicamente?", "opciones": {"a": "Qué ha ido bien, qué no ha ido bien y cómo mejorar.", "b": "La asignación de culpas por los defectos que se han escapado.", "c": "La planificación detallada del calendario de la siguiente versión.", "d": "La revisión técnica del código fuente."}, "correcta": ["a"], "concepto": "En las retrospectivas se discute qué tuvo éxito y se mantiene, qué no y puede mejorar, y cómo incorporar las mejoras; es clave para la mejora continua.", "explicacion": ["Se celebran al final de un proyecto o iteración, en un hito de entrega o cuando hace falta.", "Participan probadores, desarrolladores, arquitectos, product owner, analistas de negocio, etc.", "Se discute qué mantener, qué mejorar y cómo incorporar mejoras; los resultados se registran y se les da seguimiento.", "Beneficios: más eficacia y eficiencia, mejor calidad de los productos de prueba y de la base de prueba, y mejor cooperación."], "razones": {"a": "Correcta.", "b": "Una retrospectiva busca la mejora continua, no culpables.", "c": "Eso es planificación, no el objeto de una retrospectiva.", "d": "Eso es una revisión (prueba estática)."}, "clave": "Retrospectiva = mejora continua: bien / mal / cómo mejorar."}, {"id": "2-07", "cap": 2, "lo": "FL-2.2.1", "k": "K2", "fuente": "2.2.1", "tema": "Niveles de prueba", "pregunta": "Un equipo prueba las interfaces y la interacción entre su sistema de reservas y la pasarela de pago externa de un proveedor. ¿Qué nivel de prueba es?", "opciones": {"a": "Prueba de integración de componentes.", "b": "Prueba de integración de sistemas.", "c": "Prueba de sistema.", "d": "Prueba de aceptación."}, "correcta": ["b"], "concepto": "La prueba de integración de sistemas se centra en las interfaces del sistema bajo prueba con otros sistemas y servicios externos.", "explicacion": ["Integración de sistemas: interfaces del sistema con otros sistemas y servicios externos.", "Requiere entornos de prueba adecuados, preferiblemente similares al entorno operativo.", "Integración de componentes: interfaces e interacciones entre componentes.", "Sistema: comportamiento y capacidades globales de un sistema o producto completo."], "razones": {"a": "Esa sería entre componentes, no con un servicio externo.", "b": "Correcta. Sistema propio ↔ servicio externo = integración de sistemas.", "c": "La prueba de sistema se centra en el comportamiento global del sistema completo, no en la interfaz con sistemas externos.", "d": "La aceptación se centra en la validación y la preparación para el despliegue."}, "clave": "¿Es 'otro sistema' o 'servicio externo'? → integración de SISTEMAS."}, {"id": "2-08", "cap": 2, "lo": "FL-2.2.1", "k": "K2", "fuente": "2.2.1", "tema": "Niveles de prueba", "pregunta": "Antes de la puesta en producción, un banco pide a un grupo de empleados de sus oficinas que usen el nuevo sistema con sus tareas diarias reales en un entorno parecido al de producción, para confirmar que satisface sus necesidades. ¿Qué tipo de prueba es?", "opciones": {"a": "Prueba de sistema.", "b": "Prueba de aceptación de usuario.", "c": "Prueba de aceptación contractual.", "d": "Prueba de integración de componentes."}, "correcta": ["b"], "concepto": "La prueba de aceptación se centra en la validación y en demostrar la preparación para el despliegue; idealmente la hacen los usuarios previstos (UAT).", "explicacion": ["Aceptación: validación y demostración de que el sistema satisface las necesidades de negocio del usuario.", "Idealmente la realizan los usuarios previstos.", "Formas principales: UAT, operativa, contractual, regulatoria, alfa y beta.", "La prueba de sistema se relaciona con las especificaciones del sistema y puede hacerla un equipo independiente."], "razones": {"a": "La prueba de sistema se relaciona con las especificaciones y se centra en el sistema completo, no en validar necesidades con usuarios.", "b": "Correcta. Usuarios reales validando sus necesidades de negocio → UAT.", "c": "La contractual es otra forma de aceptación, ligada a criterios de un contrato; aquí los usuarios validan sus necesidades.", "d": "Es un nivel técnico entre componentes."}, "clave": "Usuarios previstos validando necesidades de negocio = aceptación de usuario (UAT)."}, {"id": "2-09", "cap": 2, "lo": "FL-2.2.2", "k": "K2", "fuente": "2.2.2", "tema": "Tipos de prueba", "pregunta": "¿Cuál de los siguientes es un ejemplo de prueba NO funcional?", "opciones": {"a": "Comprobar que el carrito suma bien el precio de los productos.", "b": "Comprobar que la página de búsqueda responde en menos de 2 segundos con 500 usuarios concurrentes.", "c": "Comprobar que un usuario bloqueado no puede iniciar sesión.", "d": "Comprobar que se aplica el descuento del 10 % a los socios."}, "correcta": ["b"], "concepto": "La prueba funcional evalúa QUÉ debe hacer el sistema; la no funcional evalúa atributos distintos de los funcionales, es decir, cómo de bien se comporta.", "explicacion": ["Funcional: evalúa las funciones que debe realizar el objeto de prueba (el 'qué').", "No funcional: evalúa 'cómo de bien' se comporta, atributos distintos de las características funcionales.", "ISO/IEC 25010 las clasifica: eficiencia de desempeño, compatibilidad, usabilidad, fiabilidad, seguridad, mantenibilidad, portabilidad, safety.", "Un tiempo de respuesta exigido es una restricción no funcional (eficiencia de desempeño)."], "razones": {"a": "Funcional: resultado de un cálculo.", "b": "Correcta. Tiempo de respuesta con carga = eficiencia de desempeño (no funcional).", "c": "Funcional: regla de negocio de acceso.", "d": "Funcional: regla de negocio."}, "clave": "Funcional = QUÉ hace. No funcional = CÓMO DE BIEN lo hace."}, {"id": "2-10", "cap": 2, "lo": "FL-2.2.3", "k": "K2", "fuente": "2.2.3", "tema": "Prueba de confirmación y de regresión", "pregunta": "Se corrige un defecto en el cálculo del IVA. El probador vuelve a ejecutar el caso de prueba que había fallado y además ejecuta pruebas sobre la facturación y los descuentos, que usan ese mismo cálculo. ¿Qué tipos de prueba ha realizado?", "opciones": {"a": "Regresión en ambos casos.", "b": "Confirmación al repetir el caso que falló, y regresión al probar la facturación y los descuentos.", "c": "Confirmación en ambos casos.", "d": "Prueba de mantenimiento al repetir el caso, y prueba de sistema al probar la facturación."}, "correcta": ["b"], "concepto": "La prueba de confirmación comprueba que el defecto original se ha corregido; la de regresión, que el cambio no ha causado consecuencias adversas en otras partes.", "explicacion": ["Confirmación: se repiten los casos que fallaron por el defecto, o se añaden pruebas nuevas si hace falta.", "Regresión: confirma que no hay consecuencias adversas, incluso tras una corrección ya confirmada.", "Los efectos pueden afectar al mismo componente, a otros componentes o a otros sistemas conectados.", "Conviene un análisis de impacto previo para decidir el alcance de la regresión."], "razones": {"a": "Repetir el caso que falló es confirmación, no regresión.", "b": "Correcta.", "c": "Probar otras zonas posiblemente afectadas es regresión.", "d": "Mezcla conceptos; no describe lo que ha hecho."}, "clave": "Confirmación = ¿se arregló? Regresión = ¿se ha roto algo más?"}, {"id": "2-11", "cap": 2, "lo": "FL-2.3.1", "k": "K1", "fuente": "2.3", "tema": "Prueba de mantenimiento", "pregunta": "¿Cuál de los siguientes es un desencadenante de la prueba de mantenimiento?", "opciones": {"a": "La migración de un sistema en producción a una plataforma nueva.", "b": "La redacción de la primera historia de usuario de un producto nuevo.", "c": "La prueba de aceptación inicial de un sistema que aún no se ha desplegado.", "d": "La contratación de nuevos probadores para el equipo."}, "correcta": ["a"], "concepto": "Los desencadenantes del mantenimiento y de su prueba son las modificaciones, las actualizaciones o migraciones del entorno operativo y la retirada del sistema.", "explicacion": ["Modificaciones: mejoras planificadas (por versiones), cambios correctivos o arreglos urgentes (hot fixes).", "Actualizaciones o migraciones del entorno operativo: pueden requerir probar el nuevo entorno y la conversión de datos.", "Retirada de una aplicación: puede requerir probar el archivado de datos y los procedimientos de restauración.", "Se prueba el éxito del cambio y se buscan regresiones en lo que no cambia."], "razones": {"a": "Correcta. Una migración del entorno operativo es un desencadenante típico.", "b": "Es el inicio de un desarrollo nuevo, no mantenimiento de un sistema operativo.", "c": "El sistema aún no está en operación.", "d": "No tiene relación con el objeto de prueba."}, "clave": "Mantenimiento = sistema YA en producción: modificación, migración o retirada."}, {"id": "2-12", "cap": 2, "lo": "FL-2.2.2", "k": "K1", "fuente": "2.2.2", "tema": "Tipos de prueba", "pregunta": "¿En qué se basa la prueba de caja blanca?", "opciones": {"a": "En la estructura interna o la implementación del sistema.", "b": "En las especificaciones externas del sistema.", "c": "En la experiencia y la intuición del probador.", "d": "En las opiniones de los usuarios finales."}, "correcta": ["a"], "concepto": "La prueba de caja blanca está basada en la estructura y deriva las pruebas de la implementación o estructura interna; la de caja negra, de la especificación.", "explicacion": ["Caja blanca: deriva las pruebas del código, la arquitectura, los flujos de trabajo y de datos.", "Su objetivo principal es cubrir la estructura subyacente hasta un nivel aceptable.", "Caja negra: basada en la especificación, deriva las pruebas de documentación no relacionada con la estructura interna.", "Ambas pueden aplicarse en todos los niveles de prueba."], "razones": {"a": "Correcta.", "b": "Eso es caja negra.", "c": "Eso son técnicas basadas en la experiencia, no la caja blanca.", "d": "No define ningún tipo de prueba del programa."}, "clave": "Caja blanca = estructura. Caja negra = especificación."}, {"id": "2-13", "cap": 2, "lo": "FL-2.1.1", "k": "K2", "fuente": "2.1.1", "tema": "Ciclo de vida y prueba", "pregunta": "¿Qué afirmación describe correctamente la diferencia entre un ciclo de vida secuencial y uno iterativo e incremental respecto a la prueba?", "opciones": {"a": "En el ciclo secuencial la prueba dinámica puede empezar en la primera fase, mientras que en el iterativo solo se hace al final.", "b": "En el ciclo iterativo e incremental cada iteración entrega un incremento funcional, lo que exige retroalimentación rápida y una prueba de regresión extensa.", "c": "En el ciclo secuencial se prueba cada incremento por separado, por lo que no hace falta prueba de regresión.", "d": "En el ciclo iterativo e incremental la prueba se concentra en una única fase final tras terminar todo el desarrollo."}, "correcta": ["b"], "concepto": "En los modelos iterativos e incrementales cada iteración entrega un producto o incremento funcional, lo que exige retroalimentación rápida y mucha prueba de regresión.", "explicacion": ["Secuencial: el código ejecutable se crea en fases tardías, así que normalmente no hay prueba dinámica pronto.", "Secuencial: al inicio los probadores participan en revisiones de requisitos, análisis y diseño de la prueba.", "Iterativo e incremental: cada iteración entrega un incremento, con prueba estática y dinámica en todos los niveles.", "La entrega frecuente de incrementos exige retroalimentación rápida y una prueba de regresión extensa."], "razones": {"a": "Es al revés: en el secuencial no suele poderse hacer prueba dinámica pronto, porque el código llega tarde.", "b": "Correcta. Cada iteración entrega un incremento y obliga a una regresión extensa.", "c": "El secuencial no se caracteriza por entregar incrementos; es el iterativo e incremental el que exige regresión extensa.", "d": "En el iterativo e incremental se prueba en cada iteración, no en una única fase final."}, "clave": "Iterativo/incremental = entregas frecuentes y regresión extensa; secuencial = prueba dinámica tardía."}, {"id": "2-14", "cap": 2, "lo": "FL-2.1.1", "k": "K2", "fuente": "2.1.1", "tema": "Ciclo de vida y prueba", "pregunta": "En un proyecto ágil, donde se asume que el cambio puede producirse durante todo el proyecto, ¿qué se favorece respecto a la prueba?", "opciones": {"a": "La prueba se realiza solo al final del proyecto por un equipo independiente.", "b": "La documentación de los productos de trabajo debe ser exhaustiva y estar aprobada antes de empezar a programar.", "c": "Una documentación ligera de los productos de trabajo y una automatización extensa de la prueba que facilite la regresión.", "d": "Que la prueba manual se base en un análisis y diseño detallados y previos de todos los casos de prueba."}, "correcta": ["c"], "concepto": "En ágil, como el cambio puede ocurrir en cualquier momento, se favorecen la documentación ligera y la automatización extensa para facilitar la regresión.", "explicacion": ["Ágil asume que el cambio puede producirse durante todo el proyecto.", "Se favorece una documentación ligera de los productos de trabajo.", "Se favorece una automatización extensa de la prueba para facilitar la regresión.", "La mayor parte de la prueba manual usa técnicas basadas en la experiencia, sin análisis y diseño previos extensos."], "razones": {"a": "En iterativo e incremental se prueba en cada iteración, no solo al final.", "b": "Es lo contrario de lo que se favorece en ágil: documentación ligera.", "c": "Correcta. Documentación ligera y automatización extensa de la regresión.", "d": "La prueba manual en ágil suele usar técnicas basadas en la experiencia, que no requieren análisis y diseño previos extensos."}, "clave": "Ágil = documentación ligera + automatización de regresión + técnicas basadas en la experiencia."}, {"id": "2-15", "cap": 2, "lo": "FL-2.1.2", "k": "K1", "fuente": "2.1.2", "tema": "Buenas prácticas de prueba", "pregunta": "¿Cuál de las siguientes es una buena práctica de prueba aplicable a cualquier ciclo de vida de desarrollo?", "opciones": {"a": "Dejar la prueba estática para después de la prueba de aceptación.", "b": "Aplicar los mismos objetivos de prueba a todos los niveles de prueba.", "c": "Empezar a diseñar las pruebas solo cuando el código esté terminado.", "d": "Que los probadores participen en las revisiones de los productos de trabajo en cuanto haya borradores disponibles."}, "correcta": ["d"], "concepto": "Buenas prácticas: cada actividad de desarrollo tiene su actividad de prueba, cada nivel tiene objetivos específicos y los probadores revisan borradores pronto.", "explicacion": ["Para cada actividad de desarrollo hay una actividad de prueba correspondiente.", "Cada nivel de prueba tiene objetivos de prueba específicos y distintos.", "El análisis y diseño de pruebas de un nivel empieza durante la fase de desarrollo correspondiente.", "Los probadores participan en revisiones de borradores para apoyar el shift left y detectar defectos pronto."], "razones": {"a": "La prueba estática y la detección de defectos deben hacerse pronto, no al final.", "b": "Cada nivel tiene objetivos específicos y diferentes.", "c": "El diseño de pruebas debe empezar durante la fase de desarrollo correspondiente.", "d": "Correcta. Apoya el shift left, con detección temprana de defectos."}, "clave": "Buena práctica = prueba temprana y objetivos propios por nivel."}, {"id": "2-16", "cap": 2, "lo": "FL-2.1.3", "k": "K1", "fuente": "2.1.3", "tema": "Enfoques test-first", "pregunta": "¿Qué enfoque test-first deriva las pruebas de los criterios de aceptación como parte del proceso de diseño del sistema y las escribe antes de desarrollar la parte de la aplicación?", "opciones": {"a": "Desarrollo guiado por pruebas (TDD).", "b": "Desarrollo guiado por pruebas de aceptación (ATDD).", "c": "Prueba exploratoria basada en sesiones.", "d": "Prueba de regresión automatizada."}, "correcta": ["b"], "concepto": "ATDD deriva las pruebas de los criterios de aceptación como parte del proceso de diseño del sistema, y las escribe antes de desarrollar la parte de la aplicación.", "explicacion": ["ATDD: pruebas derivadas de los criterios de aceptación, escritas antes de desarrollar esa parte de la aplicación.", "TDD: las pruebas dirigen la codificación; primero pruebas, luego código y refactorización.", "BDD: comportamiento esperado en lenguaje natural, normalmente Given/When/Then.", "Los tres implementan la prueba temprana y el shift left porque definen las pruebas antes del código."], "razones": {"a": "TDD dirige la codificación con las pruebas; no parte de los criterios de aceptación.", "b": "Correcta. ATDD se basa en criterios de aceptación.", "c": "La exploratoria no es un enfoque test-first.", "d": "La regresión se ejecuta tras cambios, no guía el desarrollo."}, "clave": "Criterios de aceptación = ATDD; pruebas dirigen el código = TDD."}, {"id": "2-17", "cap": 2, "lo": "FL-2.1.4", "k": "K2", "fuente": "2.1.4", "tema": "DevOps y prueba", "pregunta": "¿Cuál de las siguientes es un riesgo o desafío de DevOps para la prueba?", "opciones": {"a": "Se pierde la retroalimentación rápida sobre la calidad del código.", "b": "Se elimina por completo la necesidad de la prueba manual.", "c": "Hay que definir y establecer el pipeline de CI/CD, y la automatización de pruebas requiere recursos adicionales y puede ser difícil de establecer y mantener.", "d": "Desarrollo y operaciones dejan de colaborar hacia objetivos comunes."}, "correcta": ["c"], "concepto": "DevOps ofrece retroalimentación rápida y CI/CD, pero exige definir el pipeline, introducir y mantener herramientas y recursos extra para automatizar las pruebas.", "explicacion": ["Beneficios: retroalimentación rápida, CI/CD, entornos estables y menos prueba manual repetitiva.", "Riesgo: hay que definir y establecer el pipeline de entrega de DevOps.", "Riesgo: hay que introducir y mantener las herramientas de CI/CD.", "La automatización requiere recursos adicionales y puede ser difícil de establecer y mantener.", "La prueba manual, sobre todo desde la perspectiva del usuario, sigue haciendo falta."], "razones": {"a": "Es un beneficio de DevOps, justo lo contrario.", "b": "La prueba manual sigue siendo necesaria.", "c": "Correcta. Es un desafío descrito para DevOps.", "d": "DevOps busca que desarrollo (incluida la prueba) y operaciones trabajen juntos hacia objetivos comunes."}, "clave": "DevOps: beneficios de velocidad, coste de montar pipeline y automatización."}, {"id": "2-18", "cap": 2, "lo": "FL-2.2.1", "k": "K1", "fuente": "2.2.1", "tema": "Niveles de prueba", "pregunta": "¿Qué nivel de prueba se centra en el comportamiento y las capacidades de un sistema o producto completo, incluidas las tareas de extremo a extremo?", "opciones": {"a": "Prueba de sistema.", "b": "Prueba de componente.", "c": "Prueba de integración de componentes.", "d": "Prueba de integración de sistemas."}, "correcta": ["a"], "concepto": "La prueba de sistema se centra en el comportamiento y las capacidades de todo un sistema o producto, a menudo con tareas de extremo a extremo.", "explicacion": ["Componente: componentes en aislamiento, normalmente por desarrolladores.", "Integración de componentes: interfaces e interacciones entre componentes.", "Sistema: comportamiento global, a menudo prueba funcional de tareas de extremo a extremo y no funcional de características de calidad.", "Integración de sistemas: interfaces del sistema con otros sistemas y servicios externos."], "razones": {"a": "Correcta. Cubre el sistema completo y las tareas de extremo a extremo.", "b": "Se centra en componentes en aislamiento.", "c": "Se centra en interfaces e interacciones entre componentes.", "d": "Se centra en interfaces con otros sistemas y servicios externos."}, "clave": "Extremo a extremo y sistema completo = prueba de sistema."}, {"id": "2-19", "cap": 2, "lo": "FL-2.2.2", "k": "K2", "fuente": "2.2.2", "tema": "Tipos de prueba", "pregunta": "¿Cuál de las siguientes características de calidad se evalúa mediante prueba no funcional según la clasificación ISO/IEC 25010?", "opciones": {"a": "Corrección funcional.", "b": "Cobertura de sentencias.", "c": "Trazabilidad de requisitos.", "d": "Compatibilidad."}, "correcta": ["d"], "concepto": "La prueba no funcional comprueba las características de calidad no funcionales de ISO/IEC 25010, como eficiencia de desempeño, compatibilidad, usabilidad o fiabilidad.", "explicacion": ["La prueba funcional comprueba completitud, corrección y adecuación funcionales.", "No funcionales: eficiencia de desempeño, compatibilidad, usabilidad, fiabilidad.", "También: seguridad (security), mantenibilidad, portabilidad y safety.", "La cobertura de sentencias es un objetivo de la prueba de caja blanca (cubrir la estructura), no una característica de calidad."], "razones": {"a": "La corrección funcional se comprueba con prueba funcional.", "b": "Es una medida de cobertura estructural (caja blanca), no una característica de calidad no funcional.", "c": "No figura entre las características de calidad no funcionales de ISO/IEC 25010 del programa.", "d": "Correcta. La compatibilidad es una característica no funcional."}, "clave": "Completitud, corrección y adecuación = funcional; las ocho de ISO 25010 = no funcional."}, {"id": "2-20", "cap": 2, "lo": "FL-2.2.2", "k": "K2", "fuente": "2.2.2", "tema": "Tipos de prueba", "pregunta": "¿Qué afirmación sobre los tipos de prueba es correcta?", "opciones": {"a": "La prueba de caja blanca solo es aplicable a la prueba de componente.", "b": "La prueba funcional solo se realiza en el nivel de prueba de aceptación.", "c": "La prueba de caja negra se basa en la estructura interna del código.", "d": "Los tipos de prueba pueden aplicarse a todos los niveles de prueba, y la prueba no funcional a veces conviene empezarla pronto."}, "correcta": ["d"], "concepto": "Los cuatro tipos de prueba (funcional, no funcional, caja negra y caja blanca) pueden aplicarse a todos los niveles, aunque el foco cambie en cada nivel.", "explicacion": ["Los cuatro tipos pueden aplicarse a todos los niveles de prueba, con distinto foco en cada uno.", "A veces conviene empezar la prueba no funcional pronto, por ejemplo en revisiones o en la prueba de componente.", "Descubrir tarde defectos no funcionales puede suponer una grave amenaza para el éxito del proyecto.", "Caja negra: basada en especificaciones. Caja blanca: basada en la estructura interna."], "razones": {"a": "La caja blanca puede aplicarse a todos los niveles.", "b": "La funcional puede aplicarse en todos los niveles.", "c": "La caja negra se basa en especificaciones, no en la estructura interna.", "d": "Correcta. Los tipos de prueba no están ligados a un único nivel."}, "clave": "Tipo de prueba no es igual a nivel de prueba."}, {"id": "2-21", "cap": 2, "lo": "FL-2.2.3", "k": "K2", "fuente": "2.2.3", "tema": "Confirmación y regresión", "pregunta": "¿Por qué la prueba de regresión es una candidata fuerte a la automatización?", "opciones": {"a": "Porque se ejecuta solo una vez después de corregir cada defecto.", "b": "Porque solo comprueba que el defecto corregido ya no aparece.", "c": "Porque sustituye a la prueba de confirmación.", "d": "Porque las suites de regresión se ejecutan muchas veces y el número de casos suele crecer con cada iteración o versión."}, "correcta": ["d"], "concepto": "Las suites de regresión se ejecutan muchas veces y sus casos aumentan con cada iteración o versión, por lo que son candidatas fuertes a la automatización.", "explicacion": ["Regresión: confirma que un cambio no ha causado consecuencias adversas, ni siquiera tras una corrección ya confirmada.", "Las consecuencias pueden afectar al mismo componente, a otros o a otros sistemas conectados.", "Las suites de regresión se ejecutan muchas veces y crecen con cada iteración o versión.", "Con CI, como en DevOps, conviene incluir pruebas de regresión automatizadas en distintos niveles."], "razones": {"a": "Se ejecuta repetidamente, no una sola vez.", "b": "Eso describe la prueba de confirmación.", "c": "No la sustituye; la confirmación y la regresión tienen objetivos distintos.", "d": "Correcta. Su repetición y crecimiento compensan la automatización."}, "clave": "Confirmación = el defecto ya no está; regresión = no se rompió nada más."}, {"id": "2-22", "cap": 2, "lo": "FL-2.3.1", "k": "K2", "fuente": "2.3", "tema": "Prueba de mantenimiento", "pregunta": "¿Qué es el análisis de impacto en el contexto de la prueba de mantenimiento?", "opciones": {"a": "Analizar las posibles consecuencias de un cambio en otras áreas del sistema, para decidir si debe hacerse y qué partes pueden verse afectadas.", "b": "Ejecutar de nuevo todas las pruebas de aceptación tras cada modificación.", "c": "Medir el rendimiento del sistema en el entorno de producción.", "d": "Verificar que un defecto concreto ya ha sido corregido."}, "correcta": ["a"], "concepto": "El análisis de impacto, hecho antes del cambio, ayuda a decidir si debe hacerse según sus posibles consecuencias y muestra qué partes pueden verse afectadas.", "explicacion": ["Puede hacerse antes de realizar un cambio, para decidir si debe hacerse según sus consecuencias en otras áreas.", "Muestra qué partes del software podrían verse afectadas y ayuda a decidir el alcance de la regresión.", "La prueba de mantenimiento evalúa el éxito del cambio y comprueba posibles regresiones en lo que no cambia.", "Su alcance depende del riesgo del cambio, del tamaño del sistema existente y del tamaño del cambio."], "razones": {"a": "Correcta. Es el propósito del análisis de impacto.", "b": "Reejecutar todo no es análisis de impacto.", "c": "Eso es medir rendimiento, no análisis de impacto.", "d": "Eso es la prueba de confirmación."}, "clave": "Análisis de impacto = qué afecta el cambio, antes de hacerlo."}, {"id": "2-23", "cap": 2, "lo": "FL-2.2.1", "k": "K1", "fuente": "2.2.1", "tema": "Prueba de componente (component testing)", "pregunta": "¿Qué nivel de prueba se centra en probar componentes en aislamiento y suele requerir arneses de prueba o marcos de pruebas unitarias?", "opciones": {"a": "Prueba de componente.", "b": "Prueba de integración de componentes.", "c": "Prueba de sistema.", "d": "Prueba de aceptación."}, "correcta": ["a"], "concepto": "La prueba de componente (o unitaria) se centra en probar componentes en aislamiento y suele requerir arneses de prueba o marcos de pruebas unitarias.", "explicacion": ["Se conoce también como prueba unitaria.", "Se centra en componentes en aislamiento.", "Suele requerir soporte específico, como arneses de prueba o marcos de pruebas unitarias.", "Normalmente la realizan los desarrolladores en sus entornos de desarrollo."], "razones": {"a": "Correcta. Componentes en aislamiento = prueba de componente.", "b": "Se centra en las interfaces e interacciones entre componentes.", "c": "Se centra en el comportamiento global de un sistema completo.", "d": "Se centra en la validación y en demostrar la preparación para el despliegue."}, "clave": "Componente = aislado, arnés de prueba, desarrolladores."}, {"id": "2-24", "cap": 2, "lo": "FL-2.2.1", "k": "K1", "fuente": "2.2", "tema": "Nivel de prueba (test level)", "pregunta": "¿Cómo define el programa de estudio un nivel de prueba?", "opciones": {"a": "Un grupo de actividades de prueba que se organizan y gestionan conjuntamente, cada una instancia del proceso de prueba.", "b": "Un grupo de actividades de prueba relacionadas con características de calidad específicas.", "c": "Una forma de derivar pruebas a partir de la estructura interna del objeto de prueba.", "d": "El grado de detalle de la documentación de prueba de un proyecto."}, "correcta": ["a"], "concepto": "Los niveles de prueba son grupos de actividades de prueba organizadas y gestionadas conjuntamente; cada nivel es una instancia del proceso de prueba.", "explicacion": ["Un nivel de prueba agrupa actividades que se organizan y gestionan juntas.", "Cada nivel es una instancia del proceso de prueba, aplicada al software en una fase de desarrollo dada.", "Va de componentes individuales a sistemas completos o sistemas de sistemas.", "Los niveles se distinguen por objeto de prueba, objetivos, base de prueba, defectos y fallos, enfoque y responsabilidades."], "razones": {"a": "Correcta. Es la definición de nivel de prueba.", "b": "Eso define un tipo de prueba, no un nivel.", "c": "Eso describe la prueba de caja blanca.", "d": "No es una definición de nivel de prueba; el nivel de detalle de la documentación depende del ciclo de vida."}, "clave": "Nivel = grupo de actividades gestionadas juntas; tipo = grupo ligado a características de calidad."}, {"id": "2-25", "cap": 2, "lo": "FL-2.2.2", "k": "K1", "fuente": "2.2", "tema": "Tipo de prueba (test type)", "pregunta": "¿Cuál de las siguientes afirmaciones sobre los tipos de prueba es correcta?", "opciones": {"a": "Cada tipo de prueba pertenece a un único nivel de prueba.", "b": "Son grupos de actividades de prueba relacionadas con características de calidad específicas, y la mayoría pueden realizarse en cada nivel de prueba.", "c": "Son grupos de actividades que se organizan y gestionan conjuntamente como una instancia del proceso de prueba.", "d": "El programa solo describe dos tipos de prueba: funcional y no funcional."}, "correcta": ["b"], "concepto": "Los tipos de prueba son grupos de actividades relacionadas con características de calidad específicas, y la mayoría pueden realizarse en cada nivel de prueba.", "explicacion": ["Un tipo de prueba agrupa actividades relacionadas con características de calidad específicas.", "La mayoría de esas actividades pueden realizarse en cada nivel de prueba.", "El programa trata cuatro tipos: funcional, no funcional, caja negra y caja blanca.", "Se pueden usar distintas técnicas de prueba para derivar condiciones y casos de prueba de todos ellos."], "razones": {"a": "Pueden aplicarse a todos los niveles, con distinto foco.", "b": "Correcta. Es la definición de tipo de prueba.", "c": "Eso define un nivel de prueba.", "d": "El programa trata cuatro tipos: funcional, no funcional, caja negra y caja blanca."}, "clave": "Tipo = característica de calidad; nivel = grupo gestionado junto."}, {"id": "2-26", "cap": 2, "lo": "FL-2.2.1", "k": "K1", "fuente": "2.2.1", "tema": "Prueba de integración de componentes (component integration testing)", "pregunta": "¿Cuál de las siguientes afirmaciones sobre la prueba de integración de componentes es correcta?", "opciones": {"a": "Se centra en las interfaces e interacciones entre componentes y depende mucho de la estrategia de integración (ascendente, descendente o big-bang).", "b": "Se centra en las interfaces del sistema con otros sistemas y servicios externos.", "c": "Se centra en probar los componentes en aislamiento.", "d": "Se centra en demostrar que el sistema satisface las necesidades de negocio del usuario."}, "correcta": ["a"], "concepto": "La prueba de integración de componentes se centra en las interfaces e interacciones entre componentes y depende mucho de la estrategia de integración.", "explicacion": ["Se conoce también como prueba de integración de unidades.", "Se centra en las interfaces e interacciones entre componentes.", "Depende mucho de la estrategia de integración: ascendente (bottom-up), descendente (top-down) o big-bang.", "Si la interfaz es con otro sistema o servicio externo, es prueba de integración de sistemas."], "razones": {"a": "Correcta.", "b": "Eso describe la prueba de integración de sistemas.", "c": "Eso describe la prueba de componente.", "d": "Eso describe la prueba de aceptación."}, "clave": "Integración de componentes = entre componentes y según estrategia de integración."}, {"id": "2-27", "cap": 2, "lo": "FL-2.2.2", "k": "K1", "fuente": "2.2.2", "tema": "Prueba de caja negra (black-box testing)", "pregunta": "¿Qué tipo de prueba está basado en la especificación, deriva las pruebas de documentación no relacionada con la estructura interna del objeto de prueba y busca comprobar el comportamiento frente a sus especificaciones?", "opciones": {"a": "Prueba de caja negra.", "b": "Prueba de caja blanca.", "c": "Prueba de confirmación.", "d": "Prueba de mantenimiento."}, "correcta": ["a"], "concepto": "La prueba de caja negra está basada en la especificación: deriva las pruebas de documentación no relacionada con la estructura interna y comprueba el comportamiento frente a ella.", "explicacion": ["Caja negra: basada en la especificación, sin usar la estructura interna del objeto de prueba.", "Su objetivo principal es comprobar el comportamiento del sistema frente a sus especificaciones.", "Caja blanca: basada en la estructura, deriva las pruebas del código, la arquitectura o los flujos de datos.", "Ambos tipos pueden aplicarse en todos los niveles de prueba."], "razones": {"a": "Correcta. Basada en la especificación = caja negra.", "b": "La caja blanca deriva las pruebas de la estructura interna o la implementación.", "c": "La confirmación comprueba que un defecto original se ha corregido.", "d": "El mantenimiento prueba los cambios en un sistema operativo."}, "clave": "Caja negra = especificación; caja blanca = estructura."}, {"id": "2-28", "cap": 2, "lo": "FL-2.2.2", "k": "K1", "fuente": "2.2.2", "tema": "Prueba funcional (functional testing)", "pregunta": "¿Cuál de las siguientes afirmaciones sobre la prueba funcional es correcta?", "opciones": {"a": "Evalúa las funciones que un componente o sistema debe realizar (el 'qué'), comprobando completitud, corrección y adecuación funcionales.", "b": "Evalúa 'cómo de bien' se comporta el sistema, es decir, atributos distintos de las características funcionales.", "c": "Se basa en la estructura interna y su objetivo principal es cubrirla hasta un nivel aceptable.", "d": "Solo puede aplicarse en el nivel de prueba de sistema."}, "correcta": ["a"], "concepto": "La prueba funcional evalúa las funciones que debe realizar un componente o sistema (el 'qué'), comprobando completitud, corrección y adecuación funcionales.", "explicacion": ["Evalúa las funciones que un componente o sistema debe realizar: el 'qué' del objeto de prueba.", "Su objetivo principal es comprobar la completitud, la corrección y la adecuación funcionales.", "La prueba no funcional evalúa 'cómo de bien' se comporta el sistema.", "Puede aplicarse en todos los niveles de prueba."], "razones": {"a": "Correcta.", "b": "Eso describe la prueba no funcional.", "c": "Eso describe la prueba de caja blanca.", "d": "Puede aplicarse en todos los niveles de prueba."}, "clave": "Funcional = el QUÉ; no funcional = el CÓMO DE BIEN."}, {"id": "3-01", "cap": 3, "lo": "FL-3.1.1", "k": "K1", "fuente": "3.1.1", "tema": "Productos examinables por prueba estática", "pregunta": "¿Cuál de los siguientes conjuntos de productos de trabajo puede examinarse mediante prueba estática?", "opciones": {"a": "Solo el código fuente.", "b": "Solo los productos ejecutables.", "c": "Especificaciones de requisitos, código fuente, planes de prueba, casos de prueba y contratos.", "d": "Solo los documentos con una estructura formal que pueda analizar una herramienta."}, "correcta": ["c"], "concepto": "Casi cualquier producto de trabajo puede examinarse con prueba estática; cualquiera que pueda leerse y entenderse puede revisarse.", "explicacion": ["Ejemplos: especificaciones de requisitos, código fuente, planes de prueba, casos de prueba y elementos del backlog.", "También: cartas de prueba, documentación del proyecto, contratos y modelos.", "Cualquier producto que pueda leerse y entenderse puede ser objeto de una revisión.", "El análisis estático necesita productos con una estructura que comprobar (modelos, código o texto con sintaxis formal)."], "razones": {"a": "Demasiado restrictivo: casi cualquier producto de trabajo es examinable.", "b": "La prueba estática no necesita ejecutar; sirve también para productos no ejecutables.", "c": "Correcta.", "d": "Eso es lo que necesita el ANÁLISIS ESTÁTICO con herramientas, no la revisión."}, "clave": "Revisión → cualquier cosa legible. Análisis estático → necesita una estructura formal."}, {"id": "3-02", "cap": 3, "lo": "FL-3.1.2", "k": "K2", "fuente": "3.1.3", "tema": "Valor de la prueba estática", "pregunta": "¿Qué defecto se detecta más fácilmente con prueba estática que con prueba dinámica?", "opciones": {"a": "Un tiempo de respuesta excesivo con 1.000 usuarios.", "b": "Una fuga de memoria que aparece tras horas de funcionamiento.", "c": "Una variable que se usa antes de haber recibido un valor.", "d": "Un fallo intermitente que solo ocurre con cierta configuración de red."}, "correcta": ["c"], "concepto": "La prueba estática encuentra más fácil o barato ciertos defectos: de requisitos, de diseño, de codificación (como variables sin valor definido), de estándares o de interfaces.", "explicacion": ["Requisitos: inconsistencias, ambigüedades, contradicciones, omisiones, inexactitudes y duplicidades.", "Diseño: estructuras de base de datos ineficientes y mala modularización.", "Codificación: variables con valores no definidos o no declaradas, código inalcanzable o duplicado, complejidad excesiva.", "También: desviaciones de estándares, interfaces mal especificadas, vulnerabilidades como desbordamientos de búfer y huecos en la cobertura de la base de prueba."], "razones": {"a": "El rendimiento depende de la ejecución: se mide con prueba dinámica.", "b": "Una fuga de memoria tras horas de funcionamiento exige ejecutar el software.", "c": "Correcta. Variable con valor no definido = defecto típico de la prueba estática.", "d": "Depende de la ejecución en un entorno concreto."}, "clave": "Si hace falta EJECUTAR para verlo (rendimiento, memoria, tiempos) → dinámica."}, {"id": "3-03", "cap": 3, "lo": "FL-3.1.3", "k": "K2", "fuente": "3.1.3", "tema": "Prueba estática y dinámica", "pregunta": "¿Qué afirmación sobre las diferencias entre la prueba estática y la dinámica es correcta?", "opciones": {"a": "La prueba estática encuentra defectos directamente, mientras que la dinámica provoca fallos a partir de los cuales se determinan los defectos asociados.", "b": "La prueba estática es la más adecuada para medir la eficiencia de desempeño.", "c": "La prueba dinámica se puede aplicar a productos de trabajo no ejecutables, como los requisitos.", "d": "La prueba estática no puede detectar vulnerabilidades de seguridad."}, "correcta": ["a"], "concepto": "La prueba estática encuentra defectos directamente; la dinámica provoca fallos de los que se determinan los defectos mediante análisis posterior.", "explicacion": ["Ambas se complementan y comparten objetivos, pero hay tipos de defectos que solo encuentra una de ellas.", "La estática encuentra defectos directamente; la dinámica provoca fallos y después se analizan los defectos.", "La estática detecta más fácilmente defectos en caminos de código poco ejecutados o difíciles de alcanzar.", "La estática se aplica a productos no ejecutables; la dinámica, solo a ejecutables.", "La estática mide características como la mantenibilidad; la dinámica, las que dependen de ejecutar, como la eficiencia de desempeño."], "razones": {"a": "Correcta.", "b": "La eficiencia de desempeño depende de ejecutar el código: se mide con prueba dinámica.", "c": "Es al revés: la dinámica solo se aplica a productos ejecutables.", "d": "Sí puede: ciertas vulnerabilidades, como los desbordamientos de búfer, se detectan más fácilmente con prueba estática."}, "clave": "Estática → defectos. Dinámica → fallos."}, {"id": "3-04", "cap": 3, "lo": "FL-3.2.1", "k": "K1", "fuente": "3.2.1", "tema": "Retroalimentación temprana", "pregunta": "¿Qué beneficio aporta la retroalimentación temprana y frecuente de las partes interesadas?", "opciones": {"a": "Permite comunicar pronto posibles problemas de calidad y evitar malentendidos sobre los requisitos.", "b": "Elimina la necesidad de la prueba de aceptación.", "c": "Hace innecesarias las revisiones formales.", "d": "Garantiza que no habrá cambios en los requisitos."}, "correcta": ["a"], "concepto": "La retroalimentación temprana y frecuente comunica pronto los problemas de calidad, evita malentendidos sobre los requisitos y centra al equipo en lo que más valor aporta.", "explicacion": ["Permite comunicar pronto posibles problemas de calidad.", "Evita malentendidos sobre los requisitos y asegura que sus cambios se entienden e implementan antes.", "Ayuda al equipo a entender mejor lo que construye y a centrarse en lo que más valor aporta.", "Con poca implicación, el producto puede no cumplir la visión de las partes interesadas."], "razones": {"a": "Correcta.", "b": "El programa no le atribuye esa función; no sustituye otras pruebas.", "c": "El programa no le atribuye esa función; no sustituye a las revisiones.", "d": "No evita los cambios; ayuda a entenderlos e implementarlos antes."}, "clave": "Retroalimentación temprana → menos malentendidos y menos retrabajo."}, {"id": "3-05", "cap": 3, "lo": "FL-3.2.2", "k": "K2", "fuente": "3.2.2", "tema": "Proceso de revisión", "pregunta": "Cada revisor examina el documento por su cuenta, usando técnicas como listas de comprobación, y anota anomalías, recomendaciones y preguntas. ¿A qué actividad del proceso de revisión corresponde?", "opciones": {"a": "Inicio de la revisión.", "b": "Revisión individual.", "c": "Comunicación y análisis.", "d": "Corrección e informe."}, "correcta": ["b"], "concepto": "En la revisión individual cada revisor evalúa la calidad del producto y registra anomalías, recomendaciones y preguntas aplicando técnicas de revisión.", "explicacion": ["Las actividades son: planificación, inicio, revisión individual, comunicación y análisis, y corrección e informe.", "Planificación: se define el alcance (propósito, producto, características de calidad, foco, criterios de salida, esfuerzo y plazos).", "Revisión individual: cada revisor aplica técnicas (lista de comprobación, basada en escenarios) y registra todo lo identificado.", "Comunicación y análisis: se analiza cada anomalía (estado, propietario, acciones), normalmente en una reunión.", "Corrección e informe: informe de defecto por cada defecto, aceptación al cumplir los criterios de salida y comunicación de resultados."], "razones": {"a": "El inicio asegura que todos están preparados y tienen acceso al producto; todavía no se revisa.", "b": "Correcta.", "c": "Ahí se analizan y discuten las anomalías ya identificadas.", "d": "Ahí se crean informes de defecto y se comunican los resultados."}, "clave": "Planificación → Inicio → Revisión individual → Comunicación y análisis → Corrección e informe."}, {"id": "3-06", "cap": 3, "lo": "FL-3.2.3", "k": "K1", "fuente": "3.2.3", "tema": "Roles en las revisiones", "pregunta": "¿Qué rol de una revisión garantiza el buen desarrollo de las reuniones, incluidas la mediación, la gestión del tiempo y un ambiente seguro en el que todos puedan hablar con libertad?", "opciones": {"a": "Líder de la revisión.", "b": "Moderador (facilitador).", "c": "Escriba (registrador).", "d": "Gerente."}, "correcta": ["b"], "concepto": "El moderador (facilitador) garantiza el buen desarrollo de las reuniones: mediación, gestión del tiempo y un ambiente seguro para hablar con libertad.", "explicacion": ["Gerente: decide qué se revisa y aporta recursos, como personal y tiempo.", "Autor: crea y corrige el producto de trabajo revisado.", "Moderador (facilitador): garantiza reuniones eficaces, con mediación y gestión del tiempo.", "Escriba (registrador): recopila las anomalías de los revisores y registra decisiones y anomalías nuevas.", "Revisor realiza la revisión; líder de la revisión asume la responsabilidad general y organiza cuándo y dónde."], "razones": {"a": "El líder asume la responsabilidad general y organiza la revisión, pero no es quien modera la reunión.", "b": "Correcta.", "c": "El escriba registra la información; no modera.", "d": "El gerente decide qué se revisa y aporta recursos."}, "clave": "Moderador = reunión. Líder = responsabilidad general. Escriba = registro."}, {"id": "3-07", "cap": 3, "lo": "FL-3.2.4", "k": "K2", "fuente": "3.2.4", "tema": "Tipos de revisión", "pregunta": "Se necesita el tipo de revisión más formal, que siga el proceso genérico completo, en el que se recopilen métricas y cuyo objetivo principal sea encontrar el máximo número de anomalías. ¿Cuál es?", "opciones": {"a": "Revisión informal.", "b": "Recorrido.", "c": "Revisión técnica.", "d": "Inspección."}, "correcta": ["d"], "concepto": "La inspección es el tipo de revisión más formal: sigue el proceso genérico completo, busca el máximo de anomalías y recopila métricas para mejorar el proceso.", "explicacion": ["Informal: sin proceso definido ni resultado documentado formal; objetivo principal, detectar anomalías.", "Recorrido: lo dirige el autor; los revisores pueden hacer revisión individual previa, pero no es obligatorio.", "Revisión técnica: revisores técnicamente cualificados y un moderador; busca consenso y decisiones técnicas.", "Inspección: la más formal; sigue el proceso genérico completo y recopila métricas."], "razones": {"a": "Es la menos formal: no sigue un proceso definido.", "b": "Lo dirige el autor y tiene objetivos más amplios (educar, consenso...).", "c": "Su foco es el consenso y las decisiones sobre problemas técnicos.", "d": "Correcta."}, "clave": "Máxima formalidad + métricas + máximo de anomalías = inspección."}, {"id": "3-08", "cap": 3, "lo": "FL-3.2.5", "k": "K1", "fuente": "3.2.5", "tema": "Factores de éxito de las revisiones", "pregunta": "¿Cuál de los siguientes es un factor de éxito de las revisiones?", "opciones": {"a": "Usar los resultados de la revisión para evaluar el rendimiento de los participantes.", "b": "Revisar el producto en partes pequeñas para que los revisores no pierdan la concentración.", "c": "No dejar tiempo de preparación, para que la revisión sea más espontánea.", "d": "Que solo la dirección decida si el producto supera la revisión."}, "correcta": ["b"], "concepto": "Factores de éxito: objetivos claros y criterios de salida medibles, partes pequeñas, tiempo de preparación, apoyo de la gerencia y formación; nunca evaluar a los participantes.", "explicacion": ["Objetivos claros y criterios de salida medibles; evaluar a los participantes nunca debe ser un objetivo.", "Elegir el tipo de revisión adecuado y revisar partes pequeñas para no perder la concentración.", "Dar retroalimentación a las partes interesadas y a los autores, y tiempo adecuado para prepararse.", "Apoyo de la gerencia, revisiones como parte de la cultura, formación adecuada y reuniones facilitadas."], "razones": {"a": "Expresamente desaconsejado: evaluar a los participantes nunca debe ser un objetivo.", "b": "Correcta.", "c": "Al contrario: hay que dar tiempo suficiente para prepararse.", "d": "No es un factor de éxito del programa."}, "clave": "Nunca se evalúa a las personas en una revisión: se evalúa el producto."}, {"id": "3-09", "cap": 3, "lo": "FL-3.1.1", "k": "K1", "fuente": "3.1.1", "tema": "Productos examinables", "pregunta": "¿Qué producto de trabajo NO es adecuado para la prueba estática?", "opciones": {"a": "Un documento de requisitos del sistema.", "b": "Un modelo de arquitectura del sistema.", "c": "Código ejecutable de terceros que, por razones legales, no se puede analizar.", "d": "Un código fuente de la propia empresa."}, "correcta": ["c"], "concepto": "Casi cualquier producto de trabajo puede examinarse con prueba estática; no son adecuados los difíciles de interpretar por humanos y que no deben analizarse con herramientas.", "explicacion": ["Ejemplos examinables: requisitos, código fuente, planes de prueba, casos de prueba y elementos del backlog.", "También: cartas de prueba, documentación del proyecto, contratos y modelos.", "Para el análisis estático, el producto necesita una estructura con la que comprobarlo.", "No son adecuados los difíciles de interpretar por humanos que no deben analizarse con herramientas, como código ejecutable de terceros por razones legales."], "razones": {"a": "Los requisitos son examinables.", "b": "Los modelos son examinables.", "c": "Correcta. No es adecuado para la prueba estática.", "d": "El código fuente propio es examinable."}, "clave": "Si se puede leer y entender, se puede examinar estáticamente."}, {"id": "3-10", "cap": 3, "lo": "FL-3.1.2", "k": "K2", "fuente": "3.1.2", "tema": "Valor de la prueba estática", "pregunta": "¿Cuál es un valor de la prueba estática sobre los requisitos antes del diseño?", "opciones": {"a": "Mide el tiempo de respuesta del sistema bajo carga.", "b": "Detecta defectos en las fases más tempranas del ciclo de vida, lo que reduce el esfuerzo de corregirlos más tarde.", "c": "Garantiza que el software no tendrá fallos en producción.", "d": "Sustituye a la prueba dinámica en las fases finales."}, "correcta": ["b"], "concepto": "La prueba estática detecta defectos en las fases más tempranas del ciclo de vida, por lo que se gasta menos tiempo y esfuerzo en corregirlos después.", "explicacion": ["Detecta defectos en las fases más tempranas, cumpliendo el principio de prueba temprana.", "Identifica defectos que la prueba dinámica no detecta, como código inalcanzable o defectos en productos no ejecutables.", "Verificar los requisitos documentados ayuda a que describan las necesidades reales de las partes interesadas.", "Mejora la comunicación y crea un entendimiento compartido entre las partes interesadas.", "Aunque las revisiones cuestan, el coste total del proyecto suele ser menor que sin ellas."], "razones": {"a": "El rendimiento bajo carga se mide con prueba dinámica.", "b": "Correcta. Es un valor descrito de la prueba estática.", "c": "Ninguna prueba puede demostrar la ausencia de defectos o fallos.", "d": "Ambas se complementan; la estática no sustituye a la dinámica."}, "clave": "Estática = defectos pronto y menos coste global; no garantiza ausencia de fallos."}, {"id": "3-11", "cap": 3, "lo": "FL-3.1.3", "k": "K2", "fuente": "3.1.3", "tema": "Estática frente a dinámica", "pregunta": "¿Qué afirmación sobre prueba estática y dinámica es correcta?", "opciones": {"a": "La mantenibilidad del código se evalúa con prueba estática, mientras que la eficiencia de desempeño requiere ejecutar el software.", "b": "La prueba estática requiere ejecutar el código y la dinámica no.", "c": "La prueba dinámica encuentra defectos directamente, sin fallos previos.", "d": "La prueba estática solo se puede aplicar a código fuente."}, "correcta": ["a"], "concepto": "La prueba estática mide características que no dependen de ejecutar el código (mantenibilidad); la dinámica, las que sí dependen (eficiencia de desempeño).", "explicacion": ["Estática: no necesita ejecutar el software; se evalúan productos mediante examen manual o con herramientas.", "Dinámica: solo se aplica a productos ejecutables.", "La estática encuentra defectos directamente; la dinámica provoca fallos y luego se analiza el defecto asociado.", "Son complementarias: algunos tipos de defecto solo los encuentra una de las dos."], "razones": {"a": "Correcta. La mantenibilidad no depende de ejecutar; el desempeño sí.", "b": "Es al revés: la estática no necesita ejecutar el software.", "c": "La dinámica provoca fallos, de los que se determinan después los defectos.", "d": "Se aplica a casi cualquier producto de trabajo, no solo al código."}, "clave": "Estática: sin ejecutar y defectos directos; dinámica: fallos."}, {"id": "3-12", "cap": 3, "lo": "FL-3.2.1", "k": "K1", "fuente": "3.2.1", "tema": "Retroalimentación temprana", "pregunta": "¿Qué puede ocurrir si hay poca implicación de las partes interesadas durante el ciclo de vida?", "opciones": {"a": "El producto se entrega sin defectos.", "b": "Los probadores no necesitarán diseñar casos de prueba.", "c": "El producto puede no cumplir la visión de las partes interesadas, con retrabajo costoso.", "d": "Se reduce el coste de corregir los defectos."}, "correcta": ["c"], "concepto": "Con poca implicación de las partes interesadas, el producto puede no cumplir su visión, lo que acarrea retrabajo costoso, plazos incumplidos y hasta el fracaso del proyecto.", "explicacion": ["La retroalimentación temprana y frecuente comunica antes los posibles problemas de calidad.", "Con poca implicación, el producto puede no cumplir la visión original o actual de las partes interesadas.", "Las consecuencias: retrabajo costoso, plazos incumplidos, culpas y hasta el fracaso del proyecto.", "La retroalimentación frecuente evita malentendidos sobre los requisitos."], "razones": {"a": "El programa no relaciona la falta de feedback con un producto sin defectos.", "b": "El programa no plantea que la falta de feedback evite diseñar pruebas.", "c": "Correcta. Es la consecuencia descrita.", "d": "Sin feedback aumenta el riesgo de retrabajo costoso, no se reduce el coste."}, "clave": "Sin feedback temprano: producto equivocado y retrabajo caro."}, {"id": "3-13", "cap": 3, "lo": "FL-3.2.2", "k": "K2", "fuente": "3.2.2", "tema": "Proceso de revisión", "pregunta": "¿En qué actividad del proceso de revisión se asegura que todos los participantes tienen acceso al producto de trabajo, entienden su rol y responsabilidades y reciben todo lo necesario?", "opciones": {"a": "Planificación.", "b": "Revisión individual.", "c": "Inicio de la revisión.", "d": "Comunicación y análisis."}, "correcta": ["c"], "concepto": "En el inicio de la revisión se asegura que todos los participantes están preparados: acceso al producto, comprensión de su rol y todo lo necesario para revisar.", "explicacion": ["Planificación: se define el alcance (propósito, producto, características de calidad, foco, criterios de salida, esfuerzo, plazos).", "Inicio: todos tienen acceso al producto, entienden su rol y reciben lo necesario.", "Revisión individual: cada revisor registra anomalías, recomendaciones y preguntas.", "Comuni
