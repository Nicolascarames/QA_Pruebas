<!DOCTYPE html>
<meta charset="utf-8">
<title>Aula ISTQB CTFL</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: hoja de examen centrada (columna de lectura ~760px), barra de pestañas fija arriba; opciones como burbujas de hoja de respuestas */
:root{
  --paper:#f2f4f7; --sheet:#ffffff; --ink:#172031; --muted:#5b6678; --line:#d9dee7;
  --accent:#2747c9; --accent-soft:#e6ebfb;
  --ok:#17804a; --ok-soft:#e3f4ea; --bad:#c23a2b; --bad-soft:#fbe7e4; --warn:#a96a00; --warn-soft:#fdf1dc;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f141d; --sheet:#171e2a; --ink:#e6eaf2; --muted:#9aa5b8; --line:#2a3445;
  --accent:#8ea4ff; --accent-soft:#1f2a4a;
  --ok:#4cc985; --ok-soft:#14301f; --bad:#ff8a7a; --bad-soft:#3a1b18; --warn:#f0b54a; --warn-soft:#352812;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0f141d; --sheet:#171e2a; --ink:#e6eaf2; --muted:#9aa5b8; --line:#2a3445;
  --accent:#8ea4ff; --accent-soft:#1f2a4a;
  --ok:#4cc985; --ok-soft:#14301f; --bad:#ff8a7a; --bad-soft:#3a1b18; --warn:#f0b54a; --warn-soft:#352812;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar-in{max-width:820px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:.7rem;font-weight:400;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:700;font-size:.92rem}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:.75rem;margin-left:4px}
main{max-width:820px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.5rem}
h3{font-size:1.1rem}
p{margin:0}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--sheet);padding:4px 11px;border-radius:999px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--f-mono);font-size:.76rem;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.meta b{color:var(--ink);font-weight:600}
.k{padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.qtext{font-size:1.08rem;white-space:pre-line}
.anexo{margin:0;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-family:var(--f-mono);font-size:.84rem;line-height:1.5;overflow-x:auto;white-space:pre}
.two{display:inline-block;font-family:var(--f-mono);font-size:.75rem;font-weight:600;color:var(--warn);background:var(--warn-soft);padding:2px 8px;border-radius:4px;letter-spacing:.04em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;text-align:left;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.bub{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem;color:var(--muted)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.opt.sel{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.otext{min-width:0}
.why{display:block;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:.9rem;color:var(--ink)}
.why b{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.why.y b{color:var(--ok)} .why.n b{color:var(--muted)}
.opt.wrong .why.n b{color:var(--bad)}
.mine{display:inline-block;margin:0 8px 4px 0;font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid currentColor;color:var(--muted)}
.verdict{align-items:flex-start}
.verdict .ico{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;color:var(--sheet)}
.verdict.ok .ico{background:var(--ok)} .verdict.bad .ico{background:var(--bad)}
.verdict .vt{font-family:var(--f-display);font-size:1.15rem}
.verdict .vs{font-weight:400;color:var(--ink);font-size:.93rem}
.concept{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:1.02rem}
.concept b,.blk h3{display:block;font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.blk h3{color:var(--muted)}
.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.pts ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.pts li::marker{color:var(--accent)}
.src{font-size:.85rem;color:var(--muted)}
.src b{color:var(--ink)}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--sheet)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:.88rem}
.verdict{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:8px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.bad{background:var(--bad-soft);color:var(--bad)}
.expl{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.expl p{max-width:68ch}
.tip{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.tip b{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);display:block;margin-bottom:2px}
.ask{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:14px}
.ask textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--sheet)}
.answer{white-space:normal;max-width:68ch}
.answer{display:flex;flex-direction:column;gap:6px}
.answer h4{margin:10px 0 0;font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.answer h4:first-child{margin-top:0}
.answer ul,.answer ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.answer:empty{display:none}
.answer:not(:empty){background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat .v{font-family:var(--f-display);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:.85rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.93rem}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.ok i{background:var(--ok)} .meter.bad i{background:var(--bad)} .meter.warn i{background:var(--warn)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.timer{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{height:36px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);cursor:pointer;font-family:var(--f-mono);font-size:.82rem;position:relative}
.cell.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.cell.r-ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.r-bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.simhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.item .t{min-width:0}
.item .t span{display:block}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--sheet);border:1px dashed var(--line);border-radius:10px}
.save{font-size:.8rem;color:var(--muted)}
.big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
details.rev{border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
details.rev>summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;list-style:none}
details.rev>summary::-webkit-details-marker{display:none}
details.rev[open]>summary{border-bottom:1px solid var(--line)}
details.rev .inner{padding:14px;display:flex;flex-direction:column;gap:12px}
kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
@media (max-width:560px){.tabs{margin-left:0;width:100%}.tab{flex:1;padding:6px 6px}.big{font-size:2.4rem}}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.tab{transition:border-color .15s,background .15s}}
/*PROG-CSS-INICIO*/

.prog>summary{cursor:pointer;padding:.5rem .75rem;color:var(--accent);font-weight:600}
/* cursor:pointer hace que iOS Safari/WKWebView envíe «click» al document al tocar texto plano (si no, el recuadro de definición no se cierra al tocar fuera); la selección de texto sigue igual */
.prog-in{cursor:pointer;position:relative;padding:.25rem .85rem .8rem;font-size:.92rem;line-height:1.5}
.prog-ruta{color:var(--muted);font-size:.8rem;margin-bottom:.5rem}
.prog-h{margin:1rem 0 .3rem;font-size:.95rem}
.prog-txt p{margin:.4rem 0}
.prog-txt ul{margin:.3rem 0;padding-left:1.3rem}
.prog-txt table{border-collapse:collapse;margin:.5rem 0;font-size:.85rem}
.prog-txt th,.prog-txt td{border:1px solid var(--line);padding:.25rem .5rem;text-align:left;vertical-align:top}
.prog-txt .fig{color:var(--muted);font-style:italic}
.prog-txt .nota{color:var(--muted);font-size:.78rem}
.prog-avisos{margin-top:.7rem}
.prog-aviso{border-left:3px solid var(--bad);padding:.3rem .6rem;margin:.4rem 0}
.prog-aviso small{display:block;color:var(--muted);font-size:.75rem;margin-top:.2rem}
.prog-copy{margin-top:.7rem;color:var(--muted);font-size:.72rem}
.term{text-decoration:underline dotted var(--accent);text-underline-offset:3px;cursor:pointer}
.term-pop{position:absolute;z-index:5;max-width:22rem;padding:.55rem .7rem;background:var(--sheet);
  border:1px solid var(--accent);border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);font-size:.85rem}
.term-pop i{color:var(--muted)}
.term-pop small{display:block;margin-top:.3rem;color:var(--muted)}

/*PROG-CSS-FIN*/
</style>

<script>
/*PROG-JS-INICIO*/
const PROGRAMA = {"apartados":[{"id":"1","titulo":"Fundamentos del Proceso de Prueba","padre":null,"texto":""},{"id":"1.1","titulo":"¿Qué es Probar?","padre":"1","texto":"Los sistemas de software son parte integrante de nuestra vida cotidiana. La mayoría de la gente ha tenido experiencias con software que no funcionaba como se esperaba. Un software que no funciona correctamente puede acarrear muchos problemas, como pérdidas económicas, de tiempo o de reputación empresarial y, en casos extremos, incluso lesiones o la muerte. La prueba de software evalúa la calidad del software y ayuda a reducir el riesgo de fallo del software en operación.\n\nLa prueba de software es un conjunto de actividades para descubrir defectos y evaluar la calidad de los artefactos de software. Cuando se prueban, estos artefactos se conocen como objetos de prueba. Un concepto erróneo habitual sobre la prueba es que sólo consiste en ejecutar pruebas (es decir, ejecutar el software y comprobar los resultados de las pruebas). Sin embargo, la prueba del software también incluye otras actividades y debe estar alineada con el ciclo de vida de desarrollo del software (véase el capítulo 2).\n\nOtro concepto erróneo habitual sobre la prueba es que ésta se concentra por completo en la verificación del objeto de prueba. Aunque la prueba implica verificación, es decir, comprobar si el sistema cumple los requisitos especificados, también implica validación, lo que significa comprobar si el sistema satisface las necesidades de los usuarios y otros implicados en su entorno operativo.\n\nLa prueba puede ser dinámica o estática. La prueba dinámica implica la ejecución del software, mientras que la prueba estática no. La prueba estática incluye revisiones (véase el capítulo 3) y análisis estático. La prueba dinámica utiliza distintos tipos de técnicas de prueba y enfoques de prueba para obtener casos de prueba (véase el capítulo 4).\n\nProbar no es sólo una actividad técnica. También necesita que se planifique, gestione, estime, monitorice y controle de forma adecuada (véase el capítulo 5).\n\nLos probadores utilizan herramientas (véase el capítulo 6), pero es importante recordar que la prueba es en gran medida una actividad intelectual, que requiere que los probadores tengan conocimientos especializados, utilicen competencias analíticas y apliquen el pensamiento crítico y el pensamiento sistémico (Myers 2011, Roman 2018).\n\nEl estándar ISO/IEC/IEEE 29119-1 proporciona más información sobre los conceptos de prueba de software."},{"id":"1.1.1","titulo":"Objetivos de Prueba","padre":"1.1","texto":"Los objetivos de prueba característicos son:\n\n- Evaluar productos de trabajo como requisitos, historias de usuario, diseños y código.\n- Provocar fallos y encontrar defectos.\n- Asegurar la cobertura necesaria de un objeto de prueba.\n- Reducir el nivel de riesgo asociado a una calidad inadecuada del software.\n- Verificar si se han cumplido los requisitos especificados.\n- Verificar que un objeto de prueba cumple los requisitos contractuales, legales y normativos.\n- Proporcionar información a los implicados para que puedan tomar decisiones informadas.\n- Generar confianza en la calidad del objeto de prueba.\n- Validar si el objeto de prueba está completo y funciona como esperan los implicados.\n\nLos objetivos de prueba pueden variar en función del contexto, que incluye el producto de trabajo que se está probando, el nivel de prueba, los riesgos, el ciclo de vida de desarrollo del software (SDLC) que se está siguiendo y los factores relacionados con el contexto del negocio, por ejemplo, la estructura corporativa, las consideraciones relativas a la competencia o el tiempo de comercialización."},{"id":"1.1.2","titulo":"Probar y Depurar","padre":"1.1","texto":"Probar y depurar son actividades distintas. Probar puede desencadenar fallos causados por defectos en el software (prueba dinámica) o puede, de forma directa, encontrar defectos en el objeto de prueba (prueba estática).\n\nCuando una prueba dinámica (véase el capítulo 4) desencadena un fallo, la depuración se ocupa de encontrar las causas de este fallo (defectos), analizar estas causas y eliminarlas. En este caso, el proceso típico de depuración implica:\n\n- Reproducción del fallo.\n- Diagnóstico (hallazgo de la causa raíz).\n- Corrección de la causa.\n\nLa prueba de confirmación posterior comprueba si las correcciones han resuelto el problema. Preferiblemente, la prueba de confirmación la realiza la misma persona que llevó a cabo la prueba inicial. También se puede llevar a cabo una prueba de regresión posterior, para comprobar si las correcciones están causando fallos en otras partes del objeto de prueba (véase la sección 2.2.3 para más información sobre la prueba de confirmación y la prueba de regresión).\n\nCuando la prueba estática identifica un defecto, la depuración se ocupa de eliminarlo. No se necesita reproducción ni diagnóstico, ya que la prueba estática encuentra directamente los defectos y no puede provocar fallos (véase el capítulo 3)."},{"id":"1.2","titulo":"¿Por qué es Necesario Probar?","padre":"1","texto":"Probar, como forma de control de la calidad, ayuda a alcanzar los objetivos acordados dentro del alcance, el tiempo, la calidad y las limitaciones presupuestarias establecidos. La contribución de la prueba al éxito no debe limitarse a las actividades del equipo de prueba. Cualquier implicado puede utilizar sus competencias en materia de prueba para contribuir al éxito del proyecto. Probar componentes, sistemas y la documentación asociada ayuda a identificar defectos en el software:"},{"id":"1.2.1","titulo":"Contribuciones de la prueba al éxito","padre":"1.2","texto":"Probar proporciona un medio rentable de detectar defectos. Estos defectos pueden eliminarse posteriormente (mediante la depuración, una actividad ajena a la prueba), por tanto, la prueba contribuye indirectamente a lograr objetos de prueba de mayor calidad.\n\nLa prueba proporciona medios para evaluar directamente la calidad de un objeto de prueba en varias etapas del ciclo de vida de desarrollo software CVDS. Estas mediciones se utilizan como parte de una actividad de gestión de proyectos más amplia, contribuyendo a las decisiones para pasar a la siguiente etapa del SDLC, como por ejemplo la decisión de entrega.\n\nProbar proporciona a los usuarios una representación indirecta en el proyecto de desarrollo. Los probadores aseguran que se tiene en cuenta la comprensión de las necesidades de los usuarios a lo largo de todo el ciclo de vida de desarrollo. La alternativa es implicar a un conjunto representativo de usuarios como parte del proyecto de desarrollo, lo que no suele ser posible debido a los elevados costes y a la falta de disponibilidad de usuarios adecuados.\n\nTambién puede ser necesario realizar pruebas para cumplir requisitos contractuales o legales, o para ajustarse a los estándares reglamentarios."},{"id":"1.2.2","titulo":"Prueba y Aseguramiento de la Calidad (AC)","padre":"1.2","texto":"Aunque a menudo se utilizan indistintamente los términos \"prueba\" y \"aseguramiento de la calidad\" (AC) , prueba y AC no son lo mismo. La prueba es una forma de control de la calidad (CC.\n\nEl CC es un enfoque correctivo orientado al producto que se concentra en aquellas actividades que contribuyen a la consecución de unos niveles de calidad adecuados. La prueba es una de las principales formas de control de la calidad, mientras que otras incluyen métodos formales (comprobación de modelo y prueba de corrección), simulación y creación de prototipos.\n\nEl aseguramiento de la calidad es un enfoque preventivo orientado a los procesos que se concentra en la implementación y mejora de los mismos. Funciona sobre la base de que, si un buen proceso se sigue correctamente, entonces generará un buen producto. La garantía de calidad se aplica tanto al proceso de desarrollo como al de prueba, y es responsabilidad de todos los que participan en un proyecto.\n\nLos resultados de la prueba son utilizados por el Aseguramiento de la Calidad (AC) y el Control de la Calidad (CC). En el control de calidad se utilizan para corregir defectos, mientras que en la garantía de calidad proporcionan retroalimentación sobre el rendimiento de los procesos de desarrollo y prueba."},{"id":"1.2.3","titulo":"Errores, Defectos, Fallos y Causas Raíz","padre":"1.2","texto":"Los seres humanos cometen errores (equivocaciones), que producen defectos, que a su vez pueden dar lugar a fallos. Los seres humanos cometen errores por diversas razones, como la presión por razones de tiempo, la complejidad de los productos de trabajo, los procesos, la infraestructura o las interacciones, o simplemente porque están cansados o carecen de la formación adecuada.\n\nLos defectos pueden encontrarse en la documentación, como una especificación de requisitos o un guion de prueba, en el código fuente o en un artefacto de apoyo como un archivo de construcción. Los defectos en los artefactos producidos al principio del CVDS, si no se detectan, suelen dar lugar a artefactos defectuosos más adelante en el ciclo de vida. Si se ejecuta un defecto en el código, el sistema puede fallar al hacer lo que debería hacer, o hacer algo que no debería, provocando un fallo. Algunos defectos siempre darán lugar a un fallo si se ejecutan, mientras que otros sólo darán lugar a un fallo en circunstancias específicas, y algunos puede que nunca den lugar a un fallo.\n\nLos errores y los defectos no son la única causa de los fallos. Los fallos también pueden deberse a condiciones ambientales, como cuando la radiación o el campo electromagnético provocan defectos en el firmware.\n\nUna causa raíz es una razón fundamental por la que se produce un problema (por ejemplo, una situación que conduce a un error). Las causas raíz se identifican mediante el análisis de la causa raíz, que suele realizarse cuando se produce un fallo o se identifica un defecto. Se cree que pueden evitarse otros fallos o defectos similares o reducirse su frecuencia tratando la causa raíz, por ejemplo, eliminándola."},{"id":"1.3","titulo":"Principios de la Prueba","padre":"1","texto":"A lo largo de los años se han sugerido una serie de principios de prueba que ofrecen directrices generales aplicables a todas las pruebas. En este programa de estudio se describen siete de estos principios.\n\n1. La prueba muestra la presencia de defectos, no su ausencia. La prueba puede mostrar que hay defectos en el objeto de prueba, pero no puede demostrar que no los haya (Buxton 1970). La prueba reduce la probabilidad de que queden defectos por descubrir en el objeto de prueba, pero aunque no se encuentren defectos, la prueba no puede demostrar la corrección del objeto de prueba.\n\n2. La prueba exhaustiva es imposible. Probarlo todo no es factible salvo en casos triviales (Manna 1978). En lugar de intentar probar exhaustivamente, deberían utilizarse técnicas de prueba (véase el capítulo 4), priorización de casos de prueba (véase el apartado 5.1.5) y pruebas basadas en el riesgo (véase el apartado 5.2), para concentrar los esfuerzos de prueba.\n\n3. La prueba temprana ahorra tiempo y dinero. Los defectos que se eliminan al principio del proceso no causarán defectos posteriores en los productos de trabajo derivados. El coste de la calidad se reducirá, ya que se producirán menos fallos más adelante en el CVDS (Boehm 1981). Para encontrar defectos en una fase temprana, tanto las pruebas estáticas (véase el capítulo 3) como las pruebas dinámicas (véase el capítulo 4) deben iniciarse lo antes posible.\n\n4. Los defectos se agrupan. Un pequeño número de componentes del sistema suelen contener la mayoría de los defectos descubiertos o son responsables de la mayoría de los fallos operativos (Enders 1975). Este fenómeno es una ilustración del principio de Pareto. Las agrupaciones de defectos previstas, y las agrupaciones de defectos reales observadas durante la prueba o en operación, son una entrada importante para la prueba basada en el riesgo (véase la sección 5.2).\n\n5. Las pruebas se desgastan. Si las pruebas se repiten muchas veces, se vuelven cada vez más ineficaces para detectar nuevos defectos (Beizer 1990). Para superar este efecto, puede que sea necesario modificar las pruebas y los datos de prueba existentes, y que haya que escribir nuevas pruebas. Sin embargo, en algunos casos, la repetición de las mismas pruebas puede tener un resultado beneficioso, por ejemplo, en las pruebas de regresión automatizadas (véase la sección 2.2.3).\n\n6. La prueba depende del contexto. No existe un único enfoque de prueba aplicable universalmente. La prueba se realiza de forma diferente en distintos contextos (Kaner 2011).\n\n7. Falacia de la ausencia de defectos. Es una falacia (es decir, una idea equivocada) esperar que la verificación del software asegure el éxito de un sistema. Probar a fondo todos los requisitos especificados y arreglar todos los defectos encontrados podría seguir produciendo un sistema que no satisface las necesidades y expectativas de los usuarios, que no ayuda a conseguir los objetivos de negocio del cliente y que es inferior en comparación con otros sistemas de la competencia. Además de la verificación, también debe llevarse a cabo la validación (Boehm 1981)."},{"id":"1.4","titulo":"Actividades de Prueba, Productos de Prueba y Roles de Prueba","padre":"1","texto":"La prueba depende del contexto, pero, a un alto nivel, existen conjuntos comunes de actividades de prueba sin los cuales es menos probable que la prueba alcance los objetivos de prueba. Estos conjuntos de actividades de prueba forman un proceso de prueba. El proceso de prueba puede adaptarse a una situación determinada en función de diversos factores. Qué actividades de prueba se incluyen en este proceso de prueba, cómo se implementan y cuándo tienen lugar se decide normalmente como parte de la planificación de prueba para la situación específica (véase la sección 5.1).\n\nLas siguientes secciones describen los aspectos generales de este proceso de prueba en términos de actividades y tareas de prueba, el impacto del contexto, el material de prueba, la trazabilidad entre la base de prueba y el material de prueba, y los roles de prueba.\n\nEl estándar ISO/IEC/IEEE 29119-2 proporciona más información sobre los procesos de prueba."},{"id":"1.4.1","titulo":"Actividades y Tareas de Prueba","padre":"1.4","texto":"Un proceso de prueba suele constar de los principales grupos de actividades que se describen a continuación. Aunque puede parecer que muchas de estas actividades siguen una secuencia lógica, a menudo se implementan de forma iterativa o en paralelo. Estas actividades de prueba suelen necesitar adaptarse al sistema y al proyecto.\n\nPlanificación de la Prueba.\n\nLa planificación de la prueba consiste en definir los objetivos de la prueba y, a continuación, seleccionar el enfoque que mejor permita alcanzar los objetivos dentro de las limitaciones impuestas por el contexto general. La planificación de la prueba se explica con más detalle en la sección 5.1.\n\nMonitorización y Control de la Prueba.\n\nLa monitorización de la prueba implica la comprobación continua de todas las actividades de la prueba y la comparación del avance real con el plan. El control de prueba implica la adopción de las medidas necesarias para cumplir los objetivos de la prueba. La monitorización de prueba y el control de prueba se explican con más detalle en la sección 5.3.\n\nAnálisis de la Prueba.\n\nEl análisis de la prueba incluye el análisis de la base de prueba para identificar las prestaciones que pueden ser objeto de prueba y para definir y priorizar las condiciones de prueba asociadas, junto con los riesgos y niveles de riesgo relacionados (véase la sección 5.2). La base de prueba y los objetos de prueba también se evalúan para identificar los defectos que pueden contener y valorar su capacidad de ser probados. El análisis de prueba suele apoyarse en el uso de técnicas de prueba (véase el capítulo 4). El análisis de la prueba responde a la pregunta \"¿qué hay que probar?\" en términos de criterios de cobertura medibles.\n\nDiseño de la Prueba.\n\nEl diseño de prueba incluye la elaboración de las condiciones de prueba en casos de prueba y otros productos de prueba (por ejemplo, contratos de prueba). Esta actividad suele implicar la identificación de elementos de cobertura, que sirven de referencia para especificar las entradas de los casos de prueba. Las técnicas de prueba (véase el capítulo 4) pueden servir de apoyo a esta actividad. El diseño de pruebas también incluye la definición de los requisitos de datos de prueba, el diseño del entorno de prueba y la identificación de cualquier otra infraestructura y herramientas necesarias. El diseño de prueba responde a la pregunta \"¿cómo llevar a cabo la prueba?\".\n\nImplementación de la Prueba.\n\nLa implementación de prueba incluye la creación o la adquisición de los productos de prueba necesarios para la ejecución de prueba (por ejemplo, los datos de prueba). Los casos de prueba pueden organizarse en procedimientos de prueba y suelen reunirse en conjuntos de prueba. Se crean guiones de prueba manuales y automatizados. Se priorizan los procedimientos de prueba y se organizan dentro de un calendario de ejecución de prueba para una ejecución de prueba eficiente (véase la sección 5.1.5). Se construye el entorno de prueba y se verifica que está configurado correctamente.\n\nEjecución de la Prueba.\n\nLa ejecución de la prueba incluye la realización de las pruebas de acuerdo con el calendario de ejecución de prueba (ejecuciones de pruebas). La ejecución de una prueba puede ser manual o automatizada. La ejecución de prueba puede adoptar muchas formas, incluidas la prueba continua o sesiones de prueba en pareja. Los resultados de prueba reales se comparan con los resultados esperados. Se registran los resultados de la prueba. Las anomalías se analizan para identificar sus causas probables. Este análisis permite informar de las anomalías en función de los fallos observados (véase el apartado 5.5).\n\nCompleción de la Prueba.\n\nLas actividades de compleción de la prueba suelen producirse en los hitos del proyecto (por ejemplo, la entrega, el final de una iteración, la compleción del nivel de prueba) para cualquier defecto no resuelto, solicitud de cambio o elemento de lista de trabajo acumulado del producto que se haya creado. Cualquier producto de prueba que pueda ser útil en el futuro se identifica y se archiva o se entrega a los equipos adecuados. Se desactiva el entorno de prueba hasta un estado acordado. Se analizan las actividades de prueba para identificar las lecciones aprendidas y las mejoras para futuras iteraciones, entregas o proyectos (véase la sección 2.1.6). Se crea un informe de compleción de la prueba y se comunica a los implicados."},{"id":"1.4.2","titulo":"El Proceso de Prueba en Contexto","padre":"1.4","texto":"La prueba no se realiza de forma aislada. Las actividades de prueba son parte integrante de los procesos de desarrollo que se llevan a cabo en una organización. La prueba también está sufragada por los implicados y su objetivo final es ayudar a satisfacer las necesidades de negocio de los implicados. Por lo tanto, la forma en que se lleve a cabo la prueba dependerá de una serie de factores contextuales entre los que se incluyen:\n\n- Implicados (necesidades, expectativas, requisitos, voluntad de cooperación, etc.)\n- Miembros del equipo (competencias, conocimientos, nivel de experiencia, disponibilidad, necesidades de formación, etc.)\n- Dominio del negocio (criticidad del objeto de prueba, riesgos identificados, necesidades del mercado, normativa legal específica, etc.)\n- Factores técnicos (tipo de software, arquitectura del producto, tecnología utilizada, etc.)\n- Restricciones del proyecto (alcance, tiempo, presupuesto, recursos, etc.)\n- Factores organizativos (estructura organizativa, políticas existentes, prácticas utilizadas, etc.)\n- Ciclo de vida de desarrollo del software (prácticas de ingeniería, métodos de desarrollo, etc.)\n- Herramientas (disponibilidad, usabilidad, cumplimiento, etc.)\n\nEstos factores influirán en muchos asuntos relacionados con la prueba, entre ellos: la estrategia de prueba, las técnicas de prueba utilizadas, el grado de automatización de la prueba, el nivel de cobertura requerido, el nivel de detalle de la documentación de prueba, el suministro de información, etc."},{"id":"1.4.3","titulo":"Productos de Prueba","padre":"1.4","texto":"El software de prueba se crea como producto de salida de las actividades de prueba descritas en la sección 1.4.1. Existe una variación significativa en la forma en que las distintas organizaciones producen, conforman, nombran, organizan y gestionan sus productos de trabajo. Una gestión de la configuración adecuada (véase la sección 5.4) asegura la consistencia y la integridad de los productos de trabajo. La siguiente lista de productos de trabajo no es exhaustiva:\n\n- Productos del Trabajo de Planificación de la Prueba\n  - Entre los productos del trabajo de planificación de la prueba se incluyen: el plan de prueba, el calendario de prueba, el registro de riesgos y los criterios de entrada y salida (véase la sección 5.1). El registro de riesgos es una lista de riesgos junto con la probabilidad del riesgo, el impacto del riesgo e información sobre la mitigación del riesgo (véase la sección 5.2). El calendario de prueba, el registro de riesgos y los criterios de entrada y salida suelen formar parte del plan de prueba.\n- Productos de Trabajo de Monitorización y Control de la Prueba\n  - Los productos de trabajo de monitorización y control de la prueba incluyen: informes del avance de la prueba (véase el apartado 5.3.2), documentación de las directivas de control (véase el apartado 5.3) e información sobre los riesgos (véase el apartado 5.2).\n- Productos del Trabajo de Análisis de la Prueba\n  - Los productos del trabajo de análisis de la prueba incluyen: condiciones de prueba (priorizadas) (por ejemplo, criterios de aceptación, véase la sección 4.5.2), e informes de defectos relativos a los defectos en la base de prueba (si no se solucionan directamente).\n- Productos del Trabajo del Diseño de la Prueba\n  - Los productos de trabajo del diseño de prueba incluyen: casos de prueba (priorizados), contratos de prueba, elementos de cobertura, requisitos de datos de prueba y requisitos del entorno de prueba.\n- Productos del Trabajo de Implementación de la Prueba\n  - Los productos de trabajo de implementación de prueba incluyen: procedimientos de prueba, guiones de prueba automatizados, juegos de prueba, datos de prueba, calendario de ejecución de la prueba y elementos del entorno de prueba. Algunos ejemplos de elementos del entorno de pruebas son: stubs, controladores, simuladores y virtualizaciones de servicios.\n- Productos del Trabajo de Ejecución de la Prueba\n  - Los productos de trabajo de la ejecución de la prueba incluyen: registros en bitácora de prueba e informes de defectos (véase la sección 5.5).\n- Productos del Trabajo de Compleción de la Prueba\n  - Los productos de trabajo de la compleción de la prueba incluyen: informe de compleción de la prueba (véase la sección 5.3.2), elementos de acción para la mejora de proyectos o iteraciones posteriores, lecciones aprendidas documentadas y solicitudes de cambio (por ejemplo, como elementos de la lista de trabajo acumulado del producto)."},{"id":"1.4.4","titulo":"Trazabilidad entre Bases de Prueba y Productos de Prueba","padre":"1.4","texto":"Para implementar una monitorización y un control efectivos de la prueba, es importante establecer y mantener la trazabilidad a lo largo del proceso de prueba entre los elementos de la base de prueba, los productos de prueba asociados a estos elementos (por ejemplo, las condiciones de la prueba, los riesgos, los casos de prueba), los resultados de la prueba y los defectos detectados.\n\nUna trazabilidad precisa soporta la evaluación de la cobertura, por lo que es muy útil que se definan criterios de cobertura medibles en la base de prueba. Los criterios de cobertura pueden funcionar como indicadores clave de rendimiento para impulsar las actividades que muestran hasta qué punto se han alcanzado los objetivos de la prueba (véase la sección 1.1.1). Por ejemplo:\n\n- La trazabilidad de los casos de prueba a los requisitos puede verificar que los requisitos están cubiertos por los casos de prueba.\n- La trazabilidad de los resultados de prueba a los riesgos puede utilizarse para evaluar el nivel de riesgo residual en un objeto de prueba.\n\nAdemás de evaluar la cobertura, una buena trazabilidad permite determinar el impacto de los cambios, facilita las auditorías de la prueba y ayuda a cumplir los criterios de gobernanza de TI. Una buena trazabilidad también facilita la comprensión de los informes de avance y compleción de la prueba al incluir el estado de los elementos de la base de prueba. Esto también puede ayudar a comunicar los aspectos técnicos de la prueba a los implicados de forma comprensible. La trazabilidad proporciona información para evaluar la calidad del producto, la capacidad del proceso y el avance del proyecto con respecto a los objetivos de negocio."},{"id":"1.4.5","titulo":"Roles en la Prueba","padre":"1.4","texto":"En este programa de estudio se tratan dos roles principales en la prueba: un rol de gestión de prueba y un rol de prueba. Las actividades y tareas asignadas a estos dos roles dependen de factores como el contexto del proyecto y del producto, las competencias de las personas que desempeñan los roles y la organización.\n\nEl rol de gestión de prueba asume la responsabilidad general del proceso de prueba, del equipo de prueba y de la dirección de las actividades de prueba. El rol de gestión de prueba se concentra principalmente en las actividades de planificación de prueba, monitorización y control de prueba y compleción de la prueba. La forma en que se lleva a cabo el rol de gestión de pruebas varía en función del contexto. Por ejemplo, en el desarrollo ágil de software, algunas de las tareas de gestión de pruebas pueden correr a cargo del equipo ágil. Las tareas que abarcan a varios equipos o a toda la organización pueden ser realizadas por jefes de prueba ajenos al equipo de desarrollo.\n\nEl rol de prueba asume la responsabilidad general del aspecto asociado a la ingeniería (técnica) de la prueba. El rol de prueba se concentra principalmente en las actividades de análisis de prueba, diseño de prueba, implementación de prueba y ejecución de prueba.\n\nDiferentes personas pueden asumir estos roles en diferentes momentos. Por ejemplo, el rol de gestión de la prueba puede ser desempeñado por un jefe de equipo, por un jefe de prueba, por un jefe de desarrollo, etc. También es posible que una misma persona asuma los roles de prueba y gestión de prueba al mismo tiempo."},{"id":"1.5","titulo":"Competencias Esenciales y Buenas Prácticas de la Prueba","padre":"1","texto":"La competencia es la capacidad de hacer algo bien que proviene del conocimiento, la práctica y la aptitud de cada uno. Los buenos probadores deben poseer algunas competencias esenciales para hacer bien su trabajo. Los buenos probadores deben ser jugadores de equipo eficaces y deben ser capaces de realizar pruebas en diferentes niveles de independencia de la prueba."},{"id":"1.5.1","titulo":"Competencias Genéricas Necesarias para Probar","padre":"1.5","texto":"A pesar de ser genéricas, las siguientes competencias son especialmente relevantes para los probadores:\n\n- Conocimiento en materia de prueba (para aumentar la efectividad de la prueba, por ejemplo, mediante el uso de técnicas de prueba).\n- Minuciosidad, cuidado, curiosidad, atención a los detalles, ser metódico (para identificar defectos, especialmente los difíciles de encontrar).\n- Buena competencia en el ámbito de la comunicación escucha activa, ser un jugador de equipo (para interactuar eficazmente con todos los implicados, transmitir información a los demás, hacerse entender e informar y discutir los defectos).\n- Pensamiento analítico, pensamiento crítico, creatividad (para aumentar la efectividad de las pruebas).\n- Conocimientos técnicos (para aumentar la eficiencia de las pruebas, por ejemplo, utilizando herramientas de prueba adecuadas).\n- Conocimientos del dominio (para poder comprender y comunicarse con los usuarios finales/representantes de negocio).\n\nA menudo, los probadores son los portadores de las malas noticias. Es un rasgo humano común culpar al portador de malas noticias. Esto hace que las competencias de comunicación sean cruciales para los probadores. Comunicar los resultados de prueba puede percibirse como una crítica al producto y a su autor. El sesgo de confirmación puede dificultar la aceptación de información que discrepa de las creencias actuales. Algunas personas pueden percibir las pruebas como una actividad destructiva, a pesar de que contribuyen en gran medida al éxito del proyecto y a la calidad del producto. Para intentar mejorar esta opinión, la información sobre defectos y fallos debe comunicarse de forma constructiva."},{"id":"1.5.2","titulo":"Enfoque de Equipo Completo","padre":"1.5","texto":"Una de las competencias importantes para un probador es la capacidad de trabajar eficazmente en un contexto de equipo y de contribuir positivamente a los objetivos del mismo. El enfoque de equipo completo - una práctica procedente de la Programación Extrema (véase la sección 2.1) - se basa en esta competencia.\n\nEn el enfoque de equipo completo, cualquier miembro del equipo con los conocimientos y competencias necesarios puede realizar cualquier tarea, y todos son responsables de la calidad. Los miembros del equipo comparten el mismo espacio de trabajo (físico o virtual), ya que la ubicación común facilita la comunicación y la interacción. El enfoque de equipo completo mejora la dinámica de equipo, potencia la comunicación y la colaboración dentro del equipo y crea sinergia al permitir que los diversos conjuntos de competencias dentro del equipo se aprovechen en beneficio del proyecto.\n\nLos probadores trabajan en estrecha colaboración con otros miembros del equipo para asegurar que se alcanzan los niveles de calidad deseados. Esto incluye colaborar con los representantes de negocio para ayudarles a crear pruebas de aceptación adecuadas y trabajar con los desarrolladores para acordar la estrategia de prueba y decidir los enfoques de automatización de la prueba. De este modo, los probadores pueden transferir conocimientos sobre la prueba a otros miembros del equipo e influir en el desarrollo del producto.\n\nDependiendo del contexto, el enfoque de equipo completo puede no ser siempre apropiado. Por ejemplo, en algunas situaciones, como las críticas para la seguridad, puede necesitarse un alto nivel de independencia en la prueba."},{"id":"1.5.3","titulo":"Independencia de la Prueba","padre":"1.5","texto":"Un cierto grado de independencia hace que el probador sea más eficaz a la hora de encontrar defectos debido a las diferencias entre los sesgos cognitivos del autor y del probador (cf. Salman 1995). Sin embargo, la independencia no sustituye a la familiaridad; por ejemplo, los desarrolladores pueden encontrar eficazmente muchos defectos en su propio código.\n\nLos productos del trabajo pueden ser probados por su autor (sin independencia), por los compañeros del autor del mismo equipo (cierta independencia), por probadores ajenos al equipo del autor pero dentro de la organización (alta independencia), o por probadores ajenos a la organización (independencia muy alta). Para la mayoría de los proyectos, suele ser mejor llevar a cabo las pruebas con varios niveles de independencia (por ejemplo, que los desarrolladores realicen las pruebas de integración de componentes, que el equipo de pruebas realice las pruebas de integración de sistemas y sistemas, y que los representantes de negocio realicen las pruebas de aceptación).\n\nLa principal ventaja de la independencia de la prueba es que es probable que los probadores independientes reconozcan diferentes tipos de fallos y defectos en comparación con los desarrolladores debido a sus diferentes antecedentes, perspectivas técnicas y sesgos. Además, un probador independiente puede verificar, cuestionar o refutar las suposiciones realizadas por los implicados durante la especificación e implementación del sistema.\n\nSin embargo, también existen algunos inconvenientes. Los probadores independientes pueden estar aislados del equipo de desarrollo, lo que puede provocar una falta de colaboración, problemas de comunicación o una relación de confrontación con el equipo de desarrollo. Los desarrolladores pueden perder el sentido de la responsabilidad por la calidad. Los probadores independientes pueden ser vistos como un cuello de botella o culpables de los retrasos en la entrega."},{"id":"2","titulo":"Prueba a lo Largo del Ciclo de Vida de Desarrollo de Software","padre":null,"texto":""},{"id":"2.1","titulo":"La Prueba en el Contexto de un Ciclo de Vida de Desarrollo de Software","padre":"2","texto":"Un modelo de ciclo de vida de desarrollo de software (CVDS) es una representación abstracta y de alto nivel del proceso de desarrollo de software. Un modelo CVDS define cómo se relacionan entre sí, tanto lógica como cronológicamente, las diferentes fases de desarrollo y los tipos de actividades que se realizan dentro de este proceso. Algunos ejemplos de modelos de CVDS son: los modelos de desarrollo secuencial (por ejemplo, el modelo en cascada, el modelo V), los modelos de desarrollo iterativo (por ejemplo, el modelo en espiral, el prototipado) y los modelos de desarrollo incremental (por ejemplo, el Proceso Unificado).\n\nAlgunas actividades de los procesos de desarrollo de software también pueden describirse mediante métodos de desarrollo de software más detallados y prácticas Ágiles. Algunos ejemplos son: el desarrollo guiado por pruebas de aceptación (DGPA), el desarrollo guiado por el comportamiento (DGC), el diseño guiado por dominios (DGD), la programación extrema (XP), el desarrollo guiado por prestaciones (DGP), Kanban, Lean IT, Scrum y el desarrollo guiado por pruebas (DGP)."},{"id":"2.1.1","titulo":"Impacto del Ciclo de Vida de Desarrollo de Software en la Prueba","padre":"2.1","texto":"La prueba debe adaptarse al CVDS para tener éxito. La elección del CVDS repercute en:\n\n- Alcance y cronología de las actividades de prueba (por ejemplo, niveles de prueba y tipos de prueba).\n- Nivel de detalle de la documentación de prueba.\n- Elección de técnicas de prueba y enfoque de prueba.\n- Alcance de la automatización de la prueba.\n- Rol y responsabilidades de un probador.\n\nEn las fases iniciales de los modelos de desarrollo secuencial, los probadores suelen participar en la revisión de requisitos, el análisis de prueba y el diseño de prueba. El código ejecutable suele crearse en las fases posteriores, por lo que normalmente la prueba dinámica no puede realizarse al principio del CVDS.\n\nEn algunos modelos de desarrollo iterativo e incremental, se supone que cada iteración entrega un prototipo funcional o un incremento del producto. Esto implica que en cada iteración se puede probar tanto estática como dinámicamente en todos los niveles de prueba. La entrega frecuente de incrementos requiere una retroalimentación rápida y pruebas de regresión extensivas.\n\nEl desarrollo de software Ágil asume que pueden producirse cambios a lo largo de todo el proyecto. Por lo tanto, en los proyectos ágiles se favorece una documentación de producto de trabajo ligera y una amplia automatización de la prueba para facilitar la prueba de regresión. Además, la mayor parte de las pruebas manuales suelen realizarse mediante técnicas de prueba basadas en la experiencia (véase la sección 4.4) que no requieren un análisis y diseño de prueba previos exhaustivos."},{"id":"2.1.2","titulo":"Ciclo de Vida de Desarrollo de Software y Buenas Prácticas de Prueba","padre":"2.1","texto":"Las buenas prácticas de prueba, independientemente del modelo de CVDS elegido, incluyen los siguientes elementos:\n\n- Cada actividad de desarrollo de software tiene su correspondiente actividad de prueba, de modo que todas las actividades de desarrollo están sujetas a un control de la calidad.\n- Cada nivel de prueba (véase el capítulo 2.2.1) tiene objetivos de prueba específicos y diferentes, lo que permite que las pruebas sean lo suficientemente comprensivas a la vez que se evita la redundancia.\n- El análisis y diseño de prueba para un nivel de prueba determinado comienza durante la fase de desarrollo correspondiente del CVDS, para que la prueba pueda atenerse al principio de prueba temprana (véase la sección 1.3).\n- Los probadores participan en la revisión de los productos de trabajo tan pronto como están disponibles los borradores de esta documentación, para que esta prueba temprana y la detección de defectos puedan apoyar la estrategia de desplazamiento a la izquierda (véase la sección 2.1.5)."},{"id":"2.1.3","titulo":"La Prueba como Impulsor del Desarrollo de Software","padre":"2.1","texto":"Desarrollo guiado por prueba (DGP), desarrollo guiado por prueba de aceptación (DGPA) y desarrollo guiado por el comportamiento (DGC son enfoques de desarrollo similares, en los que las pruebas se definen como un medio para conducir el desarrollo. Cada uno de estos enfoques aplica el principio de la prueba temprana (véase el apartado 1.3) y sigue un planteamiento de desplazamiento a la izquierda (véase el apartado 2.1.5), ya que las pruebas se definen antes de escribir el código. Apoyan un modelo de desarrollo iterativo. Estos enfoques se caracterizan por lo siguiente:\n\nDesarrollo Guiado por Prueba (DGP):\n\n- Dirige la codificación mediante casos de prueba (en lugar de un diseño extensivo del software) (Beck 2003).\n- Primero se redactan las pruebas, luego se elabora el código para que satisfaga las pruebas y, por último, se refactorizan las pruebas y el código.\n\nDesarrollo Guiado por Prueba de Aceptación (DGPA) (véase el apartado 4.5.3):\n\n- Obtiene pruebas a partir de criterios de aceptación como parte del proceso de diseño del sistema (Gärtner 2011).\n- Las pruebas se redactan antes de que la parte de la aplicación se desarrolle para satisfacer las pruebas.\n\nDesarrollo Guiado por Comportamiento (DGC):\n\n- Expresa el comportamiento deseado de una aplicación con casos de prueba escritos en una forma sencilla de lenguaje natural, que es fácil de entender por los implicados - normalmente utilizando el formato Dado/Cuando/Entonces (“Given/When/Then”). (Chelimsky 2010)\n- A continuación, los casos de prueba se traducen automáticamente en pruebas ejecutables.\n\nEn todos los enfoques anteriores, las pruebas pueden persistir como pruebas automatizadas para asegurar la calidad del código en futuras adaptaciones / refactorizaciones."},{"id":"2.1.4","titulo":"DevOps y la Prueba","padre":"2.1","texto":"DevOps es un enfoque organizativo que pretende crear sinergias haciendo que el desarrollo (incluidas las pruebas) y las operaciones trabajen juntos para alcanzar un conjunto de objetivos comunes. DevOps requiere un cambio cultural dentro de una organización para salvar las distancias entre el desarrollo (incluidas las pruebas) y las operaciones, tratando sus funciones con el mismo valor. DevOps promueve la autonomía de los equipos, la retroalimentación rápida, las cadenas de herramientas integradas y prácticas técnicas como la integración continua (IC) y la entrega continua (EC). Esto permite a los equipos construir, probar y entregar código de alta calidad más rápidamente a través de un canal de entrega DevOps (Kim 2016).\n\nDesde el punto de vista de la prueba, algunas de las ventajas de DevOps son:\n\n- Rápida retroalimentación sobre la calidad del código y sobre si los cambios afectan negativamente al código existente.\n- La integración continua IC promueve un enfoque de desplazamiento a la izquierda en la prueba (véase la sección 2.1.5) animando a los desarrolladores a suministrar código de alta calidad acompañado de pruebas de componentes y análisis estático.\n- Promueve procesos automatizados como CI/CD que facilitan el establecimiento de entornos de prueba estables.\n- Aumenta la visión sobre las características de calidad no funcionales (por ejemplo, rendimiento, fiabilidad).\n- La automatización a través de un canal de entrega reduce la necesidad de pruebas manuales repetitivas.\n- El riesgo en la regresión se minimiza gracias a la escala y el alcance de las pruebas de regresión automatizadas.\n\nDevOps no está exento de riesgos y desafíos, entre los que se incluyen:\n\n- La tubería3 de entrega DevOps debe ser definida y establecida.\n- Las herramientas CI / CD deben ser introducidas y mantenidas.\n- La automatización de la prueba requiere recursos adicionales y puede ser difícil de establecer y mantener.\n\nAunque DevOps llega con un alto nivel de pruebas automatizadas, la prueba manual - especialmente desde la perspectiva del usuario - seguirá siendo necesaria."},{"id":"2.1.5","titulo":"Enfoque “Desplazamiento a la Izquierda”","padre":"2.1","texto":"El principio de prueba temprana (véase la sección 1.3) se denomina a veces desplazamiento a la izquierda porque es un enfoque en el que la prueba se realiza de forma temprana en el CVDS. El desplazamiento a la izquierda normalmente sugiere que la prueba debería realizarse antes (por ejemplo, no esperar a que se implemente el código o a que se integren los componentes), pero no significa que deba descuidarse la prueba más avanzada en el CVDS.\n\nExisten algunas buenas prácticas que ilustran cómo lograr un \"desplazamiento a la izquierda\" en la prueba, entre las que se incluyen:\n\n- Revisión de la especificación desde la perspectiva de la prueba. Estas actividades de revisión de las especificaciones suelen encontrar defectos potenciales, como ambigüedades, incompletitud e inconsistencias.\n- Redactar casos de prueba desde antes de escribir el código y hacer que éste se ejecute en un arnés de prueba durante la implementación de código.\n\n> 3 Buscar/Confirmar traducción del término\n\n- Utilizar integración continua (IC) e incluso mejor entrega continua (EC), ya que aporta una retroalimentación rápida y pruebas de componentes automatizadas para acompañar al código fuente cuando se envía al repositorio de código.\n- Completar el análisis estático del código fuente antes de la prueba dinámica, o como parte de un proceso automatizado.\n- Realizar pruebas no funcionales empezando en el nivel de prueba de componente, siempre que sea posible. Se trata de una forma de desplazamiento a la izquierda, ya que estos tipos de pruebas no funcionales tienden a realizarse más adelante en el CVDS, cuando se dispone de un sistema completo y de un entorno de prueba representativo.\n\nUn enfoque de desplazamiento a la izquierda puede dar lugar a formación, esfuerzo y/o costes adicionales al principio del proceso, pero se espera que ahorre esfuerzos y/o costes con posterioridad.\n\nPara el enfoque de desplazamiento a la izquierda es importante que los implicados estén convencidos y asuman este concepto."},{"id":"2.1.6","titulo":"Retrospectivas y Mejora de Proceso","padre":"2.1","texto":"Las retrospectivas (también conocidas como \"reuniones post proyecto\" y retrospectivas de proyecto) suelen celebrarse al final de un proyecto o de una iteración, en un hito de entrega, o pueden celebrarse cuando se necesiten. La cronología y la organización de las retrospectivas dependen del modelo de CVDS concreto que se siga. En estas reuniones los participantes (no sólo probadores, sino también, por ejemplo, desarrolladores, arquitectos, propietario de producto, analistas de negocio) debaten:\n\n- ¿Qué tuvo éxito y debe conservarse?\n- ¿Qué no tuvo éxito y puede mejorarse?\n- ¿Cómo incorporar las mejoras y conservar los éxitos en el futuro?\n\nLos resultados deben registrarse y normalmente forman parte del informe de compleción de la prueba (véase la sección 5.3.2). Las retrospectivas son fundamentales para el éxito de la implementación de la mejora continua y es importante que se haga un seguimiento de cualquier mejora recomendada.\n\nEntre los beneficios habituales para la prueba se incluyen:\n\n- Aumento de la efectividad / eficiencia de la prueba (por ejemplo, mediante la implementación de sugerencias para la mejora del proceso).\n- Aumento de la calidad de los productos de prueba (por ejemplo, mediante la revisión conjunta de los procesos de prueba)\n- Unión y aprendizaje en equipo (por ejemplo, como resultado de la oportunidad de plantear problemas y proponer puntos de mejora)\n- Mejora de la calidad de la base de prueba (por ejemplo, al poder abordar y solucionar las deficiencias en la extensión y la calidad de los requisitos)\n- Mejor cooperación entre el desarrollo y la prueba (por ejemplo, ya que la colaboración se revisa y optimiza con regularidad)."},{"id":"2.2","titulo":"Niveles de Prueba y Tipos de Prueba","padre":"2","texto":"Los niveles de prueba son grupos de actividades de prueba que se organizan y gestionan conjuntamente. Cada nivel de prueba es una instancia del proceso de prueba, realizado en relación con el software en una etapa determinada de desarrollo, desde componentes individuales hasta sistemas completos o, en su caso, sistemas de sistemas.\n\nLos niveles de prueba están relacionados con otras actividades dentro del CVDS. En los modelos secuenciales de CVDS, los niveles de prueba suelen definirse de tal forma que los criterios de salida de un nivel forman parte de los criterios de entrada del siguiente. En algunos modelos iterativos, esto puede no aplicarse. Las actividades de desarrollo pueden abarcar varios niveles de prueba. Los niveles de prueba pueden solaparse en el tiempo.\n\nLos tipos de prueba son grupos de actividades de prueba relacionadas con características de calidad específicas y la mayoría de esas actividades de prueba pueden realizarse en todos los niveles de prueba."},{"id":"2.2.1","titulo":"Niveles de Prueba","padre":"2.2","texto":"En este programa de estudio se describen los siguientes cinco niveles de prueba:\n\nPrueba de Componente\n\nLa prueba de componente (también conocida como prueba unitaria) se concentra en probar componentes de forma aislada. A menudo requiere un soporte específico, como arneses de prueba o marcos de trabajo para la prueba unitaria. En general, los desarrolladores realizan la prueba de componente en sus entornos de desarrollo.\n\nPrueba de Integración de Componentes\n\nLa prueba de integración de componentes (también conocida como prueba de integración de unidades) se concentra en probar las interfaces y las interacciones entre los componentes. La prueba de integración de componentes depende en gran medida de los enfoques de la estrategia de integración, como ascendente, descendente o big-bang.\n\nPrueba de Sistema\n\nLa prueba de sistema se concentra en el comportamiento general y las capacidades de todo un sistema o producto, incluyendo a menudo la prueba funcional de las tareas de extremo a extremo y la prueba no funcional de las características de calidad. Para algunas características de calidad no funcionales, es preferible probarlas en un sistema completo en un entorno de prueba representativo (por ejemplo, la usabilidad). También es posible utilizar simulaciones de subsistemas. Un equipo de prueba independiente puede realizar la prueba de sistema, que está relacionada con las especificaciones del sistema.\n\nPrueba de Integración de Sistemas\n\nLa prueba de integración de sistemas se concentra en probar las interfaces del sistema sujeto a prueba y otros sistemas y servicios externos. La prueba de integración de sistemas requiere entornos de prueba adecuados, preferiblemente similares al entorno de operaciones.\n\nPrueba de Aceptación\n\nLa prueba de aceptación se concentra en la validación y en demostrar la preparación para el despliegue, lo que significa que el sistema satisface las necesidades de negocio del usuario. Lo ideal es que la prueba de aceptación la realicen usuarios a los que está dirigido. Las principales formas de pruebas de aceptación son: prueba de aceptación de usuario (PAU), prueba de aceptación operativa, prueba de aceptación contractual y de regulación, prueba alfa y prueba beta.\n\nCon el fin de evitar el solapamiento de las actividades de prueba, los niveles de prueba se distinguen por la siguiente lista no exhaustiva de atributos:\n\n- Objeto de prueba.\n- Objetivos de prueba.\n- Base de prueba.\n- Defectos y fallos.\n- Enfoque y responsabilidades."},{"id":"2.2.2","titulo":"Tipos de Prueba","padre":"2.2","texto":"Existen muchos tipos de prueba que pueden aplicarse en los proyectos. En este programa de estudio se abordan los siguientes cuatro tipos de prueba:\n\nPrueba Funcional\n\nLa prueba funcional evalúa las funciones que debe realizar un componente o sistema. Las funciones son \" aquello\" que debe hacer el objeto de prueba. El objetivo principal de la prueba funcional es comprobar la completitud funcional, la corrección funcional y la pertinencia funcional.\n\nPrueba No Funcional\n\nLa prueba no funcional evalúa atributos distintos de las características funcionales de un componente o sistema. La prueba no funcional es la comprobación de \"lo bien que se comporta el sistema\". El principal objetivo de la prueba no funcional es comprobar las características de calidad del software no funcionales. El estándar ISO/IEC 25010 proporciona la siguiente clasificación de las características de calidad del software no funcionales:\n\n- Eficiencia de desempeño.\n- Compatibilidad.\n- Usabilidad.\n- Fiabilidad.\n- Seguridad.\n- Mantenibilidad.\n- Portabilidad.\n\nA veces es conveniente que la prueba no funcional comience al principio del ciclo de vida (por ejemplo, como parte de las revisiones y prueba de componente o prueba de sistema). Muchas pruebas no funcionales se obtienen a partir de pruebas funcionales, ya que utilizan las mismas pruebas funcionales, pero comprueban que, al realizar la función, se satisface una restricción no funcional (por ejemplo, comprobar que una función se lleva a cabo en un tiempo determinado o que una función puede portarse a una nueva plataforma). El descubrimiento tardío de defectos no funcionales puede suponer una grave amenaza para el éxito de un proyecto. A veces, la prueba no funcional necesita un entorno de prueba muy específico, como un laboratorio de usabilidad para probar la usabilidad.\n\nPrueba de Caja Negra La prueba de caja negra (véase el apartado 4.2) se basa en la especificación y obtiene pruebas a partir de documentación externa al objeto de prueba. El objetivo principal de la prueba de caja negra es comprobar el comportamiento del sistema frente a sus especificaciones.\n\nPrueba de Caja Blanca La prueba de caja blanca (véase el apartado 4.3) se basa en la estructura y obtiene pruebas de la implementación o la estructura interna del sistema (por ejemplo, el código, la arquitectura, los flujos de trabajo y los flujos de datos). El objetivo principal de la prueba de caja blanca es que las pruebas cubran la estructura subyacente hasta un nivel aceptable.\n\nLos cuatro tipos de prueba mencionados pueden aplicarse a todos los niveles de prueba, aunque el enfoque será diferente en cada nivel. Se pueden utilizar diferentes técnicas de prueba para obtener condiciones y casos de prueba para todos los tipos de prueba mencionados."},{"id":"2.2.3","titulo":"Prueba de Confirmación y Prueba de Regresión","padre":"2.2","texto":"Normalmente se realizan cambios en un componente o sistema para mejorarlo añadiendo una nueva prestación o para solucionarlo eliminando un defecto. La prueba debería entonces incluir también la prueba de confirmación y la prueba de regresión.\n\nLa prueba de confirmación confirma que un defecto original se ha corregido con éxito. En función del riesgo, se puede probar la versión corregida del software de varias maneras, entre ellas:\n\n- ejecutando todos los casos de prueba que hayan fallado previamente debido al defecto, o, también mediante\n- añadiendo nuevas pruebas para cubrir cualquier cambio que se haya necesitado para arreglar el defecto.\n\nSin embargo, cuando se dispone de poco tiempo o dinero para solucionar los defectos, la prueba de confirmación puede limitarse a practicar simplemente los pasos que deberían reproducir el fallo causado por el defecto y comprobar que éste no se produce.\n\nLa prueba de regresión confirma que no se han producido consecuencias adversas a causa de un cambio, incluida una corrección que ya ha sido sometida a una prueba de confirmación. Estas consecuencias adversas podrían afectar al mismo componente en el que se realizó el cambio, a otros componentes del mismo sistema o incluso a otros sistemas conectados. La prueba de regresión puede no limitarse al objeto de prueba en sí, sino que también puede estar relacionada con el entorno. Es aconsejable realizar primero un análisis de impacto para optimizar el alcance de la prueba de regresión. El análisis de impacto muestra qué partes del software podrían verse afectadas.\n\nLos juegos de pruebas de regresión se ejecutan muchas veces y, por lo general, el número de casos de prueba de regresión aumentará con cada iteración o entrega, por lo que la prueba de regresión es una firme candidata a la automatización. La automatización de estas pruebas debe comenzar en las primeras fases del proyecto. Cuando se utiliza IC, como en DevOps (véase la sección 2.1.4), es una buena práctica incluir también pruebas de regresión automatizadas. Dependiendo de la situación, esto puede incluir pruebas de regresión en diferentes niveles.\n\nSe necesita una prueba de confirmación y/o una prueba de regresión para el objeto de prueba en todos los niveles de prueba si se corrigen defectos y/o se realizan cambios en estos niveles de prueba."},{"id":"2.3","titulo":"Prueba de Mantenimiento","padre":"2","texto":"Existen diferentes categorías de mantenimiento, puede ser correctivo, adaptable a los cambios del entorno o mejorar el rendimiento o la mantenibilidad (véase ISO/IEC 14764 para más detalles), por lo que el mantenimiento puede implicar entregas/despliegues planificados y entregas/despliegues no planificados (correcciones en caliente). El análisis de impacto puede realizarse antes de realizar un cambio, para ayudar a decidir si el cambio debe realizarse, basándose en las consecuencias potenciales en otras áreas del sistema. Probar los cambios de un sistema en producción incluye tanto la evaluación del éxito de la implementación del cambio como la comprobación de posibles regresiones en las partes del sistema que permanecen inalteradas (que suele ser la mayor parte del sistema).\n\nEl alcance de las pruebas de mantenimiento suele depender de:\n\n- El grado de riesgo del cambio.\n- El tamaño del sistema existente.\n- La magnitud del cambio.\n\nLos desencadenantes del mantenimiento y de la prueba de mantenimiento pueden clasificarse como sigue:\n\n- Modificaciones, como mejoras planificadas (es decir, basadas en la entrega), cambios correctivos o correcciones en caliente.\n- Actualizaciones o migraciones del entorno de operación, como de una plataforma a otra, que pueden requerir pruebas asociadas con el nuevo entorno así como del software modificado, o pruebas de conversión de datos cuando se migran datos de otra aplicación al sistema que se está manteniendo.\n- Retirada, tal como ocurre cuando una aplicación llega al final de su vida útil. Cuando se retira un sistema, puede ser necesario probar el archivo de datos si se requieren largos periodos de retención de datos. También puede ser necesario probar los procedimientos de recuperación y restauración tras el archivado en caso de que se necesiten determinados datos durante el periodo de archivado."},{"id":"3","titulo":"Prueba Estática","padre":null,"texto":""},{"id":"3.1","titulo":"Prueba Estática - Fundamentos","padre":"3","texto":"A diferencia de la prueba dinámica, en la prueba estática no es necesario ejecutar el software sujeto a prueba. El código, la especificación del proceso, la especificación de la arquitectura del sistema u otros productos de trabajo se evalúan mediante un examen manual (por ejemplo, revisiones) o con la ayuda de una herramienta (por ejemplo, el análisis estático). Los objetivos de prueba incluyen la mejora de la calidad, la detección de defectos y la evaluación de características como la legibilidad, la completitud, la corrección, la capacidad de ser probado y la consistencia. La prueba estática puede aplicarse tanto para la verificación como para la validación.\n\nLos probadores, los representantes de negocio y los desarrolladores trabajan juntos durante los mapeos de ejemplos, la redacción colaborativa de historias de usuario y las sesiones de refinamiento de la lista de tareas pendientes para asegurar que las historias de usuario y los productos de trabajo relacionados cumplen los criterios definidos, por ejemplo, la definición de preparado (véase la sección 5.1.3). Pueden aplicarse técnicas de revisión para asegurar que las historias de usuario están completas y son comprensibles y que incluyen criterios de aceptación comprobables. Haciendo las preguntas adecuadas, los probadores exploran, cuestionan y ayudan a mejorar las historias de usuario propuestas.\n\nEl análisis estático puede identificar problemas antes de la prueba dinámica y suele requerir un menor esfuerzo, ya que no se necesitan casos de prueba y suelen utilizarse herramientas (véase el capítulo 6). El análisis estático suele incorporarse a los marcos de IC (véase la sección 2.1.4). Aunque se utiliza en gran medida para detectar defectos específicos del código, el análisis estático también se emplea para evaluar la mantenibilidad y la seguridad. Los comprobadores ortográficos y las herramientas de legibilidad son otros ejemplos de herramientas de análisis estático."},{"id":"3.1.1","titulo":"Productos de Trabajo Susceptibles de Ser Examinados Mediante Prueba Estática","padre":"3.1","texto":"Casi cualquier producto de trabajo puede examinarse mediante una prueba estática. Algunos ejemplos son los documentos de especificación de requisitos, el código fuente, los planes de prueba, los casos de prueba, los elementos de la lista de trabajo acumulado del producto, los contratos de prueba, la documentación del proyecto y los modelos.\n\nCualquier producto de trabajo que pueda leerse y comprenderse puede ser objeto de una revisión. Sin embargo, para el análisis estático, los productos de trabajo necesitan una estructura con la que puedan ser comprobados (por ejemplo, modelos, código o texto con una sintaxis formal).\n\nLos productos de trabajo que no son apropiados para las pruebas estáticas incluyen aquellos que son difíciles de interpretar por los seres humanos y que no deben ser analizados por herramientas (por ejemplo, el código ejecutable de terceros debido a razones legales)."},{"id":"3.1.2","titulo":"Valor de la Prueba Estática","padre":"3.1","texto":"La prueba estática puede detectar defectos en las fases más tempranas del CVDS, cumpliendo el principio de la prueba temprana (véase la sección 1.3). También puede identificar defectos que no pueden detectarse mediante pruebas dinámicas (por ejemplo, código inaccesible, patrones de diseño no implementados como se deseaba, defectos en productos de trabajo no ejecutables).\n\nLa prueba estática permite evaluar la calidad de los productos de trabajo y generar confianza en ellos. Al verificar los requisitos documentados, los implicados también pueden asegurarse de que dichos requisitos describen sus necesidades reales. Dado que la prueba estática puede realizarse en una fase temprana del CVDS, puede crearse un entendimiento compartido entre los implicados. También mejorará la comunicación entre los implicados. Por este motivo, se recomienda involucrar a una amplia variedad de implicados en la prueba estática.\n\nAunque la implementación de las revisiones puede resultar costosa, los costes totales del proyecto suelen ser mucho menores que cuando no se realizan revisiones, ya que se necesita dedicar menos tiempo y esfuerzo a la corrección de defectos cuando el proyecto se encuentra más avanzado.\n\nLos defectos de código pueden detectarse utilizando el análisis estático de forma más eficiente que en la prueba dinámica, lo que suele dar lugar tanto a un menor número de defectos de código como a un menor esfuerzo general de desarrollo."},{"id":"3.1.3","titulo":"Diferencias entre la Prueba Estática y la Prueba Dinámica","padre":"3.1","texto":"La prueba estática y la prueba dinámica son prácticas complementarias. Tienen objetivos similares, como apoyar la detección de defectos en los productos de trabajo (véase la sección 1.1.1), pero también existen algunas diferencias, como:\n\n- Tanto la prueba estática como la dinámica (con análisis de fallos) pueden conducir a la detección de defectos; sin embargo, hay algunos tipos de defectos que sólo pueden encontrarse mediante pruebas estáticas o dinámicas.\n- La prueba estática encuentra los defectos directamente, mientras que la prueba dinámica provoca fallos a partir de los cuales se determinan los defectos asociados mediante un análisis posterior.\n- La prueba estática puede detectar más fácilmente los defectos que se encuentran en caminos a través del código que rara vez se ejecutan o que son difíciles de alcanzar mediante la prueba dinámica.\n- La prueba estática puede aplicarse a productos de trabajo no ejecutables, mientras que la prueba dinámica sólo puede aplicarse a productos de trabajo ejecutables.\n- La prueba estática se puede utilizar para medir las características de calidad que no dependen de la ejecución del código (por ejemplo, la mantenibilidad), mientras que la prueba dinámica se puede utilizar para medir las características de calidad que dependen de la ejecución del código (por ejemplo, la eficiencia de rendimiento).\n\nEntre los defectos típicos que son más fáciles y/o más económicos de encontrar mediante la prueba estática se incluyen:\n\nDefectos en los requisitos (por ejemplo, inconsistencias, ambigüedades, contradicciones, omisiones, imprecisiones, duplicaciones).\n\n- Defectos de diseño (por ejemplo, estructuras de bases de datos ineficaces, modularidad deficiente).\n- Ciertos tipos de defectos de codificación (por ejemplo, variables con valores indefinidos, variables no declaradas, código inalcanzable o duplicado, excesiva complejidad del código).\n- Desviaciones de los estándares (por ejemplo, falta de adherencia a las convenciones de nomenclatura en los estándares de codificación).\n- Especificaciones incorrectas de la interfaz (por ejemplo, número, tipo u orden de los parámetros no coincidentes).\n- Tipos específicos de vulnerabilidades de seguridad (por ejemplo, desbordamientos de memoria intermedia).\n- Lagunas o imprecisiones en la cobertura de la base de prueba (por ejemplo, falta de pruebas para un criterio de aceptación)."},{"id":"3.2","titulo":"Retroalimentación y Proceso de Revisión","padre":"3","texto":""},{"id":"3.2.1","titulo":"Beneficios de una Retroalimentación Temprana y Frecuente de los Implicados","padre":"3.2","texto":"La retroalimentación temprana y frecuente permite la comunicación temprana de posibles problemas de calidad. Si hay poca implicación por parte de los implicados durante el CVDS, es posible que el producto que se desarrolle no cumpla la visión original o actual del implicado. Un fallo en la entrega de lo que la parte interesada desea puede dar lugar a una costosa repetición del trabajo, incumplimiento de los plazos, juegos de culpas e incluso podría llevar al fracaso total del proyecto.\n\nLa retroalimentación frecuente por parte de los implicados a lo largo del SDLC puede evitar malentendidos sobre los requisitos y asegurar que los cambios en los requisitos se entiendan y se implementen antes. Esto ayuda al equipo de desarrollo a mejorar su comprensión de lo que están construyendo. Les permite concentrarse en aquellas prestaciones que aportan más valor a los implicados y que tienen un impacto más positivo en los riesgos identificados."},{"id":"3.2.2","titulo":"Actividades del Proceso de Revisión","padre":"3.2","texto":"El estándar ISO/IEC 20246 define un proceso de revisión genérico que proporciona un marco estructurado pero flexible a partir del cual se puede adaptar un proceso de revisión específico a una situación concreta. Si la revisión requerida es más formal, entonces se necesitarán más de las tareas descritas para las distintas actividades.\n\nEl tamaño de muchos productos de trabajo hace que sean demasiado grandes para ser cubiertos por una sola revisión. El proceso de revisión puede invocarse un par de veces para completar la revisión de todo el producto de trabajo.\n\nLas actividades del proceso de revisión son:\n\nPlanificación.\n\nDurante la fase de planificación se definirá el alcance de la revisión, que comprende el propósito, el producto de trabajo que se revisará, las características de calidad que se evaluarán, las áreas en las que se concentrará, los criterios de salida, la información de apoyo como los estándares, el esfuerzo y los plazos de la revisión.\n\nInicio de la Revisión.\n\nDurante el inicio de la revisión, el objetivo es asegurarse de que todos y cada uno de los implicados están preparados para comenzar la revisión. Esto incluye asegurarse de que cada participante tiene acceso al producto del trabajo objeto de revisión, entiende su rol y sus responsabilidades y recibe todo lo necesario para llevar a cabo la revisión.\n\nRevisión Individual.\n\nCada revisor realiza una revisión individual para evaluar la calidad del producto del trabajo objeto de revisión e identificar anomalías, recomendaciones y preguntas aplicando una o varias técnicas de revisión (por ejemplo, revisión basad
