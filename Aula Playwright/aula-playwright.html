ting de API","tipo":"codigo","pregunta":"¿Qué petición realiza este test?","codigo":"test('lista', async ({ request }) => {\n  const response = await request.get('/api/users', {\n    params: { page: 2 },\n  });\n  await expect(response).toBeOK();\n});","opciones":{"a":"GET `/api/users` con un body `{ page: 2 }`.","b":"POST `/api/users?page=2`.","c":"GET `/api/users?page=2`.","d":"GET `/api/users` y falla porque `params` no existe."},"codigoOpciones":false,"correcta":["c"],"concepto":"La opción params de request.get añade los pares clave-valor como query string.","explicacion":["params construye ?page=2 en la URL.","toBeOK() comprueba que el status esté entre 200 y 299.","La ruta relativa se resuelve con la baseURL de la config."],"razones":{"a":"Un GET no lleva body; params va a la query.","b":"El método es GET, no POST.","c":"Correcta. params se serializa en la query.","d":"params es una opción válida de request.get."},"clave":"params = query string.","docs":"https://playwright.dev/docs/api/class-apirequestcontext#api-request-context-get"},{"id":"M-API-02","nivel":"medio","tema":"Testing de API","tipo":"codigo","pregunta":"¿Qué se envía en esta petición?","codigo":"const response = await request.post('/api/users', {\n  data: { name: 'Ana', role: 'admin' },\n});\nexpect(response.status()).toBe(201);","opciones":{"a":"Un body JSON con `Content-Type: application/json`.","b":"Un formulario `multipart/form-data`.","c":"Una query `?name=Ana&role=admin`.","d":"Nada: `data` se ignora en POST."},"codigoOpciones":false,"correcta":["a"],"concepto":"En request.post, data con un objeto se serializa como JSON y se pone Content-Type: application/json.","explicacion":["data acepta objeto, string o Buffer.","Un objeto se envía como JSON.","form y multipart son opciones distintas para otros formatos."],"razones":{"a":"Correcta. El objeto va como JSON.","b":"Multipart se logra con la opción `multipart`.","c":"La query se pasa con `params`.","d":"`data` es la opción estándar para el cuerpo."},"clave":"data = JSON; form y multipart para otros formatos.","docs":"https://playwright.dev/docs/api-testing#writing-api-test"},{"id":"M-API-03","nivel":"medio","tema":"Testing de API","tipo":"error","pregunta":"El test falla con `undefined` aunque la API devuelve el nombre. ¿Qué falla?","codigo":"const response = await request.get('/api/users/1');\nconst user = response.json();\nexpect(user.name).toBe('Ana');","opciones":{"a":"`json()` solo existe en `page.request`.","b":"`expect` necesita `await`.","c":"`name` es una propiedad reservada.","d":"Falta `await` en `response.json()`: `user` es una promesa y `user.name` es `undefined`."},"codigoOpciones":false,"correcta":["d"],"concepto":"response.json() es asíncrono y devuelve una promesa que hay que esperar.","explicacion":["json() devuelve Promise<any>.","Sin await, user.name es undefined.","Correcto: const user = await response.json();"],"razones":{"a":"json() existe en cualquier APIResponse.","b":"expect con un valor síncrono no necesita await.","c":"`name` no es una propiedad reservada.","d":"Correcta. Falta `await` en json()."},"clave":"response.json() siempre con await.","docs":"https://playwright.dev/docs/api/class-apiresponse#api-response-json"},{"id":"M-API-04","nivel":"medio","tema":"Testing de API","tipo":"codigo","pregunta":"¿Qué garantiza esta tipificación con la interface `User`?","codigo":"interface User { id: number; name: string }\n\nconst response = await request.get('/api/users/1');\nconst user: User = await response.json();\nexpect(user.name).toBe('Ana');","opciones":{"a":"Que el servidor devuelve un objeto con esa forma, validado en ejecución.","b":"Que el test falla si el JSON tiene campos extra.","c":"Solo ayuda en compilación y autocompletado; no valida la respuesta en tiempo de ejecución.","d":"Que `response.json()` convierte el JSON a una clase `User`."},"codigoOpciones":false,"correcta":["c"],"concepto":"Las interfaces de TypeScript se borran al compilar: dan tipado estático, no validación en ejecución.","explicacion":["La anotación : User es una aserción de tipo estática.","No hay comprobación en runtime de los campos.","Para validar de verdad, usa expect sobre los campos o una librería de esquemas."],"razones":{"a":"No se valida en ejecución: la interface no existe en runtime.","b":"Los campos extra no provocan fallo.","c":"Correcta. Solo aporta tipado en compilación.","d":"json() devuelve un objeto plano, no una instancia de clase."},"clave":"Interface = tipos en compilación, no validación.","docs":"https://playwright.dev/docs/api-testing"},{"id":"M-API-05","nivel":"medio","tema":"Testing de API","tipo":"como","pregunta":"Con esta configuración, ¿qué hace `request.get('/users')` en un test?","codigo":"export default defineConfig({\n  use: {\n    baseURL: 'https://api.example.com',\n    extraHTTPHeaders: {\n      Authorization: `Bearer ${process.env.API_TOKEN}`,\n    },\n  },\n});","opciones":{"a":"Pide `https://api.example.com/users` sin cabeceras extra.","b":"Falla: `baseURL` solo aplica a `page.goto`.","c":"Solo envía el `Authorization` en `page.goto`.","d":"Pide `https://api.example.com/users` enviando la cabecera `Authorization`."},"codigoOpciones":false,"correcta":["d"],"concepto":"baseURL y extraHTTPHeaders de use se aplican también a la fixture request.","explicacion":["baseURL se concatena a las rutas relativas.","extraHTTPHeaders se añaden a cada petición del contexto.","Así no se repite el token en cada llamada."],"razones":{"a":"Las cabeceras extra sí se envían.","b":"baseURL también aplica a la fixture request.","c":"También las peticiones de la fixture request llevan la cabecera.","d":"Correcta. Se aplican URL base y cabecera."},"clave":"baseURL + extraHTTPHeaders en config = menos repetición.","docs":"https://playwright.dev/docs/api-testing#configuration"},{"id":"M-API-06","nivel":"medio","tema":"Testing de API","tipo":"funcion","pregunta":"Creas un contexto de API propio fuera de las fixtures. ¿Qué debes hacer al terminar?","codigo":"import { request } from '@playwright/test';\n\nconst api = await request.newContext({\n  baseURL: 'https://api.example.com',\n  extraHTTPHeaders: { Accept: 'application/json' },\n});\nawait api.get('/health');\n// ...","opciones":{"a":"Llamar a `api.dispose()` para liberar recursos.","b":"Llamar a `api.close()`, igual que un navegador.","c":"Nada: se libera solo al terminar el test.","d":"Llamar a `request.reset()`."},"codigoOpciones":false,"correcta":["a"],"concepto":"Un APIRequestContext creado con request.newContext() se libera con dispose().","explicacion":["request.newContext() crea un contexto independiente de las fixtures.","dispose() libera recursos y limpia respuestas almacenadas.","Se suele hacer en afterAll o en un fixture propio."],"razones":{"a":"Correcta. `dispose()` cierra el APIRequestContext.","b":"`close()` es de Browser/Page; APIRequestContext usa dispose().","c":"No se libera automáticamente si lo creas tú.","d":"`request.reset()` no existe."},"clave":"newContext de API -> dispose().","docs":"https://playwright.dev/docs/api/class-apirequestcontext#api-request-context-dispose"},{"id":"M-API-07","nivel":"medio","tema":"Testing de API","tipo":"codigo","pregunta":"¿Qué estrategia ilustra este test y qué ventaja tiene?","codigo":"test('muestra la tarea', async ({ page, request }) => {\n  const res = await request.post('/api/todos', {\n    data: { title: 'Comprar pan' },\n  });\n  expect(res.ok()).toBeTruthy();\n  await page.goto('/todos');\n  await expect(page.getByText('Comprar pan')).toBeVisible();\n});","opciones":{"a":"Mock de la API: evita usar el servidor.","b":"Preparar datos por API y verificar por UI: es más rápido y estable que crearlos desde la interfaz.","c":"Test de rendimiento: mide la latencia del POST.","d":"Test visual: compara capturas de pantalla."},"codigoOpciones":false,"correcta":["b"],"concepto":"Crear el estado inicial por API y verificar solo la parte relevante por UI acelera y estabiliza los tests.","explicacion":["El POST crea el dato sin pasar por la interfaz.","La UI solo comprueba lo que se quiere probar.","Reduce pasos frágiles del flujo."],"razones":{"a":"No hay mock: la petición llega al servidor real.","b":"Correcta. Setup por API, verificación por UI.","c":"No se mide la latencia ni el rendimiento.","d":"No hay comparación de capturas."},"clave":"Setup por API, aserción por UI.","docs":"https://playwright.dev/docs/api-testing#using-request-context"},{"id":"M-API-08","nivel":"medio","tema":"Testing de API","tipo":"error","pregunta":"Este código no compila en TypeScript. ¿Cuál es el problema?","codigo":"const response = await request.post('/api/login', {\n  body: { user: 'ana', pass: 'secreto' },\n});","opciones":{"a":"`post` no admite un objeto como segundo argumento.","b":"La opción para el cuerpo se llama `data`, no `body`.","c":"Falta pasar `headers` obligatoriamente.","d":"`/api/login` debe ser una URL absoluta."},"codigoOpciones":false,"correcta":["b"],"concepto":"En APIRequestContext el cuerpo de la petición se pasa con data (o form/multipart), no con body.","explicacion":["Opciones válidas: data, form, multipart, params, headers, timeout, failOnStatusCode…","`body` es de route.fulfill, no de request.post.","Un objeto en data se envía como JSON."],"razones":{"a":"El segundo argumento es un objeto de opciones.","b":"Correcta. La opción es `data`.","c":"Las cabeceras son opcionales.","d":"Con baseURL se pueden usar rutas relativas."},"clave":"request.post -> data; route.fulfill -> body.","docs":"https://playwright.dev/docs/api/class-apirequestcontext#api-request-context-post"},{"id":"M-AUT-01","nivel":"medio","tema":"Autenticación y proyectos","tipo":"codigo","pregunta":"Quieres que los tests de `chromium` esperen a que termine el proyecto de login. ¿Qué falta?","codigo":"projects: [\n  { name: 'setup', testMatch: /.*\\.setup\\.ts/ },\n  {\n    name: 'chromium',\n    use: { ...devices['Desktop Chrome'] },\n    ___\n  },\n],","opciones":{"a":"`dependencies: ['setup'],`","b":"`needs: ['setup'],`","c":"`before: 'setup',`","d":"`globalSetup: 'setup',`"},"codigoOpciones":false,"correcta":["a"],"concepto":"`dependencies` en un proyecto hace que ese proyecto se ejecute solo tras terminar los indicados.","explicacion":["El proyecto setup corre primero y genera el estado de sesión.","dependencies lista nombres de proyectos.","globalSetup es una opción distinta y a nivel raíz."],"razones":{"a":"Correcta. dependencies lista los proyectos previos.","b":"needs no existe.","c":"before no existe.","d":"globalSetup es un fichero de la config, no del proyecto."},"clave":"Proyecto setup + dependencies.","docs":"https://playwright.dev/docs/auth"},{"id":"M-AUT-02","nivel":"medio","tema":"Autenticación y proyectos","tipo":"como","pregunta":"¿Qué regex en `testMatch` hace que un proyecto ejecute solo ficheros como `auth.setup.ts`?","opciones":{"a":"`testMatch: /.*\\.setup\\.ts/`","b":"`testMatch: /setup/ts`","c":"`testMatch: '*.setup'`","d":"`testIgnore: /.*\\.setup\\.ts/`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Un proyecto de setup suele filtrar sus ficheros con `testMatch` y la expresión `/.*\\.setup\\.ts/`.","explicacion":["testMatch acepta cadenas, regex o arrays.","El patrón captura nombres que terminan en .setup.ts.","testIgnore haría lo contrario."],"razones":{"a":"Correcta. Regex válida.","b":"/setup/ts no es una regex válida para este fin.","c":"'*.setup' no coincide con la extensión .ts.","d":"testIgnore excluye esos ficheros."},"clave":"testMatch elige, testIgnore excluye.","docs":"https://playwright.dev/docs/test-projects"},{"id":"M-AUT-03","nivel":"medio","tema":"Autenticación y proyectos","tipo":"codigo","pregunta":"En el test de setup, ¿qué guarda la sesión en un fichero?","codigo":"setup('authenticate', async ({ page }) => {\n  await page.goto('/login');\n  await page.getByLabel('User').fill('ana');\n  await page.getByLabel('Password').fill('secret');\n  await page.getByRole('button', { name: 'Entrar' }).click();\n  await page.waitForURL('/home');\n  ___\n});","opciones":{"a":"`await page.context().storageState({ path: authFile });`","b":"`await page.saveSession(authFile);`","c":"`await page.storageState(authFile);`","d":"`await context.save({ path: authFile });`"},"codigoOpciones":false,"correcta":["a"],"concepto":"El estado se guarda con `context.storageState({ path })`.","explicacion":["Almacena cookies y localStorage del contexto.","Se ejecuta tras comprobar que el login terminó.","El fichero se reutiliza en otros proyectos."],"razones":{"a":"Correcta. Método real del contexto.","b":"saveSession no existe.","c":"storageState es método del contexto, no de page.","d":"save no existe en BrowserContext."},"clave":"Sesión = context.storageState({ path }).","docs":"https://playwright.dev/docs/auth"},{"id":"M-AUT-04","nivel":"medio","tema":"Autenticación y proyectos","tipo":"codigo","pregunta":"¿Cómo hacen los tests del proyecto `chromium` para reutilizar la sesión guardada?","codigo":"{\n  name: 'chromium',\n  use: {\n    ...devices['Desktop Chrome'],\n    ___\n  },\n  dependencies: ['setup'],\n},","opciones":{"a":"`storageState: 'playwright/.auth/user.json'`","b":"`session: 'playwright/.auth/user.json'`","c":"`cookies: 'playwright/.auth/user.json'`","d":"`authFile: 'playwright/.auth/user.json'`"},"codigoOpciones":false,"correcta":["a"],"concepto":"La opción `storageState` en `use` carga el estado de sesión en cada contexto.","explicacion":["Cada test arranca ya autenticado.","La ruta debe coincidir con la guardada en setup.","Se puede definir por proyecto o a nivel global."],"razones":{"a":"Correcta. Es la opción oficial.","b":"session no existe.","c":"cookies espera cookies, no una ruta.","d":"authFile no es opción de Playwright."},"clave":"use.storageState = sesión cargada.","docs":"https://playwright.dev/docs/auth"},{"id":"M-AUT-05","nivel":"medio","tema":"Autenticación y proyectos","tipo":"como","pregunta":"Con `storageState` global, ¿cómo ejecutas un fichero de tests sin sesión?","opciones":{"a":"`test.use({ storageState: { cookies: [], origins: [] } });`","b":"`test.use({ storageState: null });`","c":"`test.skip(auth);`","d":"`test.use({ auth: false });`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Se sobrescribe `storageState` con un estado vacío.","explicacion":["Se pone en el fichero o dentro de un describe.","Un estado vacío no contiene cookies ni origins.","test.use afecta a todo el ámbito donde se declara."],"razones":{"a":"Correcta. Estado vacío.","b":"null no es un valor válido para esta opción en TypeScript.","c":"test.skip omitiría el test.","d":"auth no es una opción."},"clave":"Sin sesión: storageState vacío.","docs":"https://playwright.dev/docs/auth"},{"id":"M-AUT-06","nivel":"medio","tema":"Autenticación y proyectos","tipo":"codigo","pregunta":"Para probar dos roles, ¿cómo configuras los proyectos?","codigo":"projects: [\n  { name: 'setup', testMatch: /.*\\.setup\\.ts/ },\n  { name: 'admin', use: { storageState: 'playwright/.auth/admin.json' }, dependencies: ['setup'] },\n  { name: 'user', ___, dependencies: ['setup'] },\n]","opciones":{"a":"`use: { storageState: 'playwright/.auth/user.json' }`","b":"`use: { role: 'user' }`","c":"`storageState: 'user'`","d":"`auth: 'playwright/.auth/user.json'`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Cada rol tiene su fichero de estado y su proyecto con `use.storageState`.","explicacion":["El setup genera un fichero por rol.","Cada proyecto carga el suyo.","storageState va dentro de use."],"razones":{"a":"Correcta. Cada proyecto con su fichero.","b":"role no existe.","c":"storageState debe estar dentro de use y ser ruta.","d":"auth no existe."},"clave":"Un rol = un fichero = un proyecto.","docs":"https://playwright.dev/docs/auth"},{"id":"M-FIX-01","nivel":"medio","tema":"Fixtures","tipo":"codigo","pregunta":"Quieres una fixture que entregue un LoginPage listo al test. ¿Qué va en el hueco?","codigo":"export const test = base.extend<{ loginPage: LoginPage }>({\n  loginPage: async ({ page }, use) => {\n    const loginPage = new LoginPage(page);\n    await loginPage.goto();\n    ___\n  },\n});","opciones":{"a":"`await use(loginPage);`","b":"`return loginPage;`","c":"`use(loginPage);`","d":"`await test.use({ loginPage });`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Una fixture entrega su valor llamando a `await use(valor)`; lo que va antes es la preparación y lo que va después, la limpieza.","explicacion":["use() cede el control al test con ese valor.","El código tras await use() se ejecuta al terminar el test (teardown).","Devolver el valor con return no lo entrega."],"razones":{"a":"Correcta. La fixture entrega el valor con await use(...).","b":"Las fixtures no devuelven el valor: lo pasan a use().","c":"Sin await, el teardown se ejecutaría antes de que acabe el test.","d":"test.use() configura opciones de un fichero o describe; no entrega valores."},"clave":"Fixture = preparar, await use(valor), limpiar.","docs":"https://playwright.dev/docs/test-fixtures"},{"id":"M-FIX-02","nivel":"medio","tema":"Fixtures","tipo":"codigo","pregunta":"Tras crear `fixtures.ts` con `base.extend`, ¿qué debe exportarse además de `test` para importar ambos desde ese fichero?","codigo":"import { test as base } from '@playwright/test';\n\nexport const test = base.extend<{ todo: TodoPage }>({\n  todo: async ({ page }, use) => { await use(new TodoPage(page)); },\n});\n___","opciones":{"a":"`export { expect } from '@playwright/test';`","b":"`export { page } from '@playwright/test';`","c":"`export default base;`","d":"`export { use } from '@playwright/test';`"},"codigoOpciones":false,"correcta":["a"],"concepto":"El fichero de fixtures exporta el `test` extendido y reexporta `expect` para importar ambos desde un solo sitio.","explicacion":["Los tests importan { test, expect } de './fixtures'.","Así no se mezcla el test base con el extendido.","expect no cambia, pero se reexporta por comodidad."],"razones":{"a":"Correcta. Reexporta expect.","b":"page no se exporta como módulo; es una fixture.","c":"Exportar base no incluye las fixtures nuevas.","d":"use no es una exportación de @playwright/test."},"clave":"Exporta `test` y `expect` juntos.","docs":"https://playwright.dev/docs/test-fixtures"},{"id":"M-FIX-03","nivel":"medio","tema":"Fixtures","tipo":"codigo","pregunta":"Quieres que la fixture se cree una vez por worker y no por test. ¿Qué va en el hueco?","codigo":"export const test = base.extend<{}, { db: Db }>({\n  db: [async ({}, use) => {\n    const db = await connect();\n    await use(db);\n    await db.close();\n  }, ___],\n});","opciones":{"a":"`{ scope: 'worker' }`","b":"`{ worker: true }`","c":"`{ auto: 'worker' }`","d":"`{ scope: 'file' }`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Las fixtures de worker se declaran en el segundo genérico y con `{ scope: 'worker' }`.","explicacion":["El scope por defecto es 'test'.","Las de worker se comparten entre los tests que ejecuta el mismo worker.","Se tipan en el segundo parámetro genérico de extend."],"razones":{"a":"Correcta. Es la opción oficial de scope.","b":"worker: true no existe.","c":"auto no recibe un scope; es un booleano.","d":"Los valores válidos son 'test' y 'worker'."},"clave":"Segundo genérico + scope: 'worker'.","docs":"https://playwright.dev/docs/test-fixtures"},{"id":"M-FIX-04","nivel":"medio","tema":"Fixtures","tipo":"como","pregunta":"¿Cómo declaras una fixture que se ejecuta en todos los tests aunque no la pidan?","codigo":"myLogger: [async ({}, use) => {\n  console.log('inicio');\n  await use();\n}, ___],","opciones":{"a":"`{ auto: true }`","b":"`{ always: true }`","c":"`{ scope: 'auto' }`","d":"`{ global: true }`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Una fixture automática se declara con `{ auto: true }` y se ejecuta en cada test sin que este la mencione.","explicacion":["Es útil para logging, limpiezas o capturas globales.","Se puede combinar con scope: 'worker'.","Si no hay valor que entregar, use() se llama sin argumentos."],"razones":{"a":"Correcta. auto: true.","b":"always no es una opción de fixture.","c":"scope solo admite 'test' o 'worker'.","d":"global no existe como opción."},"clave":"auto: true = se ejecuta siempre.","docs":"https://playwright.dev/docs/test-fixtures"},{"id":"M-FIX-05","nivel":"medio","tema":"Fixtures","tipo":"codigo","pregunta":"Quieres una fixture configurable desde `test.use()` o los proyectos. ¿Qué va en el hueco?","codigo":"export const test = base.extend<{ user: string }>({\n  user: ['guest', ___],\n});\n\n// en config: use: { user: 'admin' }","opciones":{"a":"`{ option: true }`","b":"`{ config: true }`","c":"`{ scope: 'option' }`","d":"`{ auto: true }`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Una fixture opción tiene un valor por defecto y `{ option: true }`, lo que permite sobrescribirla con `use`.","explicacion":["Se declara como [valorPorDefecto, { option: true }].","Se cambia con test.use() o en use del proyecto.","Sin option: true, el valor no se puede configurar así."],"razones":{"a":"Correcta. Marca la fixture como opción.","b":"config no es una propiedad válida.","c":"scope no admite 'option'.","d":"auto la ejecuta siempre, pero no la hace configurable."},"clave":"Opción = [default, { option: true }].","docs":"https://playwright.dev/docs/test-fixtures"},{"id":"M-FIX-06","nivel":"medio","tema":"Fixtures","tipo":"concepto","pregunta":"¿Cómo hace una fixture para depender de otra?","opciones":{"a":"La recibe en el objeto desestructurado de sus argumentos, y Playwright resuelve el orden.","b":"Llamando manualmente a la otra fixture como función.","c":"Importándola con `import` desde su fichero.","d":"Declarando `dependencies: [...]` dentro de la fixture."},"codigoOpciones":false,"correcta":["a"],"concepto":"Una fixture pide otras fixtures desestructurándolas en su primer parámetro y Playwright las prepara antes.","explicacion":["Por ejemplo async ({ page, loginPage }, use) => {...}.","El teardown se ejecuta en orden inverso.","Solo se inicializan las que se usan."],"razones":{"a":"Correcta. Se piden por desestructuración.","b":"Las fixtures no se invocan manualmente.","c":"Importar el fichero no crea la dependencia.","d":"dependencies pertenece a proyectos, no a fixtures."},"clave":"Para depender, destructura.","docs":"https://playwright.dev/docs/test-fixtures"},{"id":"M-FIX-07","nivel":"medio","tema":"Fixtures","tipo":"funcion","pregunta":"¿Qué función combina fixtures de dos `test` extendidos distintos en uno?","codigo":"import { mergeTests } from '@playwright/test';\nimport { test as dbTest } from './db';\nimport { test as authTest } from './auth';\n\nexport const test = ___;","opciones":{"a":"`mergeTests(dbTest, authTest)`","b":"`dbTest.merge(authTest)`","c":"`base.extend(dbTest, authTest)`","d":"`combineTests(dbTest, authTest)`"},"codigoOpciones":false,"correcta":["a"],"concepto":"`mergeTests` fusiona las fixtures de varios `test` extendidos en uno solo.","explicacion":["Acepta dos o más test como argumentos.","El resultado se exporta como el test del proyecto.","No hay método .merge en test."],"razones":{"a":"Correcta. mergeTests es la API oficial.","b":"test no tiene método merge.","c":"extend no admite otros test como argumentos.","d":"combineTests no existe."},"clave":"Varios test: `mergeTests(a, b)`.","docs":"https://playwright.dev/docs/test-fixtures"},{"id":"M-FIX-08","nivel":"medio","tema":"Fixtures","tipo":"error","pregunta":"El test con esta fixture falla indicando que `use()` no se llamó. ¿Qué falla?","codigo":"loginPage: async ({ page }, use) => {\n  const lp = new LoginPage(page);\n  await lp.goto();\n  return lp;\n},","opciones":{"a":"La fixture nunca llama a `use()`, que es lo que la entrega al test.","b":"Falta `scope: 'test'`.","c":"`goto()` no se puede usar en una fixture.","d":"El parámetro `page` no está permitido en fixtures."},"codigoOpciones":false,"correcta":["a"],"concepto":"Una fixture debe llamar a `await use(valor)` exactamente una vez para que el test continúe.","explicacion":["return no sustituye a use().","Playwright informa de que la fixture no llamó a use().","El scope por defecto ya es 'test'."],"razones":{"a":"Correcta. Falta use().","b":"El scope por defecto ya es test.","c":"goto es una acción normal de un POM.","d":"page es la fixture más usada en otras fixtures."},"clave":"Sin use() no hay fixture.","docs":"https://playwright.dev/docs/test-fixtures"},{"id":"M-FRA-01","nivel":"medio","tema":"Frames, diálogos y pestañas","tipo":"codigo","pregunta":"El formulario de pago está dentro de un `<iframe id=\"payment\">`. ¿Qué método completa el hueco?","codigo":"await page.___('#payment')\n  .getByLabel('Tarjeta')\n  .fill('4242 4242 4242 4242');","opciones":{"a":"`frameLocator`","b":"`frame`","c":"`locator`","d":"`waitForFrame`"},"codigoOpciones":false,"correcta":["a"],"concepto":"page.frameLocator(selector) devuelve un FrameLocator con el que localizar elementos dentro de un iframe.","explicacion":["frameLocator('#payment') apunta al iframe.","Desde él se encadenan getByLabel, getByRole, etc.","Reintenta y espera automáticamente, a diferencia de page.frame()."],"razones":{"a":"Correcta. `frameLocator` entra en el iframe.","b":"`page.frame()` es la API antigua y no auto-espera.","c":"`locator` no atraviesa la frontera del iframe.","d":"`waitForFrame` no existe en Page."},"clave":"iframe -> frameLocator.","docs":"https://playwright.dev/docs/frames"},{"id":"M-FRA-02","nivel":"medio","tema":"Frames, diálogos y pestañas","tipo":"error","pregunta":"El test borra un elemento que muestra un `confirm()`, pero el borrado nunca se confirma. ¿Por qué?","codigo":"await page.getByRole('button', { name: 'Borrar' }).click();\npage.on('dialog', dialog => dialog.accept());\nawait expect(page.getByText('Elemento borrado')).toBeVisible();","opciones":{"a":"`dialog.accept()` no existe; es `dialog.confirm()`.","b":"Los diálogos solo se pueden aceptar con `page.once`.","c":"Falta `await` en `dialog.accept()`.","d":"El manejador se registra después del clic; sin manejador, Playwright descarta el diálogo automáticamente."},"codigoOpciones":false,"correcta":["d"],"concepto":"Los manejadores de diálogos deben registrarse antes de la acción que los abre; sin ellos Playwright los descarta automáticamente.","explicacion":["Sin listener de 'dialog', Playwright cierra (dismiss) el diálogo solo.","El listener debe existir antes del click que lo dispara.","Aquí se registra tarde y nunca se acepta."],"razones":{"a":"`dialog.accept()` es el método correcto.","b":"`page.on` también vale; `once` solo limita a un evento.","c":"Aunque conviene hacerlo, el fallo principal es el orden del registro.","d":"Correcta. El diálogo ya se descartó antes de registrar el manejador."},"clave":"Primero el listener del diálogo, luego el click.","docs":"https://playwright.dev/docs/dialogs"},{"id":"M-FRA-03","nivel":"medio","tema":"Frames, diálogos y pestañas","tipo":"codigo","pregunta":"¿Por qué la promesa `popupPromise` se crea antes del clic?","codigo":"const popupPromise = page.waitForEvent('popup');\nawait page.getByText('Ayuda').click();\nconst popup = await popupPromise;\nawait expect(popup).toHaveTitle(/Ayuda/);","opciones":{"a":"Porque `waitForEvent` bloquea el hilo hasta el clic.","b":"Para que el evento no se pierda si la pestaña se abre antes de empezar a escuchar.","c":"Porque `click` solo funciona si hay una promesa pendiente.","d":"Porque `toHaveTitle` necesita la promesa sin resolver."},"codigoOpciones":false,"correcta":["b"],"concepto":"Los eventos que dispara una acción se escuchan antes de ejecutarla para evitar condiciones de carrera.","explicacion":["waitForEvent empieza a escuchar al llamarse.","El popup puede abrirse justo durante el click.","Se hace await de la promesa después, para obtener la nueva Page."],"razones":{"a":"waitForEvent devuelve una promesa; no bloquea nada hasta el await.","b":"Correcta. Se evita perder el evento por orden de ejecución.","c":"click no depende de promesas pendientes.","d":"toHaveTitle recibe la Page ya resuelta."},"clave":"Promesa primero, acción después, await al final.","docs":"https://playwright.dev/docs/pages#handling-popups"},{"id":"M-FRA-04","nivel":"medio","tema":"Frames, diálogos y pestañas","tipo":"funcion","pregunta":"Un enlace abre una nueva pestaña con `target=\"_blank\"`. ¿Qué espera captura cualquier página nueva creada en el contexto del navegador?","codigo":"const pagePromise = context.___;\nawait page.getByRole('link', { name: 'Docs' }).click();\nconst newPage = await pagePromise;","opciones":{"a":"`waitForEvent('page')`","b":"`waitForNavigation()`","c":"`waitForEvent('tab')`","d":"`waitForPage()`"},"codigoOpciones":false,"correcta":["a"],"concepto":"context.waitForEvent('page') emite cada nueva Page del BrowserContext.","explicacion":["El evento 'page' del contexto cubre cualquier pestaña nueva.","page.waitForEvent('popup') cubre solo las abiertas desde esa página.","waitForNavigation está obsoleto y no abre pestañas."],"razones":{"a":"Correcta. `context.waitForEvent('page')` devuelve la nueva Page.","b":"`waitForNavigation` está obsoleto y no devuelve una Page nueva.","c":"No existe el evento 'tab'.","d":"BrowserContext no tiene `waitForPage`."},"clave":"Nueva pestaña: evento 'page' del context o 'popup' de la page.","docs":"https://playwright.dev/docs/pages#handling-new-pages"},{"id":"M-FRA-05","nivel":"medio","tema":"Frames, diálogos y pestañas","tipo":"codigo","pregunta":"El enlace descarga `informe-2024.pdf`. ¿Qué imprime este test?","codigo":"const downloadPromise = page.waitForEvent('download');\nawait page.getByRole('link', { name: 'Informe' }).click();\nconst download = await downloadPromise;\nconsole.log(download.suggestedFilename());","opciones":{"a":"La ruta temporal donde Playwright guardó el fichero.","b":"`informe-2024.pdf`, el nombre sugerido por el servidor.","c":"El contenido del PDF.","d":"`undefined` hasta llamar a `download.saveAs`."},"codigoOpciones":false,"correcta":["b"],"concepto":"download.suggestedFilename() devuelve el nombre de fichero sugerido por el navegador/servidor.","explicacion":["La descarga se espera con waitForEvent('download') antes del click.","suggestedFilename() viene de Content-Disposition o de la URL.","saveAs(ruta) guarda la copia donde se indique."],"razones":{"a":"La ruta se obtiene con `download.path()`, no con suggestedFilename.","b":"Correcta. Devuelve el nombre sugerido.","c":"El contenido no se devuelve con este método.","d":"suggestedFilename está disponible sin llamar a saveAs."},"clave":"suggestedFilename = nombre; saveAs = guardar.","docs":"https://playwright.dev/docs/downloads"},{"id":"M-FRA-06","nivel":"medio","tema":"Frames, diálogos y pestañas","tipo":"codigo","pregunta":"¿Qué método completa el hueco para subir un fichero a un `<input type=\"file\">`?","codigo":"await page.getByLabel('Adjunto').___('tests/data/cv.pdf');","opciones":{"a":"`fill`","b":"`uploadFile`","c":"`setInputFiles`","d":"`type`"},"codigoOpciones":false,"correcta":["c"],"concepto":"locator.setInputFiles() asigna uno o varios ficheros a un input de tipo file.","explicacion":["Acepta una ruta, un array de rutas o buffers.","setInputFiles([]) vacía la selección.","fill() solo vale para campos de texto."],"razones":{"a":"`fill` no sirve para inputs de tipo file.","b":"`uploadFile` es de otras librerías, no de Playwright.","c":"Correcta. `setInputFiles` selecciona los ficheros.","d":"`type` simula teclas y no sube ficheros."},"clave":"Subir fichero = setInputFiles.","docs":"https://playwright.dev/docs/input#upload-files"},{"id":"M-FRA-07","nivel":"medio","tema":"Frames, diálogos y pestañas","tipo":"error","pregunta":"El campo existe dentro del iframe `#payment`, pero el test da timeout. ¿Cuál es la causa?","codigo":"await page.locator('#payment').getByLabel('Tarjeta').fill('4242');","opciones":{"a":"`getByLabel` no se puede encadenar.","b":"Falta `await` antes de `getByLabel`.","c":"Un locator normal no entra en el contenido del iframe; hay que usar `frameLocator`.","d":"`fill` no funciona en campos de tarjeta."},"codigoOpciones":false,"correcta":["c"],"concepto":"Los locators no atraviesan iframes: el contenido de un iframe se alcanza con frameLocator o contentFrame().","explicacion":["page.locator('#payment') localiza la etiqueta iframe, no su contenido.","Para entrar: page.frameLocator('#payment') o locator.contentFrame().","Después se encadenan los locators normales."],"razones":{"a":"Encadenar getByLabel desde un locator es válido.","b":"Los locators se construyen sin await; solo la acción lo lleva.","c":"Correcta. Hay que entrar al iframe con `frameLocator`.","d":"fill funciona con cualquier input editable."},"clave":"Locator = no cruza iframes; frameLocator = sí.","docs":"https://playwright.dev/docs/frames"},{"id":"M-FRA-08","nivel":"medio","tema":"Frames, diálogos y pestañas","tipo":"codigo","pregunta":"Un botón abre el selector nativo de ficheros y no hay `<input type=\"file\">` accesible. ¿Qué hace este patrón?","codigo":"const chooserPromise = page.waitForEvent('filechooser');\nawait page.getByText('Subir').click();\nconst chooser = await chooserPromise;\nawait chooser.setFiles('tests/data/foto.png');","opciones":{"a":"Cancela el selector nativo.","b":"Descarga `foto.png` desde la página.","c":"Cambia el input a `type=\"file\"`.","d":"Intercepta el selector de ficheros y selecciona el fichero indicado."},"codigoOpciones":false,"correcta":["d"],"concepto":"El evento filechooser permite responder al selector nativo con fileChooser.setFiles().","explicacion":["Se escucha 'filechooser' antes del click.","El click abre el selector y dispara el evento.","chooser.setFiles() selecciona los ficheros sin interactuar con el SO."],"razones":{"a":"No lo cancela: lo responde con un fichero.","b":"Es una subida, no una descarga.","c":"No modifica el DOM del input.","d":"Correcta. Intercepta el selector y fija el fichero."},"clave":"Botón que abre selector nativo: waitForEvent('filechooser').","docs":"https://playwright.dev/docs/input#upload-files"},{"id":"M-LOC-01","nivel":"medio","tema":"Localizadores avanzados","tipo":"codigo","pregunta":"¿Qué hace este código?","codigo":"const row = page.getByRole('row').filter({ hasText: 'Ana' });\nawait row.getByRole('button', { name: 'Editar' }).click();","opciones":{"a":"Hace clic en todos los botones `Editar` de la tabla.","b":"Hace clic en el botón `Editar` de la fila que contiene el texto `Ana`.","c":"Falla siempre porque `filter` solo existe en `page.locator`.","d":"Hace clic en la primera fila y comprueba que contiene `Ana`."},"codigoOpciones":false,"correcta":["b"],"concepto":"filter() reduce un conjunto de locators y permite encadenar nuevos locators dentro del elemento resultante.","explicacion":["getByRole('row') devuelve todas las filas.","filter({ hasText }) deja solo las filas cuyo texto contiene 'Ana'.","El locator encadenado busca el botón únicamente dentro de esa fila."],"razones":{"a":"El filtro acota a una sola fila, no a toda la tabla.","b":"Correcta. Se filtra la fila por texto y se busca el botón dentro de ella.","c":"filter está disponible en cualquier Locator.","d":"No hay aserción ni se selecciona la primera fila; se filtra por texto."},"clave":"Fila por texto con filter, acción con un locator encadenado.","docs":"https://playwright.dev/docs/locators#filtering-locators"},{"id":"M-LOC-02","nivel":"medio","tema":"Localizadores avanzados","tipo":"funcion","pregunta":"Necesitas un locator que localice un elemento que cumpla a la vez dos condiciones (por ejemplo, un botón con rol `button` Y con un `data-testid` concreto). ¿Qué método usas?","codigo":"const btn = page.getByRole('button').___(page.getByTestId('save'));","opciones":{"a":"`and`","b":"`or`","c":"`filter`","d":"`nth`"},"codigoOpciones":false,"correcta":["a"],"concepto":"locator.and() devuelve el elemento que coincide con ambos locators a la vez.","explicacion":["and() crea una intersección de dos locators.","or() es la unión: coincide con cualquiera de los dos.","Ambos locators se evalúan sobre el mismo elemento, no uno dentro del otro."],"razones":{"a":"Correcta. `and` exige que el mismo elemento cumpla ambos locators.","b":"`or` coincide con cualquiera de los dos, no con ambos.","c":"`filter` espera opciones como hasText o has, no un locator directamente.","d":"`nth` elige por posición, no combina condiciones."},"clave":"and = intersección, or = unión.","docs":"https://playwright.dev/docs/locators#matching-all-of-multiple-locators"},{"id":"M-LOC-03","nivel":"medio","tema":"Localizadores avanzados","tipo":"error","pregunta":"Este código no compila en TypeScript. ¿Cuál es el problema?","codigo":"for (const item of page.getByRole('listitem')) {\n  console.log(await item.textContent());\n}","opciones":{"a":"`textContent` no existe en Locator.","b":"Un Locator no es iterable; hay que usar `await page.getByRole('listitem').all()`.","c":"`getByRole` no admite el rol `listitem`.","d":"Falta `await` delante del `for`."},"codigoOpciones":false,"correcta":["b"],"concepto":"Un Locator no es iterable: locator.all() devuelve una promesa con un array de Locators sobre el que sí se puede iterar.","explicacion":["Un Locator es una descripción perezosa, no una colección.","await locator.all() devuelve Locator[] con los elementos actuales.","Después se usa for...of normalmente."],"razones":{"a":"locator.textContent() existe y es válido.","b":"Correcta. Hay que obtener el array con `await ...all()` antes del for...of.","c":"listitem es un rol ARIA válido.","d":"`await` no va delante del `for` de esta forma; el problema es la iteración sobre el Locator."},"clave":"for...of sobre await locator.all(), nunca sobre el locator.","docs":"https://playwright.dev/docs/locators#lists"},{"id":"M-LOC-04","nivel":"medio","tema":"Localizadores avanzados","tipo":"codigo","pregunta":"Quieres obtener un array de strings con el texto de todos los elementos de la lista. ¿Qué método completa el hueco?","codigo":"const texts: string[] = await page.locator('ul.menu li').___();\nexpect(texts).toEqual(['Inicio', 'Cursos', 'Contacto']);","opciones":{"a":"`textContent`","b":"`allTextContents`","c":"`innerHTML`","d":"`count`"},"codigoOpciones":false,"correcta":["b"],"concepto":"allTextContents() y allInnerTexts() devuelven un array de strings con el texto de todos los elementos coincidentes.","explicacion":["textContent() devuelve un solo string y falla con varios elementos (strict mode).","allTextContents() devuelve string[].","count() solo devuelve el número de elementos."],"razones":{"a":"`textContent` devuelve un único string y es estricto con un solo elemento.","b":"Correcta. `allTextContents` devuelve el array de textos.","c":"`innerHTML` devuelve HTML de un solo elemento, no un array.","d":"`count` devuelve un número, no los textos."},"clave":"Plural 'all...' para arrays de texto.","docs":"https://playwright.dev/docs/api/class-locator#locator-all-text-contents"},{"id":"M-LOC-05","nivel":"medio","tema":"Localizadores avanzados","tipo":"concepto","pregunta":"En la página hay dos botones: `Guardar` y `Guardar como`. ¿Qué locator apunta solo al primero?","codigo":"// A\npage.getByRole('button', { name: 'Guardar' })\n// B\npage.getByRole('button', { name: 'Guardar', exact: true })","opciones":{"a":"Solo A.","b":"Ambos; `exact` no cambia nada.","c":"Solo B.","d":"Ninguno; hay que usar `first()` siempre."},"codigoOpciones":false,"correcta":["c"],"concepto":"Por defecto name coincide por subcadena sin distinguir mayúsculas; exact: true exige coincidencia exacta del nombre completo.","explicacion":["Sin exact, 'Guardar' también coincide con 'Guardar como' (subcadena).","El locator A violaría el strict mode al encontrar dos botones.","Con exact: true solo coincide el nombre completo y sensible a mayúsculas."],"razones":{"a":"A coincide con los dos botones y provoca un strict mode violation.","b":"`exact` sí cambia el emparejamiento: pasa de subcadena a exacto.","c":"Correcta. Con `exact: true` solo coincide 'Guardar' completo.","d":"Un locator exacto evita necesitar first()."},"clave":"¿Nombres que se contienen entre sí? exact: true.","docs":"https://playwright.dev/docs/locators#locate-by-role"},{"id":"M-LOC-06","nivel":"medio","tema":"Localizadores avanzados","tipo":"como","pregunta":"¿Cómo localizas un enlace cuyo nombre es `Pedido #` seguido de un número variable (Pedido #12, Pedido #345…)?","opciones":{"a":"`page.getByRole('link', { name: 'Pedido #\\\\d+' })`","b":"`page.getByRole('link', { name: /Pedido #\\d+/ })`","c":"`page.getByRole('link', { regex: 'Pedido #\\\\d+' })`","d":"`page.getByRole('link').matches(/Pedido #\\d+/)`"},"codigoOpciones":false,"correcta":["b"],"concepto":"La opción name de getByRole acepta un string o una RegExp para nombres variables.","explicacion":["name acepta string o RegExp.","Con string se busca subcadena literal, no patrón.","No existe una opción regex ni un método matches() en Locator."],"razones":{"a":"Un string se toma literal: no interpreta `\\d+` como patrón.","b":"Correcta. name acepta una RegExp.","c":"No existe la opción `regex` en getByRole.","d":"Locator no tiene un método `matches`."},"clave":"Nombre variable: /regex/ en name.","docs":"https://playwright.dev/docs/locators#locate-by-role"},{"id":"M-LOC-07","nivel":"medio","tema":"Localizadores avanzados","tipo":"codigo","pregunta":"Si hay 5 `li` en la lista y 2 contienen `Agotado`, ¿qué valor tiene `n`?","codigo":"const n = await page\n  .getByRole('listitem')\n  .filter({ hasNotText: 'Agotado' })\n  .count();","opciones":{"a":"2","b":"5","c":"3","d":"No se puede saber: lanza un error de strict mode."},"codigoOpciones":false,"correcta":["c"],"concepto":"filter({ hasNotText }) excluye los elementos que contienen el texto, y count() cuenta los restantes sin strict mode.","explicacion":["hasNotText deja los elementos que NO contienen el texto.","5 - 2 = 3 elementos restantes.","count() no es estricto: puede haber cualquier número de coincidencias."],"razones":{"a":"2 son los que sí contien ,"c":"`test.section`","d":"`expect.step`"},"codigoOpciones":false,"correcta":["a"],"concepto":"`test.step` crea un paso con nombre visible en los informes y en el trace.","explicacion":["Devuelve una Promise, por eso se usa con await.","Puede devolver un valor.","Facilita localizar dónde falla un test."],"razones":{"a":"Correcta. Es la API oficial.","b":"test.group no existe.","c":"test.section no existe.","d":"expect no tiene step."},"clave":"Pasos legibles: test.step.","docs":"https://playwright.dev/docs/api/class-test"},{"id":"M-ORG-02","nivel":"medio","tema":"Organización y depuración","tipo":"como","pregunta":"¿Cómo compruebas varias cosas sin que la primera aserción fallida detenga el test?","opciones":{"a":"`await expect.soft(locator).toHaveText('Hola');`","b":"`await expect(locator).soft().toHaveText('Hola');`","c":"`await expect(locator, { soft: true }).toBeVisible();`","d":"`await test.soft(locator).toHaveText('Hola');`"},"codigoOpciones":false,"correcta":["a"],"concepto":"`expect.soft` registra el fallo pero deja continuar el test.","explicacion":["El test se marca como fallido al final.","Útil para validar varios campos de una vez.","Se usa igual que expect."],"razones":{"a":"Correcta. API oficial.","b":"expect no tiene método soft().","c":"No existe esa opción así.","d":"test no tiene soft."},"clave":"Soft = falla sin parar.","docs":"https://playwright.dev/docs/test-assertions"},{"id":"M-ORG-03","nivel":"medio","tema":"Organización y depuración","tipo":"codigo","pregunta":"Se necesita esperar a que un endpoint devuelva 200 con reintentos. ¿Qué va en el hueco?","codigo":"await ___(async () => {\n  const res = await request.get('/api/health');\n  return res.status();\n}, { timeout: 10_000 }).toBe(200);","opciones":{"a":"`expect.poll`","b":"`expect.retry`","c":"`expect.wait`","d":"`expect.eventually`"},"codigoOpciones":false,"correcta":["a"],"concepto":"`expect.poll` repite una función hasta que el valor cumple la aserción.","explicacion":["Admite timeout M-ORG-06","nivel":"medio","tema":"Organización y depuración","tipo":"codigo","pregunta":"¿Cómo etiquetas un test como smoke y lo ejecutas filtrando?","codigo":"test('login', ___, async ({ page }) => {\n  // ...\n});\n\n// npx playwright test --grep @smoke","opciones":{"a":"`{ tag: '@smoke' }`","b":"`{ label: '@smoke' }`","c":"`{ grep: '@smoke' }`","d":"`{ smoke: true }`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Las etiquetas van en los detalles del test con `tag` y se filtran con `--grep`.","explicacion":["Pueden ser un string o array.","--grep-invert excluye tests.","Se pueden filtrar en CI."],"razones":{"a":"Correcta. tag.","b":"label no existe.","c":"grep no es detalle de test.","d":"smoke no es propiedad."},"clave":"tag + --grep.","docs":"https://playwright.dev/docs/test-annotations"},{"id":"M-ORG-07","nivel":"medio","tema":"Organización y depuración","tipo":"codigo","pregunta":"¿Cómo sabes en un test si es un reintento?","codigo":"test('x', async ({ page }) => {\n  const info = test.info();\n  if (___ > 0) { /* ... */ }\n});","opciones":{"a":"`info.retry`","b":"`info.retries`","c":"`info.attempt`","d":"`test.retry`"},"codigoOpciones":false,"correcta":["a"],"concepto":"`testInfo.retry` indica el número de reintento.","explicacion":["Vale 0 en el primer intento.","Se obtiene con test.info().","retries es opción de config."],"razones":{"a":"Correcta. retry.","b":"retries no es propiedad de testInfo.","c":"attempt no existe.","d":"test.retry no existe."},"clave":"retry 0 = primer intento.","docs":"https://playwright.dev/docs/test-retries"},{"id":"M-ORG-08","nivel":"medio","tema":"Organización y depuración","tipo":"codigo","pregunta":"¿Cómo saltas un test en WebKit con motivo?","codigo":"test('feature', async ({ page, browserName }) => {\n  ___;\n});","opciones":{"a":"`test.skip(browserName === 'webkit', 'No soportado en WebKit')`","b":"`test.skip('webkit')`","c":"`if (browserName === 'webkit') return;`","d":"`test.fixme(browserName)`"},"codigoOpciones":false,"correcta":["a"],"concepto":"`test.skip(condicion, motivo)` omite el test dinámicamente.","explicacion":["Aparece como omitido en el informe.","Se puede usar dentro del test.","return lo marcaría como pasado."],"razones":{"a":"Correcta. Forma oficial.","b":"skip('webkit') omite siempre.","c":"Marcaría como pasado.","d":"fixme se usa para tests rotos."},"clave":"skip(cond, motivo).","docs":"https://playwright.dev/docs/api/class-test"},{"id":"M-ORG-09","nivel":"medio","tema":"Organización y depuración","tipo":"codigo","pregunta":"¿Qué hace este código?","codigo":"const users: { name: string; role: string }[] = [\n  { name: 'Ana', role: 'admin' },\n  { name: 'Luis', role: 'user' },\n];\n\nfor (const u of users) {\n  test(`login de ${u.name}`, async ({ page }) => {\n    // ...\n  });\n}","opciones":{"a":"Genera un test por usuario con nombre distinto.","b":"Ejecuta un solo test con todos.","c":"Falla por nombres repetidos.","d":"Necesita test.each."},"codigoOpciones":false,"correcta":["a"],"concepto":"Los tests parametrizados se crean con un bucle.","explicacion":["Cada test debe tener título único.","Playwright no tiene test.each.","Se tipan los datos."],"razones":{"a":"Correcta. Un test por elemento.","b":"Se crean varios tests.","c":"Los títulos son distintos.","d":"test.each no existe."},"clave":"Bucle = tests parametrizados.","docs":"https://playwright.dev/docs/test-parameterize"},{"id":"M-ORG-10","nivel":"medio","tema":"Organización y depuración","tipo":"como","pregunta":"¿Qué comando abre un trace?","opciones":{"a":"`npx playwright show-trace trace.zip`","b":"`npx playwright open-trace trace.zip`","c":"`npx playwright trace trace.zip`","d":"`npx playwright view trace.zip`"},"codigoOpciones":false,"correcta":["a"],"concepto":"`show-trace` abre el visor de trazas.","explicacion":["Muestra acciones y capturas.","Se genera con trace on.","Admite zip."],"razones":{"a":"Correcta. Comando oficial.","b":"open-trace no existe.","c":"trace no existe.","d":"view no existe."},"clave":"show-trace.","docs":"https://playwright.dev/docs/trace-viewer"},{"id":"M-ORG-11","nivel":"medio","tema":"Organización y depuración","tipo":"como","pregunta":"¿Cómo actualizas las capturas de referencia?","codigo":"await expect(page).toHaveScreenshot();","opciones":{"a":"`npx playwright test --update-snapshots`","b":"`npx playwright test --update-screenshots`","c":"`npx playwright update`","d":"`npx playwright test --reset-snapshots`"},"codigoOpciones":false,"correcta":["a"],"concepto":"`--update-snapshots` regenera las referencias.","explicacion":["Se usa tras un cambio visual intencionado.","Revisa los cambios antes de commitear.","Otros flags no existen."],"razones":{"a":"Correcta. Flag oficial.","b":"update-screenshots no existe.","c":"update no existe.","d":"reset-snapshots no existe."},"clave":"--update-snapshots.","docs":"https://playwright.dev/docs/test-snapshots"},{"id":"M-POM-01","nivel":"medio","tema":"Page Object Model","tipo":"codigo","pregunta":"En este Page Object, ¿qué va en el hueco para definir el botón?","codigo":"import type { Page, Locator } from '@playwright/test';\n\nexport class LoginPage {\n  readonly page: Page;\n  readonly submit: Locator;\n\n  constructor(page: Page) {\n    this.page = page;\n    this.submit = ___;\n  }\n}","opciones":{"a":"`page.getByRole('button', { name: 'Entrar' })`","b":"`await page.getByRole('button', { name: 'Entrar' })`","c":"`page.getByRole('button', { name: 'Entrar' }).click()`","d":"`page.getByRole('button', { name: 'Entrar' }).textContent()`"},"codigoOpciones":false,"correcta":["a"],"concepto":"En un POM los locators son propiedades `readonly` que se crean en el constructor sin ejecutar ninguna acción.","explicacion":["Crear un locator es síncrono y perezoso: no toca el navegador.","El constructor no puede ser async, así que no admite await.","Guardar el Locator permite reutilizarlo con auto-espera en cada uso."],"razones":{"a":"Correcta. Devuelve un Locator, que es lo que declara la propiedad.","b":"Un constructor no puede ser async, y además crear un locator no necesita await.","c":"click() ejecuta una acción y devuelve Promise<void>, no un Locator.","d":"textContent() devuelve una Promise<string|null>, no un Locator."},"clave":"Constructor: solo locators, sin await ni acciones.","docs":"https://playwright.dev/docs/pom"},{"id":"M-POM-02","nivel":"medio","tema":"Page Object Model","tipo":"error","pregunta":"Este método del Page Object a veces deja el test sin rellenar el formulario antes de pulsar. ¿Qué falla?","codigo":"async login(user: string, pass: string): Promise<void> {\n  this.userInput.fill(user);\n  this.passInput.fill(pass);\n  await this.submit.click();\n}","opciones":{"a":"Faltan los `await` en los `fill()`: las promesas no se esperan y el clic puede adelantarse.","b":"`fill()` no existe en un Locator; hay que usar `type()`.","c":"El método debería devolver `Promise<string>`.","d":"Los locators deberían ser `async` para poder rellenarse."},"codigoOpciones":false,"correcta":["a"],"concepto":"Toda acción de Locator devuelve una Promise y hay que esperarla con `await` también dentro del Page Object.","explicacion":["Sin await la ejecución sigue sin esperar a que termine el fill.","Las promesas sin esperar pueden provocar condiciones de carrera o errores no capturados.","El tipo Promise<void> es correcto: el método no devuelve valor."],"razones":{"a":"Correcta. Hay que hacer await de cada acción.","b":"fill() sí existe en Locator y es lo recomendado.","c":"El método no devuelve texto; Promise<void> es correcto.","d":"Los locators no son async; las acciones sobre ellos sí devuelven Promise."},"clave":"Acción de Locator sin await = carrera.","docs":"https://playwright.dev/docs/pom"},{"id":"M-POM-03","nivel":"medio","tema":"Page Object Model","tipo":"concepto","pregunta":"¿Dónde conviene poner por defecto las aserciones `expect` al usar Page Objects?","opciones":{"a":"En los tests; el POM expone locators y acciones.","b":"Siempre dentro de los métodos del POM.","c":"En el constructor del POM, para validarlo al crearse.","d":"En el `playwright.config.ts`."},"codigoOpciones":false,"correcta":["a"],"concepto":"La recomendación general es que el POM encapsule acciones y localizadores, y que los tests contengan las aserciones para que sea claro qué se verifica.","explicacion":["Los tests quedan legibles: se ve qué se comprueba.","Un POM con aserciones ocultas dificulta reutilizarlo en otros escenarios.","Se puede incluir alguna espera o verificación puntual en el POM, pero no es la norma."],"razones":{"a":"Correcta. Las aserciones se dejan en el test.","b":"Esconder todas las aserciones en el POM oculta la intención del test.","c":"El constructor no debe ejecutar comprobaciones asíncronas.","d":"La configuración no contiene aserciones de tests."},"clave":"POM = cómo; test = qué se verifica.","docs":"https://playwright.dev/docs/pom"},{"id":"M-POM-04","nivel":"medio","tema":"Page Object Model","tipo":"codigo","pregunta":"Tras pulsar en el carrito se navega a otra página. ¿Qué devuelve el método para encadenar Page Objects?","codigo":"async goToCart(): Promise<CartPage> {\n  await this.cartLink.click();\n  return ___;\n}","opciones":{"a":"`new CartPage(this.page)`","b":"`new CartPage()`","c":"`CartPage`","d":"`await this.cartLink`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Un método que navega puede devolver el siguiente Page Object construido con la misma `page`.","explicacion":["El nuevo POM necesita la misma Page para actuar sobre el mismo navegador.","El tipo de retorno Promise<CartPage> se resuelve con la instancia.","Así se pueden encadenar llamadas legibles en el test."],"razones":{"a":"Correcta. Se instancia con la page actual.","b":"CartPage necesita la page en su constructor.","c":"Devolvería la clase, no una instancia.","d":"Devolvería un Locator, no un CartPage."},"clave":"Navegar = devolver `new SiguientePOM(this.page)`.","docs":"https://playwright.dev/docs/pom"},{"id":"M-POM-05","nivel":"medio","tema":"Page Object Model","tipo":"como","pregunta":"¿Cómo se importan solo los tipos `Page` y `Locator` para anotar un Page Object?","opciones":{"a":"`import type { Page, Locator } from '@playwright/test';`","b":"`import { Page, Locator } from 'playwright-pom';`","c":"`import type Page from '@playwright/page';`","d":"`const { Page, Locator } = require('@playwright/types');`"},"codigoOpciones":false,"correcta":["a"],"concepto":"`Page` y `Locator` se exportan desde `@playwright/test` y `import type` los importa solo como tipos.","explicacion":["import type se borra al compilar y no añade código en runtime.","Los tipos vienen del paquete @playwright/test.","Se usan para anotar propiedades y parámetros del POM."],"razones":{"a":"Correcta. Paquete y sintaxis correctos.","b":"playwright-pom no existe como paquete oficial.","c":"No existe el módulo @playwright/page ni exportación por defecto.","d":"@playwright/types no es un módulo de Playwright."},"clave":"Tipos desde `@playwright/test`.","docs":"https://playwright.dev/docs/pom"},{"id":"M-POM-06","nivel":"medio","tema":"Page Object Model","tipo":"concepto","pregunta":"¿Por qué se guardan `Locator` en el POM y no el texto o valor ya leído?","opciones":{"a":"Porque el Locator se resuelve de forma perezosa en cada uso, con auto-espera y datos frescos.","b":"Porque el texto leído no se puede tipar en TypeScript.","c":"Porque los Locator se cachean para siempre y son más rápidos.","d":"Porque Playwright prohíbe propiedades de tipo string."},"codigoOpciones":false,"correcta":["a"],"concepto":"Un Locator es una descripción de cómo encontrar el elemento y se evalúa al actuar, así refleja el estado actual del DOM.","explicacion":["Un texto guardado en el constructor sería una foto fija que se queda obsoleta.","Las acciones y aserciones sobre Locator reintentan hasta que se cumple la condición.","El valor se lee en el momento de usarlo."],"razones":{"a":"Correcta. Evaluación perezosa y auto-espera.","b":"Se puede tipar sin problema; no es el motivo.","c":"No se cachea el elemento: se vuelve a buscar en cada uso.","d":"Playwright no impone esa restricción."},"clave":"Guarda cómo encontrar, no lo encontrado.","docs":"https://playwright.dev/docs/pom"},{"id":"M-POM-07","nivel":"medio","tema":"Page Object Model","tipo":"error","pregunta":"¿Qué problema tiene esta clase?","codigo":"export class HomePage {\n  readonly title: Locator;\n\n  constructor(readonly page: Page) {\n    this.title = await page.locator('h1');\n  }\n}","opciones":{"a":"Un constructor no puede usar `await`; además crear un locator no es asíncrono.","b":"Falta `readonly` en `page`.","c":"`locator('h1')` no es un selector válido.","d":"`Locator` solo se puede declarar dentro de métodos."},"codigoOpciones":false,"correcta":["a"],"concepto":"Los locators se crean de forma síncrona; `await` solo se usa al ejecutar acciones o aserciones.","explicacion":["Usar await en un constructor es un error de sintaxis en TypeScript.","page.locator() devuelve un Locator directamente.","Basta con `this.title = page.locator('h1');`."],"razones":{"a":"Correcta. await sobra y es inválido en un constructor.","b":"`readonly` ya está en el parámetro con parámetro-propiedad.","c":"'h1' es un selector CSS válido.","d":"Un Locator puede ser propiedad de clase."},"clave":"Locator sin await; acción con await.","docs":"https://playwright.dev/docs/pom"},{"id":"M-RED-01","nivel":"medio","tema":"Red","tipo":"codigo","pregunta":"¿Qué efecto tiene este código?","codigo":"await page.route('**/api/users', route =>\n  route.fulfill({ json: [{ id: 1, name: 'Ana' }] })\n);\nawait page.goto('/users');","opciones":{"a":"La petición va al servidor y se añade `Ana` al resultado.","b":"La petición a `/api/users` recibe una respuesta simulada sin llegar al servidor.","c":"Se bloquea la petición y la página falla.","d":"Se espera a que llegue la respuesta real de `/api/users`."},"codigoOpciones":false,"correcta":["b"],"concepto":"route.fulfill() responde a una petición in ttps://playwright.dev/docs/mock"},{"id":"M-RED-05","nivel":"medio","tema":"Red","tipo":"codigo","pregunta":"¿Qué método completa el hueco para capturar la respuesta que dispara el clic?","codigo":"const [response] = await Promise.all([\n  page.___('**/api/orders'),\n  page.getByRole('button', { name: 'Pedir' }).click(),\n]);\nexpect(response.status()).toBe(201);","opciones":{"a":"`waitForResponse`","b":"`waitForNavigation`","c":"`waitForLoadState`","d":"`waitForFunction`"},"codigoOpciones":false,"correcta":["a"],"concepto":"page.waitForResponse() espera una respuesta que coincida con un patrón, y con Promise.all se registra antes de la acción.","explicacion":["Promise.all lanza la escucha y el click a la vez.","waitForResponse acepta glob, regex o predicado.","waitForNavigation está obsoleto y no sirve para una llamada XHR."],"razones":{"a":"Correcta. `waitForResponse` devuelve la Response.","b":"`waitForNavigation` está obsoleto y espera navegaciones, no llamadas a la API.","c":"`waitForLoadState` espera estados de carga y no devuelve una Response.","d":"`waitForFunction` evalúa JS en la página, no captura respuestas."},"clave":"Promise.all([waitForResponse, acción]).","docs":"https://playwright.dev/docs/network#network-events"},{"id":"M-RED-06","nivel":"medio","tema":"Red","tipo":"concepto","pregunta":"¿En qué se diferencia `context.route` de `page.route`?","opciones":{"a":"`context.route` solo intercepta la primera página.","b":"`page.route` intercepta en todo el navegador y `context.route` solo en un frame.","c":"`context.route` aplica a todas las páginas del contexto, incluidas las pestañas nuevas.","d":"No hay diferencia, son alias."},"codigoOpciones":false,"correcta":["c"],"concepto":"context.route intercepta las peticiones de todas las páginas del contexto, incluidas las abiertas después; page.route solo las de esa página.","explicacion":["page.route afecta solo a esa Page.","context.route afecta a todas las páginas y popups del BrowserContext.","Si ambos coinciden, prevalece la ruta de la página."],"razones":{"a":"context.route cubre todas las páginas, no solo la primera.","b":"Está invertido: page.route es por página y no cubre todo el navegador.","c":"Correcta. El alcance es todo el contexto.","d":"No son alias: el alcance es distinto."},"clave":"context.route = todas las pestañas; page.route = una.","docs":"https://playwright.dev/docs/network#modify-requests"},{"id":"M-RED-07","nivel":"medio","tema":"Red","tipo":"como","pregunta":"Has simulado una ruta y quieres que, a mitad del test, las llamadas vuelvan a ir al servidor real. ¿Cómo lo haces?","codigo":"await page.route('**/api/users*', route => route.fulfill({ json: [] }));\n// ...\n// ¿cómo se quita el mock?","opciones":{"a":"`await page.unroute('**/api/users*');`","b":"`await page.route('**/api/users*', null);`","c":"`await page.abortRoute('**/api/users*');`","d":"`await page.reload({ mock: false });`"},"codigoOpciones":false,"correcta":["a"],"concepto":"page.unroute(url, handler?) elimina las rutas registradas para ese patrón.","explicacion":["unroute elimina el manejador del patrón indicado.","Se puede pasar el handler concreto para quitar solo uno.","Después, las peticiones vuelven a ir a la red real."],"razones":{"a":"Correcta. `unroute` elimina el mock.","b":"page.route con null no es una API válida.","c":"`abortRoute` no existe.","d":"reload no tiene la opción `mock`."},"clave":"Quitar un mock = unroute con el mismo patrón.","docs":"https://playwright.dev/docs/api/class-page#page-unroute"},{"id":"M-RED-08","nivel":"medio","tema":"Red","tipo":"funcion","pregunta":"¿Qué hace esta línea?","codigo":"await page.routeFromHAR('hars/app.har', {\n  url: '**/api/**',\n  update: false,\n});","opciones":{"a":"Graba el tráfico de red en `app.har`.","b":"Bloquea todas las peticiones a `/api/`.","c":"Convierte el fichero HAR a JSON.","d":"Responde las peticiones `/api/` con las respuestas guardadas en el HAR."},"codigoOpciones":false,"correcta":["d"],"concepto":"routeFromHAR reproduce respuestas grabadas en un fichero HAR (con update: true las graba).","explicacion":["update: false = reproducir lo grabado.","update: true = grabar el tráfico actual en el HAR.","url limita qué peticiones se sirven desde el HAR."],"razones":{"a":"Grabar requiere `update: true`.","b":"No se bloquea: se responden con el HAR.","c":"No convierte formatos.","d":"Correcta. Se reproducen las respuestas del HAR."},"clave":"routeFromHAR: update false reproduce, true graba.","docs":"https://playwright.dev/docs/mock#mocking-with-har-files"}];
const NIVELES = {basico:"Básico", medio:"Medio"};
const TEST_N = 20, TEST_MIN = 30, TEST_APROBADO = 14;
const LET = ["A","B","C","D"];
const byId = Object.fromEntries(BANCO.map(q=>[q.id,q]));
const TEMAS = nivel=>[...new Set(BANCO.filter(q=>!nivel||q.nivel===nivel).map(q=>q.tema))];
const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
/* Texto con `código en línea` */
const tx = s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");
const shuffle = a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pct = (a,b)=>b?Math.round(100*a/b):0;
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

/* Resaltado sencillo de TypeScript: comentarios, cadenas, palabras clave y el hueco ___ */
const KW="await|async|const|let|var|function|return|import|from|export|type|interface|class|new|readonly|constructor|for|of|in|if|else|this|true|false|null|undefined|extends|private|public|try|catch|throw|default|as";
const TOK=new RegExp(`(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/|<!--[\\s\\S]*?-->)|('(?:\\\\.|[^'\\\\\\n])*'|"(?:\\\\.|[^"\\\\\\n])*"|\`(?:\\\\.|[^\`\\\\])*\`)|\\b(${KW})\\b|(_{3,})`,"g");
function hl(code){
  let out="",last=0,m; TOK.lastIndex=0;
  while((m=TOK.exec(code))){
    out+=esc(code.slice(last,m.index));
    const cls=m[1]?"cm":m[2]?"st":m[3]?"kw":"gap";
    out+=`<span class="${cls}">${esc(m[0])}</span>`; last=TOK.lastIndex;
  }
  return out+esc(code.slice(last));
}
const codeBlock = c=>`<pre class="code">${hl(c)}</pre>`;

/* ---------- Estado y guardado ---------- */
const S = {
  view:"practicar", prog:{}, tests:[], db:null, sample:null, store:"local",
  pr:{nivel:"", tema:"", orden:"nuevas", pool:null, q:null, order:null, sel:[], done:false, last:null, askCtl:null},
  sim:null, simResult:null, simNivel:""
};
function saveLabel(){
  const el=$("#saveInfo"); if(!el) return;
  el.textContent = S.store==="db" ? "Tu progreso se guarda en tu cuenta (lo ves en cualquier dispositivo)." : "Tu progreso se guarda en este navegador.";
}
async function initStore(){
  S.prog = lsGet("pw.prog",{}); S.tests = lsGet("pw.tests",[]);
  try{
    const db = window.claude ? await window.claude.use("db") : null;
    if(db){
      const [p,s] = await Promise.all([db.collection("progreso").get(), db.collection("tests").orderBy("fecha","desc").limit(50).get()]);
      const remote={}; p.docs.forEach(d=>{const v=d.data(); if(v) remote[d.id]=v});
      for(const [id,v] of Object.entries(S.prog)){ if(!remote[id] || (remote[id].ultima||"")<(v.ultima||"")){ remote[id]=v; try{await db.doc("progreso/"+id).set(v)}catch(e){} } }
      S.prog=remote; S.tests=s.docs.map(d=>({...d.data(),_id:d.id}));
      S.db=db; S.store="db"; lsSet("pw.prog",S.prog);
    }
  }catch(e){ /* sigue en local */ }
  render();
}
async function recordAnswer(q, ok, elegida){
  const prev = S.prog[q.id] || {qid:q.id,nivel:q.nivel,tema:q.tema,intentos:0,aciertos:0,historial:[]};
  const v = {...prev, intentos:prev.intentos+1, aciertos:prev.aciertos+(ok?1:0), ultimaCorrecta:ok, ultima:new Date().toISOString(), ultimaElegida:elegida, historial:[...(prev.historial||[]),ok].slice(-10)};
  S.prog[q.id]=v; lsSet("pw.prog",S.prog);
  if(S.db){ try{ await S.db.doc("progreso/"+q.id).set(v) }catch(e){} }
}
async function recordTest(r){
  S.tests.unshift(r); lsSet("pw.tests",S.tests.slice(0,50));
  if(S.db){ try{ await S.db.collection("tests").add(r) }catch(e){} }
}
const failed = ()=>BANCO.filter(q=>S.prog[q.id] && S.prog[q.id].ultimaCorrecta===false);

/* ---------- Navegación ---------- */
const VIEWS=["practicar","test","falladas","progreso"];
function go(v){ S.view=v; render(); window.scrollTo({top:0}); }
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>go(b.dataset.v)));

/* ---------- Pregunta (común) ---------- */
const TIPO={funcion:"¿Qué función?",localizador:"¿Qué localizador?",como:"¿Cómo se hace?",codigo:"Código",error:"Encuentra el fallo",concepto:"Concepto"};
function qHead(q){
  return `<div class="meta"><span class="lvl ${q.nivel}">${NIVELES[q.nivel]}</span><span><b>${esc(q.tema)}</b></span><span>${TIPO[q.tipo]||""}</span><span>${esc(q.id)}</span></div>
  <div class="qtext">${tx(q.pregunta)}</div>
  ${q.codigo?codeBlock(q.codigo):""}`;
}
function optBody(q,key){ return q.codigoOpciones ? codeBlock(q.opciones[key]) : `<span>${tx(q.opciones[key])}</span>`; }
function optsHTML(q, order, sel, reveal, chosen){
  return `<div class="opts" role="radiogroup">`+order.map((key,i)=>{
    let cls="opt";
    if(!reveal && sel.includes(key)) cls+=" sel";
    if(reveal){ if(q.correcta.includes(key)) cls+=" right"; else if(chosen.includes(key)) cls+=" wrong"; }
    const good=q.correcta.includes(key), mine=reveal && chosen.includes(key);
    const razon = String(q.razones[key]||"").replace(/^Correcta\.\s*/,"") || "Es la respuesta correcta; mira la explicación.";
    const why = reveal ? `<span class="why ${good?"y":"n"}"><b>${good?"✓ Por qué es correcta":"✗ Por qué no"}</b>${tx(razon)}</span>` : "";
    const tag = mine ? `<span class="mine">Tu respuesta</span>` : "";
    return `<button class="${cls}" data-key="${key}" ${reveal?"disabled":""} aria-pressed="${sel.includes(key)}"><span class="bub">${LET[i]}</span><span class="otext">${tag}${optBody(q,key)}${why}</span></button>`;
  }).join("")+`</div>`;
}
const isRight=(q,sel)=>sel.length===q.correcta.length && sel.every(k=>q.correcta.includes(k));
const letterOf=(order,key)=>LET[order.indexOf(key)];
function explHTML(q){
  return `<div class="expl">
    <div class="concept"><b>La idea en una frase</b>${tx(q.concepto)}</div>
    <div class="blk"><h3>Explicación</h3><ul class="pts">${q.explicacion.map(p=>`<li>${tx(p)}</li>`).join("")}</ul></div>
    <div class="tip"><b>Truco para recordarlo</b>${tx(q.clave)}</div>
    <p class="src">Documentación oficial: <a href="${esc(q.docs)}" target="_blank" rel="noopener">${esc(q.docs.replace(/^https:\/\//,""))}</a></p></div>`;
}
function verdictHTML(q, order, sel){
  const ok=isRight(q,sel), L=ks=>ks.map(k=>letterOf(order,k)).join(" y ");
  return `<div class="verdict ${ok?"ok":"bad"}"><span class="ico" aria-hidden="true">${ok?"✓":"✗"}</span>
    <div><div class="vt">${ok?"¡Correcta!":"Incorrecta"}</div>
    <div class="vs">${ok?`Has elegido la <b>${L(sel)}</b>.`:`Has elegido la <b>${L(sel)}</b> · La correcta es la <b>${L(q.correcta)}</b>.`} Debajo de cada opción tienes por qué vale o no.</div></div></div>`;
}

/* ---------- Práctica ---------- */
function practicePool(){
  const pr=S.pr;
  return BANCO.filter(q=>(!pr.nivel||q.nivel===pr.nivel)&&(!pr.tema||q.tema===pr.tema));
}
function pickNext(){
  const pr=S.pr;
  let pool = pr.pool ? pr.poolLeft.map(id=>byId[id]).filter(Boolean) : practicePool();
  if(!pool.length) return null;
  let cand = pool.filter(q=>q.id!==pr.last);
  if(!cand.length) cand=pool;
  if(pr.orden==="nuevas"){
    const unseen=cand.filter(q=>!S.prog[q.id]);
    if(unseen.length) cand=unseen;
    else {
      const score=q=>{const p=S.prog[q.id];return p.aciertos/p.intentos};
      const min=Math.min(...cand.map(score)); cand=cand.filter(q=>score(q)===min);
    }
  }
  return cand[Math.floor(Math.random()*cand.length)];
}
function newPracticeQ(){
  const q=pickNext(); const pr=S.pr;
  pr.q=q; pr.sel=[]; pr.done=false; pr.order=q?shuffle(Object.keys(q.opciones)):null;
  if(pr.askCtl){pr.askCtl.abort();pr.askCtl=null}
}
function renderPractice(app){
  const pr=S.pr;
  if(!pr.q) newPracticeQ();
  const pool=practicePool();
  const seenPool=pool.filter(q=>S.prog[q.id]).length;
  const tot=Object.values(S.prog).reduce((a,p)=>[a[0]+p.aciertos,a[1]+p.intentos],[0,0]);
  let head;
  if(pr.pool){
    head=`<div class="row"><span class="pill bad">Repaso de falladas</span><span class="muted">${pr.poolLeft.length} pendientes en esta tanda</span><button class="btn ghost small" id="exitPool">Volver a practicar todo</button></div>`;
  } else {
    const niv=[["","Todo"],["basico","Básico"],["medio","Medio"]].map(([v,l])=>`<button class="chip" data-niv="${v}" aria-pressed="${pr.nivel===v}">${l}</button>`).join("");
    const temas=TEMAS(pr.nivel).map(t=>`<option value="${esc(t)}" ${pr.tema===t?"selected":""}>${esc(t)}</option>`).join("");
    head=`<div class="row">${niv}<select class="sel-tema" id="temaSel" aria-label="Tema"><option value="">Todos los temas</option>${temas}</select></div>
    <div class="row muted" style="font-size:.9rem">Orden:
      <button class="chip" data-ord="nuevas" aria-pressed="${pr.orden==="nuevas"}">Nuevas primero</button>
      <button class="chip" data-ord="azar" aria-pressed="${pr.orden==="azar"}">Al azar</button>
      <span style="margin-left:auto" class="mono">${seenPool}/${pool.length} vistas · ${pct(tot[0],tot[1])} % de acierto</span></div>`;
  }
  const q=pr.q;
  if(!q){ app.innerHTML=head+`<div class="empty">No quedan preguntas en esta tanda. <button class="btn small" id="exitPool2">Volver a practicar</button></div>`; bindPracticeHead(); const b=$("#exitPool2"); if(b) b.onclick=()=>{pr.pool=null;pr.poolLeft=null;pr.tema="";newPracticeQ();render()}; return; }
  let body = `<section class="sheet" aria-live="polite">${qHead(q)}${pr.done?verdictHTML(q,pr.order,pr.sel):""}${optsHTML(q,pr.order,pr.sel,pr.done,pr.sel)}`;

  } else {

  }

  app.innerHTML=head+body; saveLabel();
  bindPracticeHead();

  const c=$("#check"); if(c) c.onclick=checkPractice;

  bindAsk(q, pr.order, pr.sel);
}
function bindPracticeHead(){
  const pr=S.pr;
  document.querySelectorAll("[data-niv]").forEach(b=>b.onclick=()=>{pr.nivel=b.dataset.niv;if(pr.tema&&!TEMAS(pr.nivel).includes(pr.tema))pr.tema="";pr.last=null;newPracticeQ();render()});

function toggleSel(key){ const pr=S.pr; if(pr.done) return; pr.sel=[key]; render(); }
function checkPractice(){
  const pr=S.pr; if(pr.done || pr.sel.length!==1) return;

document.addEventListener("keydown",e=>{
