<meta charset="utf-8">
<title>Aula Playwright TS</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: hoja de ejercicio centrada (~820px) con barra de pestañas fija; el código va en bloques tipo editor, las opciones como burbujas de hoja de respuestas */
:root{
  --paper:#eff3f1; --sheet:#ffffff; --ink:#15211d; --muted:#56665f; --line:#d5dfda;
  --accent:#0d7a5f; --accent-soft:#e0f2ec;
  --ok:#17804a; --ok-soft:#e3f4ea; --bad:#c23a2b; --bad-soft:#fbe7e4; --warn:#a96a00; --warn-soft:#fdf1dc;
  --code-bg:#17201d; --code-ink:#dfe8e4; --code-kw:#7fd4b8; --code-str:#f2c46d; --code-com:#8a9a93; --code-gap:#ff8f7a;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0e1513; --sheet:#16201d; --ink:#e3ece8; --muted:#97a8a1; --line:#283631;
  --accent:#5fd3ae; --accent-soft:#163229;
  --ok:#4cc985; --ok-soft:#14301f; --bad:#ff8a7a; --bad-soft:#3a1b18; --warn:#f0b54a; --warn-soft:#352812;
  --code-bg:#0a100e; --code-ink:#dfe8e4; --code-kw:#7fd4b8; --code-str:#f2c46d; --code-com:#7d8d86; --code-gap:#ff8f7a;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0e1513; --sheet:#16201d; --ink:#e3ece8; --muted:#97a8a1; --line:#283631;
  --accent:#5fd3ae; --accent-soft:#163229;
  --ok:#4cc985; --ok-soft:#14301f; --bad:#ff8a7a; --bad-soft:#3a1b18; --warn:#f0b54a; --warn-soft:#352812;
  --code-bg:#0a100e; --code-ink:#dfe8e4; --code-kw:#7fd4b8; --code-str:#f2c46d; --code-com:#7d8d86; --code-gap:#ff8f7a;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet)}
button,select,textarea,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet);border-bottom:1px solid var(--line)}
.bar-in{max-width:820px;margin:0 auto;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;display:flex;align-items:baseline;gap:8px}
.brand small{font-family:var(--f-mono);font-size:.7rem;font-weight:400;color:var(--muted);letter-spacing:.04em}
.tabs{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted);font-weight:700;font-size:.92rem}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
.tab .n{font-family:var(--f-mono);font-size:.75rem;margin-left:4px}
main{max-width:820px;margin:0 auto;padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h2{font-size:1.5rem}
h3{font-size:1.1rem}
p{margin:0}
a{color:var(--accent)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{border:1px solid var(--line);background:var(--sheet);padding:4px 11px;border-radius:999px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.sel-tema{border:1px solid var(--line);background:var(--sheet);border-radius:999px;padding:4px 10px;font-size:.88rem;max-width:100%}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,4vw,28px);display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-family:var(--f-mono);font-size:.76rem;color:var(--muted);letter-spacing:.02em;text-transform:uppercase}
.meta b{color:var(--ink);font-weight:600}
.lvl{padding:1px 7px;border-radius:4px;background:var(--accent-soft);color:var(--accent);font-weight:600}
.lvl.medio{background:var(--warn-soft);color:var(--warn)}
.qtext{font-size:1.08rem}
code,pre.code{font-variant-ligatures:none}
code{font-family:var(--f-mono);font-size:.88em;background:var(--accent-soft);color:var(--ink);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
pre.code{margin:0;background:var(--code-bg);color:var(--code-ink);border-radius:8px;padding:14px 16px;font-family:var(--f-mono);font-size:.84rem;line-height:1.6;overflow-x:auto;white-space:pre;tab-size:2}
pre.code .kw{color:var(--code-kw)} pre.code .st{color:var(--code-str)} pre.code .cm{color:var(--code-com);font-style:italic}
pre.code .gap{color:var(--code-gap);font-weight:600;background:rgba(255,143,122,.14);border-radius:3px;padding:0 2px}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:grid;grid-template-columns:34px minmax(0,1fr);gap:12px;align-items:start;text-align:left;width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--sheet);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt pre.code{font-size:.8rem;padding:10px 12px}
.bub{width:30px;height:30px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:.85rem;color:var(--muted)}
.opt.sel .bub{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.opt.sel{border-color:var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--sheet)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.otext{min-width:0;display:flex;flex-direction:column;gap:2px}
.why{display:block;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);font-size:.9rem;color:var(--ink)}
.why b{display:block;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.why.y b{color:var(--ok)} .why.n b{color:var(--muted)}
.opt.wrong .why.n b{color:var(--bad)}
.mine{align-self:flex-start;margin:0 0 4px;font-family:var(--f-mono);font-size:.68rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:1px 6px;border-radius:4px;border:1px solid currentColor;color:var(--muted)}
.verdict{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:8px;font-weight:700}
.verdict .ico{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:1.1rem;color:var(--sheet)}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)}
.verdict.ok .ico{background:var(--ok)} .verdict.bad .ico{background:var(--bad)}
.verdict .vt{font-family:var(--f-display);font-size:1.15rem}
.verdict .vs{font-weight:400;color:var(--ink);font-size:.93rem}
.concept{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px;font-size:1.02rem}
.concept code{background:var(--sheet)}
.concept b,.blk h3{display:block;font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.blk h3{color:var(--muted)}
.pts{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;max-width:68ch}
.pts li::marker{color:var(--accent)}
.src{font-size:.85rem;color:var(--muted)}
.btn{border:0;border-radius:8px;padding:10px 18px;font-weight:700;cursor:pointer;background:var(--accent);color:var(--sheet)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.small{padding:6px 12px;font-size:.88rem}
.expl{display:flex;flex-direction:column;gap:12px;border-top:1px solid var(--line);padding-top:16px}
.tip{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 14px;border-radius:0 8px 8px 0}
.tip b{font-family:var(--f-mono);font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);display:block;margin-bottom:2px}
.ask{display:flex;flex-direction:column;gap:8px;background:var(--paper);border:1px dashed var(--line);border-radius:8px;padding:14px}
.ask textarea{width:100%;min-height:64px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--sheet)}
.answer{display:flex;flex-direction:column;gap:6px;max-width:68ch;min-width:0}
.answer h4{margin:10px 0 0;font-family:var(--f-mono);font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.answer h4:first-child{margin-top:0}
.answer ul,.answer ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.answer:empty{display:none}
.answer:not(:empty){background:var(--sheet);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:14px}
.stat .v{font-family:var(--f-display);font-size:1.8rem;font-weight:700;font-variant-numeric:tabular-nums}
.stat .l{font-size:.85rem;color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.93rem}
.tbl th,.tbl td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600}
.scroll{overflow-x:auto}
.meter{height:8px;border-radius:4px;background:var(--line);overflow:hidden;min-width:80px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.ok i{background:var(--ok)} .meter.bad i{background:var(--bad)} .meter.warn i{background:var(--warn)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.8rem;font-weight:700}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.timer{font-family:var(--f-mono);font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px}
.cell{height:36px;border:1px solid var(--line);border-radius:6px;background:var(--sheet);cursor:pointer;font-family:var(--f-mono);font-size:.82rem;position:relative}
.cell.done{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.cell.cur{outline:2px solid var(--ink);outline-offset:1px}
.cell.flag::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.simhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 14px;background:var(--sheet);border:1px solid var(--line);border-radius:8px}
.item .t{min-width:0}
.item .t span{display:block}
.empty{padding:28px;text-align:center;color:var(--muted);background:var(--sheet);border:1px dashed var(--line);border-radius:10px}
.save{font-size:.8rem;color:var(--muted)}
.big{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
details.rev{border:1px solid var(--line);border-radius:8px;background:var(--sheet)}
details.rev>summary{cursor:pointer;padding:12px 14px;display:flex;gap:10px;align-items:center;list-style:none}
details.rev>summary::-webkit-details-marker{display:none}
details.rev[open]>summary{border-bottom:1px solid var(--line)}
details.rev .inner{padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
kbd{font-family:var(--f-mono);font-size:.75rem;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px}
@media (max-width:560px){.tabs{margin-left:0;width:100%}.tab{flex:1;padding:6px 6px}.big{font-size:2.4rem}}
@media (prefers-reduced-motion:no-preference){.opt,.chip,.tab{transition:border-color .15s,background .15s}}
</style>

<script>
const BANCO = [{"id":"B-ACC-01","nivel":"basico","tema":"Acciones","tipo":"funcion","pregunta":"¿Qué método usas para escribir un valor en un input, reemplazando su contenido?","opciones":{"a":"`locator.write()`","b":"`locator.fill()`","c":"`locator.setValue()`","d":"`locator.insertText()`"},"codigoOpciones":false,"correcta":["b"],"concepto":"fill establece el valor del campo y dispara los eventos de entrada correspondientes.","explicacion":["fill limpia el campo y asigna el texto de una vez.","Para teclear carácter a carácter se usa pressSequentially.","write y setValue no existen en Locator."],"razones":{"a":"No existe locator.write.","b":"Correcta. Es el método estándar para rellenar inputs.","c":"No existe locator.setValue.","d":"No existe locator.insertText."},"clave":"Rellenar = fill.","docs":"https://playwright.dev/docs/input#text-input"},{"id":"B-ACC-02","nivel":"basico","tema":"Acciones","tipo":"codigo","pregunta":"Necesitas simular pulsaciones de teclas una a una (p. ej. un autocompletado). Completa el hueco.","codigo":"await page.getByLabel('Ciudad').___('Madrid', { delay: 100 });","opciones":{"a":"pressSequentially","b":"fill","c":"setValue","d":"typeAll"},"codigoOpciones":false,"correcta":["a"],"concepto":"pressSequentially teclea carácter a carácter y permite un delay entre pulsaciones.","explicacion":["fill asigna el valor de golpe, sin pulsaciones reales.","pressSequentially acepta delay.","Úsalo solo si la página reacciona a cada tecla."],"razones":{"a":"Correcta. Pulsa cada tecla con el delay indicado.","b":"fill no admite la opción delay.","c":"No existe setValue.","d":"No existe typeAll."},"clave":"Tecla a tecla = pressSequentially.","docs":"https://playwright.dev/docs/input#type-characters"},{"id":"B-ACC-03","nivel":"basico","tema":"Acciones","tipo":"codigo","pregunta":"Quieres seleccionar todo el texto de un campo. Completa el código.","codigo":"const campo = page.getByRole('textbox');\nawait campo.press('___');","opciones":{"a":"Ctrl-A","b":"Control A","c":"ControlA","d":"Control+A"},"codigoOpciones":false,"correcta":["d"],"concepto":"press admite combinaciones con modificadores unidos por +, p. ej. Control+A.","explicacion":["Las teclas se nombran como en KeyboardEvent.key.","Las combinaciones usan + sin espacios.","ControlOrMeta+A sirve para ser multiplataforma."],"razones":{"a":"Ctrl-A no es una sintaxis reconocida.","b":"Los espacios no son separador válido.","c":"Faltaría el + entre teclas.","d":"Correcta. Formato correcto de combinación."},"clave":"Combinación: Tecla+Tecla.","docs":"https://playwright.dev/docs/input#keys-and-shortcuts"},{"id":"B-ACC-04","nivel":"basico","tema":"Acciones","tipo":"como","pregunta":"¿Cómo marcas un checkbox asegurando que queda marcado, sin importar su estado previo?","opciones":{"a":"`await page.getByLabel('Acepto').click()` siempre","b":"`await page.getByLabel('Acepto').toggle()`","c":"`await page.getByLabel('Acepto').check()`","d":"`await page.getByLabel('Acepto').select()`"},"codigoOpciones":false,"correcta":["c"],"concepto":"check es idempotente: marca el checkbox si no lo está y verifica el resultado.","explicacion":["check solo hace clic si hace falta.","click alternaría el estado y podría desmarcarlo.","setChecked(valor) fija un estado concreto."],"razones":{"a":"click invierte el estado, no lo fija.","b":"toggle no existe en Locator.","c":"Correcta. Garantiza el estado marcado.","d":"select no es un método de Locator."},"clave":"Estado marcado = check, no click.","docs":"https://playwright.dev/docs/input#checkboxes-and-radio-buttons"},{"id":"B-ACC-05","nivel":"basico","tema":"Acciones","tipo":"codigo","pregunta":"Completa el hueco para elegir la opción por su texto visible.","codigo":"// <select id=\"pais\"><option value=\"es\">España<\/option><\/select>\nawait page.locator('#pais').selectOption({ ___: 'España' });","opciones":{"a":"text","b":"label","c":"name","d":"title"},"codigoOpciones":false,"correcta":["b"],"concepto":"selectOption acepta value, label o index para elegir la opción.","explicacion":["Se puede pasar un string (valor) o un objeto { label }.","También admite { index } y arrays para multiselect.","No existe la clave text."],"razones":{"a":"text no es una clave válida.","b":"Correcta. label selecciona por el texto visible de la opción.","c":"name no es una clave válida.","d":"title no es una clave válida."},"clave":"Texto visible = { label }.","docs":"https://playwright.dev/docs/input#select-options"},{"id":"B-ACC-06","nivel":"basico","tema":"Acciones","tipo":"funcion","pregunta":"¿Qué método sube un archivo a un input de tipo file?","opciones":{"a":"`locator.setInputFiles()`","b":"`locator.upload()`","c":"`locator.fill()` con la ruta","d":"`page.attachFile()`"},"codigoOpciones":false,"correcta":["a"],"concepto":"setInputFiles establece los ficheros seleccionados en un input de tipo file.","explicacion":["Acepta una ruta, un array de rutas o buffers.","Con [] se vacía la selección.","fill no sirve para inputs file."],"razones":{"a":"Correcta. Método oficial para subir archivos.","b":"locator.upload no existe.","c":"fill no funciona con inputs de archivo.","d":"page.attachFile no existe."},"clave":"Subir archivo = setInputFiles.","docs":"https://playwright.dev/docs/input#upload-files"},{"id":"B-ACC-07","nivel":"basico","tema":"Acciones","tipo":"codigo","pregunta":"Completa el hueco para hacer clic derecho con la tecla Shift pulsada.","codigo":"await page.getByText('Fila 1').click({\n  button: '___',\n  modifiers: ['Shift'],\n});","opciones":{"a":"context","b":"secondary","c":"menu","d":"right"},"codigoOpciones":false,"correcta":["d"],"concepto":"La opción button de click acepta left, right o middle.","explicacion":["button: left, right o middle.","modifiers admite Shift, Control, Alt, Meta, ControlOrMeta.","force omite las comprobaciones de actionability; úsalo con cuidado."],"razones":{"a":"context no es un valor válido.","b":"secondary no es un valor válido.","c":"menu no es un valor válido.","d":"Correcta. Valor válido para el botón derecho."},"clave":"button: left | right | middle.","docs":"https://playwright.dev/docs/api/class-locator#locator-click"},{"id":"B-ACC-08","nivel":"basico","tema":"Acciones","tipo":"codigo","pregunta":"¿Qué hace este código?","codigo":"await page.locator('#origen').dragTo(page.locator('#destino'));","opciones":{"a":"Mueve el destino al origen","b":"Hace clic en ambos elementos","c":"Arrastra el elemento origen y lo suelta sobre el destino","d":"Copia el texto de origen al destino"},"codigoOpciones":false,"correcta":["c"],"concepto":"dragTo realiza arrastrar y soltar desde un locator hasta otro.","explicacion":["Se invoca sobre el elemento de origen.","El argumento es el locator de destino.","Equivale a hover, mouse down, mover y mouse up."],"razones":{"a":"La dirección es al revés.","b":"No hace clics independientes.","c":"Correcta. Es el comportamiento de dragTo.","d":"No copia texto; simula el arrastre."},"clave":"origen.dragTo(destino).","docs":"https://playwright.dev/docs/input#drag-and-drop"},{"id":"B-ASE-01","nivel":"basico","tema":"Aserciones","tipo":"concepto","pregunta":"¿Qué diferencia hay entre `toHaveText` y `toContainText` sobre un locator?","opciones":{"a":"`toHaveText` exige coincidir con todo el texto del elemento (con string); `toContainText` acepta una parte del texto.","b":"`toHaveText` solo funciona con inputs y `toContainText` con párrafos.","c":"`toHaveText` no reintenta y `toContainText` sí.","d":"No hay diferencia: son alias exactos."},"codigoOpciones":false,"correcta":["a"],"concepto":"toHaveText compara el texto completo del elemento, mientras que toContainText busca una subcadena.","explicacion":["Con un string, toHaveText normaliza espacios y compara el texto completo.","toContainText acepta que el texto sea solo una parte del contenido.","Ambos son aserciones web-first y reintentan.","También admiten expresiones regulares."],"razones":{"a":"Correcta. Completo frente a subcadena.","b":"Ambos sirven para cualquier elemento con texto; para inputs se usa toHaveValue.","c":"Los dos reintentan hasta el timeout.","d":"Se comportan distinto: uno exige coincidencia total."},"clave":"Have = entero; Contain = trozo.","docs":"https://playwright.dev/docs/test-assertions"},{"id":"B-ASE-02","nivel":"basico","tema":"Aserciones","tipo":"error","pregunta":"Este test es inestable cuando el título tarda en cargarse. ¿Por qué?","codigo":"test('título', async ({ page }) => {\n  await page.goto('/');\n  const text = await page.locator('h1').textContent();\n  expect(text).toBe('Bienvenido');\n});","opciones":{"a":"`textContent()` devuelve el valor de ese instante y `toBe` no reintenta; debería usarse `await expect(locator).toHaveText(...)`.","b":"`toBe` solo funciona con números.","c":"`goto` no admite rutas relativas.","d":"Falta `await` delante de `expect(text).toBe(...)`, y con eso se arregla todo."},"codigoOpciones":false,"correcta":["a"],"concepto":"Las aserciones genéricas sobre un valor ya leído no reintentan; las web-first sobre un locator sí.","explicacion":["await textContent() lee el texto una sola vez, en ese instante.","expect(valor).toBe() es genérico y no reintenta.","expect(locator).toHaveText() reintenta hasta que coincide o vence el timeout.","Añadir await a toBe no cambia nada: es síncrono."],"razones":{"a":"Correcta. Se lee una vez y se compara sin reintentos.","b":"toBe compara cualquier valor con Object.is.","c":"Con baseURL configurado, las rutas relativas son válidas.","d":"toBe es síncrono; await no lo vuelve reintentable."},"clave":"Si lees el valor antes de expect, pierdes el reintento.","docs":"https://playwright.dev/docs/test-assertions"},{"id":"B-ASE-03","nivel":"basico","tema":"Aserciones","tipo":"funcion","pregunta":"¿Qué aserción comprueba que una lista tiene exactamente 5 elementos?","opciones":{"a":"`await expect(page.getByRole('listitem')).toHaveCount(5);`","b":"`await expect(page.getByRole('listitem')).toHaveLength(5);`","c":"`await expect(page.getByRole('listitem').count()).toBe(5);`","d":"`await expect(page.getByRole('listitem')).toBeCount(5);`"},"codigoOpciones":false,"correcta":["a"],"concepto":"toHaveCount es la aserción web-first que verifica cuántos elementos coinciden con un locator.","explicacion":["toHaveCount(n) reintenta hasta que el número de coincidencias es n.","toHaveLength existe en expect genérico para arrays, no para locators.","count() devuelve un número puntual y no reintenta."],"razones":{"a":"Correcta. Matcher web-first para el número de elementos.","b":"toHaveLength sirve para arrays o strings, no para un Locator.","c":"count() no reintenta, por lo que puede dar un falso fallo.","d":"toBeCount no existe en Playwright."},"clave":"Elementos de un locator: toHaveCount.","docs":"https://playwright.dev/docs/test-assertions"},{"id":"B-ASE-04","nivel":"basico","tema":"Aserciones","tipo":"codigo","pregunta":"Tras iniciar sesión se redirige a cualquier URL que termine en `/dashboard`. ¿Qué va en el hueco?","codigo":"test('login', async ({ page }) => {\n  await page.getByRole('button', { name: 'Entrar' }).click();\n  ___\n});","opciones":{"a":"`await expect(page).toHaveURL(/\\/dashboard$/);`","b":"`await expect(page.url()).toHaveURL(/\\/dashboard$/);`","c":"`await expect(page).toHaveTitle(/\\/dashboard$/);`","d":"`await expect(page).toBeURL('/dashboard');`"},"codigoOpciones":false,"correcta":["a"],"concepto":"toHaveURL se aplica sobre la page y acepta string o RegExp, reintentando hasta que la URL coincide.","explicacion":["expect(page).toHaveURL(regex) espera a que la URL cumpla el patrón.","page.url() es un string sin reintento y no tiene toHaveURL.","toHaveTitle comprueba el título, no la URL.","toBeURL no existe."],"razones":{"a":"Correcta. Aserción web-first sobre page con una RegExp.","b":"toHaveURL no se aplica sobre un string: page.url() ya no es la page.","c":"toHaveTitle valida el título del documento.","d":"toBeURL no existe en Playwright."},"clave":"URL con expect(page).toHaveURL.","docs":"https://playwright.dev/docs/test-assertions"},{"id":"B-ASE-05","nivel":"basico","tema":"Aserciones","tipo":"como","pregunta":"¿Cómo se comprueba que un spinner de carga ya no está visible en pantalla?","opciones":{"a":"`await expect(page.getByTestId('spinner')).toBeHidden();`","b":"`expect(page.getByTestId('spinner')).toBeHidden();`","c":"`await expect(page.getByTestId('spinner')).toBeVisible(false);`","d":"`await page.getByTestId('spinner').waitForHidden();`"},"codigoOpciones":false,"correcta":["a"],"concepto":"toBeHidden (o .not.toBeVisible()) espera a que el elemento desaparezca o no esté visible.","explicacion":["toBeHidden reintenta hasta que el elemento no existe o no es visible.","Equivale a expect(locator).not.toBeVisible().","Sin await, la comprobación queda suelta.","No existe un método waitForHidden en el locator."],"razones":{"a":"Correcta. Con await y matcher web-first.","b":"Sin await la aserción no se espera.","c":"toBeVisible admite { visible: false } en vez de un booleano posicional, y se prefiere toBeHidden.","d":"Locator no tiene waitForHidden; existe waitFor({ state: 'hidden' })."},"clave":"Que ya no esté: toBeHidden.","docs":"https://playwright.dev/docs/test-assertions"},{"id":"B-ASE-06","nivel":"basico","tema":"Aserciones","tipo":"codigo","pregunta":"Quieres verificar que el campo email contiene el valor «ana@test.com». ¿Qué va en el hueco?","codigo":"test('email', async ({ page }) => {\n  await page.getByLabel('Email').fill('ana@test.com');\n  ___\n});","opciones":{"a":"`await expect(page.getByLabel('Email')).toHaveValue('ana@test.com');`","b":"`await expect(page.getByLabel('Email')).toHaveText('ana@test.com');`","c":"`await expect(page.getByLabel('Email')).toContainValue('ana@test.com');`","d":"`await expect(page.getByLabel('Email')).toBeFilled('ana@test.com');`"},"codigoOpciones":false,"correcta":["a"],"concepto":"toHaveValue comprueba el valor actual de un input, textarea o select.","explicacion":["Los inputs guardan su contenido en value, no en el texto del nodo.","toHaveText mira el contenido textual, que en un input está vacío.","toContainValue y toBeFilled no existen."],"razones":{"a":"Correcta. toHaveValue es el matcher para inputs.","b":"toHaveText no lee el value de un input.","c":"toContainValue no existe en Playwright.","d":"toBeFilled no existe; para vacío existe toBeEmpty."},"clave":"Input = toHaveValue.","docs":"https://playwright.dev/docs/test-assertions"},{"id":"B-ASE-07","nivel":"basico","tema":"Aserciones","tipo":"concepto","pregunta":"¿Cuánto espera por defecto una aserción web-first como `toBeVisible()` y dónde se cambia globalmente?","opciones":{"a":"5 segundos; en `expect: { timeout }` de `playwright.config.ts`.","b":"30 segundos; en `use.timeout`.","c":"No espera nada; hay que usar `waitForTimeout`.","d":"5 segundos; en `use.expectTimeout`."},"codigoOpciones":false,"correcta":["a"],"concepto":"El timeout por defecto de expect es 5 s y se configura con la clave expect.timeout en la configuración.","explicacion":["Las aserciones web-first reintentan hasta 5 s por defecto.","El test completo tiene su propio timeout, 30 s por defecto.","Se cambia con expect: { timeout: 10_000 } en defineConfig.","También se puede por aserción: toBeVisible({ timeout: 10_000 })."],"razones":{"a":"Correcta. Valor por defecto y clave de configuración.","b":"30 s es el timeout del test, y use.timeout no existe.","c":"Las aserciones web-first sí esperan automáticamente.","d":"use.expectTimeout no existe; es expect.timeout."},"clave":"expect: 5 s; test: 30 s.","docs":"https://playwright.dev/docs/test-timeouts"},{"id":"B-ASE-08","nivel":"basico","tema":"Aserciones","tipo":"codigo","pregunta":"Hay que comprobar que el botón Enviar sigue deshabilitado. ¿Qué va en el hueco?","codigo":"test('formulario vacío', async ({ page }) => {\n  await page.goto('/registro');\n  const enviar = page.getByRole('button', { name: 'Enviar' });\n  ___\n});","opciones":{"a":"`await expect(enviar).toBeDisabled();`","b":"`await expect(enviar).not.toBeEnabled;`","c":"`await expect(enviar.isDisabled()).toBeTruthy();`","d":"`await expect(enviar).toHaveText('Enviar');`"},"codigoOpciones":false,"correcta":["a"],"concepto":"toBeDisabled y toBeEnabled son matchers web-first que reintentan sobre el estado del elemento.","explicacion":["toBeDisabled reintenta hasta que el elemento está deshabilitado.","`.not.toBeEnabled` sin paréntesis no ejecuta nada.","isDisabled() devuelve un booleano puntual sin reintentos.","toHaveText comprueba el contenido textual, no el estado del control."],"razones":{"a":"Correcta. Matcher específico y con await.","b":"Falta invocar toBeEnabled(); sin paréntesis no se comprueba nada.","c":"isDisabled() no reintenta y toBeTruthy es genérico.","d":"toHaveText comprueba el texto del botón, no si está deshabilitado."},"clave":"Estado del control: toBeEnabled / toBeDisabled.","docs":"https://playwright.dev/docs/test-assertions"},{"id":"B-CLI-01","nivel":"basico","tema":"CLI y configuración","tipo":"como","pregunta":"¿Qué comando crea un proyecto nuevo de Playwright Test con su configuración y un test de ejemplo?","opciones":{"a":"`npm init playwright@latest`","b":"`npx playwright create`","c":"`npm install playwright-init`","d":"`npx playwright new project`"},"codigoOpciones":false,"correcta":["a"],"concepto":"npm init playwright@latest lanza el asistente que instala @playwright/test y genera playwright.config.ts y tests de ejemplo.","explicacion":["Pregunta lenguaje, carpeta de tests y si instalar navegadores.","Genera playwright.config.ts, tests/ y un example.spec.ts.","Es el método recomendado en la documentación de instalación."],"razones":{"a":"Correcta. Es el inicializador oficial.","b":"No existe el subcomando create.","c":"Ese paquete no es oficial.","d":"No existe el subcomando new."},"clave":"init playwright@latest.","docs":"https://playwright.dev/docs/intro"},{"id":"B-CLI-02","nivel":"basico","tema":"CLI y configuración","tipo":"como","pregunta":"¿Cómo ejecutas solo los tests cuyo título contiene «login»?","opciones":{"a":"`npx playwright test -g login`","b":"`npx playwright test --title login`","c":"`npx playwright test --filter login`","d":"`npx playwright test -t login`"},"codigoOpciones":false,"correcta":["a"],"concepto":"La opción -g (--grep) filtra los tests por una expresión sobre su título.","explicacion":["-g es la forma corta de --grep.","Acepta una RegExp contra el título completo del test.","--grep-invert (-gv) hace el filtro contrario."],"razones":{"a":"Correcta. -g / --grep filtra por título.","b":"--title no es una opción de la CLI.","c":"--filter no existe en playwright test.","d":"-t no es un flag de playwright test."},"clave":"Por título: -g.","docs":"https://playwright.dev/docs/test-cli"},{"id":"B-CLI-03","nivel":"basico","tema":"CLI y configuración","tipo":"como","pregunta":"¿Cómo ejecutas únicamente el test que empieza en la línea 25 de `tests/login.spec.ts`?","opciones":{"a":"`npx playwright test tests/login.spec.ts:25`","b":"`npx playwright test tests/login.spec.ts --line 25`","c":"`npx playwright test tests/login.spec.ts#25`","d":"`npx playwright test tests/login.spec.ts@25`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Se puede apuntar a un test concreto añadiendo :línea a la ruta del fichero.","explicacion":["La sintaxis es fichero:línea.","Sin la línea, se ejecutan todos los tests del fichero.","Es útil para repetir rápido un test que falla."],"razones":{"a":"Correcta. Sintaxis fichero:línea.","b":"--line no existe.","c":"El separador # no se admite.","d":"El separador @ no se admite."},"clave":"fichero:línea.","docs":"https://playwright.dev/docs/test-cli"},{"id":"B-CLI-04","nivel":"basico","tema":"CLI y configuración","tipo":"funcion","pregunta":"¿Qué comando abre el navegador y graba tus acciones generando código de test automáticamente?","opciones":{"a":"`npx playwright codegen`","b":"`npx playwright record`","c":"`npx playwright test --record`","d":"`npx playwright generate`"},"codigoOpciones":false,"correcta":["a"],"concepto":"codegen abre un navegador y el inspector, y escribe el código del test mientras interactúas con la página.","explicacion":["Se puede pasar una URL: npx playwright codegen https://ejemplo.com.","Elige localizadores como getByRole siempre que puede.","El código generado conviene revisarlo y añadirle aserciones."],"razones":{"a":"Correcta. Es el generador de tests.","b":"record no es un subcomando de playwright.","c":"--record no existe en test.","d":"generate no es un subcomando."},"clave":"Grabar a código: codegen.","docs":"https://playwright.dev/docs/codegen"},{"id":"B-CLI-05","nivel":"basico","tema":"CLI y configuración","tipo":"codigo","pregunta":"Queremos que los tests naveguen con rutas relativas como `page.goto('/login')`. ¿Dónde se configura `baseURL`?","codigo":"import { defineConfig } from '@playwright/test';\n\nexport default defineConfig({\n  testDir: './tests',\n  ___\n});","opciones":{"a":"`use: { baseURL: 'http://localhost:3000' },`","b":"`baseURL: 'http://localhost:3000',`","c":"`projects: { baseURL: 'http://localhost:3000' },`","d":"`webServer: { baseURL: 'http://localhost:3000' },`"},"codigoOpciones":false,"correcta":["a"],"concepto":"baseURL es una opción de use, y por tanto va dentro de use (global o de un proyecto).","explicacion":["Las opciones de contexto de los tests van dentro de use.","goto('/login') se resuelve contra baseURL.","webServer también admite url, pero no define baseURL."],"razones":{"a":"Correcta. baseURL se define dentro de use.","b":"A nivel raíz de la configuración no es una opción válida.","c":"projects es un array, no un objeto con baseURL.","d":"webServer arranca un servidor; la base de los tests es use.baseURL."},"clave":"Opciones de test: dentro de use.","docs":"https://playwright.dev/docs/test-use-options"},{"id":"B-CLI-06","nivel":"basico","tema":"CLI y configuración","tipo":"codigo","pregunta":"Completa la configuración para ejecutar los tests en Chromium con la configuración de escritorio de Chrome.","codigo":"import { defineConfig, devices } from '@playwright/test';\n\nexport default defineConfig({\n  projects: [\n    {\n      name: 'chromium',\n      use: { ...___ },\n    },\n  ],\n});","opciones":{"a":"`devices['Desktop Chrome']`","b":"`devices.chromium`","c":"`devices('Desktop Chrome')`","d":"`device['Desktop Chrome']`"},"codigoOpciones":false,"correcta":["a"],"concepto":"El objeto devices contiene descriptores de dispositivos indexados por nombre, que se expanden dentro de use.","explicacion":["devices se importa de @playwright/test.","Se accede con corchetes y el nombre: devices['Desktop Chrome'].","El spread (...) copia sus opciones dentro de use.","Cada entrada de projects genera una ejecución separada."],"razones":{"a":"Correcta. Indexado por nombre del descriptor.","b":"devices no tiene la clave chromium.","c":"devices es un objeto, no una función.","d":"El nombre importado es devices, en plural."},"clave":"...devices['Desktop Chrome'].","docs":"https://playwright.dev/docs/test-projects"},{"id":"B-CLI-07","nivel":"basico","tema":"CLI y configuración","tipo":"codigo","pregunta":"Quieres 2 reintentos solo en CI y trazas únicamente cuando un test se reintenta. ¿Qué configuración es correcta?","codigoOpciones":true,"opciones":{"a":"export default defineConfig({\n  retries: process.env.CI ? 2 : 0,\n  use: { trace: 'on-first-retry' },\n});","b":"export default defineConfig({\n  use: { retries: 2, trace: 'on-first-retry' },\n});","c":"export default defineConfig({\n  retries: process.env.CI ? 2 : 0,\n  trace: 'on-first-retry',\n});","d":"export default defineConfig({\n  retries: 2,\n  use: { trace: 'first-retry' },\n});"},"correcta":["a"],"concepto":"retries va en el nivel raíz de la configuración, mientras que trace es una opción de use con valores como 'on-first-retry'.","explicacion":["retries es una opción del runner, a nivel raíz.","trace pertenece a use.","'on-first-retry' graba la traza solo en el primer reintento.","'first-retry' no es un valor válido."],"razones":{"a":"Correcta. retries en la raíz y trace dentro de use.","b":"retries no es una opción de use.","c":"trace debe ir dentro de use.","d":"'first-retry' no es válido; el valor es 'on-first-retry'."},"clave":"retries fuera, trace dentro de use.","docs":"https://playwright.dev/docs/trace-viewer"},{"id":"B-CLI-08","nivel":"basico","tema":"CLI y configuración","tipo":"como","pregunta":"¿Cómo ejecutas los tests con el navegador visible y solo en el proyecto `chromium`?","opciones":{"a":"`npx playwright test --headed --project=chromium`","b":"`npx playwright test --visible --browser=chromium`","c":"`npx playwright test --head --project chromium-only`","d":"`npx playwright test --ui=headed --project=chrome`"},"codigoOpciones":false,"correcta":["a"],"concepto":"--headed muestra el navegador y --project selecciona un proyecto definido en la configuración.","explicacion":["Por defecto los tests se ejecutan en modo headless.","--headed abre las ventanas del navegador.","--project=nombre usa el name de un proyecto de la configuración.","--ui abre el modo UI, que es otra herramienta."],"razones":{"a":"Correcta. Ambos flags existen.","b":"--visible no existe (el flag es --headed), y --browser elige el motor, no un proyecto de la configuración.","c":"--head no es un flag válido de test.","d":"--ui no admite ese valor y el proyecto debe existir con ese nombre."},"clave":"Ver el navegador: --headed.","docs":"https://playwright.dev/docs/test-cli"},{"id":"B-ESP-01","nivel":"basico","tema":"Auto-espera","tipo":"concepto","pregunta":"¿Qué comprobaciones hace Playwright antes de ejecutar un click?","opciones":{"a":"Solo que el elemento exista en el DOM","b":"Visible, estable, habilitado y que recibe eventos","c":"Que el elemento tenga un id","d":"Que la página haya disparado el evento load"},"codigoOpciones":false,"correcta":["b"],"concepto":"Antes de actuar, Playwright espera a que el elemento cumpla las comprobaciones de actionability.","explicacion":["Visible: tiene caja no vacía y no está oculto.","Stable: sin animación en curso.","Enabled y Receives Events: no deshabilitado ni tapado por otro elemento."],"razones":{"a":"La existencia por sí sola no basta.","b":"Correcta. Son las comprobaciones reales.","c":"El id no es requisito.","d":"No espera al evento load."},"clave":"Visible, stable, enabled, receives events.","docs":"https://playwright.dev/docs/actionability"},{"id":"B-ESP-02","nivel":"basico","tema":"Auto-espera","tipo":"error","pregunta":"¿Qué problema tiene este código?","codigo":"await page.getByText('Guardar').click();\nawait page.waitForTimeout(3000);\nawait expect(page.getByText('Guardado')).toBeVisible();","opciones":{"a":"waitForTimeout es una pausa fija: lenta o frágil; expect ya reintenta","b":"Falta await en expect","c":"toBeVisible no existe","d":"click no admite getByText"},"codigoOpciones":false,"correcta":["a"],"concepto":"Las pausas fijas hacen tests lentos y poco fiables; las aserciones web-first reintentan solas.","explicacion":["expect(...).toBeVisible() espera hasta su timeout.","waitForTimeout se desaconseja salvo depuración.","Quita la pausa y deja la aserción."],"razones":{"a":"Correcta. Es el antipatrón.","b":"El await ya está presente.","c":"toBeVisible existe.","d":"click funciona con cualquier locator."},"clave":"No duermas: aserta.","docs":"https://playwright.dev/docs/best-practices"},{"id":"B-ESP-03","nivel":"basico","tema":"Auto-espera","tipo":"concepto","pregunta":"¿Qué timeout por defecto tiene cada test completo en Playwright Test?","opciones":{"a":"5 segundos","b":"60 segundos","c":"Sin límite","d":"30 segundos"},"codigoOpciones":false,"correcta":["d"],"concepto":"El timeout del test es de 30 000 ms por defecto e incluye hooks y fixtures.","explicacion":["Test: 30 s por defecto.","expect: 5 s por defecto.","Las acciones no tienen timeout propio por defecto, pero el del test las limita."],"razones":{"a":"5 s es el de expect.","b":"60 s no es el valor por defecto.","c":"Sí existe límite.","d":"Correcta. Valor por defecto del test."},"clave":"Test 30 s, expect 5 s.","docs":"https://playwright.dev/docs/test-timeouts"},{"id":"B-ESP-04","nivel":"basico","tema":"Auto-espera","tipo":"codigo","pregunta":"Completa para subir el timeout de las aserciones expect a 10 segundos.","codigo":"// playwright.config.ts\nexport default defineConfig({\n  ___: { timeout: 10_000 },\n});","opciones":{"a":"assertions","b":"timeouts","c":"expect","d":"use"},"codigoOpciones":false,"correcta":["c"],"concepto":"La clave expect de la configuración fija el timeout de las aserciones.","explicacion":["Config: expect: { timeout }.","Una aserción concreta admite { timeout } en sus opciones.","No confundir con el timeout de test."],"razones":{"a":"No existe esa clave.","b":"No existe esa clave.","c":"Correcta. Clave real de la configuración.","d":"use contiene opciones de contexto, no el timeout de expect."},"clave":"expect: { timeout }.","docs":"https://playwright.dev/docs/test-timeouts"},{"id":"B-ESP-05","nivel":"basico","tema":"Auto-espera","tipo":"concepto","pregunta":"Un botón está tapado por un modal. ¿Qué ocurre con click()?","opciones":{"a":"Hace clic igualmente sobre el modal","b":"Playwright reintenta hasta que reciba eventos o venza el timeout","c":"Falla inmediatamente","d":"Cierra el modal"},"codigoOpciones":false,"correcta":["b"],"concepto":"Si otro elemento intercepta el clic, no se cumple Receives Events y Playwright sigue reintentando.","explicacion":["Receives Events: el punto de clic debe ser alcanzable.","Si se agota el timeout, el error indica el elemento que lo intercepta.","force: true omite el chequeo, pero puede ocultar bugs."],"razones":{"a":"No clicaría sobre un elemento distinto.","b":"Correcta. Comportamiento de actionability.","c":"Reintenta antes de fallar.","d":"No cierra nada por su cuenta."},"clave":"Tapado: reintenta, no clica.","docs":"https://playwright.dev/docs/actionability"},{"id":"B-ESP-06","nivel":"basico","tema":"Auto-espera","tipo":"funcion","pregunta":"¿Qué aserción espera a que un elemento aparezca en pantalla?","opciones":{"a":"`await expect(locator).toBeVisible()`","b":"`expect(await locator.isVisible()).toBe(true)`","c":"`await page.waitForTimeout(1000)`","d":"`expect(locator.visible).toBe(true)`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Las aserciones web-first con locator reintentan hasta cumplirse o agotar el timeout.","explicacion":["isVisible() devuelve el estado al instante, sin esperar.","expect(locator) con matchers reintenta.","visible no es propiedad de Locator."],"razones":{"a":"Correcta. Aserción con reintentos.","b":"isVisible no espera; puede dar falso antes de aparecer.","c":"Pausa fija.","d":"Locator no tiene propiedad visible."},"clave":"Web-first: await expect(locator).","docs":"https://playwright.dev/docs/test-assertions"},{"id":"B-ESP-07","nivel":"basico","tema":"Auto-espera","tipo":"concepto","pregunta":"¿Qué pasa con fill() sobre un input deshabilitado?","opciones":{"a":"Rellena el valor ignorando disabled","b":"Falla al instante","c":"Lo habilita automáticamente","d":"Playwright espera a que esté habilitado y falla al agotar el timeout"},"codigoOpciones":false,"correcta":["d"],"concepto":"Las acciones esperan a que el elemento esté Enabled antes de ejecutarse.","explicacion":["Enabled significa que no tiene disabled.","fill además exige que sea editable.","El timeout de acción acaba produciendo el error."],"razones":{"a":"No ignora disabled.","b":"Antes reintenta.","c":"No modifica atributos.","d":"Correcta. Comportamiento de auto-espera."},"clave":"Enabled es requisito de la acción.","docs":"https://playwright.dev/docs/actionability"},{"id":"B-ESP-08","nivel":"basico","tema":"Auto-espera","tipo":"codigo","pregunta":"Completa el hueco para limitar a 3 segundos una acción concreta.","codigo":"await page.getByRole('button', { name: 'Enviar' }).click({ ___: 3000 });","opciones":{"a":"wait","b":"maxTime","c":"timeout","d":"delay"},"codigoOpciones":false,"correcta":["c"],"concepto":"La mayoría de acciones aceptan la opción timeout en milisegundos.","explicacion":["timeout en acción: sobrescribe el valor global.","delay en click es la pausa entre mousedown y mouseup.","Si vence, la acción falla con TimeoutError."],"razones":{"a":"wait no existe como opción.","b":"maxTime no existe.","c":"Correcta. Opción real de las acciones.","d":"delay es otra cosa: pausa entre pulsaciones."},"clave":"Acción con límite: { timeout }.","docs":"https://playwright.dev/docs/test-timeouts"},{"id":"B-EST-01","nivel":"basico","tema":"Estructura del test","tipo":"codigo","pregunta":"¿Qué línea va en la primera línea de un fichero `.spec.ts` para poder usar `test` y `expect`?","opciones":{"a":"`import { test, expect } from '@playwright/test';`","b":"`import { test, expect } from 'playwright';`","c":"`import test from '@playwright/test';`","d":"`const { test } = require('playwright-test');`"},"codigoOpciones":false,"correcta":["a"],"concepto":"El runner de Playwright exporta test y expect desde el paquete @playwright/test.","explicacion":["@playwright/test es el paquete del test runner.","El paquete 'playwright' es la librería de automatización, sin runner.","expect es una exportación con nombre; lo estándar es importar ambos con nombre: import { test, expect }."],"razones":{"a":"Correcta. Importación con nombre desde el paquete del runner.","b":"El paquete 'playwright' no incluye el runner de tests.","c":"Solo importa test (que sí es la exportación por defecto) y falta expect, que se importa con nombre.","d":"El paquete 'playwright-test' no es el oficial."},"clave":"Runner = @playwright/test.","docs":"https://playwright.dev/docs/writing-tests"},{"id":"B-EST-02","nivel":"basico","tema":"Estructura del test","tipo":"codigo","pregunta":"Todos los tests de un grupo deben empezar en `/carrito`. ¿Qué va en el hueco?","codigo":"test.describe('Carrito', () => {\n  ___(async ({ page }) => {\n    await page.goto('/carrito');\n  });\n\n  test('vacío', async ({ page }) => { /* ... */ });\n  test('con producto', async ({ page }) => { /* ... */ });\n});","opciones":{"a":"`test.beforeEach`","b":"`test.beforeAll`","c":"`test.before`","d":"`test.setup`"},"codigoOpciones":false,"correcta":["a"],"concepto":"test.beforeEach se ejecuta antes de cada test del bloque y recibe fixtures como page.","explicacion":["beforeEach corre antes de cada test, con su propia page nueva.","beforeAll corre una vez por worker y no recibe page.","before y setup no existen como hooks de test."],"razones":{"a":"Correcta. Se ejecuta antes de cada test del describe.","b":"beforeAll corre una sola vez y no puede usar la fixture page.","c":"test.before no existe.","d":"test.setup no existe; setup es un concepto de proyectos."},"clave":"Antes de cada uno: beforeEach.","docs":"https://playwright.dev/docs/api/class-test"},{"id":"B-EST-03","nivel":"basico","tema":"Estructura del test","tipo":"funcion","pregunta":"Estás depurando y quieres ejecutar solo un test del fichero sin tocar la CLI. ¿Qué se usa?","opciones":{"a":"`test.only('nombre', async ({ page }) => { ... })`","b":"`test.single('nombre', ...)`","c":"`test.focus('nombre', ...)`","d":"`test.solo('nombre', ...)`"},"codigoOpciones":false,"correcta":["a"],"concepto":"test.only hace que solo se ejecuten los tests marcados con él.","explicacion":["test.only limita la ejecución a ese test.","Conviene quitarlo antes de subir el código.","Con forbidOnly: true en CI, un test.only hace fallar la ejecución."],"razones":{"a":"Correcta. test.only aísla el test.","b":"test.single no existe.","c":"test.focus no existe (es de otros runners).","d":"test.solo no existe."},"clave":"Uno solo: only.","docs":"https://playwright.dev/docs/api/class-test"},{"id":"B-EST-04","nivel":"basico","tema":"Estructura del test","tipo":"concepto","pregunta":"¿Cuál es la diferencia entre `test.skip` y `test.fixme`?","opciones":{"a":"Ambos omiten el test; `fixme` indica que el test está roto y hay que arreglarlo, `skip` que no aplica.","b":"`skip` ejecuta el test sin aserciones y `fixme` lo borra.","c":"`fixme` ejecuta el test y `skip` no.","d":"`skip` solo funciona dentro de `test.describe`."},"codigoOpciones":false,"correcta":["a"],"concepto":"skip y fixme omiten el test; fixme documenta que está pendiente de arreglar.","explicacion":["Ninguno de los dos ejecuta el cuerpo del test.","test.fixme marca un test roto que se debe reparar.","test.skip marca un test que no aplica, por ejemplo según el navegador.","Aparecen como omitidos en el informe."],"razones":{"a":"Correcta. Mismo efecto de omitir, distinta intención.","b":"Ninguno ejecuta el test ni lo borra.","c":"Ninguno de los dos ejecuta el test.","d":"test.skip se puede usar también a nivel de fichero o dentro del test."},"clave":"fixme = pendiente de arreglar.","docs":"https://playwright.dev/docs/test-annotations"},{"id":"B-EST-05","nivel":"basico","tema":"Estructura del test","tipo":"codigo","pregunta":"Quieres hacer una llamada HTTP directa a la API dentro de un test, sin abrir el navegador. ¿Qué fixture se pide?","codigo":"test('API', async ({ ___ }) => {\n  const res = await request.get('/api/health');\n  expect(res.ok()).toBeTruthy();\n});","opciones":{"a":"`request`","b":"`page`","c":"`browser`","d":"`http`"},"codigoOpciones":false,"correcta":["a"],"concepto":"La fixture request proporciona un APIRequestContext para hacer peticiones HTTP sin navegador.","explicacion":["Los fixtures se piden por nombre con destructuring.","request da get, post, put, delete, etc.","page y browser abren o representan un navegador.","http no es una fixture integrada."],"razones":{"a":"Correcta. Cliente HTTP integrado.","b":"page es una pestaña de navegador y no tiene get() de API.","c":"browser representa la instancia del navegador.","d":"http no es una fixture integrada."},"clave":"HTTP sin navegador: request.","docs":"https://playwright.dev/docs/test-fixtures"},{"id":"B-EST-06","nivel":"basico","tema":"Estructura del test","tipo":"concepto","pregunta":"Un test deja una cookie de sesión en su `page`. ¿Qué pasa con el siguiente test?","opciones":{"a":"No la ve: cada test recibe un `context` y una `page` nuevos y aislados.","b":"La ve siempre, porque comparten navegador y contexto.","c":"La ve solo si ambos tests están en el mismo fichero.","d":"La ve solo si se ejecutan con `--headed`."},"codigoOpciones":false,"correcta":["a"],"concepto":"Playwright crea un BrowserContext nuevo por cada test, lo que aísla cookies, almacenamiento y sesión.","explicacion":["Cada test tiene su propio context, como un perfil de navegador limpio.","Se evita que un test contamine a otro.","Compartir sesión requiere storageState explícito.","El modo headed no cambia el aislamiento."],"razones":{"a":"Correcta. Aislamiento por test.","b":"El contexto no se comparte entre tests.","c":"Estar en el mismo fichero no comparte contexto.","d":"--headed solo muestra el navegador."},"clave":"Un test, un context limpio.","docs":"https://playwright.dev/docs/browser-contexts"},{"id":"B-EST-07","nivel":"basico","tema":"Estructura del test","tipo":"concepto","pregunta":"¿Cuándo se ejecuta `test.beforeAll` dentro de un `test.describe`?","opciones":{"a":"Una vez antes de todos los tests del bloque, por cada worker.","b":"Antes de cada test del bloque.","c":"Una vez al terminar todos los tests.","d":"Solo antes del primer test del proyecto, aunque haya más describes."},"codigoOpciones":false,"correcta":["a"],"concepto":"beforeAll se ejecuta una vez por worker antes de los tests de su ámbito; beforeEach se ejecuta antes de cada test.","explicacion":["beforeAll sirve para preparación costosa y compartida.","No recibe la fixture page, solo fixtures de ámbito worker.","afterAll hace el cierre equivalente al final.","beforeEach repite la acción antes de cada test."],"razones":{"a":"Correcta. Una vez por worker y por bloque.","b":"Eso es beforeEach.","c":"Eso sería afterAll.","d":"Su ámbito es el describe en el que se declara, no todo el proyecto."},"clave":"All = una vez; Each = cada vez.","docs":"https://playwright.dev/docs/api/class-test"},{"id":"B-EST-08","nivel":"basico","tema":"Estructura del test","tipo":"error","pregunta":"Este test falla con un error de TypeScript o al ejecutarse. ¿Qué está mal?","codigo":"test('abre inicio', async (page) => {\n  await page.goto('/');\n  await expect(page).toHaveTitle(/Inicio/);\n});","opciones":{"a":"El argumento es el objeto de fixtures; debe desestructurarse: `async ({ page }) =>`.","b":"`toHaveTitle` no admite expresiones regulares.","c":"Falta `test.describe` alrededor del test.","d":"`goto('/')` no se puede usar en el primer test."},"codigoOpciones":false,"correcta":["a"],"concepto":"El callback de test recibe un único objeto de fixtures, del que se extraen page, context, etc., por desestructuración.","explicacion":["El primer argumento es un objeto con todas las fixtures.","Hay que escribir ({ page }) para extraer la que se necesita.","Con (page), el objeto entero se llama page y goto no existe en él."],"razones":{"a":"Correcta. Falta desestructurar { page }.","b":"toHaveTitle admite string o RegExp.","c":"describe es opcional.","d":"goto('/') es válido en cualquier test."},"clave":"Fixtures entre llaves: ({ page }).","docs":"https://playwright.dev/docs/test-fixtures"},{"id":"B-LOC-01","nivel":"basico","tema":"Localizadores","tipo":"localizador","pregunta":"Tienes este campo. ¿Qué localizador recomienda Playwright para rellenarlo?","codigo":"<label for=\"email\">Correo electrónico<\/label>\n<input id=\"email\" type=\"email\">","opciones":{"a":"`page.getByText('Correo electrónico')`","b":"`page.getByLabel('Correo electrónico')`","c":"`page.getByTitle('email')`","d":"`page.$('#email')`"},"codigoOpciones":false,"correcta":["b"],"concepto":"getByLabel localiza controles de formulario por el texto de su etiqueta asociada.","explicacion":["getByLabel encuentra el input a través del label asociado.","Es como el usuario identifica el campo.","getByText devolvería la etiqueta, no el input."],"razones":{"a":"getByText devuelve el elemento label, no el input que se quiere rellenar.","b":"Correcta. Localiza el input por el texto de su label.","c":"getByTitle busca el atributo title, que aquí no existe.","d":"page.$ es la API antigua de ElementHandle, desaconsejada."},"clave":"Campo con label visible: getByLabel.","docs":"https://playwright.dev/docs/locators#locate-by-label"},{"id":"B-LOC-02","nivel":"basico","tema":"Localizadores","tipo":"codigo","pregunta":"Completa el hueco para localizar el campo por su texto de ayuda.","codigo":"// <input placeholder=\"Buscar productos\">\nawait page.___('Buscar productos').fill('zapatillas');","opciones":{"a":"getByPlaceholder","b":"getByLabel","c":"getByAltText","d":"getByTitle"},"codigoOpciones":false,"correcta":["a"],"concepto":"getByPlaceholder localiza inputs por el texto de su atributo placeholder.","explicacion":["getByPlaceholder busca por el atributo placeholder.","getByLabel requiere un label asociado.","getByAltText es para imágenes y áreas."],"razones":{"a":"Correcta. Busca justo por el atributo placeholder.","b":"Busca por texto de etiqueta, no por placeholder.","c":"getByAltText mira el atributo alt, propio de imágenes.","d":"getByTitle mira el atributo title."},"clave":"Placeholder = getByPlaceholder.","docs":"https://playwright.dev/docs/locators#locate-by-placeholder"},{"id":"B-LOC-03","nivel":"basico","tema":"Localizadores","tipo":"localizador","pregunta":"¿Qué localizador busca esta imagen por su texto alternativo?","codigo":"<img src=\"logo.png\" alt=\"Logotipo de Acme\">","opciones":{"a":"`page.getByText('Logotipo de Acme')`","b":"`page.getByTitle('Logotipo de Acme')`","c":"`page.getByLabel('Logotipo de Acme')`","d":"`page.getByAltText('Logotipo de Acme')`"},"codigoOpciones":false,"correcta":["d"],"concepto":"getByAltText localiza elementos, normalmente imágenes, por su texto alternativo.","explicacion":["alt es el texto alternativo de la imagen.","getByText solo ve contenido de texto, no atributos.","Otra opción válida sería getByRole('img', { name })."],"razones":{"a":"El alt no es texto del DOM; getByText no lo encuentra.","b":"getByTitle busca el atributo title, no alt.","c":"getByLabel busca controles con etiqueta, no imágenes.","d":"Correcta. alt es el atributo que usa getByAltText."},"clave":"Imagen con alt: getByAltText.","docs":"https://playwright.dev/docs/locators#locate-by-alt-text"},{"id":"B-LOC-04","nivel":"basico","tema":"Localizadores","tipo":"codigo","pregunta":"Tu equipo usa data-qa en lugar de data-testid. ¿Qué opción de config hace que getByTestId lo reconozca?","codigo":"// playwright.config.ts\nexport default defineConfig({\n  use: { ___: 'data-qa' },\n});","opciones":{"a":"testIdSelector","b":"dataTestId","c":"testIdAttribute","d":"selectorAttribute"},"codigoOpciones":false,"correcta":["c"],"concepto":"La opción use.testIdAttribute cambia el atributo que getByTestId usa para localizar.","explicacion":["Por defecto getByTestId usa data-testid.","use.testIdAttribute lo cambia globalmente.","También existe selectors.setTestIdAttribute() en código."],"razones":{"a":"No existe una opción con ese nombre.","b":"No existe; es un nombre inventado.","c":"Correcta. Es el nombre real de la opción de configuración.","d":"No existe como opción de use."},"clave":"testIdAttribute: el atributo del test id.","docs":"https://playwright.dev/docs/locators#locate-by-test-id"},{"id":"B-LOC-05","nivel":"basico","tema":"Localizadores","tipo":"error","pregunta":"Este test falla con «strict mode violation». ¿Por qué?","codigo":"// La página tiene 3 botones «Añadir»\nawait page.getByRole('button', { name: 'Añadir' }).click();","opciones":{"a":"getByRole no admite la opción name","b":"El locator resuelve a varios elementos y click exige exactamente uno","c":"click necesita un timeout explícito","d":"Falta await antes de page.getByRole"},"codigoOpciones":false,"correcta":["b"],"concepto":"Los locators son estrictos: una acción sobre un locator que coincide con varios elementos lanza error.","explicacion":["Strict mode obliga a que la acción apunte a un solo elemento.","Soluciones: afinar el locator, first(), nth() o filter().","Es una protección frente a clics en el elemento equivocado."],"razones":{"a":"name es una opción válida de getByRole.","b":"Correcta. Es justo lo que describe el modo estricto.","c":"click usa el timeout por defecto; no es obligatorio indicarlo.","d":"Los locators se crean sin await; el await va en la acción."},"clave":"Varios matches + acción = strict mode violation.","docs":"https://playwright.dev/docs/locators#strictness"},{"id":"B-LOC-06","nivel":"basico","tema":"Localizadores","tipo":"codigo","pregunta":"¿Qué ocurre en el momento de ejecutar esta línea?","codigo":"const boton = page.getByRole('button', { name: 'Guardar' });","opciones":{"a":"Nada: el locator es perezoso y solo busca el elemento al usarlo en una acción o aserción","b":"Playwright espera hasta que el botón exista en el DOM","c":"Devuelve un ElementHandle con el elemento","d":"Lanza error si el botón no está visible"},"codigoOpciones":false,"correcta":["a"],"concepto":"Un Locator es una descripción perezosa; no consulta el DOM hasta que se actúa sobre él.","explicacion":["Crear un locator no hace ninguna consulta ni espera.","Se resuelve cada vez que se usa, así que siempre está actualizado.","Por eso no lleva await."],"razones":{"a":"Correcta. Es la definición de locator perezoso.","b":"La espera ocurre al ejecutar una acción, no al crearlo.","c":"Devuelve un Locator, no un ElementHandle.","d":"No valida nada en la creación."},"clave":"Locator = receta, no resultado.","docs":"https://playwright.dev/docs/locators"},{"id":"B-LOC-07","nivel":"basico","tema":"Localizadores","tipo":"concepto","pregunta":"¿Cuál es el orden de preferencia recomendado para localizar elementos?","opciones":{"a":"CSS, luego XPath y por último getByRole","b":"XPath primero porque es el más preciso","c":"Siempre getByTestId antes que cualquier otro","d":"Roles y texto visibles para el usuario, luego test id y, como último recurso, CSS/XPath"},"codigoOpciones":false,"correcta":["d"],"concepto":"La guía recomienda localizar como el usuario: rol/texto primero, test id después y CSS/XPath al final.","explicacion":["Prioriza lo que ve el usuario: getByRole, getByLabel, getByText.","getByTestId es la alternativa estable si no hay atributos accesibles.","CSS y XPath se acoplan a la implementación."],"razones":{"a":"Invierte la recomendación.","b":"XPath es frágil ante cambios del DOM.","c":"El test id es útil, pero no es la primera opción.","d":"Correcta. Coincide con la guía de buenas prácticas."},"clave":"Usuario > test id > CSS/XPath.","docs":"https://playwright.dev/docs/best-practices#prefer-user-facing-attributes-to-xpath-or-css-selectors"},{"id":"B-LOC-08","nivel":"basico","tema":"Localizadores","tipo":"codigo","pregunta":"¿Qué localizador XPath es válido en Playwright para esta lista?","codigo":"<ul><li class=\"item\">Uno<\/li><\/ul>","opciones":{"a":"`page.getByXPath('//li')`","b":"`page.xpath('//li')`","c":"`page.locator('xpath=//li[@class=\"item\"]')`","d":"`page.locator('//li', { type: 'xpath' })`"},"codigoOpciones":false,"correcta":["c"],"concepto":"page.locator acepta XPath con el prefijo xpath= o si el selector empieza por //.","explicacion":["locator() detecta XPath por el prefijo xpath= o por empezar con //.","No existe un método getByXPath.","Aun así, CSS/XPath son el último recurso."],"razones":{"a":"getByXPath no existe en Playwright.","b":"page.xpath no existe.","c":"Correcta. Sintaxis válida de selector XPath.","d":"locator no tiene una opción type."},"clave":"locator(\"xpath=...\") o empieza por //.","docs":"https://playwright.dev/docs/other-locators#xpath-locator"},{"id":"B-NAV-01","nivel":"basico","tema":"Navegación","tipo":"codigo","pregunta":"Con baseURL configurada en use, ¿qué valor va en el hueco para navegar a https://miapp.test/login?","codigo":"// playwright.config.ts: use: { baseURL: 'https://miapp.test' }\ntest('login', async ({ page }) => {\n  await page.goto('___');\n});","opciones":{"a":"baseURL/login","b":"/login","c":"{baseURL}/login","d":"miapp.test:/login"},"codigoOpciones":false,"correcta":["b"],"concepto":"Con baseURL, goto acepta rutas relativas que se resuelven contra ella.","explicacion":["La ruta relativa se une a baseURL.","Evita repetir el dominio en cada test.","Sin baseURL habría que usar la URL completa."],"razones":{"a":"baseURL no se interpola en el texto.","b":"Correcta. Se resuelve como https://miapp.test/login.","c":"No hay interpolación con llaves.","d":"No es una URL válida."},"clave":"baseURL + ruta relativa.","docs":"https://playwright.dev/docs/test-use-options"},{"id":"B-NAV-02","nivel":"basico","tema":"Navegación","tipo":"funcion","pregunta":"¿Qué método vuelve a la página anterior del historial?","opciones":{"a":"`page.goBack()`","b":"`page.back()`","c":"`page.history.back()`","d":"`page.previous()`"},"codigoOpciones":false,"correcta":["a"],"concepto":"page.goBack navega a la entrada anterior del historial.","explicacion":["goBack y goForward recorren el historial.","page.reload() recarga la página actual.","Devuelven la respuesta o null."],"razones":{"a":"Correcta. Es el método existente.","b":"page.back no existe.","c":"page.history no existe.","d":"page.previous no existe."},"clave":"Atrás = goBack.","docs":"https://playwright.dev/docs/api/class-page#page-go-back"},{"id":"B-NAV-03","nivel":"basico","tema":"Navegación","tipo":"codigo","pregunta":"Completa el código para comprobar la URL actual tras iniciar sesión.","codigo":"await page.getByRole('button', { name: 'Entrar' }).click();\nawait expect(page).___(/dashboard/);","opciones":{"a":"toBeURL","b":"toContainURL","c":"toHavePath","d":"toHaveURL"},"codigoOpciones":false,"correcta":["d"],"concepto":"toHaveURL es una aserción con reintentos que verifica la URL de la página.","explicacion":["Acepta string, RegExp o predicado.","Reintenta hasta cumplirse o agotar el timeout.","page.url() devuelve la URL sin reintentos."],"razones":{"a":"No existe toBeURL.","b":"No existe toContainURL.","c":"No existe toHavePath.","d":"Correcta. Aserción real de página."},"clave":"URL en aserción = toHaveURL.","docs":"https://playwright.dev/docs/test-assertions"},{"id":"B-NAV-04","nivel":"basico","tema":"Navegación","tipo":"error","pregunta":"Este test es poco fiable. ¿Qué problema tiene?","codigo":"await page.getByText('Entrar').click();\nexpect(page.url()).toBe('https://miapp.test/home');","opciones":{"a":"url() es asíncrono y falta await","b":"toBe no compara cadenas","c":"page.url() es instantáneo y no reintenta; la URL puede no haber cambiado aún","d":"getByText no puede hacer click"},"codigoOpciones":false,"correcta":["c"],"concepto":"page.url() devuelve la URL actual al instante; para esperar el cambio usa toHaveURL o waitForURL.","explicacion":["La navegación puede tardar tras el click.","await expect(page).toHaveURL(...) reintenta.","url() es síncrono."],"razones":{"a":"url() es síncrono, no necesita await.","b":"toBe compara cadenas con normalidad.","c":"Correcta. Describe la condición de carrera.","d":"click funciona sobre cualquier locator."},"clave":"Para URLs que cambian: toHaveURL.","docs":"https://playwright.dev/docs/test-assertions"},{"id":"B-NAV-05","nivel":"basico","tema":"Navegación","tipo":"funcion","pregunta":"¿Qué método espera a que la página navegue a una URL que cumple un patrón?","opciones":{"a":"`page.waitForNavigation()`","b":"`page.waitForURL()`","c":"`page.waitForTimeout()`","d":"`page.waitForLocation()`"},"codigoOpciones":false,"correcta":["b"],"concepto":"page.waitForURL espera a que la URL cumpla un string, patrón o predicado.","explicacion":["waitForNavigation está obsoleto.","waitForTimeout es una pausa fija: evítala.","waitForURL admite glob, RegExp o función."],"razones":{"a":"Obsoleto y desaconsejado.","b":"Correcta. Método actual recomendado.","c":"Es solo una pausa fija.","d":"No existe."},"clave":"Esperar URL = waitForURL.","docs":"https://playwright.dev/docs/navigations"},{"id":"B-NAV-06","nivel":"basico","tema":"Navegación","tipo":"codigo","pregunta":"Completa para esperar a que no haya actividad de red durante 500 ms.","codigo":"await page.goto('/informes');\nawait page.waitForLoadState('___');","opciones":{"a":"networkidle","b":"complete","c":"ready","d":"idle"},"codigoOpciones":false,"correcta":["a"],"concepto":"waitForLoadState admite load, domcontentloaded y networkidle.","explicacion":["load es el valor por defecto.","networkidle se desaconseja en tests; prefiere aserciones web-first.","domcontentloaded espera al HTML parseado."],"razones":{"a":"Correcta. Valor válido de estado de carga.","b":"complete no es un valor válido.","c":"ready no es un valor válido.","d":"idle no es un valor válido."},"clave":"Estados: load, domcontentloaded, networkidle.","docs":"https://playwright.dev/docs/api/class-page#page-wait-for-load-state"},{"id":"B-NAV-07","nivel":"basico","tema":"Navegación","tipo":"como","pregunta":"¿Cómo obtiene un test de @playwright/test la página con la que trabajar?","opciones":{"a":"Con `new Page()` dentro del test","b":"Llamando a `chromium.launch()` en cada test","c":"Con `require('page')`","d":"Destructurándola como fixture: `test('x', async ({ page }) => {})`"},"codigoOpciones":false,"correcta":["d"],"concepto":"page es un fixture que Playwright Test crea aislado para cada test.","explicacion":["Se pide destructurando en los argumentos del test.","Cada test recibe un contexto y página nuevos.","No hace falta lanzar ni cerrar el navegador a mano."],"razones":{"a":"Page no se instancia con new.","b":"El runner gestiona el navegador.","c":"No existe ese módulo.","d":"Correcta. Es la forma estándar con fixtures."},"clave":"async ({ page }) => ...","docs":"https://playwright.dev/docs/test-fixtures"},{"id":"B-NAV-08","nivel":"basico","tema":"Navegación","tipo":"codigo","pregunta":"¿Qué expresión completa correctamente el código para obtener el título?","codigo":"const titulo = ___;\nexpect(titulo).toBe('Inicio');","opciones":{"a":"page.title","b":"page.getTitle()","c":"await page.title()","d":"await page.document.title"},"codigoOpciones":false,"correcta":["c"],"concepto":"page.title() devuelve de forma asíncrona el título del documento.","explicacion":["Es un método asíncrono: requiere await.","Para esperar a que cambie usa await expect(page).toHaveTitle().","No hay getTitle."],"razones":{"a":"Sin paréntesis sería una referencia a la función.","b":"getTitle no existe.","c":"Correcta. Método real y asíncrono.","d":"page.document no existe."},"clave":"title() con await.","docs":"https://playwright.dev/docs/api/class-page#page-title"},{"id":"B-TS-01","nivel":"basico","tema":"TypeScript para tests","tipo":"error","pregunta":"Este test es poco fiable: a veces falla de forma intermitente y otras muestra errores que no apuntan a la línea culpable. ¿Qué falla?","codigo":"test('enviar', async ({ page }) => {\n  await page.goto('/form');\n  page.getByRole('button', { name: 'Enviar' }).click();\n  await expect(page.getByText('Enviado')).toBeVisible();\n});","opciones":{"a":"Falta `await` en `click()`: la promesa queda suelta y no se espera la acción ni su error.","b":"`getByRole` no admite `name`.","c":"`toBeVisible` debe ir sin `await`.","d":"`async` no puede usarse en tests."},"codigoOpciones":false,"correcta":["a"],"concepto":"Las acciones de Playwright devuelven promesas; sin await el test sigue sin esperar el resultado ni los errores.","explicacion":["click() es asíncrono y devuelve una Promise.","Sin await, el flujo continúa antes de que termine el clic.","Un fallo en la promesa suelta puede perderse o aparecer tarde.","Hay que usar await en acciones y aserciones."],"razones":{"a":"Correcta. Falta await en la acción.","b":"getByRole admite la opción name.","c":"Las aserciones web-first sí llevan await.","d":"Los tests de Playwright son funciones async."},"clave":"Promesa sin await = se pierde.","docs":"https://www.typescriptlang.org/docs/handbook/2/functions.html"},{"id":"B-TS-02","nivel":"basico","tema":"TypeScript para tests","tipo":"codigo","pregunta":"Un helper realiza acciones y no devuelve ningún valor. ¿Qué tipo de retorno se anota?","codigo":"async function iniciarSesion(page: Page, user: string): ___ {\n  await page.goto('/login');\n  await page.getByLabel('Usuario').fill(user);\n  await page.getByRole('button', { name: 'Entrar' }).click();\n}","opciones":{"a":"`Promise<void>`","b":"`void`","c":"`Promise<string>`","d":"`Page`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Una función async siempre devuelve una Promise; si no devuelve valor, su tipo es Promise<void>.","explicacion":["async envuelve el resultado en una Promise.","Sin valor de retorno, el tipo interno es void.","Anotar solo void en una función async da error de TypeScript."],"razones":{"a":"Correcta. Función async sin valor devuelto.","b":"Una función async no puede declarar simplemente void: debe ser Promise<...>.","c":"La función no devuelve un string.","d":"No devuelve la Page."},"clave":"async sin retorno: Promise<void>.","docs":"https://www.typescriptlang.org/docs/handbook/2/functions.html"},{"id":"B-TS-03","nivel":"basico","tema":"TypeScript para tests","tipo":"codigo","pregunta":"Quieres construir la URL de un producto a partir de su id. ¿Qué sintaxis es correcta?","codigo":"const id = 42;\nawait page.goto(___);","opciones":{"a":"`` `/productos/${id}` ``","b":"`'/productos/${id}'`","c":"`\"/productos/\" . id`","d":"`/productos/${id}`"},"codigoOpciones":false,"correcta":["a"],"concepto":"Los template literals usan comillas invertidas y ${} para interpolar valores.","explicacion":["Se delimitan con comillas invertidas (backticks).","Dentro, ${expresión} inserta su valor.","Con comillas simples o dobles, ${id} se queda como texto literal."],"razones":{"a":"Correcta. Backticks con interpolación.","b":"Con comillas simples no se interpola: la URL contendría ${id} literal.","c":"El punto no concatena en TypeScript; se usa +.","d":"Sin comillas ni backticks no es una expresión válida."},"clave":"Backticks + ${}.","docs":"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html"},{"id":"B-TS-04","nivel":"basico","tema":"TypeScript para tests","tipo":"codigo","pregunta":"Para tipar los datos de un usuario de prueba, ¿qué declaración es correcta?","codigoOpciones":true,"opciones":{"a":"interface Usuario {\n  nombre: string;\n  edad: number;\n  activo: boolean;\n}","b":"interface Usuario {\n  nombre = string;\n  edad = number;\n}","c":"interface Usuario(\n  nombre: string,\n  edad: number\n)","d":"interface Usuario {\n  nombre: 'string',\n  edad: 'number'\n}"},"correcta":["a"],"concepto":"Una interface describe la forma de un objeto con propiedades y sus tipos, separadas por ; o ,.","explicacion":["Las propiedades se declaran con nombre: tipo.","Los tipos básicos son string, number y boolean.","Las comillas en 'string' crean un tipo literal, no el tipo string.","Se usa luego como const u: Usuario = {...}."],"razones":{"a":"Correcta. Sintaxis estándar de interface.","b":"Se usa dos puntos, no =.","c":"No se declara con paréntesis como una función.","d":"'string' entre comillas es el literal 'string', no el tipo."},"clave":"propiedad: tipo.","docs":"https://www.typescriptlang.org/docs/handbook/2/objects.html"},{"id":"B-TS-05","nivel":"basico","tema":"TypeScript para tests","tipo":"codigo","pregunta":"Un helper recibe la página como parámetro y solo se usa como tipo. ¿Qué import es correcto?","codigo":"___\n\nexport async function abrirInicio(page: Page): Promise<void> {\n  await page.goto('/');\n}","opciones":{"a":"`import type { Page } from '@playwright/test';`","b":"`import { Page } from 'playwright-types';`","c":"`import type Page from '@playwright/test/page';`","d":"`import { type } from '@playwright/test';`"},"codigoOpciones":false,"correcta":["a"],"concepto":"import type importa solo tipos, sin código en tiempo de ejecución; Page y Locator se exportan de @playwright/test.","explicacion":["Page y Locator son tipos exportados por @playwright/test.","import type se borra al compilar.","Se usan para anotar parámetros de helpers y Page Objects."],"razones":{"a":"Correcta. Import de solo tipo desde el paquete oficial.","b":"playwright-types no es el paquete oficial.","c":"Esa ruta interna no existe como exportación.","d":"type no es un miembro exportado."},"clave":"Tipos: import type { Page }.","docs":"https://www.typescriptlang.org/docs/handbook/modules/reference.html"},{"id":"B-TS-06","nivel":"basico","tema":"TypeScript para tests","tipo":"codigo","pregunta":"Para generar un test por cada usuario de un array, ¿qué palabra va en el hueco?","codigo":"const usuarios: string[] = ['ana', 'luis', 'eva'];\n\nfor (const usuario ___ usuarios) {\n  test(`login de ${usuario}`, async ({ page }) => {\n    await page.goto(`/login?user=${usuario}`);\n  });\n}","opciones":{"a":"`of`","b":"`in`","c":"`as`","d":"`from`"},"codigoOpciones":false,"correcta":["a"],"concepto":"for...of recorre los valores de un array, y permite declarar un test por cada dato.","explicacion":["for...of itera los valores del array.","for...in itera las claves (índices '0', '1', ...), no los valores.","Cada test debe tener un título único: por eso se interpola el dato."],"razones":{"a":"Correcta. Itera sobre los valores.","b":"for...in da los índices como strings, no los nombres.","c":"as es para aserciones de tipo, no para bucles.","d":"from no es sintaxis de bucle."},"clave":"Valores del array: of.","docs":"https://www.typescriptlang.org/docs/handbook/2/everyday-types.html"},{"id":"B-TS-07","nivel":"basico","tema":"TypeScript para tests","tipo":"concepto","pregunta":"En un test, ¿cuándo conviene declarar una variable con `const` en vez de `let`?","opciones":{"a":"Cuando la variable no se reasigna, como un locator o un dato fijo.","b":"Cuando la variable es de tipo number.","c":"Solo dentro de funciones async.","d":"Nunca: `let` es siempre preferible en TypeScript."},"codigoOpciones":false,"correcta":["a"],"concepto":"const impide reasignar la variable, así que se usa por defecto y let solo cuando el valor cambia.","explicacion":["const evita reasignaciones accidentales.","Un objeto const sigue siendo mutable en sus propiedades.","let se reserva para contadores o valores que cambian.","El tipo de dato no determina la elección."],"razones":{"a":"Correcta. Se usa const salvo que haya reasignación.","b":"Cualquier tipo puede ir con const o let.","c":"No depende de que la función sea async.","d":"La buena práctica es const por defecto."},"clave":"const por defecto, let si cambia.","docs":"https://www.typescriptlang.org/docs/handbook/variable-declarations.html"},{"id":"B-TS-08","nivel":"basico","tema":"TypeScript para tests","tipo":"codigo","pregunta":"El campo `telefono` es opcional y puede no existir. ¿Cómo lees su longitud sin que falle si es `undefined`?","codigo":"interface Cliente {\n  nombre: string;\n  telefono?: string;\n}\n\nconst c: Cliente = { nombre: 'Ana' };\nconst longitud = ___;","opciones":{"a":"`c.telefono?.length`","b":"`c.telefono.length`","c":"`c.telefono?length`","d":"`c?.telefono!.length`"},"codigoOpciones":false,"correcta":["a"],"concepto":"El encadenamiento opcional ?. devuelve undefined en lugar de lanzar error si el valor anterior es null o undefined.","explicacion":["telefono?: string significa string | undefined.","c.telefono.length da error de compilación y fallaría en ejecución.","?. corta la cadena y devuelve undefined.","El operador ! afirma que existe y no lo comprueba."],"razones":{"a":"Correcta. Acceso seguro a una propiedad opcional.","b":"Con telefono undefined lanzaría TypeError, y TS lo marca.","c":"Sintaxis inválida: falta el punto de ?.","d":"El ! fuerza el tipo y provocaría un fallo en ejecución al ser undefined."},"clave":"?. evita el crash con undefined.","docs":"https://www.typescriptlang.org/docs/handbook/2/objects.html"},{"id":"M-API-01","nivel":"medio","tema":"Tes
